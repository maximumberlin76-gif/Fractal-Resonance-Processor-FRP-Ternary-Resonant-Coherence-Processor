name: 76 - FRP M31 Quantization and Edge Audit
run-name: "76 - FRP Quantization and Edges | 8/16/32/64 cells and deterministic replay @ ${{ github.sha }}"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frp-76-quantization-edge-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    name: M31 quantization and edges - ${{ matrix.cells }} cells
    runs-on: ubuntu-24.04
    timeout-minutes: 130
    strategy:
      fail-fast: false
      matrix:
        cells: [8, 16, 32, 64]
    defaults:
      run:
        shell: bash
    env:
      CELLS: ${{ matrix.cells }}
      LC_ALL: C.UTF-8
      TZ: UTC
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Initialize evidence directory
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/frp-76-evidence"
          printf 'commit=%s\ncells=%s\nrun=%s\nattempt=%s\n' \
            "$GITHUB_SHA" "$CELLS" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            > "$RUNNER_TEMP/frp-76-evidence/context.txt"
          echo "FRP76_EVIDENCE=$RUNNER_TEMP/frp-76-evidence" >> "$GITHUB_ENV"

      - name: Check out dispatched commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify manual execution and qualified sources
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          cat > "$FRP76_EVIDENCE/sources.sha256" <<'SHA'
          9de085915aa0fb8a73705c0927cc875b106480ef8a75a76f599be04440c0f099  frp_prototype_v1_7_0.py
          6b2afb8d1583c93d95d2386ba25dd1eaef6bb5bd9a4e1c9e9abff1dd004cbf24  rtl/m31/frp_m31_fixed_point_pkg.sv
          cbb5a531283164d1d54d59ec748b97bf84e172704854bf5eb7c6bda2c502f7c7  rtl/m31/frp_m31_isqrt_u64.sv
          7ac3572ef2bf9feef509e7dc43c662d92d23fa3eb0563efbfa8dba7c28157746  rtl/m31/frp_m31_phase_interference.sv
          762302f1c7a7f7f40cb029f5ada6a111fc8c3e3f6be9920e9b2401b95e179c94  rtl/m31/frp_m31_pkg.sv
          adbb4b94fcf8fa0bfc981d654679fd7518a5c4c9c97b611a35cd8accaf28233d  rtl/m31/frp_m31_sin_q30.mem
          SHA
          sha256sum .github/workflows/frp-76-m31-quantization-edge-audit.yml \
            >> "$FRP76_EVIDENCE/sources.sha256"
          sha256sum --check --strict "$FRP76_EVIDENCE/sources.sha256" \
            | tee "$FRP76_EVIDENCE/source-check.log"
          printf '%s\n' "$GITHUB_SHA" > "$FRP76_EVIDENCE/commit.txt"

      - name: Install and record toolchain
        run: |
          set -euo pipefail
          {
            python -m pip install --disable-pip-version-check \
              verilator==5.48.0 systemc==3.0.2.1
            python -m pip check
            verilator-cli --version
            g++ --version
            make --version
          } 2>&1 | tee "$FRP76_EVIDENCE/toolchain.log"
          python -m pip freeze > "$FRP76_EVIDENCE/packages.txt"

      - name: Audit rounding and edge contracts with two replays
        run: |
          set -euo pipefail
          python - <<'PYTHON'
          import hashlib
          import importlib.util
          import json
          import os
          import random
          import re
          import signal
          import subprocess
          import time
          from pathlib import Path

          R = Path.cwd()
          E = Path(os.environ['FRP76_EVIDENCE']).resolve()
          N = int(os.environ['CELLS'])
          assert N in (8, 16, 32, 64)
          MASK, Q16, Q30 = (1 << 32)-1, 1 << 16, 1 << 30
          CONVERSION = 44798133900177
          COUNT = 200
          spec = importlib.util.spec_from_file_location('frp_reference', R/'frp_prototype_v1_7_0.py')
          ref = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(ref)

          def require(ok, message):
              if not ok:
                  raise RuntimeError(message)

          def signed(x):
              return (x & MASK) - (1 << 32) if x & (1 << 31) else x & MASK

          def rounded(x, divisor):
              return (-1 if x < 0 else 1)*((abs(x)+divisor//2)//divisor)

          def sat(x):
              return min((1 << 31)-1, max(-(1 << 31), x))

          def mul(a, b, scale):
              return sat(rounded(a*b, scale))

          def sine(phase):
              return ref.TRIG_SIN_Q30[(phase & MASK) >> 20]

          rom = [signed(int(x, 16)) for x in (R/'rtl/m31/frp_m31_sin_q30.mem').read_text().split()]
          require(rom == list(ref.TRIG_SIN_Q30), 'Canonical sine ROM differs from reference')
          weights = ref.quantized_level_weights(N, 0.70)
          require(sum(weights[d]*(1 << (d-1)) for d in weights) == Q30, 'Topology sum')

          def fields(phases, gammas, factors):
              wide, per_term = [], []
              for i in range(N):
                  terms = []
                  for j in range(N):
                      if i == j:
                          continue
                      factor = mul(factors[i], factors[j], Q30)
                      factor = mul(weights[(i ^ j).bit_length()], factor, Q30)
                      terms.append(mul(factor, sine(phases[j]-phases[i]-gammas[i]), Q30))
                  total = sum(terms)
                  legacy = sum(rounded(x, 1 << 14) for x in terms)
                  require(-(1 << 31) <= total < (1 << 31), 'Wide accumulation range')
                  require(-(1 << 31) <= legacy < (1 << 31), 'Per-term accumulation range')
                  require(abs(rounded(total, 1 << 14)-legacy) <= N//2, 'Rounding bound')
                  wide.append(mul(18350, rounded(total, 1 << 14), Q16))
                  per_term.append(mul(18350, legacy, Q16))
              return wide, per_term

          cases, vectors, differences = [], [], []
          cadence_names = ['free', 'balance', 'commit', 'excite', 'neutralize']
          threshold_index = next(i for i in range(1024) if ref.TRIG_SIN_Q30[i] > 354334802)
          for cadence in range(5):
              for profile in range(40):
                  rng = random.Random(760000 + profile)
                  p = ref.QuantizedReferenceShadowProcessor(cells=N, seed=0)
                  phases = [rng.getrandbits(32) for _ in range(N)]
                  gammas = [rng.getrandbits(32) for _ in range(N)]
                  factors = [rng.randrange(Q30+1) for _ in range(N)]
                  frequencies = [rng.randrange(-2*Q16, 3*Q16) for _ in range(N)]
                  states = [(-1, 0, 1)[i % 3] for i in range(N)]
                  activity = [rng.randrange(2) for _ in range(N)]
                  if profile == 0:
                      phases, gammas, factors = [0]*N, [0]*N, [Q30]*N
                  elif profile == 1:
                      phases = [(i % 2)*(1 << 31) for i in range(N)]
                      gammas, factors = [0]*N, [Q30]*N
                  elif profile == 2:
                      phases = [i*((1 << 32)//N) for i in range(N)]
                      gammas, factors = [0x26666666]*N, [Q30]*N
                  elif profile == 3:
                      indices = [threshold_index-1, threshold_index, 2048-threshold_index,
                                 2049-threshold_index, 2047+threshold_index, 2048+threshold_index]
                      phases = [((indices[i % 6] << 20)+(i % 2)*((1 << 20)-1)) & MASK for i in range(N)]
                      factors = [Q30]*N
                  elif profile == 4:
                      factors = [0]*N
                  elif profile == 5:
                      phases = list(p.phase_words)
                      gammas = list(p.gamma_effective_word)
                      factors = list(p.thermal_node_factor_q30)
                  elif profile == 6:
                      factors = [Q30 if i % 2 else Q30//2 for i in range(N)]
                      gammas = [MASK if i % 2 else 0 for i in range(N)]
                  elif profile == 7:
                      phases = [0xc0000000 if i % 2 else 0x40000000 for i in range(N)]
                      frequencies = [-Q16]*N
                  wide, legacy = fields(phases, gammas, factors)
                  p.phase_words = phases.copy()
                  p.gamma_effective_word = gammas.copy()
                  p.thermal_node_factor_q30 = factors.copy()
                  p.hierarchical_coupling_field()
                  require(p.coupling_field_q16 == legacy, 'Historical coupling reconstruction')
                  next_f = [sat(f+sat(rounded((Q16+(3932 if st else 0)+(7864 if sw else 0)-f)*19661, Q16)))
                            for f, st, sw in zip(frequencies, states, activity)]
                  push = [197, 197, 655, 393, 197][cadence]
                  next_phase = [(phase+rounded(signed(mul(3932, freq, Q16)+push+c)*CONVERSION, 1 << 32)) & MASK
                                for phase, freq, c in zip(phases, next_f, wide)]
                  p.frequency_current_q16 = next_f.copy()
                  p.update_phase_field(cadence_names[cadence])
                  post_coupling, _ = fields(next_phase, gammas, factors)
                  expected = []
                  for stage in range(4):
                      ps, fs, cs = (phases, frequencies, wide) if stage < 2 else (next_phase, next_f, post_coupling)
                      expected.append([(ph, fr & MASK, co & MASK, sine(ph) & MASK,
                                        1 if sine(ph) > 354334802 else 3 if sine(ph) < -354334802 else 0)
                                       for ph, fr, co in zip(ps, fs, cs)])
                  case_id = len(cases)
                  for i in range(N):
                      differences.append(dict(case=case_id, cadence=cadence, profile=profile, cell=i,
                                              coupling_delta=wide[i]-legacy[i],
                                              phase_delta=signed(next_phase[i]-p.phase_words[i])))
                  value, shift = 0, 0
                  for array, width in ((phases, 32), (frequencies, 32), (gammas, 32), (factors, 32),
                                       ([s & 3 for s in states], 2), (activity, 1)):
                      for x in array:
                          value |= (x & ((1 << width)-1)) << shift
                          shift += width
                  value |= cadence << shift
                  vectors.append(f'{value:0{(131*N+3+3)//4}x}')
                  cases.append(expected)
          require(len(cases) == COUNT, 'Case count')
          (E/'vectors.mem').write_text('\n'.join(vectors)+'\n')
          (E/'rounding-differences.json').write_text(json.dumps(differences, indent=2)+'\n')

          source = r'''// Copyright (c) 2026 Maksym Marnov (Alchimist). All rights reserved.
          `timescale 1ns/1ps
          `include "frp_m31_phase_interference.sv"
          module frp76_tb;
            localparam int N=__N__, CASES=200, WIDTH=131*N+3;
            logic clk=0, rst_n=0, tick_enable=0, load_valid=0;
            logic [N*32-1:0] phase_load=0, frequency_load_q16=0;
            logic [N*32-1:0] gamma_effective_word=0, thermal_node_factor_q30=0;
            logic [N*2-1:0] retained_state=0;
            logic [N-1:0] switch_activity=0;
            frp_m31_pkg::frp_m31_scheduler_state_e scheduler_state=frp_m31_pkg::FRP_SCHED_FREE;
            wire [N*32-1:0] phases, frequencies, coupling, projection;
            wire [N*2-1:0] targets;
            logic [WIDTH-1:0] vectors[0:CASES-1];
            string vector_path;
            frp_m31_phase_interference #(.CELLS(N)) dut (
              .clk, .rst_n, .tick_enable, .load_valid, .phase_load, .frequency_load_q16,
              .gamma_effective_word, .thermal_node_factor_q30, .retained_state,
              .switch_activity, .scheduler_state,
              .phase_word_q(phases), .frequency_current_q16(frequencies),
              .coupling_field_q16(coupling), .phase_projection_q30(projection), .phase_target(targets),
              .pair_coherence_q30(), .cluster_coherence_q30(), .global_coherence_q30(),
              .organization_dispersion_q30(), .group_coherence_q30(), .level_mean_coherence_q30(),
              .level_min_coherence_q30(), .level_max_coherence_q30(), .level_dispersion_q30()
            );
            task automatic edge_step;
              #2; clk=1; #2; clk=0; #2;
            endtask
            task automatic emit(input int c, stage);
              for(int i=0;i<N;i++)
                $display("ROW %0d %0d %0d %08h %08h %08h %08h %01h",c,stage,i,
                  phases[32*i+:32],frequencies[32*i+:32],coupling[32*i+:32],
                  projection[32*i+:32],targets[2*i+:2]);
            endtask
            initial begin
              if(!$value$plusargs("vectors=%s",vector_path)) $fatal(1,"Missing vectors");
              $readmemh(vector_path,vectors);
              edge_step();
              for(int i=0;i<N;i++)
                $display("RESET %0d %08h %08h",i,phases[32*i+:32],frequencies[32*i+:32]);
              rst_n=1;
              for(int c=0;c<CASES;c++) begin
                {scheduler_state,switch_activity,retained_state,thermal_node_factor_q30,
                 gamma_effective_word,frequency_load_q16,phase_load}=vectors[c];
                load_valid=1; tick_enable=c%2; edge_step(); emit(c,0);
                load_valid=0; tick_enable=0; edge_step(); emit(c,1);
                tick_enable=1; edge_step(); emit(c,2);
                tick_enable=0; edge_step(); emit(c,3);
              end
              $display("DONE cases=%0d cells=%0d",CASES,N);
              $finish;
            end
            initial begin #100000; $fatal(1,"Audit timeout"); end
          endmodule
          '''.replace('__N__', str(N))
          (E/'frp76_tb.sv').write_text(source)
          commands = []

          def run(argv, name, timeout):
              entry = dict(argv=argv, log=name, timeout_seconds=timeout, status='running')
              commands.append(entry)
              start = time.monotonic()
              process = None
              def save():
                  (E/'commands.json').write_text(json.dumps(commands, indent=2)+'\n')
              save()
              try:
                  with (E/name).open('w') as stream:
                      process = subprocess.Popen(argv, stdout=stream, stderr=subprocess.STDOUT, start_new_session=True)
                      while True:
                          remaining = timeout-(time.monotonic()-start)
                          require(remaining > 0, f'{name}: timeout')
                          try:
                              code = process.wait(timeout=min(30, remaining))
                              break
                          except subprocess.TimeoutExpired:
                              print(f'{name}: {time.monotonic()-start:.0f}s', flush=True)
                  require(code == 0, f'{name}: exit {code}')
                  entry.update(status='passed', returncode=code)
              except BaseException as exc:
                  if process is not None and process.poll() is None:
                      os.killpg(process.pid, signal.SIGKILL)
                      process.wait()
                  entry.update(status='failed', error=str(exc))
                  if (E/name).exists():
                      print((E/name).read_text(errors='replace')[-8000:], flush=True)
                  raise
              finally:
                  entry['elapsed_seconds'] = round(time.monotonic()-start, 3)
                  save()

          build = Path(os.environ['RUNNER_TEMP'])/f'frp-76-build-{N}'
          run(['verilator-cli', '--binary', '--timing', '--assert', '--output-groups', '0', '-Wno-fatal',
               '-j', '2', '-CFLAGS', '-std=c++20', '-MAKEFLAGS', 'OPT_FAST=-O0',
               '-MAKEFLAGS', 'VK_PCH_I_FAST=', '-MAKEFLAGS', 'VK_PCH_I_SLOW=',
               '--top-module', 'frp76_tb', '--Mdir', str(build), '-Irtl/m31', str(E/'frp76_tb.sv')],
              'build.log', 3600)
          require(not re.search(r'%Error|%Warning-(PINMISSING|IMPLICIT|MULTIDRIVEN)\b',
                                (E/'build.log').read_text()), 'Compile diagnostics')
          executable = build/'Vfrp76_tb'
          (E/'executable.sha256').write_text(hashlib.sha256(executable.read_bytes()).hexdigest()+'\n')

          def collect(text):
              require(not re.search(r'%Error|%Fatal|Assertion failed|Aborting|^FAIL\b', text, re.M), 'Simulator failure')
              lines = [x.strip() for x in text.splitlines() if x.startswith(('ROW ', 'RESET ', 'DONE'))]
              require(len(lines) == N+4*N*COUNT+1, 'Trace length')
              for i in range(N):
                  require(lines[i] == f'RESET {i} {i*((1 << 32)//N):08x} 00010000', 'Reset state')
              pos = N
              for c in range(COUNT):
                  for stage in range(4):
                      for i in range(N):
                          tokens = lines[pos].split()
                          require(tokens[:4] == ['ROW', str(c), str(stage), str(i)] and len(tokens) == 9, 'Trace order/schema')
                          require(all(re.fullmatch(r'[0-9a-f]{8}', x) for x in tokens[4:8]) and
                                  re.fullmatch(r'[013]', tokens[8]), 'Trace encoding')
                          values = tuple(int(x, 16) for x in tokens[4:])
                          require(values == cases[c][stage][i], f'RTL mismatch case={c} stage={stage} cell={i}: {values} != {cases[c][stage][i]}')
                          pos += 1
              require(lines[-1] == f'DONE cases={COUNT} cells={N}', 'Completion marker')
              return '\n'.join(lines)+'\n'

          replays = []
          for replay in (1, 2):
              name = f'run-{replay}.log'
              run(['stdbuf', '-oL', '-eL', str(executable), f'+vectors={E / "vectors.mem"}'], name, 1800)
              replays.append(collect((E/name).read_text()))
          require(replays[0] == replays[1], 'Replay mismatch')
          negative_controls = 0
          for column in (4, 5, 6):
              rows = replays[0].splitlines()
              tokens = rows[N+2*N].split()
              tokens[column] = f'{int(tokens[column], 16)^1:08x}'
              rows[N+2*N] = ' '.join(tokens)
              try:
                  collect('\n'.join(rows)+'\n')
              except RuntimeError:
                  negative_controls += 1
          require(negative_controls == 3, 'Checker negative controls')
          changed = [x for x in differences if x['coupling_delta'] or x['phase_delta']]
          coupling_bound = (18350*(N//2)+Q16-1)//Q16+1
          require(all(abs(x['coupling_delta']) <= coupling_bound for x in differences), 'Coupling delta bound')
          report = dict(commit=os.environ.get('GITHUB_SHA', 'local'), cells=N, cases=COUNT, cadences=cadence_names, builds=1, replays=2,
                        rtl_value_checks=20*N*COUNT+2*N, rtl_contract_exact=True, replay_equal=True,
                        reference='frp_prototype_v1_7_0.py', comparison_scope='identical input, isolated coupling rounding and one phase update',
                        historical_coupling_bit_exact=all(x['coupling_delta'] == 0 for x in differences),
                        historical_phase_step_bit_exact=all(x['phase_delta'] == 0 for x in differences),
                        differing_cell_cases=len(changed), first_difference=changed[0] if changed else None,
                        max_abs_coupling_delta_q16=max(abs(x['coupling_delta']) for x in differences),
                        coupling_delta_bound_q16=coupling_bound,
                        max_abs_phase_delta_word=max(abs(x['phase_delta']) for x in differences),
                        checker_negative_controls=negative_controls,
                        semantic_sha256=hashlib.sha256(replays[0].encode()).hexdigest())
          (E/'qualification.json').write_text(json.dumps(report, indent=2)+'\n')
          summary = f'### FRP 76: {N} cells\n\n```json\n'+json.dumps(report, indent=2)+'\n```\n'
          (E/'summary.md').write_text(summary)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write(summary)
          print(json.dumps(report, indent=2), flush=True)
          PYTHON

      - name: Recheck qualified sources
        if: always()
        run: |
          set -euo pipefail
          sha256sum --check --strict "$FRP76_EVIDENCE/sources.sha256" \
            | tee "$FRP76_EVIDENCE/source-recheck.log"

      - name: Hash qualification evidence
        if: always()
        run: |
          set -euo pipefail
          python - <<'PYTHON'
          import hashlib
          import os
          from pathlib import Path
          root = Path(os.environ['FRP76_EVIDENCE'])
          files = sorted(p for p in root.rglob('*') if p.is_file() and p.name != 'evidence.sha256')
          manifest = ''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(root)}\n'
                             for p in files)
          (root / 'evidence.sha256').write_text(manifest)
          PYTHON

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          name: frp-76-quantization-edge-audit-${{ matrix.cells }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/frp-76-evidence/
          if-no-files-found: error
          retention-days: 30
