               run('compile',['verilator','--binary','--sv','--timing','--no-assert','-Wno-fatal','-CFLAGS','-std=c++20 -O2','-MAKEFLAGS','VK_PCH_I_FAST=','-MAKEFLAGS','VK_PCH_I_SLOW=','--build-jobs','2','--output-split','10000','--top-module','tb','--Mdir',str(BUILD/'obj'),'-Irtl/m31','-Iformal/m31',str(E/'selected-dut.v'),'tb.sv'],timeout=1200)
              results={}
              for source_kind in range(2):
               code,p=run('simulation-'+str(source_kind),[str(exe),f'+source={source_kind}'])
               lines=[x.split() for x in p.read_text().splitlines() if x.startswith('FRP_PHASE ')]
               assert len(lines)==len(vectors) and 'DONE_CONTRACT' in p.read_text()
               state=reset();coverage=0
               for i,tokens in enumerate(lines):
                w=unpack(int(tokens[2],16),INPUTS);assert w==vectors[i]
                if not w['rst_n']:state=reset()
                wanted=outputs(state,w);actual=unpack(int(tokens[3],16),FIELDS);expected=unpack(int(tokens[4],16),FIELDS)
                if i:assert actual==expected==wanted,(i,{n:(actual[n],expected[n],wanted[n]) for n in wanted if actual[n]!=wanted[n] or expected[n]!=wanted[n]})
                coverage|=int(tokens[6],16);state=advance(state,w,wanted)
               assert coverage==0xffffff,hex(coverage)
               results['rtl' if source_kind==0 else 'netlist']=dict(samples=len(lines),checked_samples=len(lines)-1,reach=f'{coverage:06x}')
              for fault in range(1,15):
               code,p=run('negative-'+str(fault),[str(exe),'+source=0',f'+fault={fault}'],neg=True)
               assert code!=0 and 'CONTRACT_MISMATCH' in p.read_text() and 'DONE_CONTRACT' not in p.read_text()
               lines=[x.split() for x in p.read_text().splitlines() if x.startswith('FRP_PHASE ')]
               assert int(lines[-1][5],16)!=0
