name: FRP M32 CSR CDC Stream Post-Synthesis Qualification

run-name: "FRP M32 CSR CDC Stream Post-Synthesis @ ${{ github.sha }}"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frp-m32-csr-cdc-stream-post-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify-cdc-stream-post-synthesis:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    env:
      LC_ALL: C.UTF-8
      TZ: UTC
      PYTHONHASHSEED: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Initialize build and evidence paths
        run: |
          set -euo pipefail
          printf '%s\n' \
            "M32_CDC_STREAM_POST_WORK=$RUNNER_TEMP/frp-m32-csr-cdc-stream-post-work" \
            "M32_CDC_STREAM_POST_EVIDENCE=$RUNNER_TEMP/frp-m32-csr-cdc-stream-post-evidence" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/frp-m32-csr-cdc-stream-post-evidence"

      - name: Check out the dispatched commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install simulation and synthesis tools
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          {
            sudo apt-get update
            sudo apt-get install --yes verilator g++ make
            python -m pip install --disable-pip-version-check \
              yowasp-yosys==0.68.0.0.post1208
            python --version
            verilator --version
            g++ --version
          } 2>&1 | tee "$M32_CDC_STREAM_POST_EVIDENCE/toolchain.log"

      - name: Qualify frequency range and compare synthesized CDC stream with RTL
        run: |
          set -euo pipefail
          ulimit -c 0
          python - <<'PY'
          import hashlib
          import importlib.metadata
          import json
          import os
          import re
          import shutil
          import subprocess
          from pathlib import Path
          import yowasp_yosys

          root = Path.cwd().resolve()
          work = Path(os.environ["M32_CDC_STREAM_POST_WORK"])
          evidence = Path(os.environ["M32_CDC_STREAM_POST_EVIDENCE"])
          evidence.mkdir(parents=True, exist_ok=True)
          view, build = work / "source", work / "build"
          top = "frp_m32_csr_cdc_stream_top"
          bench = "frp_m32_csr_cdc_stream_post_synthesis_tb"
          tb = "fpga/m32_csr/" + bench + ".sv"
          frequency_bench = "frp_m31_frequency_range_tb"
          frequency_tb = "rtl/m31/" + frequency_bench + ".sv"
          workflow = ".github/workflows/frp-m32-csr-cdc-stream-post-synthesis-qualification.yml"
          include_dirs = ["rtl/m22", "rtl/m23", "rtl/m31", "rtl/m32",
                          "fpga/m32", "fpga/m32_csr"]
          profiles = [(5, 7, 1), (3, 11, 4), (13, 2, 3)]
          expected = {
              "accepted": 427, "completed": 423, "core_completed": 425,
              "aborted": 4, "aborted_after_core": 2, "simultaneous": 127,
              "pulses": 426, "rejected": 41, "routes": 8, "resets": 10,
          }
          frequency_expected = {
              "vectors": 144, "scheduler_states": 5, "updates": 720,
              "loads": 90, "hold_edges": 360, "reset_checks": 3,
          }
          report = {
              "status": "FAIL", "source_commit": os.environ["GITHUB_SHA"],
              "repository": os.environ["GITHUB_REPOSITORY"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "expected_metrics": expected, "commands": [], "profiles": [],
              "frequency_expected_metrics": frequency_expected,
          }

          def require(condition, message):
              if not condition:
                  raise RuntimeError(message)

          def sha(raw):
              return hashlib.sha256(raw).hexdigest()

          def execute(command, label, directory, limit):
              report["commands"].append({"label": label, "argv": command})
              print(label, flush=True)
              log_path = evidence / (label + ".log")
              try:
                  with log_path.open("w") as log:
                      subprocess.run(command, cwd=directory, stdout=log,
                          stderr=subprocess.STDOUT, timeout=limit, check=True)
              except (subprocess.CalledProcessError, subprocess.TimeoutExpired):
                  print("\n".join(log_path.read_text(errors="replace").splitlines()[-40:]))
                  raise
              return log_path

          def result_records(text, profile):
              rtl_prefix = "FRP_M32_CSR_CDC_STREAM_TB:"
              post_prefix = "FRP_M32_CSR_CDC_STREAM_POST_SYNTHESIS_TB:"
              records = [line for line in text.splitlines()
                         if line.startswith((rtl_prefix, post_prefix))]
              require(len(records) == 2,
                      "Incomplete or repeated CDC stream post-synthesis results")
              clocks = dict(zip(("host_half", "core_half", "phase"), profile))
              fields = [*clocks, "checks", "accepted", "completed", "core_completed",
                        "aborted", "aborted_after_core", "simultaneous",
                        "stalled_responses", "stalled_requests", "pulses",
                        "rejected", "routes", "resets"]
              match = re.fullmatch(rtl_prefix + " PASS " +
                  " ".join(k + r"=(\d+)" for k in fields), records[0])
              require(match is not None, "Malformed reference RTL result")
              rtl_metrics = dict(zip(fields, map(int, match.groups())))
              wanted = clocks | expected
              require(all(rtl_metrics[k] == v for k, v in wanted.items()),
                      "Unexpected reference metrics or clock profile")
              require(rtl_metrics["checks"] >= expected["completed"]
                      and rtl_metrics["stalled_responses"] >= 100
                      and rtl_metrics["stalled_requests"] >= 100,
                      "Missing stalled request or response coverage")
              fields = [*clocks, "comparisons", "output_bits", "accepted",
                        "completed", "simultaneous"]
              match = re.fullmatch(post_prefix + " PASS " +
                  " ".join(k + r"=(\d+)" for k in fields), records[1])
              require(match is not None, "Malformed post-synthesis result")
              metrics = dict(zip(fields, map(int, match.groups())))
              wanted = clocks | {k: expected[k]
                                 for k in ("accepted", "completed", "simultaneous")}
              require(all(metrics[k] == v for k, v in wanted.items())
                      and metrics["output_bits"] == 43
                      and metrics["comparisons"] >= 2 * expected["accepted"],
                      "Unexpected post-synthesis metrics or clock profile")
              return records, rtl_metrics, metrics

          def frequency_record(text):
              prefix = "FRP_M31_FREQUENCY_RANGE_TB:"
              records = [line for line in text.splitlines() if line.startswith(prefix)]
              require(len(records) == 1, "Incomplete or repeated frequency range result")
              match = re.fullmatch(prefix + " PASS " +
                  " ".join(k + r"=(\d+)" for k in frequency_expected), records[0])
              require(match is not None, "Malformed frequency range result")
              metrics = dict(zip(frequency_expected, map(int, match.groups())))
              require(metrics == frequency_expected, "Incomplete frequency range coverage")
              return records[0], metrics

          try:
              require(importlib.metadata.version("yowasp-yosys") == "0.68.0.0.post1208",
                      "Unexpected synthesis package")
              sources = set()

              def visit(name):
                  if name in sources:
                      return
                  path = root / name
                  require(path.is_file() and not path.is_symlink(), "Missing source: " + name)
                  sources.add(name)
                  for inc in re.findall(r'`include\s+"([^"]+)"', path.read_text()):
                      matches = {(directory / inc).resolve()
                                 for directory in [path.parent, *[root / d for d in include_dirs]]
                                 if (directory / inc).is_file()}
                      require(len(matches) == 1, "Missing or ambiguous include: " + inc)
                      resolved = matches.pop()
                      require(resolved.is_relative_to(root), "Include leaves the repository")
                      visit(resolved.relative_to(root).as_posix())

              visit(tb)
              visit(frequency_tb)
              sources.add("rtl/m31/frp_m31_sin_q30.mem")
              rows, identities = [], {}
              for name in sorted(sources):
                  raw = (root / name).read_bytes()
                  identities[name] = {"bytes": len(raw), "sha256": sha(raw)}
                  rows.append(f"{name}|{len(raw)}|{sha(raw)}")
              digest = sha(("\n".join(rows) + "\n").encode())
              report.update(sources=identities, source_set_sha256=digest,
                            workflow_sha256=sha((root / workflow).read_bytes()))
              require(len(sources) == 28 and digest ==
                      "f0dccbe75af1fca6fac79da92aafc1e2e4e47f34e9ff3c30d156f77c36b4b64c",
                      "Source set differs from the validated post-synthesis inputs")
              for name in sources:
                  target = view / name
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(root / name, target)

              compiler = ["verilator", "--binary", "--sv", "--timing", "--assert",
                  "-Wall", "-Wno-fatal", "-CFLAGS", "-std=c++20 -O0",
                  "--output-split", "20000", "-MAKEFLAGS", "VK_PCH_I_FAST=",
                  "-MAKEFLAGS", "VK_PCH_I_SLOW=", "-j", "2"]
              compiler += ["-I" + d for d in include_dirs]
              frequency_build = work / "frequency-build"
              execute(compiler + ["--top-module", frequency_bench,
                  "--Mdir", str(frequency_build), frequency_tb],
                  "frequency-build", root, 600)
              frequency_replays = []
              for attempt in (1, 2):
                  log = execute([str(frequency_build / ("V" + frequency_bench))],
                                f"frequency-run-{attempt}", root, 180)
                  record, metrics = frequency_record(log.read_text())
                  frequency_replays.append(record)
              require(frequency_replays[0] == frequency_replays[1],
                      "Frequency range replay records differ")
              report["frequency_range"] = {"implementation": "RTL", "replays": 2,
                  "metrics": metrics, "record": frequency_replays[0]}
              print(frequency_replays[0], flush=True)

              phase = view / "rtl/m31/frp_m31_phase_interference.sv"
              text = phase.read_text()
              first = text.index("    if (sin_lut[0] !== 32'sd0)")
              last = text.index('      $fatal(1, "FRP M31 sine LUT three-quarter-cycle mismatch");', first)
              normalized = text[:first] + text[text.index("\n", last) + 1:]
              require(sha(normalized.encode()) ==
                      "09302236b4a7734be9ac0890df4a7a577541a73c441ae7db3e70da8465f1c3ef",
                      "Unexpected synthesis source normalization")
              phase.write_text(normalized)

              share = Path(yowasp_yosys.__file__).resolve().parent / "share"
              simlib = evidence / "yosys-simlib.v"
              shutil.copyfile(share / "simlib.v", simlib)
              netlist = evidence / "frp_m32_csr_cdc_stream_netlist.v"
              script = (
                  "read_slang -j 1 --std 1800-2017 --ignore-assertions --top " + top
                  + " " + " ".join("-I" + d for d in include_dirs)
                  + " fpga/m32_csr/" + top + ".sv; "
                  + "synth -top " + top + " -noshare -run begin:fine; check -assert; "
                  + "techmap -map +/techmap.v t:$shiftx; opt_clean; check -assert; "
                  + "select -assert-none t:$shiftx t:$connect; "
                  + "rename " + top + " frp_m32_csr_cdc_stream_netlist; "
                  + "write_verilog -noattr " + json.dumps(str(netlist))
              )
              script_path = evidence / "synthesis.ys"
              script_path.write_text(script + "\n")
              execute(["yowasp-yosys", "-Q", "-T", "-q", "-s", str(script_path)],
                      "synthesis", view, 600)
              require(netlist.is_file() and netlist.stat().st_size > 0, "Missing netlist")
              report["netlist_sha256"] = sha(netlist.read_bytes())
              report["cell_models_sha256"] = sha(simlib.read_bytes())

              command = compiler + ["-DSIMLIB_NOCONNECT", "--top-module", bench,
                  "--Mdir", str(build), "-v", str(simlib), str(netlist), tb]
              execute(command, "build", root, 900)
              for profile in profiles:
                  h, c, p = profile
                  replays = []
                  for attempt in (1, 2):
                      log = execute([str(build / ("V" + bench)), f"+HOST_HALF={h}",
                                     f"+CORE_HALF={c}", f"+PHASE={p}"],
                                    f"run-{h}-{c}-{p}-{attempt}", root, 180)
                      records, rtl_metrics, metrics = result_records(log.read_text(), profile)
                      replays.append(records)
                  require(replays[0] == replays[1], "CDC stream post-synthesis replay records differ")
                  report["profiles"].append({"host_half_ns": h, "core_half_ns": c,
                      "phase_ns": p, "replays": 2, "rtl_metrics": rtl_metrics,
                      "metrics": metrics, "records": replays[0]})
                  print("\n".join(replays[0]), flush=True)

              for name, identity in identities.items():
                  require(sha((root / name).read_bytes()) == identity["sha256"],
                          "Source changed during qualification: " + name)
              require(sha((root / workflow).read_bytes()) == report["workflow_sha256"],
                      "Workflow changed during qualification")
              subprocess.run(["git", "diff", "--exit-code", "--"], cwd=root, check=True)
              report.update(status="PASS", simulation_runs=8,
                            stream_simulation_runs=6, frequency_simulation_runs=2,
                            result_records_identical=True, sources_unchanged=True)
              summary = ["# FRP M32 CSR CDC Stream Post-Synthesis: PASS", "",
                  "Source commit: " + os.environ["GITHUB_SHA"], "",
                  "Frequency range RTL regression: two matching replays; "
                  "144 vectors in five scheduler states, 720 updates per replay.",
                  "Load priority, 360 disabled-tick hold edges and three reset checks per replay.", "",
                  "DUT: synthesized CDC stream netlist; reference: CDC stream RTL.", "",
                  "All 43 external output bits match; two matching replays per profile.", "",
                  "| Host half (ns) | Core half (ns) | Phase (ns) | Comparisons per replay | Accepted | Completed |",
                  "| ---: | ---: | ---: | ---: | ---: | ---: |"]
              for item in report["profiles"]:
                  m = item["metrics"]
                  summary.append(f"| {m['host_half']} | {m['core_half']} | {m['phase']} | "
                                 f"{m['comparisons']} | {m['accepted']} | {m['completed']} |")
              summary += ["", "Schedules 7/1 and 1/7; active-zero routes; stopped clocks;",
                  "continuous valid requests; response backpressure; simultaneous transfers;",
                  "four reset-abort stages; 427 accepts and 423 consumed responses per replay."]
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as stream:
                  stream.write("\n".join(summary) + "\n")
              print("FRP M32 CSR CDC Stream post-synthesis qualification: PASS", flush=True)
          except Exception as error:
              report["status"] = "FAIL"
              report["error"] = str(error)
              raise
          finally:
              (evidence / "result.json").write_text(
                  json.dumps(report, indent=2, sort_keys=True) + "\n")
          PY

      - name: Retain CDC stream post-synthesis netlist, logs, and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frp-m32-csr-cdc-stream-post-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.M32_CDC_STREAM_POST_EVIDENCE }}/
          if-no-files-found: error
          retention-days: 90
