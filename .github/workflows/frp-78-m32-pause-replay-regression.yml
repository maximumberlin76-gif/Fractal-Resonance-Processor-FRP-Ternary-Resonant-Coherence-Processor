name: 78 - FRP M32 Pause Replay Regression
run-name: "78 - FRP Pause Replay | 8/16/32/64 cells and deterministic replay @ ${{ github.sha }}"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frp-78-pause-replay-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    name: M32 pause-replay - ${{ matrix.cells }} cells
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        cells: [8, 16, 32, 64]
    defaults:
      run:
        shell: bash
    env:
      CELLS: ${{ matrix.cells }}
      LC_ALL: C.UTF-8
      TZ: UTC
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Initialize evidence directory
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/frp-78-evidence"
          printf 'commit=%s\ncells=%s\nrun=%s\nattempt=%s\n' \
            "$GITHUB_SHA" "$CELLS" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            > "$RUNNER_TEMP/frp-78-evidence/context.txt"
          echo "FRP78_EVIDENCE=$RUNNER_TEMP/frp-78-evidence" >> "$GITHUB_ENV"

      - name: Check out dispatched commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify manual execution and qualified sources
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          cat > "$FRP78_EVIDENCE/sources.sha256" <<'SHA'
          765429b33df3f843626bdc411ad8371fd963738a58ab10201abef75dcdafcaf0  rtl/m31/frp_m31_active_neutral.sv
          d0587897f955ce49923aca807b5d3e0c637383c88e5d5e0dfa8405f47917c123  rtl/m31/frp_m31_capacity_guard.sv
          e516a5cd378bd2ddecdadc5abb13ddef26c63fafe5bda65b47a6bd859ca66f92  rtl/m31/frp_m31_execution_core.sv
          6b2afb8d1583c93d95d2386ba25dd1eaef6bb5bd9a4e1c9e9abff1dd004cbf24  rtl/m31/frp_m31_fixed_point_pkg.sv
          df058d4e3671ba1d7c9d0403a6bb1b8c9750a0a967905b5f91cca455c1dddb83  rtl/m31/frp_m31_global_stability.sv
          cbb5a531283164d1d54d59ec748b97bf84e172704854bf5eb7c6bda2c502f7c7  rtl/m31/frp_m31_isqrt_u64.sv
          478882d4f6a2986f5079c88b444c7b007d68145d61e5150209cb0637f35b2ec0  rtl/m31/frp_m31_local_gamma_drift.sv
          6e10f738f94c43ac9748ec7a033adde16243beea59e2f7f2973a3ab51c2e5e04  rtl/m31/frp_m31_local_thermal_attenuation.sv
          cb97c1bfeabbb2acaebf2f9644d484b2f7c5e995dbf1b70777f6bc2e7df9368e  rtl/m31/frp_m31_local_thermal_field.sv
          18889d85e78b23b844f1db4c46a35a6b7d01e609e3f1f0e6263a39a6c5729411  rtl/m31/frp_m31_pending_routes.sv
          7ac3572ef2bf9feef509e7dc43c662d92d23fa3eb0563efbfa8dba7c28157746  rtl/m31/frp_m31_phase_interference.sv
          fa78bcfe965270cc74855908aa392989d857575a2097a126539aabb1aab8990d  rtl/m31/frp_m31_phase_request_adapter.sv
          762302f1c7a7f7f40cb029f5ada6a111fc8c3e3f6be9920e9b2401b95e179c94  rtl/m31/frp_m31_pkg.sv
          32f75cc70df5dba3f4fbb511397be9a5921236c2afd16cfeb1350eca3f6e8109  rtl/m31/frp_m31_request_lanes.sv
          fc9de24b41736e5c5a9f9e464318c80adbfda9dc8cc4362c0c55bfed403bf97f  rtl/m31/frp_m31_scheduler.sv
          adbb4b94fcf8fa0bfc981d654679fd7518a5c4c9c97b611a35cd8accaf28233d  rtl/m31/frp_m31_sin_q30.mem
          69c06833e6dfbb28e25b74a5787dcd03756dddf0f66726de3ea47c1ad2931931  rtl/m31/frp_m31_stability.sv
          ebad1f7ee952a577239445d33d99cae799afaaff5c181c7162514bbcea6eab90  rtl/m31/frp_m31_state_update.sv
          34df4ebfc5dfad8e3e5e454e560404585de5c881e6f75abaae367d3bd9fb11bd  rtl/m31/frp_m31_thermal_proxy.sv
          0be6c5ee28ee4a23baf6110143eec309f387200c1c2c80e3016353d5d4107541  rtl/m32/frp_m32_core.sv
          9626474b49d32b411e107d7ccc8ee5aa7f42728e9a6f70d634d16d3f2a414c5e  rtl/m32/frp_m32_registered_target_boundary.sv
          02250069a68737f055a419cd67bf2d439b3f63b3f6a7a245f40e9bf29d1958eb  rtl/m32/frp_m32_registered_target_request_path.sv
          535260d5abd30b968c248e11373d1ab860f559e247bca1a16437442514554b69  rtl/m32/frp_m32_pause_replay_tb.sv
          SHA
          sha256sum .github/workflows/frp-78-m32-pause-replay-regression.yml \
            >> "$FRP78_EVIDENCE/sources.sha256"
          sha256sum --check --strict "$FRP78_EVIDENCE/sources.sha256" \
            | tee "$FRP78_EVIDENCE/source-check.log"
          printf '%s\n' "$GITHUB_SHA" > "$FRP78_EVIDENCE/commit.txt"

      - name: Install and record toolchain
        run: |
          set -euo pipefail
          {
            python -m pip install --disable-pip-version-check \
              verilator==5.48.0 systemc==3.0.2.1
            python -m pip check
            verilator-cli --version
            g++ --version
            make --version
          } 2>&1 | tee "$FRP78_EVIDENCE/toolchain.log"
          python -m pip freeze > "$FRP78_EVIDENCE/packages.txt"

      - name: Build once and qualify two full replays
        run: |
          set -euo pipefail
          python - <<'PYTHON'
          import hashlib
          import json
          import os
          import re
          import signal
          import subprocess
          import time
          from pathlib import Path

          GOLDEN = {
              8: '6d2cd247bc6e8f279d2e667c981fca022f0dd40bf86100e455890a0d2bf1cb71',
              16: 'ae7682c8536663b603a3658b25fc9d038fc069034fe5b648712e6d6f4f894d8f',
              32: 'bbcd6b5fa2c04a1b7462be7b6d1a52d2ceedc467c60d097701ebee9a79f15f64',
              64: 'c02cf75915cfc37b94c2f44eec190a7445b82d593817a6ff1d12f232d3db927a',
          }
          OUTPUT_BITS = {8: 8125, 16: 14537, 32: 27241, 64: 52537}

          def require(condition, message):
              if not condition:
                  raise RuntimeError(message)

          def record(line, prefix, fields):
              require(line.startswith(prefix), f'Missing record: {prefix}')
              values = {}
              for token in line[len(prefix):].split():
                  key, separator, value = token.partition('=')
                  require(separator and key not in values and re.fullmatch(r'[0-9]+', value),
                          f'Malformed or duplicate field: {token}')
                  values[key] = int(value)
              require(set(values) == set(fields.split()), f'Incorrect fields: {prefix}')
              return values

          def collect(path, n):
              text = path.read_text(errors='strict')
              require(not re.search(r'%Error|%Fatal|Assertion failed|Aborting|^FAIL\b', text, re.M),
                      'Simulation failure marker')
              lines = [line.strip() for line in text.splitlines()
                       if line.strip().startswith(('M32_PAUSE_', 'FRP_M32_PAUSE_'))]
              require(len(lines) == 13, f'Expected 13 semantic records, got {len(lines)}')
              profiles = []
              for mode in range(3):
                  for source in range(4):
                      row = record(lines[4*mode+source], 'M32_PAUSE_PROFILE: PASS ',
                                   'cells mode sources steps replays')
                      require(row == dict(cells=n, mode=mode, sources=source, steps=512, replays=2),
                              f'Incomplete or reordered profile: {mode}/{source}')
                      profiles.append(row)
              total = record(lines[-1], 'FRP_M32_PAUSE_REPLAY_TB: PASS ',
                             'cells output_ports output_bits profiles replays enabled paused checks resets '
                             'first second pending_pauses target_separations phase_changes heat_changes gamma_changes')
              expected = dict(cells=n, output_ports=103, output_bits=OUTPUT_BITS[n], profiles=12,
                              replays=2, enabled=18432, paused=42552, checks=91704, resets=36,
                              phase_changes=18432, heat_changes=18432, gamma_changes=18432)
              require(all(total[key] == value for key, value in expected.items()),
                      'Output width, activity or comparison count mismatch')
              require(total['first'] == total['second'] > 0, 'Route-leg accounting mismatch')
              require(0 < total['pending_pauses'] <= total['paused'], 'Missing pending-route pauses')
              require(0 < total['target_separations'] <= total['enabled'], 'Missing target/state separation')
              semantic = '\n'.join(lines) + '\n'
              digest = hashlib.sha256(semantic.encode()).hexdigest()
              require(digest == GOLDEN[n], f'{n}-cell baseline mismatch: {digest}')
              return dict(profiles=profiles, total=total, semantic_sha256=digest), semantic

          n = int(os.environ['CELLS'])
          require(n in GOLDEN, 'Unsupported cell count')
          evidence = Path(os.environ['FRP78_EVIDENCE']).resolve()
          build = Path(os.environ['RUNNER_TEMP']) / f'frp-78-build-{n}'
          top = 'frp_m32_pause_replay_tb'
          commands = []
          report = dict(status='FAIL', commit=os.environ['GITHUB_SHA'], cells=n,
                        builds=1, process_replays=2, pause_schedules_per_profile=2)
          (evidence / 'qualification.json').write_text(json.dumps(report, indent=2) + '\n')

          def run(command, logfile, seconds):
              entry = {'argv': command, 'timeout_seconds': seconds, 'log': logfile, 'status': 'running'}
              commands.append(entry)
              def save():
                  (evidence / 'commands.json').write_text(json.dumps(commands, indent=2) + '\n')
              save()
              print('Running:', command, flush=True)
              path = evidence / logfile
              started = time.monotonic()
              process = None
              try:
                  with path.open('w') as stream:
                      process = subprocess.Popen(command, stdout=stream, stderr=subprocess.STDOUT,
                                                 start_new_session=True)
                      while True:
                          remaining = seconds - (time.monotonic() - started)
                          if remaining <= 0:
                              raise TimeoutError(f'{logfile}: timeout after {seconds} seconds')
                          try:
                              code = process.wait(timeout=min(30, remaining))
                              break
                          except subprocess.TimeoutExpired:
                              print(f'{logfile}: running, elapsed={time.monotonic()-started:.0f}s, '
                                    f'log_bytes={path.stat().st_size}', flush=True)
                  entry['returncode'] = code
                  require(code == 0, f'{logfile}: exit {code}')
                  entry['status'] = 'passed'
              except BaseException as error:
                  if process is not None and process.poll() is None:
                      os.killpg(process.pid, signal.SIGKILL)
                      process.wait()
                  entry['status'] = 'failed'
                  entry['error'] = str(error)
                  if path.exists():
                      print(path.read_text(errors='replace')[-16000:], flush=True)
                  raise
              finally:
                  entry['elapsed_seconds'] = round(time.monotonic() - started, 3)
                  save()
              print(f'{logfile}: passed in {entry["elapsed_seconds"]}s', flush=True)

          run([
              'verilator-cli', '--binary', '--output-groups', '0',
              '--timing', '--assert', '-Wno-fatal', '-j', '2',
              '-CFLAGS', '-std=c++20', '-MAKEFLAGS', 'OPT_FAST=-Os',
              '-MAKEFLAGS', 'VK_PCH_I_FAST=', '-MAKEFLAGS', 'VK_PCH_I_SLOW=',
              '--top-module', top, f'-GCELLS={n}', '--Mdir', str(build),
              '-Irtl/m31', '-Irtl/m32', f'rtl/m32/{top}.sv',
          ], 'compile.log', 3600)
          compile_log = (evidence / 'compile.log').read_text(errors='replace')
          require(not re.search(r'%Error|%Warning-(PINMISSING|IMPLICIT|MULTIDRIVEN)\b', compile_log),
                  'Compile error or unexpected port, implicit signal or multiple driver')
          executable = build / f'V{top}'
          executable_hash = hashlib.sha256(executable.read_bytes()).hexdigest()
          (evidence / 'executable.sha256').write_text(f'{executable_hash}  V{top}\n')
          replays = []
          for replay in (1, 2):
              require(hashlib.sha256(executable.read_bytes()).hexdigest() == executable_hash,
                      'Executable changed before replay')
              logfile = f'run-{replay}.log'
              run([str(executable)], logfile, 3600)
              result, semantic = collect(evidence / logfile, n)
              (evidence / f'run-{replay}.txt').write_text(semantic)
              replays.append((result, semantic))
              print(semantic, end='')
          require(replays[0] == replays[1], 'Deterministic replay mismatch')
          require(hashlib.sha256(executable.read_bytes()).hexdigest() == executable_hash,
                  'Executable changed during replay')
          run(['sha256sum', '--check', '--strict', str(evidence / 'sources.sha256')],
              'source-final-check.log', 60)
          result, semantic = replays[0]
          report.update(status='PASS', replay_equal=True, baseline_checked=True,
                        semantic_records=13, executable_sha256=executable_hash, **result)
          (evidence / 'qualification.json').write_text(json.dumps(report, indent=2) + '\n')
          summary = (f'### FRP 78: {n} cells - PASS\n\n'
                     'One build; two process replays; 12 profiles per replay.\n\n'
                     'Each profile: 512 enabled transactions, reference and two pause schedules.\n\n'
                     '103 output ports; separate stability completion and pause-retention checks.\n\n'
                     f'Semantic SHA-256: `{result["semantic_sha256"]}`\n\n'
                     '```text\n' + semantic.splitlines()[-1] + '\n```\n')
          (evidence / 'summary.md').write_text(summary)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write(summary)
          print('PASS: pause replay, stability completion and deterministic replay')
          PYTHON

      - name: Recheck qualified sources
        if: always()
        run: |
          set -euo pipefail
          sha256sum --check --strict "$FRP78_EVIDENCE/sources.sha256" \
            | tee "$FRP78_EVIDENCE/source-recheck.log"

      - name: Hash qualification evidence
        if: always()
        run: |
          set -euo pipefail
          python - <<'PYTHON'
          import hashlib
          import os
          from pathlib import Path
          root = Path(os.environ['FRP78_EVIDENCE'])
          files = sorted(p for p in root.rglob('*') if p.is_file() and p.name != 'evidence.sha256')
          manifest = ''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(root)}\n'
                             for p in files)
          (root / 'evidence.sha256').write_text(manifest)
          PYTHON

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          name: frp-78-pause-replay-${{ matrix.cells }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/frp-78-evidence/
          if-no-files-found: error
          retention-days: 30
