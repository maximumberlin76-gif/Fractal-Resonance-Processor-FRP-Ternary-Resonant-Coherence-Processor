name: 111 - FRP M32 Boundary Snapshot CSR Qualification
run-name: '111 - FRP Snapshot CSR | 18 configurations, 4 seeds, 144 executions @ ${{ github.sha }}'

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install simulation tools
        run: |
          set -euo pipefail
          mkdir -p bundle
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential
          python -m pip install --disable-pip-version-check 'verilator==5.48.0'
          {
            python --version
            python -m pip show verilator
            verilator-cli --version
            g++ --version
            make --version
          } > bundle/toolchain.txt 2>&1

      - name: Qualify atomic snapshots and deterministic replay
        run: |
          set -euo pipefail
          ulimit -c 0
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          import shlex
          import subprocess
          import tempfile
          from pathlib import Path

          root = Path('source').resolve()
          out = Path('bundle').resolve()
          out.mkdir(exist_ok=True)
          seeds = (0, 76, 2026, 4294967295)
          profiles = {(n, b) for n in (1, 8, 9, 16, 32, 64) for b in (1, 3, 64)}
          keys = {'cells', 'count_bits', 'seed', 'cycles', 'comparisons',
                  'captures', 'replacements', 'releases', 'errors', 'idle',
                  'resets', 'signature'}
          report = {'schema': 'frp.m32.boundary_snapshot_csr.qualification.v1',
                    'status': 'RUNNING', 'seeds': list(seeds),
                    'configurations': 18, 'replays_per_seed': 2, 'runs': []}

          def require(ok, message):
              if not ok:
                  raise RuntimeError(message)

          def save():
              (out / 'results.json').write_text(json.dumps(report, indent=2) + '\n')

          def execute(command, log_name, seconds):
              command = ['timeout', '--kill-after=15s', f'{seconds}s'] + command
              path = out / log_name
              with path.open('w') as log:
                  log.write(shlex.join(command) + '\n')
                  log.flush()
                  result = subprocess.run(command, cwd=root, stdout=log,
                                          stderr=subprocess.STDOUT)
              require(result.returncode == 0, f'{log_name}: exit {result.returncode}')
              return path.read_text(errors='replace')

          def parse(text, seed):
              records = {}
              for line in text.splitlines():
                  if not line.startswith('PASS SNAPSHOT_CSR '):
                      continue
                  tokens = line.split()[2:]
                  fields = dict(token.split('=', 1) for token in tokens)
                  require(set(fields) == keys and len(tokens) == len(keys),
                          'PASS field set mismatch')
                  require(re.fullmatch(r'[0-9a-f]{16}', fields['signature']),
                          'Invalid trajectory signature')
                  require(all(re.fullmatch(r'[0-9]+', v) for k, v in fields.items()
                              if k != 'signature'), 'Invalid numeric field')
                  record = {k: (v if k == 'signature' else int(v))
                            for k, v in fields.items()}
                  pair = (record['cells'], record['count_bits'])
                  require(pair in profiles and pair not in records,
                          'Unexpected or duplicate configuration')
                  require(record['seed'] == seed, 'Seed mismatch')
                  cycles = 5275 + 18 * pair[0] + 3 * pair[1]
                  require(record['cycles'] == cycles and record['resets'] == 14,
                          'Scenario counts mismatch')
                  require(record['comparisons'] == 3 * (cycles + 14),
                          'Comparison accounting mismatch')
                  require(all(0 < record[k] <= cycles for k in
                              ('captures', 'replacements', 'releases', 'errors', 'idle')),
                          'Missing or invalid scenario count')
                  require(record['replacements'] <= record['captures'],
                          'Replacement count mismatch')
                  records[pair] = record
              require(set(records) == profiles, 'Incomplete configuration set')
              require(text.splitlines().count(
                  'PASS SNAPSHOT_CSR_MATRIX configurations=18') == 1,
                  'Matrix completion record mismatch')
              return [records[p] for p in sorted(records)]

          save()
          try:
              require(os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch',
                      'Manual execution required')
              sha = subprocess.check_output(
                  ['git', '-C', str(root), 'rev-parse', 'HEAD'], text=True).strip()
              require(sha == os.environ['GITHUB_SHA'], 'Checked-out commit mismatch')
              report['commit'] = sha
              paths = [root / 'rtl/m32' / name for name in (
                  'frp_m32_boundary_snapshot_csr.sv',
                  'frp_m32_boundary_snapshot_csr_tb.sv')]
              originals = {p: p.read_bytes() for p in paths}
              hashes = {str(p.relative_to(root)): hashlib.sha256(data).hexdigest()
                        for p, data in originals.items()}
              (out / 'source_sha256.json').write_text(json.dumps(hashes, indent=2) + '\n')

              with tempfile.TemporaryDirectory(prefix='frp111-',
                                               dir=os.environ['RUNNER_TEMP']) as temporary:
                  obj = Path(temporary) / 'obj'
                  top = 'frp_m32_boundary_snapshot_csr_tb'
                  command = [
                      'verilator-cli', '--binary', '--timing', '--assert',
                      '--unroll-count', '1', '--output-groups', '32',
                      '--output-split', '10000', '--output-split-cfuncs', '100',
                      '--top-module', top, '-j', '2', '--verilate-jobs', '1',
                      '-Wno-fatal', '-MAKEFLAGS', 'VK_PCH_I_FAST=',
                      '-MAKEFLAGS', 'VK_PCH_I_SLOW=', '-MAKEFLAGS', 'OPT_FAST=-O0',
                      '-I' + str(root / 'rtl/m32'), '--Mdir', str(obj), str(paths[1])
                  ]
                  execute(command, 'matrix-build.log', 2400)
                  binary = str(obj / ('V' + top))
                  for seed in seeds:
                      repeated = []
                      for replay in (1, 2):
                          text = execute([binary, f'+seed={seed}'],
                                         f'seed-{seed}-replay-{replay}.log', 120)
                          records = parse(text, seed)
                          repeated.append(records)
                          report['runs'].append({'seed': seed, 'replay': replay,
                                                 'records': records})
                          save()
                      require(repeated[0] == repeated[1], f'Replay mismatch seed={seed}')
                      print(f'PASS seed={seed}: 18 configurations, identical replays', flush=True)

              require(all(p.read_bytes() == data for p, data in originals.items()),
                      'Original source changed')
              records = [r for run in report['runs'] for r in run['records']]
              report['configuration_executions'] = len(records)
              report['bus_cycles'] = sum(r['cycles'] for r in records)
              report['output_comparisons'] = sum(r['comparisons'] for r in records)
              require((len(records), report['bus_cycles'], report['output_comparisons'])
                      == (144, 825552, 2482704), 'Matrix totals mismatch')
              report['status'] = 'PASS'
          except Exception as error:
              report['status'] = 'FAIL'
              report['error'] = str(error)
              print('::error::Snapshot CSR qualification failed; inspect bundle logs')
          finally:
              save()
              summary = [
                  '## FRP M32 Boundary Snapshot CSR Qualification', '',
                  f"Result: **{report['status']}**", '',
                  f"Commit: `{report.get('commit', 'unavailable')}`", '',
                  'Cells: 1, 8, 9, 16, 32, 64; counter widths: 1, 3, 64 bits.',
                  'Seeds: 0, 76, 2026, 4294967295; two replays per seed.', '',
                  f"Validated configuration executions: {sum(len(r['records']) for r in report['runs'])}/144.",
                  'Scenarios: all 256 byte addresses, 26 payload words, 32 flag patterns,',
                  'capture replacement, release, invalid commands, idle requests,',
                  'changing live inputs, walking bank/counter bits and asynchronous reset.', ''
              ]
              if report['status'] == 'PASS':
                  summary += ['All replay records match within each seed.',
                              'Bus cycles: 825552; output comparisons: 2482704.']
              if 'error' in report:
                  summary += ['Failure details: results.json and the named log in the artifact.']
              summary += ['', 'Artifact: build/run logs, toolchain, source hashes and JSON results.', '']
              (out / 'summary.md').write_text('\n'.join(summary))
          require(report['status'] == 'PASS', 'Snapshot CSR qualification failed')
          PY

      - name: Publish Actions summary
        if: always()
        run: |
          mkdir -p bundle
          if [ ! -f bundle/summary.md ]; then
            printf '%s\n' 'Qualification stopped before the final report; inspect the step logs.' > bundle/summary.md
          fi
          cat bundle/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload one combined artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frp-111-snapshot-csr-${{ github.run_id }}-${{ github.run_attempt }}
          path: bundle/
          if-no-files-found: error
          retention-days: 14
