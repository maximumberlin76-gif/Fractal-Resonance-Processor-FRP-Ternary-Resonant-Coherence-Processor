name: 70 - FRP M32 Cross-Feedback Regression
run-name: "70 - FRP Cross-Feedback | 8/16/32 cells and deterministic replay @ ${{ github.sha }}"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frp-70-cross-feedback-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    name: M32 cross-feedback - ${{ matrix.cells }} cells
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        cells: [8, 16, 32]
    defaults:
      run:
        shell: bash
    env:
      CELLS: ${{ matrix.cells }}
      LC_ALL: C.UTF-8
      TZ: UTC
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Initialize evidence directory
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/frp-70-evidence"
          echo "FRP70_EVIDENCE=$RUNNER_TEMP/frp-70-evidence" >> "$GITHUB_ENV"

      - name: Check out dispatched commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify manual execution and qualified sources
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          cat > "$FRP70_EVIDENCE/sources.sha256" <<'SHA'
          765429b33df3f843626bdc411ad8371fd963738a58ab10201abef75dcdafcaf0  rtl/m31/frp_m31_active_neutral.sv
          d0587897f955ce49923aca807b5d3e0c637383c88e5d5e0dfa8405f47917c123  rtl/m31/frp_m31_capacity_guard.sv
          e516a5cd378bd2ddecdadc5abb13ddef26c63fafe5bda65b47a6bd859ca66f92  rtl/m31/frp_m31_execution_core.sv
          6b2afb8d1583c93d95d2386ba25dd1eaef6bb5bd9a4e1c9e9abff1dd004cbf24  rtl/m31/frp_m31_fixed_point_pkg.sv
          d1604e08fa6cf658f25b579fb76202e65fca1481167e6d8d6039a7034e354832  rtl/m31/frp_m31_global_stability.sv
          cbb5a531283164d1d54d59ec748b97bf84e172704854bf5eb7c6bda2c502f7c7  rtl/m31/frp_m31_isqrt_u64.sv
          478882d4f6a2986f5079c88b444c7b007d68145d61e5150209cb0637f35b2ec0  rtl/m31/frp_m31_local_gamma_drift.sv
          6e10f738f94c43ac9748ec7a033adde16243beea59e2f7f2973a3ab51c2e5e04  rtl/m31/frp_m31_local_thermal_attenuation.sv
          2973c4ce73c014cd2692e2fa34cbf1ef6daa88d8e4115a545d6e776acb75cff6  rtl/m31/frp_m31_local_thermal_field.sv
          18889d85e78b23b844f1db4c46a35a6b7d01e609e3f1f0e6263a39a6c5729411  rtl/m31/frp_m31_pending_routes.sv
          81cd497e3f3e04abc93a2052c23deb189b2c200b11cc249ec51dbd40588e9523  rtl/m31/frp_m31_phase_interference.sv
          fa78bcfe965270cc74855908aa392989d857575a2097a126539aabb1aab8990d  rtl/m31/frp_m31_phase_request_adapter.sv
          762302f1c7a7f7f40cb029f5ada6a111fc8c3e3f6be9920e9b2401b95e179c94  rtl/m31/frp_m31_pkg.sv
          32f75cc70df5dba3f4fbb511397be9a5921236c2afd16cfeb1350eca3f6e8109  rtl/m31/frp_m31_request_lanes.sv
          fc9de24b41736e5c5a9f9e464318c80adbfda9dc8cc4362c0c55bfed403bf97f  rtl/m31/frp_m31_scheduler.sv
          adbb4b94fcf8fa0bfc981d654679fd7518a5c4c9c97b611a35cd8accaf28233d  rtl/m31/frp_m31_sin_q30.mem
          69c06833e6dfbb28e25b74a5787dcd03756dddf0f66726de3ea47c1ad2931931  rtl/m31/frp_m31_stability.sv
          ebad1f7ee952a577239445d33d99cae799afaaff5c181c7162514bbcea6eab90  rtl/m31/frp_m31_state_update.sv
          34df4ebfc5dfad8e3e5e454e560404585de5c881e6f75abaae367d3bd9fb11bd  rtl/m31/frp_m31_thermal_proxy.sv
          df35b73ccb01f06908385656332942858a5f056e7b92556cc16658beb5732b98  rtl/m32/frp_m32_core.sv
          e9b4e7092b23802e047459818ce6df010485b6e2ddb8314026348ca92dd0ef12  rtl/m32/frp_m32_cross_feedback_tb.sv
          9626474b49d32b411e107d7ccc8ee5aa7f42728e9a6f70d634d16d3f2a414c5e  rtl/m32/frp_m32_registered_target_boundary.sv
          02250069a68737f055a419cd67bf2d439b3f63b3f6a7a245f40e9bf29d1958eb  rtl/m32/frp_m32_registered_target_request_path.sv
          SHA
          sha256sum .github/workflows/frp-70-m32-cross-feedback-regression.yml \
            >> "$FRP70_EVIDENCE/sources.sha256"
          sha256sum --check "$FRP70_EVIDENCE/sources.sha256" \
            | tee "$FRP70_EVIDENCE/source-check.log"
          printf '%s\n' "$GITHUB_SHA" > "$FRP70_EVIDENCE/commit.txt"

      - name: Install and record toolchain
        run: |
          set -euo pipefail
          {
            python -m pip install --disable-pip-version-check \
              verilator==5.48.0 systemc==3.0.2.1
            python -m pip check
            verilator-cli --version
            g++ --version
            make --version
          } 2>&1 | tee "$FRP70_EVIDENCE/toolchain.log"
          python -m pip freeze > "$FRP70_EVIDENCE/packages.txt"

      - name: Build once and qualify two seeds with deterministic replay
        run: |
          set -euo pipefail
          python - <<'PYTHON'
          import hashlib
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          n = int(os.environ['CELLS'])
          golden = {
              8: ('4176d226e76b9a595cf573d562b31f65fda41400ff195bf8ac771d9b78a4ed9e',
                  '4f88844e7b88a49a17172a3a9d8fda12292a0f7cd14f8b6076bf6e305be9c498'),
              16: ('ea6e84058eccbeebdde297b699e6e0573c37b270028d81d30e31828d1e9c38be',
                   '5d5cd4949a1e4c8f213d10c34598c42745074e9e4731152b25b92d94381fe36e'),
              32: ('1b569ea2caf1c84edfd56edfbb8b47758784db32fec2248c752f429c3da656ff',
                   '1bc4f3029452c03d5602841ac6bd219767f5c5676d76fb6ab246890f1738734a'),
          }
          if n not in golden:
              raise SystemExit('Unsupported cell count')
          evidence = Path(os.environ['FRP70_EVIDENCE']).resolve()
          build = Path(os.environ['RUNNER_TEMP']) / f'frp-70-build-{n}'
          top = 'frp_m32_cross_feedback_tb'
          commands = []

          def run(command, logfile, seconds):
              commands.append(command)
              (evidence / 'commands.json').write_text(json.dumps(commands, indent=2) + '\n')
              print('Running:', command, flush=True)
              path = evidence / logfile
              try:
                  with path.open('w') as stream:
                      result = subprocess.run(command, stdout=stream, stderr=subprocess.STDOUT,
                                              timeout=seconds, check=False)
              except subprocess.TimeoutExpired:
                  print(path.read_text(errors='replace')[-16000:])
                  raise SystemExit(f'{logfile}: timeout after {seconds} seconds')
              if result.returncode:
                  print(path.read_text(errors='replace')[-16000:])
                  raise SystemExit(f'{logfile}: exit {result.returncode}')

          run([
              'verilator-cli', '--binary', '--output-groups', '0',
              '--timing', '--assert', '-Wno-fatal', '-j', '1',
              '-CFLAGS', '-std=c++20', '-MAKEFLAGS', 'OPT_FAST=-O0',
              '-MAKEFLAGS', 'VK_PCH_I_FAST=', '-MAKEFLAGS', 'VK_PCH_I_SLOW=',
              '--top-module', top, f'-GCELLS={n}', '--Mdir', str(build),
              '-Irtl/m31', '-Irtl/m32', f'rtl/m32/{top}.sv',
          ], 'compile.log', 1200)
          compile_log = (evidence / 'compile.log').read_text(errors='replace')
          if re.search(r'%Warning-(PINMISSING|IMPLICIT|MULTIDRIVEN)\b', compile_log):
              raise SystemExit('Unexpected port, implicit signal or multiple driver')
          executable = build / f'V{top}'
          (evidence / 'executable.sha256').write_text(
              f'{hashlib.sha256(executable.read_bytes()).hexdigest()}  V{top}\n'
          )

          def fields(line, prefix):
              result = {}
              for token in line[len(prefix):].split():
                  key, separator, value = token.partition('=')
                  if not separator or not re.fullmatch(r'[A-Za-z_][A-Za-z_0-9]*', key) or key in result:
                      raise SystemExit(f'Malformed or duplicate field: {token}')
                  if key == 'signature':
                      if not re.fullmatch(r'[0-9a-f]{16}', value):
                          raise SystemExit('Invalid signature')
                      result[key] = value
                  else:
                      if not re.fullmatch(r'[0-9]+', value):
                          raise SystemExit(f'Invalid nonnegative integer: {token}')
                      result[key] = int(value)
              return result

          def collect(path, case_id, seed):
              lines = path.read_text().splitlines()
              if any('%Error' in line or 'Assertion failed' in line or 'Aborting' in line for line in lines):
                  raise SystemExit(f'{path.name}: simulator failure')
              if not any('Verilog $finish' in line for line in lines):
                  raise SystemExit(f'{path.name}: missing normal simulator finish')
              selected = [line for line in lines if line.startswith(('SOURCE ', 'RESET ', 'BACKLOG ', 'PASS '))]
              expected = []
              if case_id == 0:
                  expected = [
                      f'SOURCE cells={n} mode={m} from={a} to={b} cases=8'
                      for m in range(3) for a in range(4) for b in range(4)
                  ] + [f'RESET cells={n} cases=96']
              offset = len(expected)
              if len(selected) != offset + 4 or selected[:offset] != expected:
                  raise SystemExit('Missing, duplicated or incorrect scenario records')
              for m in range(3):
                  prefix = 'BACKLOG '
                  line = selected[offset + m]
                  if not line.startswith(prefix):
                      raise SystemExit('Missing backlog record')
                  record = fields(line, prefix)
                  if set(record) != {'cells', 'mode', 'ticks', 'final_services'}:
                      raise SystemExit('Unexpected backlog field set')
                  if (record['cells'], record['mode'], record['ticks']) != (n, m, 2048):
                      raise SystemExit('Incorrect backlog scenario')
                  if record['final_services'] > n:
                      raise SystemExit('Invalid final route service count')
              prefix = 'PASS CROSS_FEEDBACK '
              if not selected[-1].startswith(prefix):
                  raise SystemExit('Missing final cross-feedback PASS')
              total = fields(selected[-1], prefix)
              required = {
                  'cells', 'case', 'seed', 'cycles', 'checks', 'sources', 'resets', 'stream',
                  'routes', 'completions', 'retention', 'balancing', 'neutralization',
                  'arbitration', 'backlog', 'hierarchy', 'uneven_heat', 'auto_switches',
                  'shocks', 'negative_margin', 'positive_margin', 'signature',
              }
              if set(total) != required:
                  raise SystemExit('Unexpected PASS field set')
              exact = {
                  'cells': n, 'case': case_id, 'seed': seed,
                  'cycles': 42975 if case_id == 0 else 6639,
                  'sources': 384 if case_id == 0 else 0,
                  'resets': 96 if case_id == 0 else 0,
                  'stream': 6144, 'auto_switches': 381, 'shocks': 24,
              }
              for key, value in exact.items():
                  if total[key] != value:
                      raise SystemExit(f'Incorrect coverage {key}: {total[key]} != {value}')
              for key in required - set(exact) - {'signature'}:
                  if total[key] <= 0:
                      raise SystemExit(f'Missing coverage: {key}')
              if total['routes'] != total['completions'] + total['resets'] * (n // 4):
                  raise SystemExit('Retained-route accounting mismatch, including reset cancellation')
              semantic = '\n'.join(selected) + '\n'
              digest = hashlib.sha256(semantic.encode()).hexdigest()
              expected_hash = golden[n][0 if case_id == 0 else 1]
              if digest != expected_hash:
                  raise SystemExit(f'Qualified result mismatch: expected {expected_hash}, observed {digest}')
              return total, semantic, digest

          report = {
              'commit': os.environ['GITHUB_SHA'], 'cells': n, 'builds': 1,
              'contract': {
                  'modes': ['FREE', '7/1', '1/7'],
                  'sources': 'All 16 source pairs at all 8 cadence positions in each mode',
                  'controls': 'Tick hold and clear combinations distributed across source cases',
                  'reset': 'Hot pending routes and delayed C-P snapshot; asynchronous reset and fresh-sample timing',
                  'active_zero': 'Routing, retained destinations, balancing, neutralization and capacity-priority service',
                  'interference': 'Independent phase, frequency, thermal, gamma and coupling references',
                  'coherence': 'Every group and level: mean, minimum, maximum and dispersion',
                  'stability': 'Delayed C-P, compression, effective coherence and both margin signs',
                  'stress': '6144 ticks, automatic/external request changes, live feedback sources and 24 local disturbances',
                  'units': {'coherence': 'Q30', 'margin_and_heat': 'Q16'},
              },
              'runs': [],
          }
          summary = [f'### FRP 70: {n} cells — PASS\n',
                     'One build; two complete replays and two additional-seed stress replays.\n']
          for label, case_id, seed in [('full', 0, 1889608517), ('stress', 3, 314159265)]:
              replays = []
              for replay in (1, 2):
                  logfile = f'{label}-{replay}.log'
                  run([str(executable), f'+CASE={case_id}', f'+SEED={seed}'], logfile, 600)
                  total, semantic, digest = collect(evidence / logfile, case_id, seed)
                  (evidence / f'{label}-{replay}.txt').write_text(semantic)
                  replays.append((total, semantic, digest))
                  print(semantic, end='')
              if replays[0] != replays[1]:
                  raise SystemExit(f'{label}: deterministic replay mismatch')
              total, semantic, digest = replays[0]
              report['runs'].append({'case': case_id, 'seed': seed, 'replays': 2,
                                     'replay_equal': True, 'semantic_sha256': digest, 'total': total})
              summary.append(f'**{label}**: {total["checks"]:,} checks per replay; SHA-256 `{digest}`.\n')
              summary.append('```text\n' + semantic.splitlines()[-1] + '\n```\n')
          (evidence / 'qualification.json').write_text(json.dumps(report, indent=2) + '\n')
          summary = '\n'.join(summary)
          (evidence / 'summary.md').write_text(summary)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write(summary)
          print('PASS: M32 cross-feedback, active-zero service, multiscale coherence and deterministic replay')
          PYTHON
          sha256sum --check "$FRP70_EVIDENCE/sources.sha256" \
            > "$FRP70_EVIDENCE/source-recheck.log"

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: frp-70-cross-feedback-${{ matrix.cells }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/frp-70-evidence/
          if-no-files-found: error
          retention-days: 30
