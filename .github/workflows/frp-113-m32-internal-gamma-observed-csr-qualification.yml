name: 113 - FRP M32 Internal Gamma Observed CSR Qualification
run-name: '113 - FRP Internal Gamma Observed CSR | 5 profiles, 20 replays, 2 mutations @ ${{ github.sha }}'

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install simulation tools
        run: |
          set -euo pipefail
          mkdir -p bundle
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential
          python -m pip install --disable-pip-version-check 'verilator==5.48.0'
          {
            python --version
            python -m pip show verilator
            verilator-cli --version
            g++ --version
            make --version
          } > bundle/toolchain.txt 2>&1

      - name: Qualify integration, replay and error detection
        run: |
          set -euo pipefail
          ulimit -c 0
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          import shlex
          import shutil
          import subprocess
          import tempfile
          from pathlib import Path

          root = Path('source').resolve()
          out = Path('bundle').resolve()
          out.mkdir(exist_ok=True)
          profiles = ((8, 64), (8, 3), (16, 64), (32, 64), (64, 64))
          seeds = (0, 76)
          top = 'frp_m32_internal_gamma_observed_csr_tb'
          dut_name = 'frp_m32_boundary_snapshot_csr.sv'
          tb_name = top + '.sv'
          gamma_keys = {'cells', 'outputs', 'stalls', 'stalled_csr', 'reloads'}
          recorder_keys = {
              'cells', 'count_bits', 'seed', 'cycles', 'comparisons', 'accepted',
              'recorded', 'dropped', 'captures', 'concurrent', 'frozen_reads',
              'pulse_captures', 'pulse_reads', 'saturated', 'resets',
              'first_legs', 'second_legs', 'signature'
          }
          report = {'schema': 'frp.m32.internal_gamma_observed_csr.qualification.v1',
                    'status': 'RUNNING', 'profiles': profiles, 'seeds': seeds,
                    'replays_per_seed': 2, 'runs': [], 'replay_pairs': 0,
                    'mutations': []}

          def require(ok, message):
              if not ok:
                  raise RuntimeError(message)

          def save():
              (out / 'results.json').write_text(json.dumps(report, indent=2) + '\n')

          def execute(command, log_name, seconds, expect_success=True):
              command = ['timeout', '--kill-after=15s', f'{seconds}s'] + command
              path = out / log_name
              with path.open('w') as log:
                  log.write(shlex.join(command) + '\n')
                  log.flush()
                  result = subprocess.run(command, cwd=root, stdout=log,
                                          stderr=subprocess.STDOUT)
              text = path.read_text(errors='replace')
              if expect_success:
                  require(result.returncode == 0, f'{log_name}: exit {result.returncode}')
              return result.returncode, text

          def parse_fields(line, prefix, keys):
              tokens = line[len(prefix):].split()
              fields = dict(token.split('=', 1) for token in tokens)
              require(set(fields) == keys and len(tokens) == len(keys),
                      'PASS field set mismatch')
              for key, value in fields.items():
                  pattern = r'[0-9a-f]{16}' if key == 'signature' else r'[0-9]+'
                  require(re.fullmatch(pattern, value), 'Invalid field: ' + key)
              return {k: (v if k == 'signature' else int(v))
                      for k, v in fields.items()}

          def parse(text, cells, bits, seed):
              lines = [line for line in text.splitlines() if line.startswith('PASS ')]
              prefixes = ('PASS INTERNAL_GAMMA_OBSERVED ', 'PASS OBSERVED_SNAPSHOT_CSR ')
              require(len(lines) == 2 and
                      all(line.startswith(prefix) for line, prefix in zip(lines, prefixes)),
                      'Missing, duplicate or unexpected PASS record')
              gamma = parse_fields(lines[0], prefixes[0], gamma_keys)
              record = parse_fields(lines[1], prefixes[1], recorder_keys)
              require((gamma['cells'], gamma['outputs'], gamma['reloads']) ==
                      (cells, 114, 10), 'Reference/checkpoint coverage mismatch')
              require(gamma['stalls'] >= gamma['stalled_csr'] > 0,
                      'Missing CSR access during gamma stalls')
              require((record['cells'], record['count_bits'], record['seed']) ==
                      (cells, bits, seed), 'Profile or seed mismatch')
              require(record['resets'] == 9 and record['dropped'] == 3,
                      'Reset pipeline coverage mismatch')
              require(record['accepted'] == record['recorded'] + record['dropped']
                      and record['recorded'] > 0, 'Sample conservation mismatch')
              require(record['comparisons'] == 2 * (record['cycles'] + record['resets']),
                      'Comparison accounting mismatch')
              for key in ('captures', 'concurrent', 'frozen_reads', 'pulse_captures',
                          'first_legs', 'second_legs'):
                  require(record[key] > 0, 'Missing scenario: ' + key)
              require(record['captures'] >= record['concurrent'] and
                      record['pulse_reads'] >= record['pulse_captures'],
                      'Capture/pulse coverage mismatch')
              require((record['saturated'] > 0) if bits == 3 else
                      (record['saturated'] == 0), 'Saturation coverage mismatch')
              return {'gamma': gamma, 'recorder': record}

          def mutation_diagnostic(code, text, pattern):
              diagnostic = re.search(pattern, text)
              require(code in (1, 134, -6) and diagnostic is not None and
                      not any(line.startswith('PASS ') for line in text.splitlines()),
                      'Mutation did not produce the expected runtime failure')
              return diagnostic[0]

          def source_hashes():
              return {str(p.relative_to(root)): hashlib.sha256(p.read_bytes()).hexdigest()
                      for directory in ('rtl/m31', 'rtl/m32')
                      for p in sorted((root / directory).rglob('*'))
                      if p.is_file() and p.suffix in ('.sv', '.svh', '.v', '.mem')}

          save()
          try:
              require(os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch',
                      'Manual execution required')
              sha = subprocess.check_output(
                  ['git', '-C', str(root), 'rev-parse', 'HEAD'], text=True).strip()
              require(sha == os.environ['GITHUB_SHA'], 'Checked-out commit mismatch')
              report['commit'] = sha
              hashes = source_hashes()
              (out / 'source_sha256.json').write_text(json.dumps(hashes, indent=2) + '\n')
              tb = (root / 'rtl/m32' / tb_name).read_text()

              with tempfile.TemporaryDirectory(prefix='frp113-',
                                               dir=os.environ['RUNNER_TEMP']) as temporary:
                  scratch = Path(temporary)

                  def build(cells, bits, tag, mutation=None):
                      directory = scratch / tag
                      directory.mkdir()
                      (directory / tb_name).write_text(tb)
                      if mutation is not None:
                          (directory / mutation[0]).write_text(mutation[1])
                      obj = directory / 'obj'
                      command = [
                          'verilator-cli', '--binary', '--timing', '--assert',
                          '--unroll-count', '1', '--output-groups', '32',
                          '--output-split', '10000', '--output-split-cfuncs', '0',
                          '--top-module', top, '-j', '2', '--verilate-jobs', '1',
                          '-Wno-fatal', '-MAKEFLAGS', 'VK_PCH_I_FAST=',
                          '-MAKEFLAGS', 'VK_PCH_I_SLOW=', '-MAKEFLAGS', 'OPT_FAST=-O0',
                          '-I' + str(directory), '-I' + str(root / 'rtl/m31'),
                          '-I' + str(root / 'rtl/m32'), '--Mdir', str(obj),
                          f'-GCELLS={cells}', f'-GCOUNT_BITS={bits}', str(directory / tb_name)
                      ]
                      execute(command, tag + '-build.log', 1800)
                      return directory, str(obj / ('V' + top))

                  for cells, bits in profiles:
                      tag = f'cells-{cells}-bits-{bits}'
                      directory, binary = build(cells, bits, tag)
                      for seed in seeds:
                          repeated = []
                          for replay in (1, 2):
                              _, text = execute([binary, f'+seed={seed}'],
                                                f'{tag}-seed-{seed}-replay-{replay}.log', 1200)
                              record = parse(text, cells, bits, seed)
                              repeated.append(record)
                              report['runs'].append({'replay': replay, 'record': record})
                              save()
                          require(repeated[0] == repeated[1], f'Replay mismatch {tag} seed={seed}')
                          report['replay_pairs'] += 1
                          save()
                          print(f'PASS {tag} seed={seed}: identical replays', flush=True)
                      shutil.rmtree(directory)

                  mutations = (
                      ('unaccepted_tick', 'frp_m32_internal_gamma_observed_csr_core.sv',
                       '.tick_enable(tick_accepted)', '.tick_enable(tick_valid)',
                       r'COMMON_OUTPUT_MISMATCH cells=8 cycle=\d+ phase=\d+'),
                      ('live_snapshot', dut_name,
                       "csr_rdata = snapshot_words_q[((int'(csr_addr)-16)/4)*32+:32];",
                       "csr_rdata = capture_words[((int'(csr_addr)-16)/4)*32+:32];",
                       r'SNAPSHOT_CSR cells=8 bits=3 cycle=\d+ phase=\d+ '
                       r'addr=[0-9a-f]+ got=[0-9a-f]+ expected=[0-9a-f]+')
                  )
                  for name, filename, before, after, pattern in mutations:
                      original = (root / 'rtl/m32' / filename).read_text()
                      require(original.count(before) == 1, 'Mutation anchor mismatch: ' + name)
                      changed = original.replace(before, after)
                      (out / (name + '.sv')).write_text(changed)
                      directory, binary = build(8, 3, name, (filename, changed))
                      code, text = execute([binary, '+seed=76'], name + '-run.log',
                                           1200, expect_success=False)
                      item = {'name': name, 'detected': False, 'exit_code': code,
                              'source_sha256': hashlib.sha256(changed.encode()).hexdigest()}
                      report['mutations'].append(item)
                      save()
                      item['diagnostic'] = mutation_diagnostic(code, text, pattern)
                      item['detected'] = True
                      save()
                      print('DETECTED ' + name, flush=True)
                      shutil.rmtree(directory)

              require(source_hashes() == hashes, 'Original RTL or lookup data changed')
              records = [item['record']['recorder'] for item in report['runs']]
              report['executions'] = len(records)
              report['bus_cycles'] = sum(r['cycles'] for r in records)
              report['output_comparisons'] = sum(r['comparisons'] for r in records)
              require(len(records) == 20 and report['replay_pairs'] == 10 and
                      len(report['mutations']) == 2 and
                      all(item['detected'] for item in report['mutations']),
                      'Qualification totals mismatch')
              report['status'] = 'PASS'
          except Exception as error:
              report['status'] = 'FAIL'
              report['error'] = str(error)
              print('::error::Observed snapshot CSR qualification failed; inspect bundle logs')
          finally:
              save()
              summary = [
                  '## FRP M32 Internal Gamma Observed CSR Qualification', '',
                  f"Result: **{report['status']}**", '',
                  f"Commit: `{report.get('commit', 'unavailable')}`", '',
                  'Profiles (cells / counter bits): 8/64, 8/3, 16/64, 32/64, 64/64.',
                  'Seeds: 0 and 76; two replays per profile and seed.', '',
                  f"Validated executions: {len(report['runs'])}/20.",
                  f"Matching replay pairs: {report['replay_pairs']}/10.", '',
                  'Checks: 114 outputs against the original internal-gamma core before and after each edge,',
                  'ten checkpoint loads per execution, gamma stalls with CSR traffic, all 26 snapshot words,',
                  'concurrent capture and recorder updates,',
                  'frozen reads, boundary pulses, counter saturation, reset and sample conservation,',
                  'active-zero route legs, free / 7/1 / 1/7 scheduling.', '',
                  '| Mutation | Expected runtime failure detected |',
                  '| --- | --- |'
              ]
              for item in report['mutations']:
                  summary.append(f"| {item['name']} | {item['detected']} |")
              if report['status'] == 'PASS':
                  summary += ['', f"Bus cycles: {report['bus_cycles']}; CSR comparisons: {report['output_comparisons']}.",
                              'Reference outputs per comparison: 114; detected mutations: 2/2.']
              if 'error' in report:
                  summary += ['', 'Failure details: results.json and the named artifact log.']
              summary += ['', 'Artifact: logs, toolchain, source hashes, mutation copies and JSON results.', '']
              (out / 'summary.md').write_text('\n'.join(summary))
          require(report['status'] == 'PASS', 'Observed snapshot CSR qualification failed')
          PY

      - name: Publish Actions summary
        if: always()
        run: |
          mkdir -p bundle
          if [ ! -f bundle/summary.md ]; then
            printf '%s\n' 'Qualification stopped before the final report; inspect the step logs.' > bundle/summary.md
          fi
          cat bundle/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload one combined artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frp-113-internal-gamma-observed-csr-${{ github.run_id }}-${{ github.run_attempt }}
          path: bundle/
          if-no-files-found: error
          retention-days: 14
