name: 90 - FRP M32 Stress and Scaling Regression
run-name: "90 - FRP Stress and Scaling | three tests, 8/16/32/64 cells and deterministic replay @ ${{ github.sha }}"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frp-90-stress-scaling-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    name: M32 stress and scaling - ${{ matrix.cells }} cells
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        cells: [8, 16, 32, 64]
    defaults:
      run:
        shell: bash
    env:
      CELLS: ${{ matrix.cells }}
      LC_ALL: C.UTF-8
      TZ: UTC
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Initialize evidence directory
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/frp-90-evidence"
          printf 'commit=%s\ncells=%s\nrun=%s\nattempt=%s\n' \
            "$GITHUB_SHA" "$CELLS" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            > "$RUNNER_TEMP/frp-90-evidence/context.txt"
          printf '%s\n' '{"status":"NOT_COMPLETED"}' \
            > "$RUNNER_TEMP/frp-90-evidence/qualification.json"
          echo "FRP90_EVIDENCE=$RUNNER_TEMP/frp-90-evidence" >> "$GITHUB_ENV"

      - name: Check out dispatched commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify manual execution and qualified sources
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          cat > "$FRP90_EVIDENCE/sources.sha256" <<'SHA'
          765429b33df3f843626bdc411ad8371fd963738a58ab10201abef75dcdafcaf0  rtl/m31/frp_m31_active_neutral.sv
          d0587897f955ce49923aca807b5d3e0c637383c88e5d5e0dfa8405f47917c123  rtl/m31/frp_m31_capacity_guard.sv
          e516a5cd378bd2ddecdadc5abb13ddef26c63fafe5bda65b47a6bd859ca66f92  rtl/m31/frp_m31_execution_core.sv
          6b2afb8d1583c93d95d2386ba25dd1eaef6bb5bd9a4e1c9e9abff1dd004cbf24  rtl/m31/frp_m31_fixed_point_pkg.sv
          df058d4e3671ba1d7c9d0403a6bb1b8c9750a0a967905b5f91cca455c1dddb83  rtl/m31/frp_m31_global_stability.sv
          cbb5a531283164d1d54d59ec748b97bf84e172704854bf5eb7c6bda2c502f7c7  rtl/m31/frp_m31_isqrt_u64.sv
          478882d4f6a2986f5079c88b444c7b007d68145d61e5150209cb0637f35b2ec0  rtl/m31/frp_m31_local_gamma_drift.sv
          6e10f738f94c43ac9748ec7a033adde16243beea59e2f7f2973a3ab51c2e5e04  rtl/m31/frp_m31_local_thermal_attenuation.sv
          cb97c1bfeabbb2acaebf2f9644d484b2f7c5e995dbf1b70777f6bc2e7df9368e  rtl/m31/frp_m31_local_thermal_field.sv
          18889d85e78b23b844f1db4c46a35a6b7d01e609e3f1f0e6263a39a6c5729411  rtl/m31/frp_m31_pending_routes.sv
          7ac3572ef2bf9feef509e7dc43c662d92d23fa3eb0563efbfa8dba7c28157746  rtl/m31/frp_m31_phase_interference.sv
          fa78bcfe965270cc74855908aa392989d857575a2097a126539aabb1aab8990d  rtl/m31/frp_m31_phase_request_adapter.sv
          762302f1c7a7f7f40cb029f5ada6a111fc8c3e3f6be9920e9b2401b95e179c94  rtl/m31/frp_m31_pkg.sv
          32f75cc70df5dba3f4fbb511397be9a5921236c2afd16cfeb1350eca3f6e8109  rtl/m31/frp_m31_request_lanes.sv
          fc9de24b41736e5c5a9f9e464318c80adbfda9dc8cc4362c0c55bfed403bf97f  rtl/m31/frp_m31_scheduler.sv
          adbb4b94fcf8fa0bfc981d654679fd7518a5c4c9c97b611a35cd8accaf28233d  rtl/m31/frp_m31_sin_q30.mem
          69c06833e6dfbb28e25b74a5787dcd03756dddf0f66726de3ea47c1ad2931931  rtl/m31/frp_m31_stability.sv
          ebad1f7ee952a577239445d33d99cae799afaaff5c181c7162514bbcea6eab90  rtl/m31/frp_m31_state_update.sv
          34df4ebfc5dfad8e3e5e454e560404585de5c881e6f75abaae367d3bd9fb11bd  rtl/m31/frp_m31_thermal_proxy.sv
          0be6c5ee28ee4a23baf6110143eec309f387200c1c2c80e3016353d5d4107541  rtl/m32/frp_m32_core.sv
          ae840b73a80778b350ff0eaa0578ec4dea9702fd495a13da0690218ea0784151  rtl/m32/frp_m32_full_state_oracle_tb.sv
          9626474b49d32b411e107d7ccc8ee5aa7f42728e9a6f70d634d16d3f2a414c5e  rtl/m32/frp_m32_registered_target_boundary.sv
          02250069a68737f055a419cd67bf2d439b3f63b3f6a7a245f40e9bf29d1958eb  rtl/m32/frp_m32_registered_target_request_path.sv
          12706454e2714e128ebe908e8633c243cad4372757299273e21c9955da40b230  rtl/m32/frp_m32_stress_scaling_tb.sv
          SHA
          sha256sum .github/workflows/frp-90-m32-stress-scaling-regression.yml \
            >> "$FRP90_EVIDENCE/sources.sha256"
          sha256sum --check --strict "$FRP90_EVIDENCE/sources.sha256" \
            | tee "$FRP90_EVIDENCE/source-check.log"

      - name: Install and record toolchain
        run: |
          set -euo pipefail
          {
            python -m pip install --disable-pip-version-check \
              verilator==5.48.0 systemc==3.0.2.1
            python -m pip check
            verilator-cli --version
            g++ --version
            make --version
          } 2>&1 | tee "$FRP90_EVIDENCE/toolchain.log"
          python -m pip freeze > "$FRP90_EVIDENCE/packages.txt"

      - name: Qualify stress, reset storm and scaling
        run: |
          set -euo pipefail
          python - <<'PYTHON'
          import hashlib
          import json
          import os
          import re
          import signal
          import subprocess
          import time
          from pathlib import Path

          out = Path(os.environ['FRP90_EVIDENCE']).resolve()
          n = int(os.environ['CELLS'])
          top = 'frp_m32_stress_scaling_tb'
          build = Path(os.environ['RUNNER_TEMP']) / f'frp-90-build-{n}'
          expected = {
              8: (26520902, 'bba3902a630c3792188010358eea6d718f7b8d08117eba73b2ecbfa51453a254'),
              16: (47507915, 'ba4d184ed63f5dc042337502e9e1f305156bd95c2ddda5fff3148a9bda09ad5a'),
              32: (88959876, '7a0ec8835510b3a4b56e03f8c39fc5866f49197097c1d4e9de015ad834c2d8d4'),
              64: (171446146, '541e02a9b1d0edd758b37fb97916bb3ffad5b8cf9deed5a47cd96748b3e24b39'),
          }
          report = dict(status='RUNNING', commit=os.environ['GITHUB_SHA'], cells=n, commands=[])

          def require(ok, message):
              if not ok:
                  raise RuntimeError(message)

          def digest(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def save():
              (out / 'qualification.json').write_text(json.dumps(report, indent=2) + '\n')

          def run(argv, name, limit):
              entry = dict(argv=argv, log=name, status='RUNNING')
              report['commands'].append(entry)
              started = time.monotonic()
              process = None
              save()
              try:
                  with (out / name).open('w') as log:
                      process = subprocess.Popen(argv, stdout=log, stderr=subprocess.STDOUT,
                                                 start_new_session=True)
                      while True:
                          remaining = limit - (time.monotonic() - started)
                          require(remaining > 0, f'{name}: timeout')
                          try:
                              code = process.wait(timeout=min(30, remaining))
                              break
                          except subprocess.TimeoutExpired:
                              print(f'{name}: elapsed={time.monotonic()-started:.0f}s', flush=True)
                  entry['returncode'] = code
                  require(code == 0, f'{name}: exit {code}')
                  entry['status'] = 'PASS'
              except BaseException:
                  entry['status'] = 'FAIL'
                  if process is not None and process.poll() is None:
                      os.killpg(process.pid, signal.SIGKILL)
                      process.wait()
                  print((out / name).read_text(errors='replace')[-12000:], flush=True)
                  raise
              finally:
                  entry['seconds'] = round(time.monotonic() - started, 3)
                  save()

          def collect(path):
              text = path.read_text()
              require(not re.search(r'%Error|%Fatal|Assertion failed|Aborting|^FAIL\b', text, re.M),
                      'Simulation failure marker')
              records = [line.strip() for line in text.splitlines()
                         if line.strip().startswith(('PASS', 'FULL_STATE_'))]
              prefixes = ['FULL_STATE_STABILITY ', 'PASS FULL_STATE ', 'FULL_STATE_EVENTS ',
                          'PASS STRESS ', 'PASS RESET_STORM '] + ['PASS SCALING '] * 6 + [
                          'PASS STRESS_SCALING_ALL ']
              require(len(records) == 12, 'Incomplete or duplicate semantic records')
              require(all(line.startswith(prefix) for line, prefix in zip(records, prefixes)),
                      'Unexpected test order')
              semantic = '\n'.join(records)
              require(hashlib.sha256(semantic.encode()).hexdigest() == expected[n][1],
                      'Results differ from locally qualified baseline')
              fields = [dict(item.split('=', 1) for item in line.split() if '=' in item)
                        for line in records]
              require(all(int(row['cells']) == n for row in fields), 'Wrong cell count')
              stress, reset, total = fields[3], fields[4], fields[-1]
              require(stress['seed'] == '90c0ffee' and int(stress['enabled']) == 24576,
                      'Incomplete stress workload')
              require(int(stress['held']) == 88 and int(stress['longest']) == 2048,
                      'Incorrect pause/run coverage')
              require(int(stress['offered']) == int(stress['accepted']) + int(stress['rejected'])
                      and int(stress['accepted']) > 0 and int(stress['rejected']) > 0,
                      'Request accounting mismatch')
              require(int(stress['routes']) == int(stress['completions']) > 0,
                      'Route conservation mismatch')
              require(int(reset['cases']) == 64 and int(reset['resets']) == 128,
                      'Incomplete reset storm')
              for index, row in enumerate(fields[5:11]):
                  mode, polarity = index // 2, (-1, 1)[index % 2]
                  cycles = (4, 28, 29)[mode]
                  require(int(row['mode']) == mode and int(row['polarity']) == polarity,
                          'Incomplete scaling matrix')
                  require(int(row['lanes']) == n // 4 and int(row['completed']) == n
                          and int(row['service_edges']) == 4
                          and int(row['enabled_edges']) == cycles
                          and int(row['held_edges']) == 2 * cycles, 'Scaling contract mismatch')
              require(int(total['ports']) == 103 and int(total['tests']) == 3
                      and int(total['scaling_cases']) == 6 and int(total['saturation_edges']) == 280
                      and int(total['steps']) == 26339 and int(total['checks']) == expected[n][0],
                      'Incomplete campaign')
              return semantic, fields

          try:
              require(n in expected, 'Unsupported matrix configuration')
              build.mkdir(parents=True, exist_ok=True)
              run([
                  'verilator-cli', '--binary', '--output-groups', '0', '--unroll-count', '1',
                  '--timing', '--assert', '-Wno-fatal', '-j', '2', '-CFLAGS', '-std=c++20',
                  '-MAKEFLAGS', 'OPT_FAST=-O2', '-MAKEFLAGS', 'VK_PCH_I_FAST=',
                  '-MAKEFLAGS', 'VK_PCH_I_SLOW=', '--top-module', top,
                  f'-GCELLS={n}', '--Mdir', str(build), '-Irtl/m31', '-Irtl/m32',
                  f'rtl/m32/{top}.sv',
              ], 'compile.log', 3600)
              compile_log = (out / 'compile.log').read_text(errors='replace')
              require(not re.search(r'%Error|%Warning-(PINMISSING|IMPLICIT|MULTIDRIVEN)\b', compile_log),
                      'Compile error or unexpected wiring warning')
              executable = build / f'V{top}'
              executable_hash = digest(executable)
              replays = []
              for replay in (1, 2):
                  require(digest(executable) == executable_hash, 'Executable changed')
                  name = f'run-{replay}.log'
                  run([str(executable)], name, 600)
                  semantic, fields = collect(out / name)
                  (out / f'run-{replay}.txt').write_text(semantic + '\n')
                  replays.append(semantic)
                  print(semantic, flush=True)
              require(replays[0] == replays[1], 'Deterministic replay mismatch')
              require(digest(executable) == executable_hash, 'Executable changed')
              run(['sha256sum', '--check', '--strict', str(out / 'sources.sha256')],
                  'source-final-check.log', 30)
              report.update(status='PASS', replays=2, replay_equal=True, ports=103,
                            executable_sha256=executable_hash, semantic_sha256=expected[n][1],
                            extra_word_comparisons=2 * expected[n][0],
                            stress=fields[3], reset=fields[4], scaling=fields[5:11], total=fields[-1])
              summary = (f'### FRP 90: Stress and Scaling - {n} cells - PASS\n\n'
                         'Three tests; 103 public outputs; two independent process replays.\n\n'
                         f'Additional 32-bit word comparisons: {2 * expected[n][0]:,}.\n\n'
                         '| Mode | Polarity | Completed | Service edges | Enabled edges | Held edges |\n'
                         '|---|---:|---:|---:|---:|---:|\n')
              for row in fields[5:11]:
                  mode = ('FREE', '7/1', '1/7')[int(row['mode'])]
                  summary += (f"| {mode} | {row['polarity']} | {row['completed']} | "
                              f"{row['service_edges']} | {row['enabled_edges']} | {row['held_edges']} |\n")
              summary += ('\nScaling latency counts enabled DUT clock edges; pauses are listed separately.\n'
                          'The log field total_edges counts model.step calls including setup; '
                          'reset_core also drives reset edges.\n\n'
                          '```text\n' + replays[0] + '\n```\n')
              (out / 'summary.md').write_text(summary)
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
                  stream.write(summary)
          except BaseException as error:
              report.update(status='FAIL', error=str(error))
              raise
          finally:
              save()
          PYTHON

      - name: Hash qualification evidence
        if: always()
        run: |
          set -euo pipefail
          python - <<'PYTHON'
          import hashlib
          import os
          from pathlib import Path
          root = Path(os.environ['FRP90_EVIDENCE'])
          files = sorted(p for p in root.rglob('*') if p.is_file() and p.name != 'evidence.sha256')
          (root / 'evidence.sha256').write_text(''.join(
              f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(root)}\n'
              for p in files))
          PYTHON

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          name: frp-90-stress-scaling-${{ matrix.cells }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/frp-90-evidence/
          if-no-files-found: error
          retention-days: 14
