name: 141 - FRP M32 Recorder CSR Edge Formal
run-name: "141 - M32 recorder and CSR | up to 64 cells | ${{ github.sha }}"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Record sources and install tools
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/commit.txt
          sha256sum formal/m32/frp_m32_{recorder_csr_edge,recorder_saturation,snapshot_csr}_formal.sv \
            rtl/m32/frp_m32_boundary_{recorder,snapshot_csr}.sv > evidence/sources.sha256
          python -m pip install yowasp-yosys==0.68.0.0.post1208 yowasp-runtime==1.96 wasmtime==47.0.1
          yowasp-yosys -V > evidence/tool-version.txt
          python -m pip freeze > evidence/packages.txt

      - name: Prove edge ordering and replay CSR controls
        run: |
          cat > evidence/verify.py <<'PY'
          from concurrent.futures import ThreadPoolExecutor
          import itertools
          import json
          from pathlib import Path
          import shutil
          import subprocess

          top = "frp_m32_recorder_csr_edge_formal"
          out = Path("evidence")
          sources = list(map(Path, [
              f"formal/m32/{top}.sv",
              "formal/m32/frp_m32_recorder_saturation_formal.sv",
              "formal/m32/frp_m32_snapshot_csr_formal.sv",
              "rtl/m32/frp_m32_boundary_recorder.sv",
              "rtl/m32/frp_m32_boundary_snapshot_csr.sv",
          ]))
          reset = "-set-assumes -set rst_n 1 -set-at 1 rst_n 0"
          show = "-show-inputs -show reach -show csr_rdata -show csr_error -show csr_ready"

          def prepare(folder):
              folder.mkdir(parents=True)
              for src in sources:
                  shutil.copyfile(src, folder / src.name)

          def solve(folder, label, commands):
              ok = label + ".ok"
              commands += f"; tee -o {ok} log FRP141_COMPLETE"
              with (folder / (label + ".stderr")).open("w") as err:
                  proc = subprocess.run(["yowasp-yosys", "-Q", "-p", commands], cwd=folder,
                                        stdout=subprocess.PIPE, stderr=err, timeout=480)
              (folder / (label + ".log")).write_bytes(proc.stdout)
              proc.check_returncode()
              if (folder / ok).read_text().strip() != "FRP141_COMPLETE":
                  raise RuntimeError(f"{folder}: incomplete {label}")

          def build(n, w, clear):
              return (f"read_slang -j 1 --top {top} -I. -G CELLS={n} -G COUNT_BITS={w} "
                      f"-G ENABLE_EPOCH_CLEAR={clear} {top}.sv; prep -top {top} -flatten; "
                      "async2sync; opt -full; chformal -lower; check -assert; "
                      "select -assert-count 17 t:$assert; select -assert-count 1 t:$assume; "
                      "write_rtlil model.il")

          def samples(path, name, depth):
              sig = next(s for s in json.loads(path.read_text())["signal"] if s["name"] == name)
              data = iter(sig.get("data", [])[1:])
              values = []
              for ch in sig["wave"][1:]:
                  if ch == "=":
                      values.append(int(next(data), 2))
                  elif ch in ("0", "1"):
                      values.append(int(ch))
                  elif ch == "." and values:
                      values.append(values[-1])
                  else:
                      raise ValueError(f"{path}: unexpected symbol {ch} in {name}")
              if len(values) != depth:
                  raise ValueError(f"{path}: incomplete {name}")
              return values

          def qualify(case):
              n, w, clear = case
              folder = out / f"cells-{n}-width-{w}-clear-{clear}"
              prepare(folder)
              solve(folder, "proof", build(n, w, clear) +
                    "; sat -set-assumes -tempinduct -seq 1 -maxsteps 5 -prove-asserts -verify")
              # Bits 2, 3 and 7 require epoch clear. Bit 5 requires counter overflow.
              bits = [0, 1, 4, 6] + ([2, 3, 7] if clear else []) + ([5] if w == 3 else [])
              queries = []
              for b in bits:
                  depth = 12 if b == 5 else 6
                  queries.append(f"sat -seq {depth} {reset} -set-at {depth} reach[{b}] 1 "
                                 f"{show} -dump_json w{b}.json")
              solve(folder, "witness", "read_rtlil model.il; " + "; ".join(queries))
              for b in bits:
                  depth = 12 if b == 5 else 6
                  path = folder / f"w{b}.json"
                  if samples(path, "rst_n", depth) != [0]+[1]*(depth-1):
                      raise RuntimeError(f"{path}: reset mismatch")
                  if not (samples(path, "reach", depth)[-1] & (1 << b)):
                      raise RuntimeError(f"{path}: event mismatch")
              print(f"PASS cells={n} width={w} clear={clear}", flush=True)
              return {"cells": n, "width": w, "clear": clear, "witnesses": len(bits)}

          cases = list(itertools.product((8, 9, 16, 32, 64), (3, 64), (0, 1)))
          with ThreadPoolExecutor(max_workers=2) as pool:
              rows = list(pool.map(qualify, cases))
          if len(rows) != 20 or sum(r["witnesses"] for r in rows) != 120:
              raise RuntimeError("Incomplete proof matrix")
          (out / "profiles.json").write_text(json.dumps(rows, indent=2))

          # Only the clear connection differs between the two reference controls.
          pins = (f"sat -seq 13 {reset} -set clear_epoch 0 -set-at 7 clear_epoch 1 "
                  "-set sample_valid 0 -set-at 2 sample_valid 1 -set-at 3 sample_valid 1 "
                  "-set-at 7 sample_valid 1 -set stability_margin_q16 1 "
                  "-set-at 3 stability_margin_q16 0 -set-at 7 stability_margin_q16 0 "
                  "-set alignment_error 0 -set csr_valid 1 -set csr_write 0 -set csr_wdata 0 -set csr_addr 4 "
                  "-set source_tick 37 -set scheduler_mode 0 -set scheduler_state 0 "
                  "-set coherence_capacity_q16 1 -set pressure_q16 2 -set mean_heat_q16 3 "
                  "-set switch_load_q16 4 -set retained_state 4 -set pending_route 3")
          for step in (3, 4, 7, 10):
              pins += f" -set-at {step} csr_addr 0 -set-at {step} csr_write 1 -set-at {step} csr_wdata 1"
          pins += (" -set-at 9 csr_addr 16 -set-at 12 csr_addr 0 -set-at 12 csr_write 1 "
                   "-set-at 12 csr_wdata 2 -set-at 13 csr_addr 16")
          controls = {}
          for clear in (0, 1):
              folder = out / f"cells-64-width-64-clear-{clear}"
              solve(folder, "control", f"read_rtlil model.il; {pins} {show} -dump_json control.json")
              path = folder / "control.json"
              data = samples(path, "csr_rdata", 13)
              expected = [0,0,0,0,27,27,0,11,2,0,1 if clear else 11,0,0]
              if data != expected or samples(path, "csr_error", 13) != [0]*12+[1]:
                  raise RuntimeError(f"{path}: incorrect CSR sequence")
              controls[clear] = data
          (out / "controls.json").write_text(json.dumps(controls, indent=2))

          faults = [
              ("lookahead-pulse", "rec.pulse_q, rec.valid_q", "rec.capture, rec.valid_q", 5, 11),
              ("premature-clear", ".count(rec.count_q)", ".count(clear ? '0 : rec.count_q)", 9, 0),
          ]
          for name, old, new, step, wrong in faults:
              folder = out / name
              prepare(folder)
              src = folder / (top + ".sv")
              body = src.read_text()
              if body.count(old) != 1:
                  raise RuntimeError(f"{name}: mutation anchor changed")
              src.write_text(body.replace(old, new))
              solve(folder, "fault", build(64,64,1) + f"; {pins} -prove-asserts -falsify "
                    f"{show} -dump_json counterexample.json")
              actual = samples(folder / "counterexample.json", "csr_rdata", 13)[step-1]
              if actual != wrong or actual == controls[1][step-1]:
                  raise RuntimeError(f"{name}: unexpected counterexample")
              print("PASS detected", name, flush=True)
          (out / "mutations.json").write_text(json.dumps([f[0] for f in faults]))
          PY
          python -u evidence/verify.py

      - name: Summarize verification
        if: always()
        env:
          PRIOR_STATUS: ${{ job.status }}
        run: |
          {
            echo "### M32 recorder and CSR edge ordering"
            echo "Verification status: $PRIOR_STATUS"
            if [[ -f evidence/profiles.json ]]; then
              jq -r '"Profiles: \(length), reset witnesses: \(map(.witnesses)|add)"' evidence/profiles.json
            fi
            if [[ -f evidence/controls.json ]]; then
              jq -r 'to_entries[] | "Clear enable=\(.key): CSR data at step 11 = \(.value[10])"' evidence/controls.json
            fi
            if [[ -f evidence/mutations.json ]]; then
              jq -r '"Detected mutations: " + join(", ")' evidence/mutations.json
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload combined evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frp-141-recorder-csr-edge-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30
