name: 116 - FRP M32 Gamma CDC Recovery Qualification
run-name: '116 - FRP Gamma CDC Recovery | 2 suites, 56 replays, 3 mutations @ ${{ github.sha }}'

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install simulation tools
        run: |
          set -euo pipefail
          mkdir -p bundle
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential
          python -m pip install --disable-pip-version-check 'verilator==5.48.0'
          {
            python --version
            python -m pip show verilator
            verilator-cli --version
            g++ --version
            make --version
          } > bundle/toolchain.txt 2>&1

      - name: Qualify interruption and checkpoint recovery
        run: |
          set -euo pipefail
          ulimit -c 0
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          import shlex
          import shutil
          import subprocess
          import tempfile
          import zipfile
          from pathlib import Path

          root = Path('source').resolve()
          out = Path('bundle').resolve()
          out.mkdir(exist_ok=True)
          profiles = ((8, 3), (8, 64), (16, 64), (32, 64), (64, 64))
          clocks = ((5, 7, 1), (3, 11, 4), (13, 2, 3))
          seeds = (0, 76)
          tops = {'interruption': 'frp_m32_internal_gamma_cdc_interruption_tb',
                  'checkpoint': 'frp_m32_gamma_checkpoint_cdc_tb'}
          directories = ('rtl/m22', 'rtl/m23', 'rtl/m31', 'rtl/m32', 'fpga/m32', 'fpga/m32_csr')
          common = set('cells bits seed host_half core_half phase checks launches completions ticks resets signature'.split())
          fields = {
              'interruption': common | set('rounds core_completions aborted checkpoints reset_waits core_stops host_stops wait_edges reset_modes core_modes host_modes'.split()),
              'checkpoint': common | set('errors updates begins words partial_words busy_aborts bank_checks frozen'.split())
          }
          prefixes = {'interruption': 'PASS GAMMA_CDC_INTERRUPTION ',
                      'checkpoint': 'PASS GAMMA_CHECKPOINT_CDC '}
          report = {'schema': 'frp.m32.gamma_cdc_recovery.qualification.v1', 'status': 'RUNNING',
                    'profiles': profiles, 'clocks': clocks, 'seeds': seeds, 'rounds': 3,
                    'runs': [], 'replay_pairs': 0, 'clock_signature_checks': 0, 'mutations': []}


          def require(ok, message):
              if not ok:
                  raise RuntimeError(message)


          def save():
              (out / 'results.json').write_text(json.dumps(report, indent=2) + '\n')


          def execute(command, name, seconds, success=True):
              command = ['timeout', '--kill-after=15s', f'{seconds}s'] + command
              with (out / name).open('w') as log:
                  log.write(shlex.join(command) + '\n')
                  log.flush()
                  result = subprocess.run(command, cwd=root, stdout=log, stderr=subprocess.STDOUT)
              text = (out / name).read_text(errors='replace')
              if success:
                  require(result.returncode == 0, f'{name}: exit {result.returncode}')
              return result.returncode, text


          def parse(text, suite, cells, bits, seed, clock):
              lines = [line for line in text.splitlines() if line.startswith('PASS ')]
              prefix = prefixes[suite]
              require(len(lines) == 1 and lines[0].startswith(prefix), 'Missing or duplicate PASS record')
              tokens = lines[0][len(prefix):].split()
              values = dict(token.split('=', 1) for token in tokens)
              require(set(values) == fields[suite] and len(tokens) == len(values), 'PASS field mismatch')
              for key, value in values.items():
                  pattern = r'[0-9a-f]{16}' if key == 'signature' else r'[0-9]+'
                  require(re.fullmatch(pattern, value), 'Invalid field: ' + key)
              record = {k: v if k == 'signature' else int(v) for k, v in values.items()}
              expected = dict(zip(('host_half', 'core_half', 'phase'), clock))
              expected.update(cells=cells, bits=bits, seed=seed)
              if suite == 'checkpoint':
                  expected.update(checks=15480+2*cells, launches=3105, completions=3105, errors=312,
                                  ticks=17, updates=3, begins=6, words=2522, partial_words=26,
                                  busy_aborts=1, bank_checks=2*cells, frozen=104, resets=2)
              else:
                  expected.update(rounds=3, launches=5792, completions=5789, core_completions=5789,
                                  aborted=3, ticks=6, checkpoints=9, reset_waits=3, core_stops=3,
                                  host_stops=3, resets=10, reset_modes=7, core_modes=7, host_modes=7)
                  require(record['wait_edges'] > 0, 'Gamma backpressure was not exercised')
                  require(29140 <= record['checks'] <= 29380, 'Interruption comparison count out of bounds')
              require(all(record[k] == v for k, v in expected.items()), 'Profile or scenario accounting mismatch')
              return record


          def mutation_diagnostic(code, text, pattern):
              match = re.search(pattern, text)
              require(code in (1, 134, -6) and match is not None and
                      not any(line.startswith('PASS ') for line in text.splitlines()),
                      'Expected mutation runtime failure was not detected')
              return match[0]


          def source_hashes():
              return {str(p.relative_to(root)): hashlib.sha256(p.read_bytes()).hexdigest()
                      for directory in directories for p in sorted((root / directory).rglob('*'))
                      if p.is_file() and p.suffix in ('.sv', '.svh', '.v', '.mem')}


          def build(scratch, suite, cells, bits, tag, mutation=None):
              directory = scratch / tag
              directory.mkdir()
              top = tops[suite]
              tb = top + '.sv'
              shutil.copyfile(root / 'fpga/m32_csr' / tb, directory / tb)
              if mutation is not None:
                  path, changed = mutation
                  (directory / Path(path).name).write_text(changed)
              obj = directory / 'obj'
              command = ['verilator-cli', '--binary', '--timing', '--assert', '--unroll-count', '1',
                         '--output-groups', '32', '--output-split', '10000', '--output-split-cfuncs', '0',
                         '--top-module', top, '-j', '2', '--verilate-jobs', '1', '-Wno-fatal',
                         '-MAKEFLAGS', 'VK_PCH_I_FAST=', '-MAKEFLAGS', 'VK_PCH_I_SLOW=',
                         '-MAKEFLAGS', 'OPT_FAST=-O0', '-I' + str(directory)]
              command += ['-I' + str(root / item) for item in directories]
              command += ['--Mdir', str(obj), f'-GCELLS={cells}', f'-GCOUNT_BITS={bits}', str(directory / tb)]
              execute(command, tag + '-build.log', 1800)
              return directory, str(obj / ('V' + top))


          def arguments(binary, seed, clock):
              h, c, phase = clock
              return [binary, f'+seed={seed}', '+ROUNDS=3', f'+HOST_HALF={h}', f'+CORE_HALF={c}', f'+PHASE={phase}']


          save()
          try:
              require(os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch', 'Manual execution required')
              sha = subprocess.check_output(['git', '-C', str(root), 'rev-parse', 'HEAD'], text=True).strip()
              require(sha == os.environ['GITHUB_SHA'], 'Checked-out commit mismatch')
              report['commit'] = sha
              hashes = source_hashes()
              (out / 'source_sha256.json').write_text(json.dumps(hashes, indent=2) + '\n')
              with zipfile.ZipFile(out / 'tested_sources.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
                  for path in hashes:
                      archive.write(root / path, path)
              with tempfile.TemporaryDirectory(prefix='frp116-', dir=os.environ['RUNNER_TEMP']) as temporary:
                  scratch = Path(temporary)
                  for suite in tops:
                      for cells, bits in profiles:
                          tag = f'{suite}-cells-{cells}-bits-{bits}'
                          directory, binary = build(scratch, suite, cells, bits, tag)
                          signatures = {}
                          selected_clocks = clocks if (cells, bits) == (8, 3) else clocks[:1]
                          for clock in selected_clocks:
                              timing = '-'.join(map(str, clock))
                              for seed in seeds:
                                  repeated = []
                                  for replay in (1, 2):
                                      label = f'{tag}-clock-{timing}-seed-{seed}-replay-{replay}'
                                      _, text = execute(arguments(binary, seed, clock), label + '.log', 1200)
                                      record = parse(text, suite, cells, bits, seed, clock)
                                      repeated.append(record)
                                      report['runs'].append({'suite': suite, 'replay': replay, 'record': record})
                                      save()
                                  require(repeated[0] == repeated[1], 'Replay mismatch: ' + label)
                                  report['replay_pairs'] += 1
                                  if seed in signatures:
                                      require(signatures[seed] == repeated[0]['signature'],
                                              'Clock-dependent functional signature: ' + label)
                                      report['clock_signature_checks'] += 1
                                  else:
                                      signatures[seed] = repeated[0]['signature']
                                  save()
                                  print('PASS ' + label + ': identical replays', flush=True)
                          shutil.rmtree(directory)

                  mutations = (
                      ('retain_request_on_reset', 'interruption',
                       'fpga/m32_csr/frp_m32_internal_gamma_observed_csr_cdc_top.sv',
                       "response_rdata_hold_q <= '0;\n        core_csr_valid <= 1'b0;",
                       "response_rdata_hold_q <= '0;\n        core_csr_valid <= core_csr_valid;",
                       r'UNREQUESTED_CORE_TRANSFER'),
                      ('index_truncation', 'checkpoint',
                       'fpga/m32_csr/frp_m32_internal_gamma_observed_csr_top.sv',
                       "(control_wdata <= 32'd624)", "(control_wdata[9:0] <= 10'd624)",
                       r'RESPONSE_STATUS actual=00000000 expected=00000001'),
                      ('forget_nonzero_prefix', 'checkpoint',
                       'rtl/m32/frp_m32_gamma_target_source.sv',
                       'load_or_q <= load_or_q | load_word;', 'load_or_q <= load_word;',
                       r'BANK_TIMEOUT')
                  )
                  for name, suite, path, before, after, pattern in mutations:
                      original = (root / path).read_text()
                      require(original.count(before) == 1, 'Mutation anchor mismatch: ' + name)
                      changed = original.replace(before, after)
                      (out / (name + '.sv')).write_text(changed)
                      directory, binary = build(scratch, suite, 8, 3, name, (path, changed))
                      code, text = execute(arguments(binary, 76, clocks[0]), name + '-run.log', 1200, False)
                      item = {'name': name, 'suite': suite, 'detected': False, 'exit_code': code,
                              'source_sha256': hashlib.sha256(changed.encode()).hexdigest()}
                      report['mutations'].append(item)
                      save()
                      item['diagnostic'] = mutation_diagnostic(code, text, pattern)
                      item['detected'] = True
                      save()
                      print('DETECTED ' + name, flush=True)
                      shutil.rmtree(directory)

              require(source_hashes() == hashes, 'Original sources changed')
              records = [item['record'] for item in report['runs']]
              report['comparisons'] = sum(r['checks'] for r in records)
              report['completed_requests'] = sum(r['completions'] for r in records)
              report['accepted_ticks'] = sum(r['ticks'] for r in records)
              require(all(sum(x['suite'] == suite for x in report['runs']) == 28 for suite in tops) and
                      report['replay_pairs'] == 28 and report['clock_signature_checks'] == 8 and
                      report['completed_requests'] == 249032 and report['accepted_ticks'] == 644 and
                      len(report['mutations']) == 3 and all(x['detected'] for x in report['mutations']),
                      'Qualification totals mismatch')
              report['status'] = 'PASS'
          except Exception as error:
              report['status'] = 'FAIL'
              report['error'] = str(error)
              print('::error::Gamma CDC recovery qualification failed; inspect bundle logs')
          finally:
              save()
              summary = [
                  '## FRP M32 Gamma CDC Recovery Qualification', '',
                  f"Result: **{report['status']}**", '', f"Commit: `{report.get('commit', 'unavailable')}`", '',
                  'Two suites: interruption recovery and checkpoint fault/recovery.',
                  'Profiles (cells / counter bits): 8/3, 8/64, 16/64, 32/64, 64/64.',
                  'Clock half periods / phase (ns): 5/7/1 for every profile;',
                  '3/11/4 and 13/2/3 additionally for 8/3.',
                  'Seeds: 0 and 76; two identical replays per suite/profile/timing/seed.',
                  'Interruption: three rounds; each scenario exercises free, 7/1 and 1/7 modes.', '',
                  f"Completed executions: {len(report['runs'])}/56.",
                  f"Matching replay pairs: {report['replay_pairs']}/28.",
                  f"Cross-clock signature comparisons: {report['clock_signature_checks']}/8.", '',
                  'Checks: 42 request bits, 33 response bits, reset during gamma backpressure,',
                  'stopped host/core clocks, retained responses, completion accounting,',
                  'invalid checkpoint addresses/indices, all-zero and incomplete loads,',
                  'restart during MT twist, staged indices, extra words, known gamma targets,',
                  'reload/reset recovery, gamma cadence and frozen snapshot retention.', '',
                  '| Mutation | Expected runtime failure detected |', '| --- | --- |'
              ]
              for item in report['mutations']:
                  summary.append(f"| {item['name']} | {item['detected']} |")
              if report['status'] == 'PASS':
                  summary += ['', f"Comparisons: {report['comparisons']}.",
                              f"Completed requests: {report['completed_requests']}.",
                              f"Accepted ticks: {report['accepted_ticks']}."]
              if 'error' in report:
                  summary += ['', 'Failure details: results.json and the named artifact log.']
              summary += ['', 'One artifact contains logs, toolchain, source hashes, tested sources,',
                          'mutation copies, JSON results and this summary.', '']
              (out / 'summary.md').write_text('\n'.join(summary))
          require(report['status'] == 'PASS', 'Gamma CDC recovery qualification failed')
          PY

      - name: Publish Actions summary
        if: always()
        run: |
          mkdir -p bundle
          if [ ! -f bundle/summary.md ]; then
            printf '%s\n' 'Qualification stopped before the final report; inspect the step logs.' > bundle/summary.md
          fi
          cat bundle/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload one combined artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frp-116-gamma-cdc-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: bundle/
          if-no-files-found: error
          retention-days: 14
