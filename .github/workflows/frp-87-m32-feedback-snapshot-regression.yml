name: 87 - FRP M32 Feedback Snapshot Regression
run-name: "87 - FRP Feedback Snapshot | 26 outputs, three tests, 8/16/32/64 cells and deterministic replay @ ${{ github.sha }}"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frp-87-feedback-snapshot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    name: M32 feedback snapshot - ${{ matrix.cells }} cells
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        cells: [8, 16, 32, 64]
    defaults:
      run:
        shell: bash
    env:
      CELLS: ${{ matrix.cells }}
      LC_ALL: C.UTF-8
      TZ: UTC
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Initialize evidence directory
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/frp-87-evidence"
          printf 'commit=%s\ncells=%s\nrun=%s\nattempt=%s\n' \
            "$GITHUB_SHA" "$CELLS" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            > "$RUNNER_TEMP/frp-87-evidence/context.txt"
          printf '%s\n' '{"status":"NOT_COMPLETED"}' \
            > "$RUNNER_TEMP/frp-87-evidence/qualification.json"
          echo "FRP87_EVIDENCE=$RUNNER_TEMP/frp-87-evidence" >> "$GITHUB_ENV"

      - name: Check out dispatched commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify manual execution and qualified sources
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          cat > "$FRP87_EVIDENCE/sources.sha256" <<'SHA'
          6b2afb8d1583c93d95d2386ba25dd1eaef6bb5bd9a4e1c9e9abff1dd004cbf24  rtl/m31/frp_m31_fixed_point_pkg.sv
          478882d4f6a2986f5079c88b444c7b007d68145d61e5150209cb0637f35b2ec0  rtl/m31/frp_m31_local_gamma_drift.sv
          6e10f738f94c43ac9748ec7a033adde16243beea59e2f7f2973a3ab51c2e5e04  rtl/m31/frp_m31_local_thermal_attenuation.sv
          df058d4e3671ba1d7c9d0403a6bb1b8c9750a0a967905b5f91cca455c1dddb83  rtl/m31/frp_m31_global_stability.sv
          c57d813dc7fc53d351adfa28fdc7d0ec8703e5b6e9be1a41c43af0ea5aad2522  rtl/m32/frp_m32_feedback_snapshot_tb.sv
          SHA
          sha256sum .github/workflows/frp-87-m32-feedback-snapshot-regression.yml \
            >> "$FRP87_EVIDENCE/sources.sha256"
          sha256sum --check --strict "$FRP87_EVIDENCE/sources.sha256" \
            | tee "$FRP87_EVIDENCE/source-check.log"

      - name: Install and record toolchain
        run: |
          set -euo pipefail
          {
            python -m pip install --disable-pip-version-check \
              verilator==5.48.0 systemc==3.0.2.1
            python -m pip check
            verilator-cli --version
            g++ --version
            make --version
          } 2>&1 | tee "$FRP87_EVIDENCE/toolchain.log"
          python -m pip freeze > "$FRP87_EVIDENCE/packages.txt"

      - name: Build and qualify feedback snapshot replay with RTL coverage
        run: |
          set -euo pipefail
          python - <<'PYTHON'
          import hashlib
          import json
          import os
          import re
          import signal
          import subprocess
          import time
          from pathlib import Path

          evidence = Path(os.environ['FRP87_EVIDENCE']).resolve()
          n = int(os.environ['CELLS'])
          build = Path(os.environ['RUNNER_TEMP']) / f'frp-87-build-{n}'
          top = 'frp_m32_feedback_snapshot_tb'
          report = dict(status='RUNNING', commit=os.environ['GITHUB_SHA'], cells=n, commands=[])
          ports = (6, 2, 18)
          expected = {
              8: [(11547, 10538, 97, '7437fde30a3cce51'), (11679, 10406, 97, '928884b948d2323d'), (11548, 10537, 105, '90d31c36f64e21de')],
              16: [(11528, 10557, 97, '9ba924f6a83cec99'), (11605, 10480, 97, '2ae0143818b2ffcd'), (11592, 10493, 105, '23e8180303267197')],
              32: [(11494, 10591, 97, 'e53b5010810bd1c1'), (11640, 10445, 97, '2da3e77e36f2d955'), (11561, 10524, 105, '4e04413baeb2c671')],
              64: [(11563, 10522, 97, 'c73a3d3c6a9b77ce'), (11556, 10529, 97, '73ca01fb193eedbe'), (11581, 10504, 105, '5510d31aa534b8cd')],
          }
          coverage_baseline = {
              'rtl/m31/frp_m31_local_gamma_drift.sv:line': [5, 5],
              'rtl/m31/frp_m31_local_gamma_drift.sv:branch': [4, 4],
              'rtl/m31/frp_m31_local_thermal_attenuation.sv:line': [6, 6],
              'rtl/m31/frp_m31_local_thermal_attenuation.sv:branch': [6, 6],
              'rtl/m31/frp_m31_global_stability.sv:line': [11, 11],
              'rtl/m31/frp_m31_global_stability.sv:branch': [9, 10],
          }
          rtl_files = {key.split(':')[0] for key in coverage_baseline}

          def require(ok, message):
              if not ok:
                  raise RuntimeError(message)

          def digest(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def save():
              (evidence / 'qualification.json').write_text(json.dumps(report, indent=2) + '\n')

          def collect(path):
              text = path.read_text()
              require(not re.search(r'%Error|%Fatal|Assertion failed|Aborting|^FAIL\b', text, re.M),
                      'Simulation failure marker')
              rows = [s.strip() for s in text.splitlines()
                      if s.strip().startswith(('PASS', 'FEEDBACK_'))]
              require(len(rows) == 4, f'Expected four records, received {len(rows)}')
              parsed = {}
              matrix = (f'FEEDBACK_MATRIX cells={n} edges=22214 cases=128 boundaries=12285 '
                        f'random=8192 rom_cell_pairs={4096*n} events=ff')
              require(rows.count(matrix) == 1, 'Missing or incorrect stimulus coverage record')
              pattern = (r'PASS FEEDBACK_SNAPSHOT cells=(\d+) test=(\d+) probes=(\d+) '
                         r'checks=(\d+) commits=(\d+) holds=(\d+) resets=(\d+) '
                         r'signature=([0-9a-f]{16})')
              for row in rows:
                  if row == matrix:
                      continue
                  match = re.fullmatch(pattern, row)
                  require(match is not None, f'Malformed result: {row}')
                  cells, test, probes, checks, commits, holds, resets = map(int, match.groups()[:7])
                  signature = match.group(8)
                  require(cells == n and test in (0, 1, 2), 'Incorrect test configuration')
                  require(test not in parsed, 'Duplicate test result')
                  words = (6*n, 2*n, 18)[test]
                  require(probes == 44960 and checks == 44960*words, 'Incomplete output checks')
                  require((commits, holds, resets, signature) == expected[n][test],
                          f'Test {test}: history counts or signature mismatch')
                  parsed[test] = row
              require(set(parsed) == {0, 1, 2}, 'Missing test result')
              return '\n'.join([parsed[t] for t in (0, 1, 2)] + [matrix]) + '\n'

          def coverage(path):
              text = path.read_text()
              require(text.startswith('# SystemC::Coverage-3\n'), 'Invalid coverage header')
              bins, files = {}, set()
              for line in text.splitlines()[1:]:
                  if not line.startswith("C '"):
                      continue
                  data, hits = line[3:].rsplit("' ", 1)
                  fields = dict(x.split('\x02', 1) for x in data.split('\x01') if '\x02' in x)
                  source, instance = fields['f'], fields.get('h', '')
                  if source not in rtl_files:
                      continue
                  require(instance.startswith(top + '.'), 'Unexpected coverage hierarchy')
                  hits = int(hits)
                  require(hits >= 0, 'Negative coverage count')
                  kind = fields['t']
                  require(kind in ('line', 'branch'), f'Unexpected coverage kind: {kind}')
                  key = source + ':' + kind
                  counts = bins.setdefault(key, [0, 0])
                  counts[0] += int(hits > 0)
                  counts[1] += 1
                  files.add(source)
              require(files == rtl_files, 'Missing RTL coverage')
              require(bins == coverage_baseline, f'RTL coverage baseline mismatch: {bins}')
              return bins

          def run(argv, name, limit):
              path = evidence / name
              entry = dict(argv=argv, log=name, status='RUNNING')
              report['commands'].append(entry)
              started = time.monotonic()
              process = None
              save()
              try:
                  with path.open('w') as log:
                      process = subprocess.Popen(argv, stdout=log, stderr=subprocess.STDOUT,
                                                 start_new_session=True)
                      while True:
                          remaining = limit - (time.monotonic() - started)
                          require(remaining > 0, f'{name}: timeout')
                          try:
                              code = process.wait(timeout=min(30, remaining))
                              break
                          except subprocess.TimeoutExpired:
                              print(f'{name}: elapsed={time.monotonic()-started:.0f}s', flush=True)
                  entry['returncode'] = code
                  require(code == 0, f'{name}: exit {code}')
                  entry['status'] = 'PASS'
              except BaseException:
                  entry['status'] = 'FAIL'
                  if process is not None and process.poll() is None:
                      os.killpg(process.pid, signal.SIGKILL)
                      process.wait()
                  if path.exists():
                      print(path.read_text(errors='replace')[-12000:], flush=True)
                  raise
              finally:
                  entry['seconds'] = round(time.monotonic() - started, 3)
                  save()

          try:
              build.mkdir(parents=True, exist_ok=True)
              run([
                  'verilator-cli', '--binary', '--output-groups', '0', '--unroll-count', '1',
                  '--timing', '--assert', '--coverage-line', '-Wno-fatal', '-j', '2',
                  '-CFLAGS', '-std=c++20', '-MAKEFLAGS', 'OPT_FAST=-Os',
                  '-MAKEFLAGS', 'VK_PCH_I_FAST=', '-MAKEFLAGS', 'VK_PCH_I_SLOW=',
                  '--top-module', top, f'-GCELLS={n}', '--Mdir', str(build),
                  '-Irtl/m31', '-Irtl/m32', f'rtl/m32/{top}.sv',
              ], 'compile.log', 3600)
              compile_log = (evidence / 'compile.log').read_text(errors='replace')
              require(not re.search(r'%Error|%Warning', compile_log),
                      'Compile error or warning')
              executable = build / f'V{top}'
              executable_hash = digest(executable)
              (evidence / 'executable.sha256').write_text(f'{executable_hash}  V{top}\n')
              replays, coverage_hashes = [], []
              for replay in (1, 2):
                  require(digest(executable) == executable_hash, 'Executable changed')
                  name = f'run-{replay}.log'
                  cov = evidence / f'run-{replay}.dat'
                  run([str(executable), '+verilator+coverage+file+' + str(cov)], name, 600)
                  semantic = collect(evidence / name)
                  (evidence / f'run-{replay}.txt').write_text(semantic)
                  replays.append(semantic)
                  bins = coverage(cov)
                  (evidence / f'coverage-{replay}.json').write_text(json.dumps(bins, indent=2) + '\n')
                  coverage_hashes.append(digest(cov))
                  print(semantic, end='')
              require(replays[0] == replays[1], 'Semantic replay mismatch')
              require(coverage_hashes[0] == coverage_hashes[1], 'Coverage replay mismatch')
              require(digest(executable) == executable_hash, 'Executable changed')
              run(['sha256sum', '--check', '--strict', str(evidence / 'sources.sha256')],
                  'source-final-check.log', 30)
              report.update(status='PASS', replays=2, replay_equal=True, tests=3, ports=26,
                            checks_per_replay=44960*(8*n+18),
                            executable_sha256=executable_hash, rtl_coverage=bins,
                            coverage_sha256=coverage_hashes[0],
                            semantic_sha256=hashlib.sha256(replays[0].encode()).hexdigest())
              summary = (f'### FRP 87: Feedback snapshot - {n} cells - PASS\n\n'
                         'Three tests; 26 output ports; two process replays.\n\n'
                         'Test 0: gamma drift (6); test 1: attenuation (2); test 2: global stability (18).\n\n'
                         '128 enable/reset/target-valid combinations; 8192 mixed input steps.\n\n'
                         '4096 attenuation addresses observed at candidate outputs in every cell.\n\n'
                         'RTL instrumented points; testbench excluded.\n\n'
                         '| RTL file / kind | Covered | Total | Percent |\n|---|---:|---:|---:|\n')
              for key, (covered, total) in sorted(bins.items()):
                  summary += f'| {key} | {covered} | {total} | {100 * covered / total:.2f}% |\n'
              summary += '\n```text\n' + replays[0] + '```\n'
              (evidence / 'summary.md').write_text(summary)
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
                  stream.write(summary)
          except BaseException as error:
              report.update(status='FAIL', error=str(error))
              raise
          finally:
              save()
          PYTHON

      - name: Hash qualification evidence
        if: always()
        run: |
          set -euo pipefail
          python - <<'PYTHON'
          import hashlib
          import os
          from pathlib import Path
          root = Path(os.environ['FRP87_EVIDENCE'])
          files = sorted(p for p in root.rglob('*') if p.is_file() and p.name != 'evidence.sha256')
          (root / 'evidence.sha256').write_text(''.join(
              f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(root)}\n'
              for p in files))
          PYTHON

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          name: frp-87-feedback-snapshot-${{ matrix.cells }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/frp-87-evidence/
          if-no-files-found: error
          retention-days: 14
