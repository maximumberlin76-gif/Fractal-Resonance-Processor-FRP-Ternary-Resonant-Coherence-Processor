name: 167 - M31 writeback lane symmetry formal
on: workflow_dispatch
permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Record revision and install Yosys
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence work
          git rev-parse HEAD > evidence/commit.txt
          test "$(cat evidence/commit.txt)" = "$GITHUB_SHA"
          sha256sum formal/m31/frp_m31_writeback_lane_symmetry_formal.sv \
            rtl/m31/frp_m31_state_update.sv rtl/m31/frp_m31_pkg.sv \
            .github/workflows/frp-167-m31-writeback-lane-symmetry-formal.yml > evidence/sources.sha256
          python -m pip install --only-binary=:all: pyosys==0.68
          python -m pip show pyosys > evidence/tools.txt

      - name: Prove symmetry, replay witnesses and check mutations
        shell: python
        run: |
          import json
          import os
          import subprocess
          import sys
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path
          from typing import NamedTuple

          top = "frp_m31_writeback_lane_symmetry_formal"
          dut = "frp_m31_state_update"
          source = Path(f"rtl/m31/{dut}.sv")
          evidence = Path("evidence")

          def yosys(commands, log):
              driver = "import sys; from pyosys import libyosys as y; y.run_pass(sys.argv[1], y.Design())"
              with log.open("w") as stream:
                  result = subprocess.run([sys.executable, "-c", driver, commands],
                                          stdout=stream, stderr=subprocess.STDOUT, timeout=900)
              if result.returncode:
                  raise RuntimeError(f"Yosys exit {result.returncode}, see {log}")
              return log.read_text()

          def prepare(n, options):
              return (f"read_slang --top {top} -G CELLS={n} {options} formal/m31/{top}.sv; "
                      f"prep -flatten -top {top}; async2sync; chformal -lower; "
                      "select -assert-count 7 t:$assert; select -assert-count 1 t:$assume; "
                      "select -assert-count 12 t:$cover; chformal -cover -remove; opt -full; check -assert; ")

          def samples(signal):
              data = iter(signal.get("data", []))
              values = []
              for code in signal["wave"]:
                  if code == ".":
                      value = values[-1]
                  elif code in "01":
                      value = int(code)
                  elif code in "=23456789":
                      word = next(data, "")
                      value = int(word, 2) if word else None
                  else:
                      value = None
                  values.append(value)
              return values[1:]

          class Lane(NamedTuple):
              old: int
              target: int
              next_state: int
              write: bool
              hold: bool
              reserved: bool
              flags: tuple

          def reflect(word, reverse):
              return 4 - word if reverse and word in (1, 3) else word

          def step_cell(old, target, flags, rst, tick, sched):
              cap, accepted, route, complete, reserved, direct = flags
              old = old if rst else 0
              leave = old == 0 and target in (1, 3) and sched in (0, 2, 3) and not route
              enter = old in (1, 3) and target == 0 and sched in (0, 1, 4) and not complete
              write = bool(rst and tick and cap and accepted and not (reserved or direct) and (enter or leave))
              return Lane(old, target, target if write else old, write, bool(rst and not write),
                          bool(rst and (target == 2 or old == 2 or reserved)), flags)

          def replay(path, n, bit):
              names = ("rst_n", "tick_enable", "scheduler_code", "select_cells", "select_reverse",
                       "candidate_a", "free_candidate_b", "meta_a", "free_meta_b", "reach")
              signals = {s["name"]: samples(s) for s in json.loads(path.read_text())["signal"] if s["name"] in names}
              rows = list(zip(*(signals[k] for k in names), strict=True))
              if len(rows) != 5 or rows[0][0] != 0 or any(None in row for row in rows):
                  raise ValueError(f"Incomplete trace or missing initial reset: {path}")
              watch, reverse = rows[0][3:5]
              last, mid = n - 1, n // 2
              mixed = (watch & 1 and not reverse & 1 and (watch & reverse) >> last
                       and not (watch >> mid) & 1)
              state = [[0] * n for _ in range(2)]
              prior_split = False
              for t, (rst, tick, sched, _, _, ca, cb, ma, mb, reach) in enumerate(rows):
                  banks = [[], []]
                  for i in range(n):
                      watched = (watch >> i) & 1
                      flipped = (reverse >> i) & 1
                      for side in (0, 1):
                          shared = side == 0 or watched
                          target = ((ca if shared else cb) >> (2*i)) & 3
                          if side and watched:
                              target = reflect(target, flipped)
                          meta = ma if shared else mb
                          flags = tuple((meta >> (k*n + i)) & 1 for k in range(6))
                          lane = step_cell(state[side][i], target, flags, rst, tick, sched)
                          banks[side].append(lane)
                          state[side][i] = lane.next_state
                      a, b = banks[0][i], banks[1][i]
                      if t and watched:
                          expected = (reflect(a.old, flipped), reflect(a.next_state, flipped), a.write, a.hold, a.reserved)
                          if expected != (b.old, b.next_state, b.write, b.hold, b.reserved):
                              raise ValueError(f"Lane {i} differs at sample {t+1}: {path}")
                  a, b = banks[0][last], banks[1][last]
                  first_a, first_b = banks[0][0], banks[1][0]
                  mid_a, mid_b = banks[0][mid], banks[1][mid]
                  split = mid_a.old != mid_b.old
                  split_write = mid_a.write != mid_b.write
                  old, new = (a.old, b.old), (a.next_state, b.next_state)
                  write, hold = a.write and b.write, a.hold and b.hold
                  cap, acc, route, complete, rf, df = a.flags
                  grant = tick and sched == 0 and cap and acc and not (rf or df)
                  goals = (
                      write and new == (1, 3) and split_write,
                      write and new == (3, 1) and split_write,
                      route and write and old == (1, 3) and new == (0, 0),
                      complete and write and old == (0, 0) and new == (3, 1),
                      not tick and split and old == (3, 1) and hold,
                      grant and old == (3, 1) and a.target == 1 and not (route or complete) and hold and split_write,
                      grant and route and complete and a.old == 0 and a.target == 1 and hold,
                      tick and a.target == 2 and not rf and a.reserved and b.reserved and hold and split_write,
                      False,
                      write and new == (1, 3) and first_a.write and first_b.write
                      and first_a.next_state == first_b.next_state == 3 and split_write,
                      old == (0, 0) and split and hold and first_a.old == first_b.old == 1,
                      False,
                  )
                  bits = sum(1 << i for i, hit in enumerate(goals) if t and mixed and rst and hit)
                  if t and mixed and not rst and prior_split:
                      bits |= 1 << 8
                  if t and rst and watch == reverse == (1 << n)-1 and old == (3, 1) and (first_a.old, first_b.old) == (1, 3):
                      bits |= 1 << 11
                  if reach != bits:
                      raise ValueError(f"Reach vector differs at sample {t+1}: {path}")
                  prior_split = bool(t and mixed and rst and split and old == (1, 3))
              if not (rows[-1][-1] & (1 << bit)):
                  raise ValueError(f"Missing final reach[{bit}]: {path}")

          def profile(n, mode):
              label = f"{mode}-{n}"
              out = evidence / label
              out.mkdir()
              options = "-I rtl/m31"
              if mode == "mapped":
                  unused = """
                      accepted_changes switch_load_numerator state_write_events state_hold_events
                      state_reset_events accepted_change_events neutral_routed_commit_events
                      pending_completion_commit_events reserved_state_events actual_direct_events
                      state_domain_valid state_output_domain_valid state_update_valid state_write_capacity_valid
                      same_state_hold_valid active_neutral_writeback_valid pending_completion_writeback_valid
                      no_reserved_state_output no_actual_direct_events
                  """.split()
                  drop = " ".join("w:" + p for p in unused)
                  net = out / "mapped.v"
                  yosys(f"read_slang --top {dut} -G CELLS={n} -I rtl/m31 {source}; proc; flatten; "
                        f"delete -output {drop}; opt -full; synth -top {dut} -noabc; "
                        f"rename {dut} frp_m31_lane_symmetry_netlist; check -assert; write_verilog -noattr {net}",
                        out / "synth.log")
                  options += f" -DFRP_M31_LANE_SYMMETRY_NETLIST {net}"
              model = Path("work") / f"{label}.il"
              yosys(prepare(n, options) + f"write_rtlil {model}", out / "prepare.log")
              proof = yosys(f"read_rtlil {model}; delete -output w:reach; opt_clean; "
                            "sat -seq 1 -set-assumes -tempinduct -maxsteps 5 -prove-asserts -verify -timeout 150",
                            out / "proof.log")
              if "Base case for induction length" not in proof or "Induction step proven: SUCCESS!" not in proof:
                  raise ValueError("Incomplete induction")
              cmds = [f"read_rtlil {model}; chformal -assert -remove; opt -full"]
              for bit in range(12):
                  cmds.append(f"sat -seq 5 -set-assumes -set-at 5 reach[{bit}] 1 -show-ports "
                              f"-dump_json {out}/reach-{bit}.json -timeout 90")
              if yosys("; ".join(cmds), out / "witnesses.log").count("SAT solving finished - model found:") != 12:
                  raise ValueError("Missing SAT witnesses")
              for bit in range(12):
                  replay(out / f"reach-{bit}.json", n, bit)
              return dict(induction="PASS", assertions=7, witnesses=12, replays=12)

          mutations = {
              "negative_target_filtered": ("if (commit_allowed_w[element_index]) begin",
                  "if (commit_allowed_w[element_index] && state_candidate_d[2*element_index +: 2] != 2'b11) begin"),
              "capacity_from_next_cell": ("&& capacity_accept_mask[element_index]",
                                          "&& capacity_accept_mask[(element_index+1)%CELLS]"),
              "rotate_register": ("state_q <= state_d;",
                                  "state_q <= {state_d[2*CELLS-3:0], state_d[2*CELLS-1 -: 2]};"),
          }

          def control(name, old, new):
              out = evidence / name
              out.mkdir()
              rtl = source.read_text()
              if rtl.count(old) != 1:
                  raise ValueError(f"Expected one mutation site for {name}")
              (out / source.name).write_text(rtl.replace(old, new))
              trace = out / "counterexample.json"
              log = yosys(prepare(8, f"-I {out} -I rtl/m31") +
                          "delete -output w:reach; opt_clean; sat -seq 4 -set-assumes -prove-asserts "
                          f"-falsify -show-ports -dump_json {trace} -timeout 90", out / "control.log")
              if "SAT proof finished - model found: FAIL!" not in log or not json.loads(trace.read_text())["signal"]:
                  raise ValueError("Missing counterexample")
              return "DETECTED"

          profiles, controls, errors = {}, {}, {}
          with ThreadPoolExecutor(max_workers=2) as pool:
              jobs = {pool.submit(profile, n, m): (profiles, f"{m}-{n}")
                      for n in (8, 9, 16, 32, 64, 128) for m in ("rtl", "mapped")}
              jobs.update({pool.submit(control, k, *v): (controls, k) for k, v in mutations.items()})
              for job in as_completed(jobs):
                  dest, key = jobs[job]
                  try:
                      dest[key] = job.result()
                  except Exception as exc:
                      errors[key] = str(exc)
                      print(f"::error::{key}: {exc}", flush=True)
          counts = (len(profiles), sum(v["replays"] for v in profiles.values()), len(controls))
          passed = counts == (12, 144, 3) and not errors
          report = dict(commit=os.environ["GITHUB_SHA"], passed=passed, profiles=profiles,
                        detected_controls=controls, errors=errors)
          (evidence / "results.json").write_text(json.dumps(report, indent=2, sort_keys=True) + "\n")
          summary = "M31 symmetry: %d/12 complete profiles, %d/144 replayed traces, %d/3 detected controls." % counts
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as stream:
              print(summary, file=stream)
          sys.exit(0 if passed else 1)

      - name: Record checksums
        if: always()
        shell: bash
        working-directory: evidence
        run: find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frp-167-m31-lane-symmetry-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
