name: 143 - FRP M32 Stability Handoff Formal
run-name: "143 - M32 stability handoff | up to 64 cells | ${{ github.sha }}"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Record inputs and install solver
        shell: bash
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/commit.txt
          git archive --format=tar.gz --output=evidence/sources.tar.gz HEAD -- \
            rtl/m31 rtl/m32 formal/m32/frp_m32_stability_handoff_formal.sv
          python -m pip install yowasp-yosys==0.68.0.0.post1208 yowasp-runtime==1.96 wasmtime==47.0.1
          yowasp-yosys -V > evidence/tool-version.txt
          python -m pip freeze > evidence/packages.txt

      - name: Prove stability handoff and check counterexamples
        shell: bash
        run: |
          cat > evidence/verify.py <<'PY'
          import itertools
          import json
          import re
          import shutil
          import subprocess
          from pathlib import Path

          out = Path("evidence")
          top = "frp_m32_stability_handoff_formal"
          harness = Path("formal/m32") / (top + ".sv")
          core = Path("rtl/m32/frp_m32_core.sv")
          observer = core.with_name("frp_m32_observed_core.sv")
          blocks = {
              "frp_m31_execution_core": "u_execution",
              "frp_m31_phase_interference": "u_phase_interference",
              "frp_m31_global_stability": "u_local_global_stability",
          }
          events = ["consecutive-ticks", "drain-on-clear", "phase-only-idle",
                    "reset-two-in-flight", "boundary-on-pause", "recorder-overflow"]
          reset = "-set-assumes -set rst_n 1 -set-at 1 rst_n 0"

          def require(ok, message):
              if not ok:
                  raise RuntimeError(message)

          def read(n, width, src):
              cuts = " ".join("--blackboxed-module " + block for block in blocks)
              return (f"read_slang -j 1 {cuts} --top {top} -G CELLS={n} -G COUNT_BITS={width} "
                      f"-I{src.parent} -Irtl/m31 -Irtl/m32 {src}")

          def build(n, width, src):
              return [read(n, width, src), "cutpoint -blackbox", f"prep -top {top} -flatten",
                      "async2sync", "opt -full", "chformal -lower", "check -assert",
                      "select -assert-count 11 t:$assert", "select -assert-count 1 t:$assume"]

          def run(folder, commands, reject=False):
              folder.mkdir(exist_ok=True)
              script = folder / "run.ys"
              marker = folder / "complete.txt"
              script.write_text("\n".join(commands + [f"tee -o {marker} log FRP143_COMPLETE"]) + "\n")
              proc = subprocess.run(["yowasp-yosys", "-Q", "-s", str(script)],
                                    stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=900)
              log = proc.stdout.decode()
              (folder / "solver.log").write_text(log)
              if reject:
                  require(proc.returncode != 0 and not marker.exists(), "9-cell design accepted")
                  errors = re.findall(r"(?m)^([^:\n]+):\d+:\d+: error: (.+)$", log)
                  allowed = {str(core), "rtl/m31/frp_m31_local_thermal_field.sv"}
                  require(str(core) in {p for p, _ in errors} and
                          all(p in allowed and "'$fatal'" in msg for p, msg in errors) and
                          "FRP M32 core requires 8, 16, 32 or 64 cells" in log,
                          "9-cell rejection did not match the RTL guard")
                  return log
              proc.check_returncode()
              require(marker.read_text().strip() == "FRP143_COMPLETE", f"{folder}: incomplete run")
              cuts = re.findall(r"Removing cell (\S+), making all cell outputs cutpoints\.", log)
              expected = {f"{top}.dut.u_core.{name}" for name in blocks.values()}
              require(len(cuts) == 3 and set(cuts) == expected, f"{folder}: wrong proof boundary")
              return log

          def samples(trace, name, depth):
              sig = next(s for s in trace["signal"] if s["name"].replace(" ", "") == name)
              data = iter(sig.get("data", [])[1:])
              values = []
              for symbol in sig["wave"][1:]:
                  if symbol == "=":
                      values.append(int(next(data), 2))
                  elif symbol in ("0", "1"):
                      values.append(int(symbol))
                  elif symbol == "." and values:
                      values.append(values[-1])
                  else:
                      raise ValueError(f"{name}: invalid symbol {symbol}")
              require(len(values) == depth, f"{name}: incomplete trace")
              return values

          def audit(path, bit, width):
              depth = 14 if bit == 5 else 10
              trace = json.loads(path.read_text())
              signals = ["rst_n", "reach", "tick_enable", "due", "completed", "recorded"]
              rst, reach, tick, due, completed, recorded = [samples(trace, s, depth) for s in signals]
              expected_reset = [0] + [1] * (depth - 1)
              if bit == 3:
                  expected_reset[4] = 0
              require(rst == expected_reset and reach[-1] & (1 << bit), f"{path}: wrong event or reset")
              for i in range(1, depth):
                  expected = (0, 0, 0)
                  if rst[i - 1] and rst[i]:
                      pending = due[i - 1]
                      expected = (2 * (pending & 1) + tick[i - 1],
                                  (completed[i - 1] + (pending & 1)) % (1 << 32),
                                  min((1 << width) - 1, recorded[i - 1] + (pending >> 1)))
                  require((due[i], completed[i], recorded[i]) == expected, f"{path}: cycle {i+1}")
              if bit == 3:
                  require(tick[2:4] == [1, 1] and completed[-1] == recorded[-1] == 1,
                          f"{path}: missing restart after two issued ticks")

          run(out / "cells-9-rejected", [read(9, 64, harness)], reject=True)
          rows = []
          for n, width in itertools.product((8, 16, 32, 64), (3, 64)):
              folder = out / f"cells-{n}-width-{width}"
              selected = events if width == 3 else events[:5]
              commands = build(n, width, harness)
              commands.append("sat -set-assumes -seq 1 -maxsteps 6 -tempinduct -prove-asserts -verify")
              for bit, event in enumerate(selected):
                  depth = 14 if bit == 5 else 10
                  second_reset = "-set-at 5 rst_n 0" if bit == 3 else ""
                  commands.append(f"sat -seq {depth} {reset} {second_reset} -set-at {depth} reach[{bit}] 1 "
                                  f"-show rst_n -show reach -show tick_enable -show due -show completed "
                                  f"-show recorded -dump_json {folder}/{event}.json")
              log = run(folder, commands)
              require("Induction step proven: SUCCESS!" in log, f"{folder}: induction incomplete")
              for bit, event in enumerate(selected):
                  audit(folder / (event + ".json"), bit, width)
              rows.append({"cells": n, "count_bits": width, "events": selected})
              print(f"PASS cells={n} count_bits={width} witnesses={len(selected)}", flush=True)

          faults = [
              ("discard-drain", "local_stability_valid_q <= local_stability_pending_q;",
               "local_stability_valid_q <= local_stability_pending_q && tick_enable;",
               "dut.local_stability_valid_q", "due[1]",
               "-set-at 2 tick_enable 1 -set-at 3 tick_enable 0", 4, 0, 1),
              ("phase-only-issue", "local_stability_pending_q <= tick_enable;",
               "local_stability_pending_q <= tick_enable || phase_load_valid;",
               "dut.u_core.local_stability_pending_q", "due[0]",
               "-set-at 2 tick_enable 0 -set-at 2 phase_load_valid 1", 3, 1, 0),
              ("live-switch", "local_stability_switch_load_q16 <= local_stability_switch_snapshot_q16;",
               "local_stability_switch_load_q16 <= normalized_cycle_cost_q16;",
               "dut.local_stability_switch_load_q16", "result[31:0]",
               "-set-at 2 tick_enable 1 -set-at 2 dut.switch_load_numerator 0 "
               "-set-at 3 dut.switch_load_numerator 1", 4, 1024, 0),
              ("clear-count", "local_stability_sample_count_q <= local_stability_sample_count_q + 32'd1;",
               "local_stability_sample_count_q <= clear_counters ? 32'd0 : local_stability_sample_count_q + 32'd1;",
               "dut.local_stability_sample_count_q", "completed",
               "-set-at 2 tick_enable 1 -set-at 3 clear_counters 1", 4, 0, 1),
          ]
          detected = {}
          for name, old, new, actual, expected, pins, cycle, bad, good in faults:
              folder = out / name
              folder.mkdir()
              body = core.read_text()
              require(body.count(old) == 1, f"{name}: mutation anchor changed")
              (folder / core.name).write_text(body.replace(old, new))
              shutil.copyfile(observer, folder / observer.name)
              src = folder / harness.name
              shutil.copyfile(harness, src)
              commands = build(64, 64, src)
              path = folder / "counterexample.json"
              commands.append(f"sat -seq 7 {reset} {pins} -prove-asserts -falsify -show {actual} "
                              f"-show {expected} -show rst_n -dump_json {path}")
              log = run(folder, commands)
              trace = json.loads(path.read_text())
              require("model found: FAIL!" in log and samples(trace, "rst_n", 7) == [0] + [1]*6,
                      f"{name}: missing counterexample from reset")
              pair = [samples(trace, s, 7)[cycle-1] for s in (actual, expected)]
              require(pair == [bad, good], f"{name}: unexpected values {pair} at cycle {cycle}")
              detected[name] = {"cycle": cycle, "actual": bad, "expected": good}
              print(f"DETECTED {name} cycle={cycle} actual={bad} expected={good}", flush=True)

          total = sum(len(row["events"]) for row in rows)
          require((len(rows), total, len(detected)) == (8, 44, 4), "Incomplete verification matrix")
          summary = {"profiles": rows, "witnesses": total, "mutations": detected, "rejected_cells": [9]}
          (out / "summary.json").write_text(json.dumps(summary, indent=2) + "\n")
          PY
          python -u evidence/verify.py
          jq -r '"Profiles: \(.profiles|length), witnesses: \(.witnesses), detected mutations: \(.mutations|length)"' \
            evidence/summary.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload combined evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frp-143-stability-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30
