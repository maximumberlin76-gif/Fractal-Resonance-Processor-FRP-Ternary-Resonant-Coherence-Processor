name: 142 - FRP M32 Observer Alignment Formal
run-name: "142 - M32 observer alignment | up to 64 cells | ${{ github.sha }}"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Record inputs and install solver
        shell: bash
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/commit.txt
          git archive --format=tar.gz --output=evidence/sources.tar.gz HEAD -- \
            rtl/m31 rtl/m32 formal/m32/frp_m32_observer_alignment_formal.sv
          python -m pip install yowasp-yosys==0.68.0.0.post1208 yowasp-runtime==1.96 wasmtime==47.0.1
          yowasp-yosys -V > evidence/tool-version.txt
          python -m pip freeze > evidence/packages.txt

      - name: Prove alignment and check fault recovery
        shell: bash
        run: |
          cat > evidence/verify.py <<'PY'
          import itertools
          import json
          from pathlib import Path
          import shutil
          import subprocess

          out = Path("evidence")
          top = "frp_m32_observer_alignment_formal"
          harness = Path(f"formal/m32/{top}.sv")
          observer = Path("rtl/m32/frp_m32_observed_core.sv")
          events = ["missing-valid", "extra-valid", "blocked-after-fault",
                    "reset-recovery", "last-cell-route", "drain-with-clear"]

          def design(n, w, src):
              return [
                  f"read_slang -j 1 --blackboxed-module frp_m32_core --top {top} "
                  f"-G CELLS={n} -G COUNT_BITS={w} -I{src.parent} -Irtl/m31 -Irtl/m32 {src}",
                  "cutpoint -blackbox",
                  f"prep -top {top} -flatten",
                  "async2sync", "opt -full", "chformal -lower", "check -assert",
                  "select -assert-count 11 t:$assert", "select -assert-count 1 t:$assume",
              ]

          def solve(folder, commands):
              script = folder / "run.ys"
              marker = folder / "complete.txt"
              commands.append(f"tee -o {marker} log FRP142_COMPLETE")
              script.write_text("\n".join(commands) + "\n")
              with (folder / "stderr.txt").open("w") as err:
                  run = subprocess.run(["yowasp-yosys", "-Q", "-s", str(script)],
                                       stdout=subprocess.PIPE, stderr=err, timeout=600)
              log = run.stdout.decode()
              (folder / "solver.log").write_text(log)
              run.check_returncode()
              cuts = [line for line in log.splitlines() if "making all cell outputs cutpoints" in line]
              if len(cuts) != 1 or f"{top}.dut.u_core," not in cuts[0]:
                  raise RuntimeError(f"{folder}: unexpected formal boundary")
              if marker.read_text().strip() != "FRP142_COMPLETE":
                  raise RuntimeError(f"{folder}: incomplete solver run")
              return log

          def values(trace, name, depth):
              sig = next(s for s in trace["signal"] if s["name"] == name)
              data = iter(sig.get("data", [])[1:])
              result = []
              for ch in sig["wave"][1:]:
                  if ch == "=":
                      result.append(int(next(data), 2))
                  elif ch in ("0", "1"):
                      result.append(int(ch))
                  elif ch == "." and result:
                      result.append(result[-1])
                  else:
                      raise ValueError(f"{name}: unexpected wave symbol {ch}")
              if len(result) != depth:
                  raise ValueError(f"{name}: expected {depth} cycles")
              return result

          reset = "-set-assumes -set rst_n 1 -set-at 1 rst_n 0"
          show = "-show reach -show rst_n -show valid -show due -show fault -show count -show tick_enable -show clear_counters"
          profiles = []
          for n, w in itertools.product((8, 9, 16, 32, 64), (3, 64)):
              folder = out / f"cells-{n}-width-{w}"
              folder.mkdir()
              commands = design(n, w, harness)
              commands.append("sat -set-assumes -tempinduct -seq 1 -maxsteps 5 -prove-asserts -verify")
              for bit, event in enumerate(events):
                  depth = 12 if bit == 3 else 8
                  extra = "-set-at 6 rst_n 0" if bit == 3 else ""
                  commands.append(f"sat -seq {depth} {reset} {extra} -set-at {depth} reach[{bit}] 1 "
                                  f"{show} -dump_json {folder}/{event}.json")
              log = solve(folder, commands)
              if "Induction step proven: SUCCESS!" not in log:
                  raise RuntimeError(f"{folder}: missing induction result")
              for bit, event in enumerate(events):
                  trace = json.loads((folder / f"{event}.json").read_text())
                  resets = [0] + [1]*4 + [0] + [1]*6 if bit == 3 else [0] + [1]*7
                  depth = len(resets)
                  if values(trace, "rst_n", depth) != resets or not values(trace, "reach", depth)[-1] & (1 << bit):
                      raise RuntimeError(f"{folder}/{event}: invalid witness")
                  if bit == 3:
                      fault = values(trace, "fault", depth)
                      count = values(trace, "count", depth)
                      if 1 not in fault[1:5] or any(fault[5:]) or count[5] != 0 or count[-1] != 1:
                          raise RuntimeError(f"{folder}: recovery sequence mismatch")
              profiles.append({"cells": n, "counter_bits": w, "events": events})
              print(f"PASS cells={n} width={w}", flush=True)

          faults = [
              ("ignore-extra-valid", "if (!alignment_match)",
               "if (result_pending_q && !local_stability_valid_q)", "dut.record_alignment_error_q", "fault"),
              ("unblock-on-clear", "if (!alignment_match)",
               "if (clear_counters) record_alignment_error_q <= 1'b0;\n      else if (!alignment_match)",
               "dut.record_alignment_error_q", "fault"),
              ("use-live-route", ".pending_route(result_pending_route_q)",
               ".pending_route(pending_route_out)", "dut.u_recorder.pending_route", "pending"),
          ]
          detected = {}
          for name, old, new, actual, expected in faults:
              folder = out / name
              folder.mkdir()
              body = observer.read_text()
              if body.count(old) != 1:
                  raise RuntimeError(f"{name}: mutation anchor changed")
              (folder / observer.name).write_text(body.replace(old, new))
              src = folder / harness.name
              shutil.copyfile(harness, src)
              commands = design(64, 64, src)
              stimulus = ""
              if name == "use-live-route":
                  stimulus = ("-set-at 7 accept 1 -set-at 6 dut.pending_route_out[127:126] 3 "
                              "-set-at 7 dut.pending_route_out[127:126] 0")
              commands.append(f"sat -seq 8 {reset} {stimulus} -prove-asserts -falsify {show} -show accept -show {actual} "
                              f"-show {expected} -dump_json {folder}/counterexample.json")
              log = solve(folder, commands)
              trace = json.loads((folder / "counterexample.json").read_text())
              if "model found: FAIL!" not in log or values(trace, "rst_n", 8) != [0]+[1]*7:
                  raise RuntimeError(f"{name}: missing counterexample from reset")
              pairs = zip(values(trace, actual, 8), values(trace, expected, 8))
              differences = [i for i, (a, b) in enumerate(pairs, 1) if i > 1 and a != b]
              if not differences:
                  raise RuntimeError(f"{name}: counterexample lacks expected divergence")
              if name == "use-live-route":
                  if (values(trace, "accept", 8)[6] != 1 or values(trace, actual, 8)[6] >> 126 != 0
                          or values(trace, expected, 8)[6] >> 126 != 3):
                      raise RuntimeError("Expected route mismatch on accepted sample for cell 63")
              detected[name] = differences
              print(f"DETECTED {name} at {differences}", flush=True)

          summary = {"profiles": profiles, "witness_count": sum(len(p["events"]) for p in profiles),
                     "mutation_mismatch_cycles": detected}
          (out / "summary.json").write_text(json.dumps(summary, indent=2) + "\n")
          PY
          python -u evidence/verify.py
          jq -r '"Profiles: \(.profiles|length), witnesses: \(.witness_count), detected mutations: \(.mutation_mismatch_cycles|length)"' \
            evidence/summary.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload combined evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frp-142-observer-alignment-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30
