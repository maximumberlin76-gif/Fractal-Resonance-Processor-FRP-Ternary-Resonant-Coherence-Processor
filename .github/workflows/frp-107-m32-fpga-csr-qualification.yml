# Copyright (c) 2026 Maksym Marnov (Alchimist). All rights reserved.
name: 107 - FRP M32 FPGA CSR Qualification
run-name: "107 - FRP FPGA CSR | 4 sizes, 2 suites, 16 replays @ ${{ github.sha }}"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frp-107-fpga-csr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    env:
      LC_ALL: C.UTF-8
      TZ: UTC
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Initialize one evidence bundle
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/frp-107-evidence"
          echo "FRP107_EVIDENCE=$RUNNER_TEMP/frp-107-evidence" >> "$GITHUB_ENV"
          printf '%s\n' '{"status":"NOT_COMPLETED"}' > "$RUNNER_TEMP/frp-107-evidence/qualification.json"
          printf 'commit=%s\nrun=%s\nattempt=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            > "$RUNNER_TEMP/frp-107-evidence/context.txt"

      - name: Check out dispatched commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install and record toolchain
        run: |
          set -euo pipefail
          {
            python -m pip install --disable-pip-version-check verilator==5.48.0 systemc==3.0.2.1
            python -m pip check
            python --version
            verilator-cli --version
            g++ --version
            make --version
          } 2>&1 | tee "$FRP107_EVIDENCE/toolchain.log"
          python -m pip freeze > "$FRP107_EVIDENCE/packages.txt"

      - name: Qualify FPGA and CSR integration
        run: |
          set -euo pipefail
          cat > "$FRP107_EVIDENCE/qualify.py" <<'PYTHON'
          # Copyright (c) 2026 Maksym Marnov (Alchimist). All rights reserved.
          from pathlib import Path
          import hashlib, importlib.util, json, os, re, shutil, signal, subprocess, sys, time, traceback

          root = Path(os.environ['GITHUB_WORKSPACE']).resolve()
          base = Path(os.environ['FRP107_EVIDENCE']).resolve()
          work = base.parent / 'frp-107-build'
          source = 'rtl/m32/frp_m32_internal_gamma_core.sv'
          reference = 'frp_prototype_v1_7_0.py'
          pins = {
              reference: '9de085915aa0fb8a73705c0927cc875b106480ef8a75a76f599be04440c0f099',
              source: 'b56dfc038299792bee47a4bfc6e342edbe0f5a1aea8b24d51f2a2cc93adcc95d',
              'rtl/m32/frp_m32_gamma_target_source.sv': '339b6e8c768cd8358c7dbe2dabb055251b98ead7dde231e2540daaf5e49fe039',
              'fpga/m32/frp_m32_internal_gamma_fpga_top.sv': '7d4355fc89b7b8814fc808298b09aea4f6f650422b783b1b26b82e6b19e34e91',
              'fpga/m32_csr/frp_m32_internal_gamma_csr_top.sv': '19a82fa2e5a8a35f133e9c9ed738ed0a5e8044e1caf49ed3c1f9bc8823cb3326',
          }
          report = dict(status='RUNNING', commit=os.environ['GITHUB_SHA'], scope='FPGA and CSR RTL integration',
                        commands=[], suites=[dict(suite=k, cells=n, status='NOT_RUN', replays=0)
                                             for n in (8,16,32,64) for k in ('fpga','csr')])

          def require(condition, message):
              if not condition:
                  raise RuntimeError(message)

          def digest(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def save():
              (base/'qualification.json').write_text(json.dumps(report,indent=2)+'\n')
              rows=['# FRP 107 — FPGA and CSR qualification','',f"Status: **{report['status']}**",
                    f"Commit: `{report['commit']}`",'', '| Suite | Cells | Status | Replays |','|---|---:|---|---:|']
              rows += [f"| {s['suite']} | {s['cells']} | {s['status']} | {s['replays']} |" for s in report['suites']]
              rows += ['', 'Scope: '+report['scope']+'.',
                       'Profiles: 8/16/32/64 cells; scheduler modes: free, 7/1, 1/7.',
                       'Checks: 114 core outputs, reset release, checkpoint loading, command handshakes,',
                       'gamma cadence and Python targets, CSR reads/writes/errors and upper windows.']
              if 'totals' in report:
                  rows += ['', '```json',json.dumps(report['totals'],indent=2),'```']
              if 'error' in report:
                  rows += ['', 'Failure details: failure.txt and the corresponding command log.']
              (base/'summary.md').write_text('\n'.join(rows)+'\n')

          def command(args, log, timeout):
              entry=dict(argv=[str(a) for a in args],log=str(log.relative_to(base)),timeout_seconds=timeout)
              report['commands'].append(entry);save();start=time.monotonic()
              with log.open('w') as stream:
                  process=subprocess.Popen(args,cwd=root,stdout=stream,stderr=subprocess.STDOUT,start_new_session=True)
                  try:
                      code=process.wait(timeout=timeout)
                  except subprocess.TimeoutExpired:
                      os.killpg(process.pid,signal.SIGKILL);process.wait()
                      entry.update(status='TIMEOUT',seconds=round(time.monotonic()-start,3));save()
                      raise RuntimeError('Command timeout: '+entry['log'])
              entry.update(returncode=code,seconds=round(time.monotonic()-start,3));save()
              require(code==0,'Command failed: '+entry['log'])
              return log.read_text(errors='replace')

          def source_hashes():
              paths=[root/reference]
              for folder in ('rtl/m22','rtl/m31','rtl/m32','fpga/m32','fpga/m32_csr'):
                  paths += [p for p in (root/folder).rglob('*') if p.is_file() and p.suffix in ('.sv','.svh','.mem')]
              return {str(p.relative_to(root)):digest(p) for p in sorted(set(paths))}

          def expected_metrics(kind,n):
              if kind=='fpga':
                  extra={8:(8269,11970),16:(8509,12226),32:(8989,12738),64:(9949,13762)}[n]
                  return dict(cells=n,outputs=114,ticks=120,gamma_updates=15,resets=8,begin_transfers=18,
                              word_transfers=8747,phase_transfers=15,blocked=extra[0],cycles=extra[1])
              transfers,reads,waits,clocks={8:(24904,5139,46,26067),16:(28270,7560,118,29505),
                                          32:(35101,12483,262,36480),64:(48862,22410,550,50529)}[n]
              return dict(cells=n,outputs=114,ticks=120,updates=15,transfers=transfers,reads=reads,
                          errors=12113,waits=waits,resets=6,upper_requests=4 if n==64 else 0,
                          upper_masks=4 if n==64 else 0,clocks=clocks)

          def validate_output(text,kind,n):
              lines=[s for s in text.splitlines() if s.startswith('PASS ')]
              require(len(lines)==1,'Expected exactly one PASS record')
              line=lines[0];prefix='PASS INTERNAL_GAMMA_'+kind.upper()+' '
              require(line.startswith(prefix),'Unexpected suite record')
              fields=line[len(prefix):].split()
              require(all(re.fullmatch(r'\w+=\d+',s) for s in fields),'Malformed PASS record')
              pairs=[s.split('=') for s in fields]
              metrics={k:int(v) for k,v in pairs}
              require(len(metrics)==len(pairs),'Duplicate metric')
              require(metrics==expected_metrics(kind,n),'Missing or unexpected execution coverage: '+line)
              return line,metrics

          def fpga_bench(ports):
              outputs=[(n,p) for n,p in ports if p.startswith("output ")]
              def declaration(p):
               p=p.replace('input ','').replace('output logic ','wire ').replace('output wire ','wire ').replace('output ','wire ')
               return p+';'
              decls='\n'.join(declaration(p.replace('rst_n','rst_n_async') if n=='rst_n' else p) for n,p in ports)
              golden='\n'.join(declaration(p[:-len(n)]+'gold_'+n) for n,p in outputs)
              controls={'tick_valid','clear_counters','phase_load_valid','auto_target_enable','checkpoint_load_begin','checkpoint_load_valid'}
              connections=[]
              for n,p in ports:
               value='gold_'+n if p.startswith('output ') else n
               if n=='rst_n':value='rst_n_ref'
               if n in controls:value=n+' && rst_n_ref'
               if n=='external_request_valid':value='external_request_valid & {REQUEST_LANES{rst_n_ref}}'
               connections.append('.'+n+'('+value+')')
              checks='\n'.join(f'if({n} !== gold_{n})$fatal(1,"forward {n} n=%0d cycle=%0d",CELLS,cycles);' for n,_ in outputs)
              tb='''`timescale 1ns/1ps
          `include "frp_m32_internal_gamma_fpga_top.sv"
          module tb #(parameter int CELLS=8);
          import frp_m31_pkg::*;
          localparam int REQUEST_LANES=CELLS/4,CELL_INDEX_BITS=$clog2(CELLS),COUNTER_BITS=32;
          DECLS
          GOLD
          wire core_ready,checkpoint_begin_ready,checkpoint_begin_accepted,checkpoint_word_accepted;
          int release_edges=0,cycles=0,logical_ticks=0,draws=0,total_ticks=0,updates=0;
          int begin_transfers=0,word_transfers=0,phase_transfers=0,blocked=0,resets=0;
          wire rst_n_ref = rst_n_async && release_edges==2;
          logic [31:0] snapshot[0:624],expected[0:80*CELLS-1];
          frp_m32_internal_gamma_fpga_top #(.CELLS(CELLS)) dut(.*);
          frp_m32_internal_gamma_core #(.CELLS(CELLS)) gold(CONNECTIONS);
          always @(negedge rst_n_async) release_edges=0;
          event compare_event;
          always @(compare_event) begin
           CHECKS
           if(core_ready!==rst_n_ref || checkpoint_begin_ready!==rst_n_ref)$fatal(1,"reset release");
           if(checkpoint_begin_accepted!==(rst_n_ref&&checkpoint_load_begin))$fatal(1,"begin handshake");
           if(checkpoint_word_accepted!==(checkpoint_load_valid&&gold_checkpoint_load_ready))$fatal(1,"word handshake");
           if(tick_accepted!==(tick_valid&&gold_tick_ready))$fatal(1,"tick handshake");
           if(phase_load_accepted!==(phase_load_valid&&gold_phase_load_ready))$fatal(1,"phase handshake");
           if(gamma_tick_phase_q!==3'(logical_ticks%8))$fatal(1,"logical cadence");
           if(actual_direct_events || reserved_state_events || queue_overflow_events)$fatal(1,"invariant");
          end
          task automatic compare;
           ->compare_event;#0.01;
          endtask
          task automatic cycle;
           bit fire,update;
           #1;compare();fire=tick_accepted;update=gamma_update_accepted;
           if(update!==(fire&&logical_ticks%8==0))$fatal(1,"update cadence");
           if(checkpoint_begin_accepted)begin_transfers++;
           if(checkpoint_word_accepted)word_transfers++;
           if(phase_load_accepted)phase_transfers++;
           if(tick_valid&&!fire)blocked++;
           clk=1;#1;
           if(rst_n_async && release_edges<2)release_edges++;
           if(fire)begin logical_ticks++;total_ticks++;end
           if(update)begin
            for(int k=0;k<CELLS;k++)if(local_gamma_noise_target_q16[k*32+:32]!==expected[draws*CELLS+k])
             $fatal(1,"Python gamma n=%0d draw=%0d lane=%0d",CELLS,draws,k);
            draws++;updates++;
           end
           clk=0;#1;cycles++;compare();
          endtask
          task automatic idle_controls;
           tick_valid=0;phase_load_valid=0;clear_counters=0;checkpoint_load_begin=0;checkpoint_load_valid=0;
          endtask
          task automatic assert_reset;
           // Exercise assertion between clock edges, with no clock needed to clear ready.
           rst_n_async=0;logical_ticks=0;draws=0;#0.2;compare();resets++;
           if(core_ready || gamma_configured || gamma_bank_valid || tick_ready || checkpoint_load_ready || phase_load_ready)$fatal(1,"async reset");
           cycle();
          endtask
          task automatic release_reset;
           rst_n_async=1;cycle();if(core_ready)$fatal(1,"early release");
           cycle();if(!core_ready)$fatal(1,"late release");
          endtask
          task automatic load_snapshot;
           int before_words;
           checkpoint_load_begin=1;checkpoint_index=10'(snapshot[624]);cycle();checkpoint_load_begin=0;draws=0;
           before_words=word_transfers;
           for(int i=0;i<624;i++)begin
            checkpoint_load_word=snapshot[i];checkpoint_load_valid=1;
            #0.1;if(!checkpoint_load_ready)$fatal(1,"load ready");cycle();
            if(i%13==0)begin checkpoint_load_valid=0;cycle();end
           end
           checkpoint_load_valid=0;
           if(word_transfers-before_words!=624 || !gamma_configured || gamma_load_error)$fatal(1,"checkpoint transfer");
          endtask
          task automatic accept_tick;
           int before_ticks;
           tick_valid=1;before_ticks=logical_ticks;
           for(int t=0;t<2000&&logical_ticks==before_ticks;t++)cycle();
           if(logical_ticks!=before_ticks+1)$fatal(1,"lost or duplicate tick");
           tick_valid=0;phase_load_valid=0;clear_counters=0;
          endtask
          initial begin
           clk=0;rst_n_async=1;idle_controls();scheduler_mode=FRP_MODE_FREE;
           phase_load='0;frequency_load_q16={CELLS{32'd65536}};
           auto_target_enable=1;external_request_valid='1;external_request_cell_index='0;
           external_request_target='0;external_target_bank='0;checkpoint_index=0;checkpoint_load_word=0;
           $readmemh("STATE_PATH",snapshot);$readmemh("TARGET_PATH",expected);
           // Pulses confined to reset release must not become operations afterward.
           assert_reset();checkpoint_load_begin=1;checkpoint_load_valid=1;phase_load_valid=1;tick_valid=1;clear_counters=1;
           rst_n_async=1;cycle();idle_controls();cycle();cycle();
           if(begin_transfers || word_transfers || phase_transfers || total_ticks || gamma_configured || checkpoint_load_ready)$fatal(1,"reset pulse leaked");
           // Held controls first become eligible on the third release edge.
           assert_reset();checkpoint_load_begin=1;checkpoint_load_valid=1;phase_load_valid=1;tick_valid=1;
           checkpoint_index=10'(snapshot[624]);release_reset();
           if(begin_transfers || word_transfers || phase_transfers || total_ticks)$fatal(1,"release edge consumed control");
           cycle();if(begin_transfers!=1 || word_transfers || phase_transfers || total_ticks)$fatal(1,"held begin priority");
           idle_controls();
           // Reset in a partial load, then in generation, then with a completed bank.
           checkpoint_load_valid=1;checkpoint_load_word=snapshot[0];repeat(11)cycle();assert_reset();idle_controls();release_reset();
           load_snapshot();cycle();if(!gamma_source_busy)$fatal(1,"source did not start");assert_reset();idle_controls();release_reset();
           load_snapshot();for(int t=0;!gamma_bank_valid&&t<2000;t++)cycle();
           if(!gamma_bank_valid)$fatal(1,"bank timeout");assert_reset();idle_controls();release_reset();
           for(int m=0;m<3;m++)begin
            idle_controls();assert_reset();release_reset();scheduler_mode=frp_m31_scheduler_mode_e'(m);
            for(int i=0;i<CELLS;i++)phase_load[i*32+:32]=32'(i*32'h13851cab+m*32'h01111000);
            phase_load_valid=1;cycle();phase_load_valid=0;
            if(phase_word_q!==phase_load || gamma_configured)$fatal(1,"phase-only before checkpoint");
            tick_valid=1;load_snapshot();tick_valid=0;
            for(int step=0;step<24;step++)begin
             if(step==6)repeat(700)cycle();
             if(step==8 || step==13)begin tick_valid=1;load_snapshot();tick_valid=0;end
             if(step==17)begin
              checkpoint_load_begin=1;checkpoint_index=625;tick_valid=1;cycle();checkpoint_load_begin=0;repeat(5)cycle();
              if(!gamma_load_error || gamma_configured || tick_ready)$fatal(1,"invalid checkpoint accepted");
              load_snapshot();tick_valid=0;
             end
             auto_target_enable=(step/4)%2==0;
             for(int lane=0;lane<REQUEST_LANES;lane++)begin
              external_request_cell_index[lane*CELL_INDEX_BITS+:CELL_INDEX_BITS]=CELL_INDEX_BITS'((step+lane)%CELLS);
              external_request_target[lane*2+:2]=(step%3==0)?FRP_STATE_NEG:FRP_STATE_POS;
             end
             for(int i=0;i<CELLS;i++)external_target_bank[i*2+:2]=(step%3==0)?FRP_STATE_NEG:FRP_STATE_POS;
             if(step%7==0)begin
              phase_load_valid=1;
              for(int i=0;i<CELLS;i++)begin
               phase_load[i*32+:32]=32'(i*32'h13a5f123+step*32'h019abcde);
               frequency_load_q16[i*32+:32]=32'(50000+step*130+i*71);
              end
             end
             clear_counters=step%5==0;accept_tick();
             if(logical_ticks!=step+1)$fatal(1,"logical tick count");
             repeat(step%3)cycle();
            end
            // A continuously asserted valid performs one tick on each ready edge.
            tick_valid=1;
            for(int t=0;t<5000&&logical_ticks<40;t++)cycle();
            tick_valid=0;
            if(logical_ticks!=40)$fatal(1,"held tick stream");
            repeat(3)cycle();
           end
           if(total_ticks!=120 || updates!=15 || blocked==0)$fatal(1,"coverage count");
           $display("PASS INTERNAL_GAMMA_FPGA cells=%0d outputs=OUTPUT_COUNT ticks=%0d gamma_updates=%0d resets=%0d begin_transfers=%0d word_transfers=%0d phase_transfers=%0d blocked=%0d cycles=%0d",CELLS,total_ticks,updates,resets,begin_transfers,word_transfers,phase_transfers,blocked,cycles);
           $finish;
          end
          initial begin #10000000;$fatal(1,"watchdog");end
          endmodule
          '''.replace('GOLD',golden).replace('DECLS',decls).replace('CONNECTIONS',',\n'.join(connections)).replace('CHECKS',checks).replace('OUTPUT_COUNT',str(len(outputs)))
              return tb

          def csr_bench(ports):
              outs=[(n,p) for n,p in ports if p.startswith('output ')]
              decls=[];conn=[]
              for n,p in ports:
               if n=='rst_n':continue
               if n=='clk':conn.append('.clk(clk)');continue
               pp=p.replace('input ','').replace('output logic ','wire ').replace('output wire ','wire ').replace('output ','wire ')
               decls.append(pp[:-len(n)]+'g_'+n+';');conn.append('.'+n+'(g_'+n+')')
              conn+=['.rst_n_async(rst_n_async)','.core_ready(g_core_ready)','.checkpoint_begin_ready()','.checkpoint_begin_accepted()','.checkpoint_word_accepted()']
              check='\n'.join(f'if(dut.u_fpga.{n}!==g_{n})$fatal(1,"core output {n} cells=%0d clock=%0d",CELLS,clocks);' for n,p in outs)
              snap=['request_accept','request_reject','accepted_cell_mask','neutral_routed_cell_mask','accepted_change_mask','accepted_changes','capacity_remaining','capacity_exhausted','switch_load_numerator','requested_direct_events','prevented_direct_events','neutral_routed_events','actual_direct_events','reserved_state_events','queue_overflow_events','invariant_flags','target_capture_accepted','target_capture_rejected','normalized_cycle_cost_q16','execution_target_bank']
              snapdecl='\n'.join('logic [159:0] s_'+n+';' for n in snap)+ '\nlogic [159:0] s_phase_requests,s_execution_requests;'
              save='\n'.join('s_'+n+'=160\'(g_'+n+');' for n in snap)+"\ns_phase_requests=160'({g_phase_request_target,g_phase_request_cell_index,g_phase_request_valid});\ns_execution_requests=160'({g_execution_request_target,g_execution_request_cell_index,g_execution_request_valid});"
              clear='\n'.join('s_'+n+'=0;' for n in snap)+"\ns_invariant_flags=160'((1<<FRP_M31_INVARIANT_FLAGS)-1);s_phase_requests=0;s_execution_requests=0;"
              # Register expectations are independent of the CSR implementation's case tables.
              common={4:"32'(g_scheduler_mode)",8:'lane',12:"32'(g_external_request_cell_index[lane*IDX+:IDX])",16:"32'(g_external_request_target[lane*2+:2])",20:"32'(g_external_request_valid[lane])",24:'cell_index',32:"32'(g_scheduler_mode_q)",36:"32'(g_scheduler_state_q)",40:'g_ticks_recorded_q',44:"32'(s_request_accept)",48:"32'(s_request_reject)",52:"32'(g_state_out[cell_index*2+:2])",56:"32'(g_pending_route_out[cell_index*2+:2])"}
              for a,n in zip(range(60,104,4),['accepted_changes','capacity_remaining','capacity_exhausted','switch_load_numerator','invariant_flags','requested_direct_events','prevented_direct_events','neutral_routed_events','actual_direct_events','reserved_state_events','queue_overflow_events']):common[a]=f"32'(s_{n})"
              base={0x68:"32'(g_auto_target_enable)",0x6c:'g_phase_load[cell_index*32+:32]',0x70:'g_frequency_load_q16[cell_index*32+:32]',0x74:'g_phase_gamma_effective_word[cell_index*32+:32]',0x78:'g_phase_thermal_node_factor_q30[cell_index*32+:32]',0x7c:'g_phase_word_q[cell_index*32+:32]',0x80:'g_frequency_current_q16[cell_index*32+:32]',0x84:'g_coupling_field_q16[cell_index*32+:32]',0x88:'g_phase_projection_q30[cell_index*32+:32]',0x8c:"32'(g_phase_target_source[cell_index*2+:2])",0x90:"32'(g_registered_target_q[cell_index*2+:2])",0x94:"{26'd0,s_target_capture_rejected[0],s_target_capture_accepted[0],g_registered_request_enable,g_registered_target_domain_valid,g_phase_target_domain_valid,g_registered_target_valid_q}",0x98:'g_accepted_target_capture_events_q',0x9c:'g_rejected_target_capture_events_q'}
              for a,n in zip(range(0xa0,0xc4,4),['scheduler_count_free_q','scheduler_count_balance_q','scheduler_count_commit_q','scheduler_count_excite_q','scheduler_count_neutralize_q','pair_coherence_q30','cluster_coherence_q30','global_coherence_q30','organization_dispersion_q30']):base[a]='g_'+n
              base[0xc4]="32'(s_normalized_cycle_cost_q16)"
              for a,n in zip(range(0xc8,0xe4,4),['temperature_proxy_q16','peak_temperature_proxy_q16','thermal_sample_count_q','coherence_capacity_q16','pressure_q16','stability_margin_q16','stable']):base[a]="32'(g_"+n+")"
              for a,n in zip(range(0xe4,0xfc,4),['accepted_cell_mask','neutral_routed_cell_mask','accepted_change_mask','phase_requests','execution_requests','execution_target_bank']):base[a]='window(s_'+n+')'
              local={0x68:'3'}
              for a,n in zip(range(0x70,0xc8,4),['local_gamma_noise_target_q16','local_gamma_noise_state_q16','local_gamma_drift_word','local_gamma_effective_word','phase_gamma_effective_word','local_heat_q16','local_heat_peak_q16','local_generated_power_q16','local_thermal_dissipation_q16','local_thermal_diffusion_q16','local_thermal_overload_q16','local_thermal_node_factor_q30','local_frequency_lag_q16','local_mean_heat_q16','local_mean_heat_peak_q16','local_maximum_heat_peak_q16','local_next_heat_q16','local_next_overload_q16','local_next_gamma_drift_word','local_next_gamma_effective_word','local_next_thermal_node_factor_q30','phase_thermal_node_factor_q30']):local[a]='g_'+n+('' if a in [0xa4,0xa8,0xac] else '[cell_index*32+:32]')
              stability={}
