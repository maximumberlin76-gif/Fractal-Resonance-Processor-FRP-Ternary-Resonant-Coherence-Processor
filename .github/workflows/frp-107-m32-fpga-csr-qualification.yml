          PYTHON
          python "$FRP107_EVIDENCE/qualify.py"

      - name: Publish readable summary
        if: ${{ always() }}
        run: |
          set -euo pipefail
          if test -s "$FRP107_EVIDENCE/summary.md"; then
            cat "$FRP107_EVIDENCE/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' '# FRP 107 — NOT COMPLETED' \
              'Inspect the failed step and the evidence bundle.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the single evidence artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: frp-107-fpga-csr-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.FRP107_EVIDENCE }}/
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
