              for k,v in [('DECLS','\n'.join(decls)),('SNAPDECL',snapdecl),('CONNECTIONS',',\n'.join(conn)),('CHECK',check),('CLEAR',clear),('SAVE',save),('EXPECT',expect)]:tb=tb.replace(k,v)
