name: 32 - FRP M31 Thermal Stability Contract RTL + Netlist Formal

run-name: "32 - FRP M31 Thermal Stability Contract | 8 proofs @ ${{ github.sha }}"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frp-32-m31-thermal-stability-contract-formal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify-thermal-stability-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      LC_ALL: C.UTF-8
      TZ: UTC
      PYTHONHASHSEED: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Initialize evidence paths
        run: |
          set -euo pipefail
          printf '%s\n' "M31_THERMAL_STABILITY_EVIDENCE=$RUNNER_TEMP/frp-m31-thermal-stability-contract-evidence" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/frp-m31-thermal-stability-contract-evidence"

      - name: Check out the dispatched commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install the pinned formal tool
        timeout-minutes: 10
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          {
            python --version
            python -m pip install --disable-pip-version-check --only-binary=:all: \
              --timeout 30 --retries 3 yowasp-yosys==0.68.0.0.post1208
            python -m pip freeze
          } 2>&1 | tee "$M31_THERMAL_STABILITY_EVIDENCE/toolchain.log"

      - name: Prove both contracts and check witnesses and negative controls
        run: |
          set -euo pipefail
          ulimit -c 0
          python - <<'PY'
          from pathlib import Path
          import hashlib, importlib.metadata, json, os, re, shutil, subprocess, sys, time
          import yowasp_yosys
          repo = Path.cwd().resolve()
          evidence = Path(os.environ['M31_THERMAL_STABILITY_EVIDENCE']).resolve()
          evidence.mkdir(parents=True, exist_ok=True)
          view = evidence / 'inputs'
          workflow = '.github/workflows/frp-32-m31-thermal-stability-contract-formal.yml'
          harness = 'formal/m31/frp_m31_thermal_stability_contract_formal.sv'
          macro = 'FRP_M31_THERMAL_STABILITY_CONTRACT_NETLIST'
          report = {'status': 'FAIL', 'repository': os.environ['GITHUB_REPOSITORY'], 'source_commit': os.environ['GITHUB_SHA'], 'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'scope': 'Independent thermal and eight-cell stability contracts on RTL and fresh netlists', 'public_output_bits': 193, 'source_assertions': 9, 'input_domain': 'All signed 32-bit inputs; thermal initial sampled reset only', 'proof_method': 'Thermal reset base and temporal induction; stability combinational SAT', 'contracts_proven': False, 'full_core_proof': False, 'global_coverage_closure': False, 'physical_timing': False, 'physical_temperature_model': False, 'python_model_equivalence': False, 'commands': [], 'proofs': [], 'witnesses': [], 'negatives': [], 'sources': {}, 'netlists': {}, 'models': {}}
          immutable = {}
          expected_sources = {'formal/m31/frp_m31_thermal_stability_contract_formal.sv': {'bytes': 11259, 'sha256': 'fea4f63f66d6ecef4b0dbe3c1d742860f08ac98e019cc1901fd40821bb713033'}, 'rtl/m31/frp_m31_fixed_point_pkg.sv': {'bytes': 7278, 'sha256': '6b2afb8d1583c93d95d2386ba25dd1eaef6bb5bd9a4e1c9e9abff1dd004cbf24'}, 'rtl/m31/frp_m31_thermal_proxy.sv': {'bytes': 1883, 'sha256': '34df4ebfc5dfad8e3e5e454e560404585de5c881e6f75abaae367d3bd9fb11bd'}, 'rtl/m31/frp_m31_stability.sv': {'bytes': 2203, 'sha256': '69c06833e6dfbb28e25b74a5787dcd03756dddf0f66726de3ea47c1ad2931931'}}
          expected_netlists = {'thermal': {'bytes': 10670, 'sha256': 'cfdef894b60e7c5b31cdf35ff66032f54806c1be51bccbb5b4f6baf4093a5865'}, 'stability': {'bytes': 21734, 'sha256': '942152a70f9501931a4dc127fedb4b214cd506d8be123250db28da2b34a5e5e2'}}
          profiles = {'thermal': dict(core='frp_m31_thermal_proxy', inputs=dict(clk=1, rst_n=1, tick_enable=1, clear=1, normalized_cycle_cost_q16=32), outputs=dict(temperature_proxy_q16=32, peak_temperature_proxy_q16=32, sample_count_q=32), reach=16, asserts={'a_temperature', 'a_peak', 'a_count', 'a_peak_nonnegative', 'a_peak_dominates'}), 'stability': dict(core='frp_m31_stability', inputs=dict(retained_state=16, global_coherence_q30=32, cluster_coherence_q30=32, temperature_proxy_q16=32, switch_load_q16=32), outputs=dict(coherence_capacity_q16=32, pressure_q16=32, stability_margin_q16=32, stable=1), reach=20, asserts={'a_capacity', 'a_pressure', 'a_margin', 'a_stable'})}

          def require(ok, msg):
              if not ok:
                  raise RuntimeError(msg)

          def ident(p):
              raw = p.read_bytes()
              return dict(bytes=len(raw), sha256=hashlib.sha256(raw).hexdigest())

          def save(n, obj):
              (evidence / n).write_text(json.dumps(obj, indent=2, sort_keys=True) + '\n')

          def q(p):
              return json.dumps(str(p))

          def freeze(*paths):
              for path in paths:
                  value = ident(path)
                  require(path not in immutable or immutable[path] == value, 'Evidence changed: ' + str(path))
                  immutable[path] = value

          def run(label, script, cwd=view, negative=False):
              ys, log = (evidence / (label + '.ys'), evidence / (label + '.log'))
              ys.write_text(script + '\n')
              t = time.monotonic()
              print('START', label, flush=True)
              entry = dict(label=label, script=ident(ys))
              report['commands'].append(entry)
              try:
                  z = subprocess.run(['yowasp-yosys', '-Q', '-T', '-s', str(ys)], cwd=cwd, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=180)
                  log.write_bytes(z.stdout)
                  entry['returncode'] = z.returncode
              except subprocess.TimeoutExpired as ex:
                  log.write_bytes(ex.stdout or b'')
                  entry['timeout'] = 180
                  raise
              finally:
                  entry['seconds'] = round(time.monotonic() - t, 2)
                  if log.exists():
                      entry['log'] = ident(log)
                  save('commands.json', report['commands'])
              text = log.read_text()
              require('TIMEOUT' not in text.upper(), label + ': timeout')
              if negative:
                  require(z.returncode != 0 and 'SAT proof finished - model found: FAIL!' in text, label + ': not a property rejection')
              else:
                  require(z.returncode == 0, label + ': ' + text[-1800:])
              freeze(ys, log)
              print('DONE', label, entry['seconds'], flush=True)
              return text

          def ports(m):
              return {k: (v['direction'], len(v['bits'])) for k, v in m['ports'].items()}

          def synth(b, label, directory=view):
              p = profiles[b]
              core = p['core']
              net = evidence / (label + '.v')
              meta = evidence / (label + '-netlist.json')
              front = evidence / (label + '-synthesis-frontend.json')
              run(label + '-synthesis', f'read_slang -j 1 --std 1800-2017 --top {core} ' + ('-G CELLS=8 ' if b == 'stability' else '') + f'-Irtl/m31 rtl/m31/{core}.sv; write_json {q(front)}; synth -top {core} -flatten -noshare -run begin:fine; check -assert; techmap -map +/techmap.v t:$shiftx; opt_clean; check -assert; select -assert-none t:$shiftx t:$connect; rename {core} {core}_netlist; write_verilog -noattr {q(net)}; write_json {q(meta)}', cwd=directory)
              mods = json.loads(meta.read_text())['modules']
              require(set(mods) == {core + '_netlist'}, 'Netlist modules')
              m = mods[core + '_netlist']
              require(ports(m) == ports(json.loads(front.read_text())['modules'][core]) == {**{k: ('input', v) for k, v in p['inputs'].items()}, **{k: ('output', v) for k, v in p['outputs'].items()}}, 'Core ports')
              require(not m.get('processes') and (not any(('latch' in c['type'].lower() for c in m['cells'].values()))), 'Process/latch')
              state = {v for c in m['cells'].values() if 'dff' in c['type'].lower() for v in c['connections']['Q']}
              require(len(state) == (96 if b == 'thermal' else 0), 'State width')
              freeze(net, meta, front)
              return net

          def prepare(b, label, net=None, directory=view):
              p = profiles[b]
              top = f'frp_m31_{b}_contract_formal'
              model = evidence / (label + '.il')
              front = evidence / (label + '-frontend.json')
              run(label + '-prepare', (f'read_verilog -icells {q(net)}; ' if net else '') + f'read_slang -j 1 --std 1800-2017 ' + (f'-D {macro} ' if net else '') + f'--top {top} -Irtl/m31 {harness}; proc; write_json {q(front)}; prep -top {top} -flatten; memory_map; async2sync; opt -full; wreduce; opt_clean; chformal -lower; alumacc; opt -full; opt_clean; write_rtlil {q(model)}', cwd=directory)
              m = json.loads(front.read_text())['modules'][top]
              bits = sum(p['outputs'].values())
              require(ports(m) == {**{k: ('input', v) for k, v in p['inputs'].items()}, 'observed_outputs': ('output', bits), 'expected_outputs': ('output', bits), 'mismatch': ('output', len(p['outputs'])), 'reach': ('output', p['reach'])}, 'Harness ports')
              checks = [(n, c['parameters']['FLAVOR']) for n, c in m['cells'].items() if c['type'] == '$check']
              require({n for n, f in checks if f == 'assert'} == p['asserts'] and sum((f == 'assume' for n, f in checks)) == int(b == 'thermal'), 'Source property inventory')
              count = {k: len(re.findall('^  cell [$]' + k + ' ', model.read_text(), re.M)) for k in ['assert', 'assume']}
              require(count == {'assert': len(p['asserts']), 'assume': int(b == 'thermal')}, 'Prepared property inventory ' + str(count))
              freeze(model, front)
              return model

          def prove(b, label, model):
              opts = '-seq 2 -tempinduct -maxsteps 3 -set-assumes ' if b == 'thermal' else ''
              text = run(label, f'read_rtlil {q(model)}; sat {opts}-prove-asserts -verify -timeout 120')
              require('Base case for induction length 1 proven.' in text and 'Induction step proven: SUCCESS!' in text if b == 'thermal' else 'SAT proof finished - no model found: SUCCESS!' in text, 'Incomplete proof ' + label)
              report['proofs'].append(dict(label=label, status='PASS', method='reset base plus temporal induction' if b == 'thermal' else 'unrestricted combinational SAT'))
              save('proofs.json', report['proofs'])
          mask = (1 << 32) - 1

          def signed(v):
              return v - (1 << 32) if v & 1 << 31 else v

          def clip(v):
              return min((1 << 31) - 1, max(-(1 << 31), v))

          def rnd(v):
              a, r = divmod(abs(v), 1 << 30)
              a += int(2 * r >= 1 << 30)
              return -a if v < 0 else a

          def pack(b, a):
              v = 0
              for val, bits in zip(a, profiles[b]['outputs'].values()):
                  v = v << bits | val & (1 << bits) - 1
              return v

          def unpack(b, v):
              left = sum(profiles[b]['outputs'].values())
              a = []
              for bits in profiles[b]['outputs'].values():
                  left -= bits
                  a.append(v >> left & (1 << bits) - 1)
              return a

          def decode(path, b):
              p = profiles[b]
              total = sum(p['outputs'].values())
              widths = {**p['inputs'], 'observed_outputs': total, 'expected_outputs': total, 'mismatch': len(p['outputs']), 'reach': p['reach']}
              signals = json.loads(path.read_text())['signal']
              require(len({s['name'] for s in signals}) == len(signals), 'Duplicate signals')
              result = {}
              for s in signals:
                  name = s['name']
                  if name not in widths:
                      require(b == 'thermal' and (name in ('previous', 'previous_tick', 'previous_reset', 'previous_cost', 'previous_clear', 'previous [95:64]', 'previous [63:32]', 'previous [31:0]', 'history_valid') or re.fullmatch('\\$auto\\$async2sync.cc:[0-9]+:execute\\$[0-9]+', name)) and (s['wave'][1:] == '444444'), 'Unexpected auxiliary signal ' + name)
                      continue
                  bits = widths[name]
                  if b == 'stability':
                      data = s.get('data', [])
                      if bits == 1:
                          require(s['wave'] in ('04', '14') and (not data), 'Scalar format')
                          v = s['wave'][0]
                      else:
                          require(s['wave'] == '=4' and len(data) == 2 and (data[1] == ''), 'Vector format')
                          v = data[0]
                      require(re.fullmatch('[01]{' + str(bits) + '}', v), 'Undefined port')
                      result[name] = [int(v, 2)]
                  else:
                      data = iter(s.get('data', []))
                      values = []
                      v = None
                      for i, c in enumerate(s['wave']):
                          if c in '4=':
                              if 'data' in s:
                                  v = next(data)
                              else:
                                  require(bits == 1 and i == 0 and (c == '4'), 'Scalar initial encoding')
                                  v = None
                          elif c in '01':
                              require(bits == 1, 'Scalar vector')
                              v = c
                          else:
                              require(c == '.', 'Bad waveform')
                          values.append(v)
                      require(len(values) == 7 and all((re.fullmatch('[01]{' + str(bits) + '}', v or '') for v in values[1:])), 'Undefined sampled port ' + name)
                      result[name] = [None] + [int(v, 2) for v in values[1:]]
              require(set(result) == set(widths), 'Missing ports')
              return result

          def comb(w):
              n = sum((w['retained_state'] >> 2 * i & 3 == 0 for i in range(8)))
              g = rnd(22282 * signed(w['global_coherence_q30']))
              c = rnd(10486 * signed(w['cluster_coherence_q30']))
              cap = clip(53740 + clip(g) + clip(c) + rnd(5243 * n * (1 << 27)))
              wp = signed(w['temperature_proxy_q16']) + signed(w['switch_load_q16'])
              p = clip(wp)
              wm = cap - p
              m = signed(wm & mask)
              a = [cap, p, m, int(m > 0)]
              actual = unpack('stability', w['observed_outputs'])
              flag = actual[3]
              predicates = [n == i for i in range(9)] + [wp > (1 << 31) - 1, wp < -(1 << 31), wm > (1 << 31) - 1 and m < 0 and (not flag), m == 0 and (not flag), m == 1 and flag, m == -1 and (not flag), w['retained_state'] == 43690 and n == 0, w['global_coherence_q30'] == 2147483648 and w['cluster_coherence_q30'] == 2147483647, w['global_coherence_q30'] == 2147483647 and w['cluster_coherence_q30'] == 2147483648, signed(w['global_coherence_q30']) == 268435456 and g == 5571, signed(w['global_coherence_q30']) == -268435456 and g == -5571]
              return (a, sum((int(bool(v)) << i for i, v in enumerate(predicates))))

          def thermal(w, prev):
              before = unpack('thermal', prev['observed_outputs'])
              pt, pp, pc = (signed(before[0]), signed(before[1]), before[2])
              cost = signed(prev['normalized_cycle_cost_q16'])
              if not w['rst_n'] or not prev['rst_n'] or prev['clear']:
                  a = [0, 0, 0]
              elif prev['tick_enable']:
                  t = clip(clip(rnd(pt * 1020054733)) + clip(rnd(cost * 10737418)))
                  a = [t, max(pp, t), pc + 1 & mask]
              else:
                  a = before
              actual = unpack('thermal', w['observed_outputs'])
              t, peak, count = (signed(actual[0]), signed(actual[1]), actual[2])
              r = [False] * 16
              if prev['rst_n'] and w['rst_n']:
                  if prev['tick_enable'] and (not prev['clear']):
                      r[0] = pt == 0 and cost > 0 and (t > 0)
                      r[1] = pt == 0 and cost < 0 and (t < 0) and (peak == 0)
                      r[2] = pp > 0 and t < pt and (peak == pp)
                      r[3] = peak > pp
                      r[8] = cost == (1 << 31) - 1 and t > 0
                      r[9] = cost == -(1 << 31) and t < 0
                      r[10] = cost == 0 and pt > 0 and (t < pt)
                      r[11] = cost == 0 and pt < 0 and (t > pt)
                      for i, c, v in [(12, 50, 0), (13, 51, 1), (14, -50, 0), (15, -51, -1)]:
                          r[i] = pt == 0 and cost == c and (t == v)
                  r[4] = not prev['tick_enable'] and (not prev['clear']) and (pt != 0)
                  r[5] = prev['clear'] and (not prev['tick_enable']) and (pc != 0)
                  r[6] = prev['clear'] and prev['tick_enable'] and (pc != 0) and (cost != 0)
              r[7] = prev['rst_n'] and (not w['rst_n']) and (pc != 0)
              return (a, sum((int(bool(v)) << i for i, v in enumerate(r))))

          def stimulus(bit):
              samples = [dict(rst_n=int(i != 1), tick_enable=0, clear=0, normalized_cycle_cost_q16=0) for i in range(1, 7)]
              if bit in (2, 3, 4, 5, 6, 7, 10, 11):
                  samples[2].update(tick_enable=1, normalized_cycle_cost_q16=(-65536 if bit == 11 else 65536) & mask)
              if bit in (0, 1, 2, 3, 8, 9, 10, 11, 12, 13, 14, 15):
                  samples[4].update(tick_enable=1, normalized_cycle_cost_q16={0: 65536, 1: -65536, 2: 0, 3: 131072, 8: (1 << 31) - 1, 9: -(1 << 31), 10: 0, 11: 0, 12: 50, 13: 51, 14: -50, 15: -51}[bit] & mask)
              if bit in (5, 6):
                  samples[4].update(clear=1, tick_enable=int(bit == 6), normalized_cycle_cost_q16=65536 if bit == 6 else 0)
              if bit == 7:
                  samples[5]['rst_n'] = 0
              return '-set clk 0 ' + ' '.join((f'-set-at {i} {n} ' + (f"32'h{v:08x}" if n == 'normalized_cycle_cost_q16' else str(v)) for i, s in enumerate(samples, 1) for n, v in s.items()))

          def inspect(path, b, negative=None):
              waves = decode(path, b)
              seen = 0
              for i in range(2, 7) if b == 'thermal' else [0]:
                  w = {n: a[i] for n, a in waves.items()}
                  a, r = thermal(w, {n: a[i - 1] for n, a in waves.items()}) if b == 'thermal' else comb(w)
                  exp = pack(b, a)
                  require(w['expected_outputs'] == exp, 'Checker oracle differs ' + str(path))
                  require(w['reach'] == r, 'Reach differs ' + str(path))
                  obs = unpack(b, w['observed_outputs'])
                  expwords = unpack(b, exp)
                  m = sum((int(x != y) << j for j, (x, y) in enumerate(zip(obs, expwords))))
                  require(w['mismatch'] == m, 'Mismatch mapping')
                  seen |= m
                  if negative is None:
                      require(m == 0, 'Actual oracle differs')
              if negative is not None:
                  require(seen & 1 << negative, 'Intended fault not detected')
              return waves
          mutations = {'thermal-decay': ('thermal', 0, 'FRP_M31_THERMAL_DECAY_Q30', "32'sd0", 3), 'thermal-peak': ('thermal', 1, 'if (temperature_d > peak_temperature_proxy_q16)', 'if (temperature_d < peak_temperature_proxy_q16)', 3), 'thermal-count': ('thermal', 2, "sample_count_q <= sample_count_q + 32'd1;", "sample_count_q <= sample_count_q + 32'd3;", 3), 'thermal-clear-paused': ('thermal', 0, 'end else if (clear) begin', 'end else if (clear && tick_enable) begin', 5), 'thermal-hold': ('thermal', 0, 'end else if (tick_enable) begin', "end else if (1'b1) begin", 4), 'stability-neutral': ('stability', 0, "== 2'b00)", "== 2'b10)", None), 'stability-round-tie': ('stability', 0, "GLOBAL_GAIN_Q16 = 32'sd22282;", "GLOBAL_GAIN_Q16 = 32'sd22281;", None), 'stability-pressure': ('stability', 1, 'pressure_q16 = frp_m31_sat_s32(pressure_sum);', 'pressure_q16 = pressure_sum[31:0];', None), 'stability-margin': ('stability', 2, 'stability_margin_q16 = coherence_capacity_q16 - pressure_q16;', 'stability_margin_q16 = coherence_capacity_q16 + pressure_q16;', None), 'stability-zero': ('stability', 3, 'stable = stability_margin_q16 > 0;', 'stable = stability_margin_q16 >= 0;', None)}
          try:
              require(os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch', 'Manual dispatch only')
              require(os.environ['GITHUB_REF'] == 'refs/heads/main', 'Select main for this workflow')
              require(subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == report['source_commit'], 'Checkout commit mismatch')
              require(not view.exists() and (not evidence.is_relative_to(repo)), 'Fresh external evidence directory required')
              workflow_identity = ident(repo / workflow)
              shutil.copyfile(repo / workflow, evidence / Path(workflow).name)
              report['workflow'] = workflow_identity
              sources = {}

              def visit(name):
                  if name in sources:
                      return
                  path = repo / name
                  require(path.is_file() and (not path.is_symlink()), 'Missing or linked source: ' + name)
                  sources[name] = ident(path)
                  destination = view / name
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(path, destination)
                  freeze(destination)
                  for include in re.findall('`include\\s+"([^"]+)"', path.read_text()):
                      candidates = {p.resolve() for p in [path.parent / include, repo / 'rtl/m31' / include] if p.is_file()}
                      require(len(candidates) == 1, 'Ambiguous include: ' + include)
                      visit(candidates.pop().relative_to(repo).as_posix())
              visit(harness)
              report['sources'] = sources
              save('source-identities.json', sources)
              require(sources == expected_sources, 'Thermal/stability contract sources differ from validated inputs')
              require(not subprocess.check_output(['git', 'status', '--porcelain'], text=True), 'Checkout is not clean')
              require(sys.version_info[:2] == (3, 12), 'Python 3.12 required')
              require(importlib.metadata.version('yowasp-yosys') == '0.68.0.0.post1208', 'Yosys package changed')
              wasm = ident(Path(yowasp_yosys.__file__).parent / 'yosys.wasm')
              require(wasm['sha256'] == 'e37a7e65e3fa4efbbd64a9c1b0e906be16cdc6c4d5273109d17537f78449f38c', 'Yosys WASM changed')
              report['toolchain'] = {'python': sys.version, 'yowasp_yosys': importlib.metadata.version('yowasp-yosys'), 'wasm': wasm}
              save('toolchain.json', report['toolchain'])
              for b, p in profiles.items():
                  net = synth(b, b + '-netlist')
                  report['netlists'][b] = ident(net)
                  require(ident(net) == expected_netlists[b], 'Fresh netlist identity changed: ' + b)
                  for impl, netarg in [('rtl', None), ('netlist', net)]:
                      label = b + '-' + impl
                      model = prepare(b, label, netarg)
                      report['models'][label] = ident(model)
                      for repeat in [1, 2]:
                          prove(b, label + f'-proof-{repeat}', model)
                      for bit in range(p['reach']):
                          label2 = label + f'-reach-{bit:02d}'
                          path = evidence / (label2 + '.json')
                          opts = f'-seq 6 -set-assumes {stimulus(bit)} -set-at 6 reach[{bit}] 1' if b == 'thermal' else f'-set reach[{bit}] 1'
                          text = run(label2, f'read_rtlil {q(model)}; sat {opts} -show-ports -timeout 60 -dump_json {q(path)}')
                          require('SAT solving finished - model found:' in text, 'No witness')
                          waves = inspect(path, b)
                          require(waves['reach'][6 if b == 'thermal' else 0] & 1 << bit, 'Wrong target')
                          freeze(path)
                          report['witnesses'].append(dict(profile=b, implementation=impl, bit=bit, identity=ident(path), oracle='PASS'))
                          save('witnesses.json', report['witnesses'])
              for name, (b, bit, old, new, stim) in mutations.items():
                  directory = evidence / 'mutants' / name
                  shutil.copytree(view, directory)
                  path = directory / f"rtl/m31/{profiles[b]['core']}.sv"
                  raw = path.read_text()
                  require(raw.count(old) == 1, 'Mutation site ' + name)
                  path.write_text(raw.replace(old, new))
                  freeze(*[p for p in directory.rglob('*') if p.is_file()])
                  net = synth(b, name, directory)
                  for impl, netarg in [('rtl', None), ('netlist', net)]:
                      label = name + '-' + impl
                      model = prepare(b, label, netarg, directory)
                      witness = evidence / (label + '-counterexample.json')
                      opts = f'-seq 6 -set-assumes {stimulus(stim)} ' if b == 'thermal' else ''
                      if name == 'stability-round-tie':
                          opts += "-set global_coherence_q30 32'h10000000 "
                      run(label + '-negative', f'read_rtlil {q(model)}; sat {opts}-prove-asserts -verify -show-ports -timeout 60 -dump_json {q(witness)}', negative=True)
                      inspect(witness, b, bit)
                      freeze(witness)
                      report['negatives'].append(dict(fault=name, implementation=impl, status='REJECTED', source=ident(path), netlist=ident(net), counterexample=ident(witness)))
                      save('negatives.json', report['negatives'])
              require(len(report['proofs']) == 8 and len(report['witnesses']) == 72 and (len(report['negatives']) == 20), 'Incomplete checks')
              require({p['label'] for p in report['proofs']} == {b + '-' + i + '-proof-' + str(n) for b in profiles for i in ('rtl', 'netlist') for n in (1, 2)}, 'Proof profiles incomplete')
              require({(w['profile'], w['implementation'], w['bit']) for w in report['witnesses']} == {(b, i, n) for b in profiles for i in ('rtl', 'netlist') for n in range(profiles[b]['reach'])}, 'Witness profiles incomplete')
              require({(n['fault'], n['implementation']) for n in report['negatives']} == {(m, i) for m in mutations for i in ('rtl', 'netlist')}, 'Fault profiles incomplete')
              for name, expected in expected_sources.items():
                  require(ident(repo / name) == ident(view / name) == expected, 'Source changed: ' + name)
              for path, expected in immutable.items():
                  require(ident(path) == expected, 'Evidence changed: ' + str(path))
              save('immutable-evidence.json', {str(p.relative_to(evidence)): v for p, v in immutable.items()})
              require(ident(repo / workflow) == ident(evidence / Path(workflow).name) == workflow_identity, 'Workflow changed')
              require(not subprocess.check_output(['git', 'status', '--porcelain'], text=True), 'Checkout changed')
              report.update(status='PASS', contracts_proven=True, sources_unchanged=True)
              print('FRP M31 independent thermal and stability contracts: PASS', flush=True)
          except Exception as error:
              report.update(status='FAIL', error=str(error))
              raise
          finally:
              save('result.json', report)
              summary = '\n'.join(['# M31 thermal and stability contracts: ' + report['status'], '', 'Commit: `' + report['source_commit'] + '`', '', f"Completed proof runs: {len(report['proofs'])}/8; witnesses: {len(report['witnesses'])}/72; detected faults: {len(report['negatives'])}/20.", '', 'Independent contracts on unchanged RTL and fresh netlists; 193 public output bits, nine assertions per implementation.', 'Thermal: reset base plus temporal induction; only initial sampled reset is assumed.', 'The thermal oracle checks transitions from public state, separate product rounding, peak, hold, clear and full 32-bit counting.', 'Stability: unrestricted combinational inputs, eight-cell profile; capacity, saturated pressure, wrapping margin and strict positive flag.', 'Four proof profiles are each repeated in fresh solvers; bounded witness traces do not replace induction.', 'All 36 witness targets are checked on both RTL and netlist with independent Python arithmetic.', 'Ten isolated source mutations must fail with verified counterexamples on both implementations.', 'Canonical source bytes, tool WASM and fresh netlists are hash-pinned; evidence is checked for changes.', 'Scope excludes integrated-core proof, global coverage closure, physical temperature/timing, four-state behavior and Python reference-model equivalence.', 'Artifacts retain input snapshots, identities, solver scripts/logs, witnesses and counterexamples.', ''])
              (evidence / 'summary.md').write_text(summary)
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
                  stream.write(summary)
          PY

      - name: Retain sources, proofs, witnesses, and counterexamples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frp-32-m31-thermal-stability-contract-formal-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.M31_THERMAL_STABILITY_EVIDENCE }}/
          if-no-files-found: error
          retention-days: 90
