name: FRP M22 Control Status Register Interface

run-name: FRP M22 Preserved Release Qualification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frp-m22-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  qualify-m22:
    name: Qualify preserved M22 and current technical sources
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      M22_RELEASE_COMMIT: 6bb07958710dc942c4deea1e7663ea97017fe3a8
      M21_SOURCE_COMMIT: 759ee446adf028ca135c75ca38388c26e911aa68
      PYTHONHASHSEED: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
      LC_ALL: C.UTF-8
      TZ: UTC

    steps:
      - name: Check out the dispatched commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Require manual execution on main and prepare preserved release
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          git merge-base --is-ancestor "$M22_RELEASE_COMMIT" "$GITHUB_SHA"
          git merge-base --is-ancestor "$M21_SOURCE_COMMIT" "$M22_RELEASE_COMMIT"
          python - <<'PY'
          import os
          import tempfile
          from pathlib import Path

          root = Path(tempfile.mkdtemp(prefix="frp-m22-", dir=os.environ["RUNNER_TEMP"]))
          evidence = root / "evidence"
          evidence.mkdir()
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as stream:
              stream.write(f"M22_RUN_ROOT={root}\n")
              stream.write(f"M22_REPLAY={root / 'release'}\n")
              stream.write(f"M22_EVIDENCE={evidence}\n")
          PY

      - name: Materialize the exact M22 release
        run: |
          set -euo pipefail
          git worktree add --detach "$M22_REPLAY" "$M22_RELEASE_COMMIT"
          test "$(git -C "$M22_REPLAY" rev-parse HEAD)" = "$M22_RELEASE_COMMIT"
          test "$(git -C "$M22_REPLAY" log -1 --format=%H -- artifacts/m21)" = "$M21_SOURCE_COMMIT"

      - name: Verify preserved inputs and current M22 file identities
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath

          current = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          release = Path(os.environ["M22_REPLAY"]).resolve()
          evidence = Path(os.environ["M22_EVIDENCE"])
          workflow = ".github/workflows/frp-m22-control-status-register-interface.yml"
          documents = {"MILESTONES.md", "ROADMAP.md"}
          historical_only = documents | {workflow}
          artifacts = (
              "artifacts/m22/interface/m22-control-status-register-interface.json",
              "artifacts/m22/traces/m22-deterministic-transaction-traces.json",
              "artifacts/m22/manifests/m22-control-status-register-manifest.json",
              "artifacts/m22/manifests/m22-control-status-register-qualification.json",
          )

          def read(root, relative):
              parts = PurePosixPath(relative)
              if parts.is_absolute() or "\\" in relative or any(
                  item in {"", ".", ".."} for item in relative.split("/")
              ):
                  raise SystemExit(f"Unsafe source path: {relative}")
              target = root
              for part in parts.parts:
                  target = target / part
                  if target.is_symlink():
                      raise SystemExit(f"Symlink source rejected: {relative}")
              if not target.is_file():
                  raise SystemExit(f"Missing source: {relative}")
              return target.read_bytes()

          def identity(raw):
              return {"byte_length": len(raw), "raw_sha256": hashlib.sha256(raw).hexdigest()}

          manifest = json.loads(read(release, artifacts[2]))
          if manifest["source_commit"] != os.environ["M21_SOURCE_COMMIT"]:
              raise SystemExit("M22 manifest upstream commit mismatch")
          sources = manifest["sources"]
          paths = [item["path"] for item in sources]
          if len(paths) != 18 or len(set(paths)) != 18 or not historical_only <= set(paths):
              raise SystemExit("M22 source inventory mismatch")
          records = []
          for item in sources:
              relative = item["path"]
              frozen = read(release, relative)
              expected = {key: item[key] for key in ("byte_length", "raw_sha256")}
              if identity(frozen) != expected:
                  raise SystemExit(f"Preserved M22 source mismatch: {relative}")
              present = read(current, relative)
              scope = "historical document or workflow" if relative in historical_only else "current technical source"
              if relative not in historical_only and present != frozen:
                  raise SystemExit(f"Current M22 technical source changed: {relative}")
              records.append({"path": relative, "scope": scope, "preserved": expected, "current": identity(present)})
          for relative in artifacts:
              if read(current, relative) != read(release, relative):
                  raise SystemExit(f"Committed M22 artifact changed: {relative}")
          report = {
              "scope": "Preserved M22 release and current M22 technical source identity",
              "status": "PASS",
              "dispatched_commit": os.environ["GITHUB_SHA"],
              "m22_release_commit": os.environ["M22_RELEASE_COMMIT"],
              "m21_source_commit": os.environ["M21_SOURCE_COMMIT"],
              "preserved_source_count": len(records),
              "current_technical_source_count": len(records) - len(historical_only),
              "committed_artifact_count": len(artifacts),
              "sources": records,
              "current_workflow_sha256": identity(read(current, workflow))["raw_sha256"],
          }
          (evidence / "source-boundary.json").write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")
          print("M22_PRESERVED_SOURCES=18/18 PASS")
          print("M22_CURRENT_TECHNICAL_SOURCES=15/15 PASS")
          print("M22_COMMITTED_ARTIFACT_IDENTITIES=4/4 PASS")
          PY

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install qualification dependencies and record toolchain
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r "$M22_REPLAY/requirements.txt"
          sudo apt-get update
          sudo apt-get install --yes verilator g++ make
          {
            python --version
            verilator --version
            g++ --version
            python -m pip freeze
          } > "$M22_EVIDENCE/toolchain.txt"
          cat "$M22_EVIDENCE/toolchain.txt"

      - name: Independently regenerate and qualify all four M22 artifacts
        run: |
          set -euo pipefail
          cd "$M22_REPLAY"
          for generation in a b; do
            python frp_m22_control_status_register_interface.py \
              --generate --repository-root . \
              --output-root "$M22_RUN_ROOT/generation-$generation" \
              --source-commit "$M21_SOURCE_COMMIT" \
              --output "$M22_EVIDENCE/generation-$generation.json"
          done
          python frp_m22_control_status_register_interface.py \
            --verify --repository-root . --source-commit "$M21_SOURCE_COMMIT" \
            --output "$M22_EVIDENCE/verify.json"
          python frp_m22_control_status_register_interface.py \
            --self-test --repository-root . --source-commit "$M21_SOURCE_COMMIT" \
            --output "$M22_EVIDENCE/self-test.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import frp_m22_control_status_register_interface as m22

          root = Path(os.environ["M22_RUN_ROOT"])
          evidence = Path(os.environ["M22_EVIDENCE"])
          current = Path(os.environ["GITHUB_WORKSPACE"])
          for relative in m22.GENERATED_PATHS:
              a = (root / "generation-a" / relative).read_bytes()
              b = (root / "generation-b" / relative).read_bytes()
              if a != b or a != Path(relative).read_bytes() or a != (current / relative).read_bytes():
                  raise SystemExit(f"M22 artifact reproduction mismatch: {relative}")
              target = evidence / relative
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(a)
          for label in ("generation-a", "generation-b", "verify", "self-test"):
              report = json.loads((evidence / f"{label}.json").read_text())
              if report["status"] != "PASS":
                  raise SystemExit(f"M22 {label} failed")
          record = json.loads(Path(m22.QUALIFICATION_ARTIFACT).read_text())
          traces = json.loads(Path(m22.TRACE_ARTIFACT).read_text())
          interface = json.loads(Path(m22.INTERFACE_ARTIFACT).read_text())
          if (
              record["overall_status"] != "PASS"
              or (record["check_count"], record["passed_count"], record["failed_count"]) != (60, 60, 0)
              or len(record["checks"]) != 60
              or len({check["check_id"] for check in record["checks"]}) != 60
              or any(check["status"] != "PASS" for check in record["checks"])
              or traces["status"] != "PASS"
              or (traces["profile_count"], traces["invalid_access_count"]) != (3, 36)
              or interface["register_count"] != 26
          ):
              raise SystemExit("M22 qualification totals mismatch")
          print("M22_INDEPENDENT_GENERATION=4/4 PASS")
          print("M22_COMMITTED_ARTIFACT_REPRODUCTION=4/4 PASS")
          print("M22_REGISTER_MAP=26/26 PASS")
          print("M22_PARAMETER_PROFILES=3/3 PASS")
          print("M22_INVALID_ACCESSES=36/36 REJECTED")
          print("M22_QUALIFICATION=60/60 PASS")
          PY

      - name: Run all 202 tests from the preserved M22 release
        run: |
          set -euo pipefail
          cd "$M22_REPLAY"
          python - <<'PY'
          import json
          import os
          import unittest
          from pathlib import Path

          for relative in (
              "frp_m22_control_status_register_interface.py",
              "tests/test_frp_m22_control_status_register_interface.py",
          ):
              compile(Path(relative).read_bytes(), relative, "exec")
          loader = unittest.TestLoader()
          focused = loader.discover("tests", pattern="test_frp_m22_control_status_register_interface.py")
          suite = loader.discover("tests", pattern="test*.py")
          if loader.errors or focused.countTestCases() != 36 or suite.countTestCases() != 202:
              raise SystemExit(f"Preserved M22 test inventory mismatch: {loader.errors}")
          evidence = Path(os.environ["M22_EVIDENCE"])
          log = evidence / "unittest.log"
          with log.open("w", encoding="utf-8") as stream:
              result = unittest.TextTestRunner(stream=stream, verbosity=2).run(suite)
          print(log.read_text(), end="")
          passed = result.wasSuccessful() and result.testsRun == 202 and not result.skipped and not result.expectedFailures
          report = {
              "scope": "Complete unittest suite at the preserved M22 release commit",
              "tests_run": result.testsRun,
              "m22_tests_in_suite": focused.countTestCases(),
              "failures": len(result.failures),
              "errors": len(result.errors),
              "skipped": len(result.skipped),
              "expected_failures": len(result.expectedFailures),
              "status": "PASS" if passed else "FAIL",
          }
          (evidence / "unittest.json").write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")
          if not passed:
              raise SystemExit("Preserved M22 release regression failed")
          print("M22_RELEASE_FULL_REGRESSION=202/202 PASS")
          PY

      - name: Lint and execute all three M22 RTL parameter profiles
        run: |
          set -euo pipefail
          cd "$M22_REPLAY"
          verilator --sv --lint-only --timing --assert --Wno-TIMESCALEMOD \
            --top-module frp_m22_control_status_register_interface_tb \
            -Irtl/m16 -Irtl/m22 \
            rtl/m22/frp_m22_control_status_register_interface_tb.sv \
            2>&1 | tee "$M22_EVIDENCE/rtl-lint.log"
          for cells in 8 16 32; do
            verilator --sv --timing --assert --binary \
              --Wno-TIMESCALEMOD \
              --top-module frp_m22_control_status_register_interface_tb \
              "-GCELLS=$cells" -Irtl/m16 -Irtl/m22 \
              --Mdir "$M22_RUN_ROOT/obj-$cells" \
              rtl/m22/frp_m22_control_status_register_interface_tb.sv \
              > "$M22_EVIDENCE/rtl-build-$cells.log" 2>&1 || {
                cat "$M22_EVIDENCE/rtl-build-$cells.log"
                exit 1
              }
            "$M22_RUN_ROOT/obj-$cells/Vfrp_m22_control_status_register_interface_tb" \
              2>&1 | tee "$M22_EVIDENCE/rtl-$cells.log"
          done
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = Path(os.environ["M22_EVIDENCE"])
          profiles = []
          for cells, lanes, transactions in ((8, 2, 115), (16, 4, 129), (32, 8, 157)):
              lines = (evidence / f"rtl-{cells}.log").read_text().splitlines()
              required = (
                  f"CELLS={cells} REQUEST_LANES={lanes}",
                  f"M22_INTERFACE_TRANSACTIONS={transactions}",
                  "M22_INVALID_ACCESSES=12",
                  "actual_direct_events=0",
                  "reserved_state_events=0",
                  "queue_overflow_events=0",
                  "invariant_flags=1111111111",
                  "M22_CSR_TESTBENCH=PASS",
              )
              if any(lines.count(marker) != 1 for marker in required):
                  raise SystemExit(f"M22 RTL marker mismatch for {cells}/{lanes}")
              profiles.append({"cells": cells, "request_lanes": lanes, "transactions": transactions, "status": "PASS"})
              print(f"M22_RTL_PROFILE={cells}/{lanes} PASS")
          (evidence / "rtl-profiles.json").write_text(json.dumps({"status": "PASS", "profiles": profiles}, indent=2) + "\n", encoding="utf-8")
          print("M22_RTL_LINT=PASS")
          PY

      - name: Confirm clean repositories and publish qualification summary
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=all)"
          test -z "$(git -C "$M22_REPLAY" status --porcelain --untracked-files=all)"
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          evidence = Path(os.environ["M22_EVIDENCE"])
          checksums = []
          for path in sorted(evidence.rglob("*")):
              if path.is_file():
                  checksums.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.relative_to(evidence).as_posix()}")
          (evidence / "SHA256SUMS").write_text("\n".join(checksums) + "\n", encoding="utf-8")
          lines = [
              "## M22 preserved release qualification: PASS",
              "",
              f"Dispatched commit: {os.environ['GITHUB_SHA']}",
              f"Preserved M22 release: {os.environ['M22_RELEASE_COMMIT']}",
              f"M21 source commit: {os.environ['M21_SOURCE_COMMIT']}",
              "",
              "| Check | Result |",
              "|---|---|",
              "| Preserved manifest source identities | 18/18 PASS |",
              "| Current M22 technical source identities | 15/15 PASS |",
              "| Independently reproduced committed artifacts | 4/4 PASS |",
              "| Register map | 26/26 PASS |",
              "| Invalid accesses rejected | 36/36 PASS |",
              "| Qualification checks | 60/60 PASS |",
              "| Complete M22 release unittest suite | 202/202 PASS |",
              "| RTL lint and profiles 8/2, 16/4, 32/8 | PASS |",
              "| Current and preserved worktrees | CLEAN |",
              "",
              "The historical documents and original creation workflow are read from the pinned M22 release.",
              "Current technical inputs and committed M22 artifacts must still match that release byte for byte.",
              "This run qualifies the M22 boundary; it does not claim a new M32 synthesis or FPGA implementation result.",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as stream:
              stream.write("\n".join(lines) + "\n")
          PY

      - name: Upload M22 qualification evidence
        if: ${{ always() && env.M22_EVIDENCE != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: frp-m22-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.M22_EVIDENCE }}
          if-no-files-found: error
          retention-days: 30

      - name: Remove the temporary preserved worktree
        if: ${{ always() && env.M22_REPLAY != '' }}
        run: |
          set -euo pipefail
          if test -f "$M22_REPLAY/.git"; then
            git worktree remove "$M22_REPLAY"
          fi
