name: 123 - FRP M31 Execution Scaling Qualification
run-name: '123 - FRP Execution Scaling | 2 suites, 40 executions, 6 mutations @ ${{ github.sha }}'
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install simulator
        run: |
          set -euo pipefail
          mkdir -p bundle
          python -m pip install 'verilator==5.48.0'
          { python --version; verilator-cli --version; g++ --version; make --version; } > bundle/toolchain.txt
      - name: Qualify address embedding and service width
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          python -u - <<'PY'
          import hashlib, json, os, re, shlex, shutil, subprocess, tempfile, zipfile
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor

          root = Path.cwd()
          rtl = root / 'rtl/m31'
          out = root / 'bundle'
          out.mkdir(exist_ok=True)
          profiles = (8, 9, 16, 32, 64)
          workflow = '.github/workflows/frp-123-m31-execution-scaling-qualification.yml'
          suites = {
              'embedding': ('frp_m31_execution_embedding_tb', 'EXECUTION_EMBEDDING'),
              'width': ('frp_m31_execution_service_width_tb', 'EXECUTION_SERVICE_WIDTH'),
          }
          hashes = {
              'frp_m31_execution_embedding_tb': '62b42ae187cd895ff24bfc0613888bae98c444c91d5041a07f11bc3e0e9a7b82',
              'frp_m31_execution_service_width_tb': '3466580c34e3c8f981dd902f7629f5a25f21eef073e60f2a9c05a93f19ccefe5',
              'frp_m31_execution_core': 'e516a5cd378bd2ddecdadc5abb13ddef26c63fafe5bda65b47a6bd859ca66f92',
              'frp_m31_pkg': '762302f1c7a7f7f40cb029f5ada6a111fc8c3e3f6be9920e9b2401b95e179c94',
              'frp_m31_scheduler': 'fc9de24b41736e5c5a9f9e464318c80adbfda9dc8cc4362c0c55bfed403bf97f',
              'frp_m31_request_lanes': '32f75cc70df5dba3f4fbb511397be9a5921236c2afd16cfeb1350eca3f6e8109',
              'frp_m31_pending_routes': '18889d85e78b23b844f1db4c46a35a6b7d01e609e3f1f0e6263a39a6c5729411',
              'frp_m31_active_neutral': '765429b33df3f843626bdc411ad8371fd963738a58ab10201abef75dcdafcaf0',
              'frp_m31_capacity_guard': 'd0587897f955ce49923aca807b5d3e0c637383c88e5d5e0dfa8405f47917c123',
              'frp_m31_state_update': 'ebad1f7ee952a577239445d33d99cae799afaaff5c181c7162514bbcea6eab90',
          }
          # Each digest covers the two full reference records in seed order 0, 76.
          golden = {
              'embedding': (
                  '2b1a3afe2d4f3a65f0d2f3478257a94781e4dc00d05b863609a54ec89ed18d69',
                  'ac4f175fdec05644a077935ff7211c5160098965edc1c56b81ac53be88775dd3',
                  '54a709bb2b75e5486234aba79cf408392c3eb25b9661a58a54c64d8ac46fafe8',
                  '9fa720ad888cd590886dc433eaa3e6b1278236ef01084ca76108aa8a42a08f1e',
                  'd35f976a8adb374d25926d9d4aa7cf6e14873eba0f3f7cf1aabb85e9710638f9',
              ),
              'width': (
                  '5ec74d02af3979987deae7eee82fb215c05c966a46ba60a2fa97947d1d5d1873',
                  '2b03bf2eeace885e228f1fa65940f83a547c1a4d648d1f8aedd2ec5426fcee83',
                  '13e8fc2426b172e9438c4e56996766dac48029865b96a0107d5e912a40c733da',
                  '2f33e6e0db1d5d3410da6a098f1373787f696ea21fc30b5423c7fac9e3320f55',
                  '90e38ea23e4b22d21733386c6164824d227b79daff30b0a01be0481b7262f0ac',
              ),
          }
          mutations = (
              ('physical_budget', 'embedding', 'frp_m31_capacity_guard',
               'REQUEST_LANES[COUNTER_BITS - 1:0];',
               "COUNTER_BITS'(frp_calc_request_lanes(CELLS));", 'EMBEDDING capacity/domain'),
              ('alias_address', 'embedding', 'frp_m31_request_lanes',
               "int'(lane_index_w[lane_index]);",
               "int'(lane_index_w[lane_index]) & ((1 << (CELL_INDEX_BITS-1))-1);", 'EMBEDDING projection'),
              ('omit_last_pending', 'embedding', 'frp_m31_capacity_guard',
               'element_index < CELLS;\n            element_index = element_index + 1',
               'element_index < CELLS-1;\n            element_index = element_index + 1', 'EMBEDDING service rank'),
              ('early_retire', 'width', 'frp_m31_execution_core',
               'assign pending_completion_accept_mask =\n    capacity_accept_mask\n    & pending_completion_candidate;',
               'assign pending_completion_accept_mask = pending_completion_candidate;', 'SERVICE_WIDTH capacity or invariant'),
              ('reverse_rank', 'width', 'frp_m31_capacity_guard',
               'int element_index = 0;\n            element_index < CELLS;\n            element_index = element_index + 1',
               'int element_index = CELLS-1;\n            element_index >= 0;\n            element_index = element_index - 1', 'SERVICE_WIDTH rank or ownership'),
              ('deny_on_full', 'width', 'frp_m31_execution_core',
               'assign request_accept = request_accept_capacity;',
               "assign request_accept = capacity_exhausted ? '0 : request_accept_capacity;", 'SERVICE_WIDTH rank or ownership'),
          )
          report = dict(schema='frp.m31.execution_scaling.qualification.v1', status='RUNNING',
                        runs=[], replay_pairs=0, profile_digests={}, detected=[])

          def need(ok, message):
              if not ok:
                  raise RuntimeError(message)

          def digest(data):
              return hashlib.sha256(data).hexdigest()

          def execute(cmd, tag, seconds, positive=True):
              cmd = ['timeout', '--kill-after=10s', f'{seconds}s', *map(str, cmd)]
              log = out / (tag + '.log')
              with log.open('w') as stream:
                  stream.write(shlex.join(cmd) + '\n'); stream.flush()
                  p = subprocess.run(cmd, stdout=stream, stderr=subprocess.STDOUT)
              if positive:
                  need(p.returncode == 0, f'{tag}: exit {p.returncode}')
              return p.returncode, log.read_text(errors='replace')

          def build(stage, suite, cells, tag, change=None):
              top = suites[suite][0]
              for name in hashes:
                  shutil.copy(rtl / (name+'.sv'), stage)
              if change:
                  dut, old, new = change
                  path = stage / (dut+'.sv'); original = path.read_text()
                  need(original.count(old) == 1, tag+': mutation anchor mismatch')
                  path.write_text(original.replace(old, new))
                  shutil.copy(path, out / (tag+'.sv'))
              obj = stage / 'obj'
              execute(['verilator-cli','--cc','--main','--exe','--timing','--assert','--unroll-count','1',
                       '-Wno-fatal','--top-module',top,'-I'+str(stage),'--Mdir',obj,f'-GCELLS={cells}',
                       stage/(top+'.sv')], tag+'-generate', 600)
              execute(['make','-C',obj,'-f','V'+top+'.mk','-j','2','VK_PCH_I_FAST=','VK_PCH_I_SLOW=',
                       'CXXFLAGS=--std=c++20 -DVL_TIME_CONTEXT','OPT_FAST=-O1'], tag+'-build', 900)
              return obj / ('V'+top)

          def record(text, suite, cells, seed):
              lines = [s for s in text.splitlines() if s.startswith('PASS ')]
              prefix = 'PASS '+suites[suite][1]+' '
              need(len(lines)==1 and lines[0].startswith(prefix), 'Missing or duplicate PASS')
              result = {}
              for pair in lines[0][len(prefix):].split():
                  key, value = pair.split('=')
                  fmt = r'[0-9a-f]{16}' if key=='signature' else r'0|[1-9][0-9]*'
                  need(key not in result and re.fullmatch(fmt,value), 'Malformed PASS field: '+key)
                  result[key] = value
              need(result.get('cells')==str(cells) and result.get('seed')==str(seed), 'Wrong profile')
              return result

          try:
              sha = subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
              need(os.environ['GITHUB_EVENT_NAME']=='workflow_dispatch' and sha==os.environ['GITHUB_SHA'],
                   'Manual run on the selected commit required')
              report['commit'] = sha
              manifest = {}
              for name, want in hashes.items():
                  path = rtl/(name+'.sv')
                  need(path.is_file(), 'Missing prerequisite: '+str(path.relative_to(root)))
                  actual = digest(path.read_bytes()); manifest[str(path.relative_to(root))] = actual
                  need(actual==want, 'Qualified source mismatch: '+name)
              manifest[workflow] = digest((root/workflow).read_bytes())
              (out/'source_sha256.json').write_text(json.dumps(manifest,indent=2)+'\n')
              with zipfile.ZipFile(out/'tested_sources.zip','w',zipfile.ZIP_DEFLATED) as archive:
                  for path in manifest: archive.write(root/path,path)
              def positive(job):
                  suite,i,cells = job
                  tag = f'{suite}-{cells}'; records = []; runs = []
                  with tempfile.TemporaryDirectory(dir=os.environ['RUNNER_TEMP']) as tmp:
                      exe = build(Path(tmp),suite,cells,tag)
                      for seed in (0,76):
                          pair = []
                          for replay in (1,2):
                              label = f'{tag}-{seed}-{replay}'
                              _,text = execute([exe,f'+SEED={seed}'],label,180)
                              item = record(text,suite,cells,seed); pair.append(item)
                              runs.append(dict(suite=suite,replay=replay,log=label+'.log',record=item))
                          need(pair[0]==pair[1], label+': replay mismatch')
                          records.append(pair[0])
                  actual = digest(json.dumps(records,sort_keys=True,separators=(',',':')).encode())
                  need(actual==golden[suite][i], tag+': reference records differ')
                  print('PASS',tag,flush=True)
                  return tag,actual,runs

              def negative(case):
                  tag,suite,dut,old,new,marker = case
                  with tempfile.TemporaryDirectory(dir=os.environ['RUNNER_TEMP']) as tmp:
                      exe = build(Path(tmp),suite,8,tag,(dut,old,new))
                      code,text = execute([exe,'+SEED=76'],tag+'-run',180,False)
                  line = next((s for s in text.splitlines() if re.search(r'%(?:Fatal|Error):',s) and marker in s),None)
                  need(code in (1,134,-6) and line and not any(s.startswith('PASS ') for s in text.splitlines()),
                       tag+': expected runtime failure absent')
                  print('DETECTED',tag,flush=True)
                  return dict(mutation=tag,cells=8,exit_code=code,diagnostic=line)

              jobs = [(s,i,c) for s in suites for i,c in enumerate(profiles)]
              with ThreadPoolExecutor(max_workers=2) as pool:
                  for tag,actual,runs in pool.map(positive,jobs):
                      report['runs'].extend(runs)
                      report['profile_digests'][tag] = actual
                      report['replay_pairs'] += len(runs)//2
                  for item in pool.map(negative,mutations):
                      report['detected'].append(item)
              need(all(digest((root/p).read_bytes())==h for p,h in manifest.items()), 'Source changed')
              need((len(report['runs']),report['replay_pairs'],len(report['detected']))==(40,20,6), 'Incomplete matrix')
              report['status'] = 'PASS'
          except Exception as exc:
              report.update(status='FAIL',error=str(exc)); raise
          finally:
              (out/'results.json').write_text(json.dumps(report,indent=2)+'\n')
              summary = (f"## FRP M31 Execution Scaling Qualification\n\nResult: **{report['status']}**\n\n"
                         f"Commit: `{report.get('commit','unavailable')}`\n\nExecutions: {len(report['runs'])}/40; "
                         f"matching replay pairs: {report['replay_pairs']}/20; detected mutations: {len(report['detected'])}/6.\n")
              (out/'summary.md').write_text(summary)
              with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f: f.write(summary)
          PY
      - name: Upload one combined artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frp-123-execution-scaling-${{ github.run_id }}-${{ github.run_attempt }}
          path: bundle/
          if-no-files-found: error
          retention-days: 14
