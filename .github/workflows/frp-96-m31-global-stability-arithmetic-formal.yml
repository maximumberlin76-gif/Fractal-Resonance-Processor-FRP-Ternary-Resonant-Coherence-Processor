name: 96 - FRP M31 Global Stability Arithmetic Formal
run-name: "96 - FRP Stability Arithmetic | six profiles, 8/16/32/64 cells @ ${{ github.sha }}"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: frp-96-stability-arithmetic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prove:
    name: "Arithmetic contracts - ${{ matrix.cells }} cells"
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        cells: [8, 16, 32, 64]
    defaults:
      run:
        shell: bash
    env:
      CELLS: ${{ matrix.cells }}
      LC_ALL: C.UTF-8
      TZ: UTC
      PYTHONHASHSEED: "0"
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pinned formal tool
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pyosys==0.68
      - name: Prove all profiles and check witnesses and rounding mutation
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import importlib.metadata
          import json
          import os
          import shutil
          import subprocess
          import sys

          n = int(os.environ['CELLS'])
          assert n in (8, 16, 32, 64)
          e = Path('.frp96-evidence') / f'n{n}'
          e.mkdir(parents=True, exist_ok=False)
          top = 'frp_m31_global_stability_arithmetic_formal'
          harness = Path('formal/m31') / (top + '.sv')
          rtl = Path('rtl/m31/frp_m31_global_stability.sv')
          pkg = Path('rtl/m31/frp_m31_fixed_point_pkg.sv')
          expected = {
              str(harness): '84f82789594dd8bb8511d9851fc6b988c0ecc21eecc29caff2ba06382c87b23c',
              str(rtl): 'df058d4e3671ba1d7c9d0403a6bb1b8c9750a0a967905b5f91cca455c1dddb83',
              str(pkg): '6b2afb8d1583c93d95d2386ba25dd1eaef6bb5bd9a4e1c9e9abff1dd004cbf24',
          }
          cuts = [[], ['previous_margin_q16', 'mean_thermal_overload_q16'],
                  ['compression_arg_q16'], ['next_coherence_compression_q30'],
                  ['next_effective_coherence_q30', 'neutral_fraction_q30',
                   'mean_frequency_lag_q16'], []]
          counts = [4, 3, 3, 2, 1, 1]
          live_counts = [4, 3, 2, 1, 1, 1]
          names = ['means_and_fraction', 'compression', 'rom_address',
                   'effective_and_mixed_product', 'capacity', 'q16_product']
          result = {
              'schema': 'frp.m31.stability_arithmetic.formal.v1',
              'commit': os.environ['GITHUB_SHA'],
              'attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'cells': n, 'status': 'failed', 'profiles': [],
              'scope': 'Composed combinational arithmetic contracts; unrestricted cutpoints',
          }

          def save():
              (e / 'result.json').write_text(json.dumps(result, indent=2) + '\n')

          save()
          digest = lambda p: hashlib.sha256(Path(p).read_bytes()).hexdigest()
          before = {p: digest(p) for p in expected}
          (e / 'sources.json').write_text(json.dumps(before, indent=2) + '\n')
          assert before == expected, 'Source hash mismatch; inspect the changed file'
          assert importlib.metadata.version('pyosys') == '0.68'
          for source in expected:
              target = e / 'sources' / source
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source, target)
          (e / 'packages.txt').write_text(subprocess.check_output(
              [sys.executable, '-m', 'pip', 'freeze'], text=True))

          worker = e / 'worker.py'
          worker.write_text(
              'from pathlib import Path\nfrom pyosys import libyosys as y\nimport sys\n'
              'for command in Path(sys.argv[1]).read_text().split(";"):\n'
              '    command = command.strip()\n'
              '    if not command: continue\n'
              '    if command.startswith(("prep ", "opt", "memory_map", "wreduce", "alumacc")):\n'
              '        command = "tee -q " + command\n'
              '    y.run_pass(command)\n'
              'print("WORKER_COMPLETED", flush=True)\n')

          def run(label, commands, timeout=300, success=True):
              script = e / (label + '.ys')
              script.write_text(commands + '\n')
              logpath = e / (label + '.log')
              print(f'RUN {label}', flush=True)
              with logpath.open('w') as log:
                  process = subprocess.run([sys.executable, '-u', str(worker), str(script)],
                                           stdout=log, stderr=subprocess.STDOUT, timeout=timeout)
              text = logpath.read_text()
              if success:
                  assert process.returncode == 0 and 'WORKER_COMPLETED' in text, str(logpath)
              return process.returncode, text

          def prepare(profile, source, include, label, full=True):
              commands = (
                  f'read_slang --std 1800-2017 --unroll-limit 10000 -I {include} '
                  f'-G CELLS={n} -G PROFILE={profile} --top {top} {source}; '
                  'chformal -lower; '
                  f'select -assert-count {counts[profile]} t:$assert; '
                  'select -assert-none t:$assume t:$cover t:$check t:$anyseq t:$anyconst; '
                  f'prep -top {top} -flatten; async2sync; opt; memory_map; opt; '
              )
              if cuts[profile]:
                  selection = ' '.join('w:' + name for name in cuts[profile])
                  commands += f'select -assert-count {len(cuts[profile])} {selection}; cutpoint {selection}; '
              if full:
                  commands += f'write_rtlil {e}/{label}-full.il; '
              commands += (
                  'delete -output w:mismatch w:reach; opt -full; wreduce; '
                  'chformal -lower; alumacc; opt -full; opt_clean; '
                  f'select -assert-count {live_counts[profile]} t:$assert; '
                  f'select -assert-count {len(cuts[profile])} t:$anyseq; '
                  'select -assert-none t:$assume t:$anyconst; '
                  f'check -assert; write_rtlil {e}/{label}-proof.il'
              )
              run('prepare-' + label, commands, timeout=600)

          proof = 'sat -prove-asserts -verify -timeout 120'
          for profile in range(6):
              label = f'p{profile}'
              prepare(profile, harness, 'rtl/m31', label)
              _, log = run('prove-' + label, f'read_rtlil {e}/{label}-proof.il; {proof}')
              assert 'SAT proof finished - no model found: SUCCESS!' in log, 'Incomplete proof'
              commands = (
                  f'read_rtlil {e}/{label}-full.il; delete -output w:mismatch; '
                  'chformal -assert -remove; opt_clean; '
                  'select -assert-none t:$assert t:$assume; check -assert; '
              )
              show = '-show ' + ','.join(cuts[profile]) if cuts[profile] else ''
              for bit in range(8):
                  commands += (
                      f'sat -set reach[{bit}] 1 -show-ports {show} '
                      f'-dump_json {e}/{label}-reach-{bit}.json -timeout 15; '
                  )
              _, log = run('reach-' + label, commands)
              assert log.count('SAT solving finished - model found:') == 8, 'Missing witness'
              for bit in range(8):
                  witness = json.loads((e / f'{label}-reach-{bit}.json').read_text())
                  signal = next(s for s in witness['signal'] if s['name'] == 'reach')
                  value = next(v for v in signal['data'] if v and set(v) <= {'0', '1'})
                  assert int(value, 2) & (1 << bit), f'Invalid witness {profile}:{bit}'
              result['profiles'].append({
                  'profile': profile, 'name': names[profile], 'status': 'passed',
                  'source_assertions': counts[profile], 'normalized_assertions': live_counts[profile],
                  'witnesses': 8, 'cutpoints': cuts[profile],
              })
              save()

          # Mutate a private source copy; the checked repository sources remain intact.
          mutant = e / 'mutant'
          mutant.mkdir()
          for source in (harness, rtl, pkg):
              shutil.copyfile(source, mutant / source.name)
          old = "half_value = 64'sd1 <<< (shift - 1);"
          original = pkg.read_text()
          assert original.count(old) == 1, 'Mutation site changed'
          (mutant / pkg.name).write_text(original.replace(old, "half_value = 64'sd1 <<< shift;"))
          prepare(5, mutant / harness.name, mutant, 'mutation', full=False)
          code, log = run('negative-control', f'read_rtlil {e}/mutation-proof.il; {proof}', success=False)
          assert code != 0 and 'SAT proof finished - model found: FAIL!' in log, 'Mutation escaped'
          assert {p: digest(p) for p in expected} == before, 'Checked sources changed'
          assert len(result['profiles']) == 6
          result.update(status='passed', source_assertions=14, normalized_assertions=12,
                        witnesses=48, detected_mutations=1,
                        composition='All six contracts and primitive lemmas passed together')
          save()
          print(json.dumps(result, indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write(
                  f'### FRP 96 — {n} cells\n\n'
                  '| Check | Result |\n|---|---|\n'
                  '| Arithmetic profiles | 6 of 6 passed |\n'
                  '| Source assertions | 14 checked |\n'
                  '| Assertions after simplification and sharing | 12 proven |\n'
                  '| Local arithmetic witnesses | 48 of 48 |\n'
                  '| Q16 rounding mutation | Detected |\n\n'
                  'All six profiles are required for the composed result. '
                  'Cutpoints are unrestricted; witnesses describe local arithmetic domains. '
                  'ROM address mapping is included; ROM table values are outside this contract.\n')
          PY
      - name: Upload formal evidence
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          name: frp96-n${{ matrix.cells }}-${{ github.sha }}-${{ github.run_attempt }}
          path: .frp96-evidence/n${{ matrix.cells }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
