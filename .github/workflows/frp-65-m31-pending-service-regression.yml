name: 65 - FRP M31 Pending Route Service Regression
run-name: "65 - FRP Active Zero Service | 8/16/32 cells and deterministic replay @ ${{ github.sha }}"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frp-65-pending-service-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    name: Pending route service - ${{ matrix.cells }} cells
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        cells: [8, 16, 32]
    defaults:
      run:
        shell: bash
    env:
      CELLS: ${{ matrix.cells }}
      LC_ALL: C.UTF-8
      TZ: UTC
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Initialize evidence directory
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/frp-65-evidence"
          echo "FRP65_EVIDENCE=$RUNNER_TEMP/frp-65-evidence" >> "$GITHUB_ENV"

      - name: Check out dispatched commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify manual execution and qualified sources
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          cat > "$FRP65_EVIDENCE/sources.sha256" <<'SHA'
          18889d85e78b23b844f1db4c46a35a6b7d01e609e3f1f0e6263a39a6c5729411  rtl/m31/frp_m31_pending_routes.sv
          1f5a3e08a981a1685147eba4d75110ace4becb175685cc2177e6e96a78edc309  rtl/m31/frp_m31_pending_service_tb.sv
          32f75cc70df5dba3f4fbb511397be9a5921236c2afd16cfeb1350eca3f6e8109  rtl/m31/frp_m31_request_lanes.sv
          762302f1c7a7f7f40cb029f5ada6a111fc8c3e3f6be9920e9b2401b95e179c94  rtl/m31/frp_m31_pkg.sv
          765429b33df3f843626bdc411ad8371fd963738a58ab10201abef75dcdafcaf0  rtl/m31/frp_m31_active_neutral.sv
          d0587897f955ce49923aca807b5d3e0c637383c88e5d5e0dfa8405f47917c123  rtl/m31/frp_m31_capacity_guard.sv
          e516a5cd378bd2ddecdadc5abb13ddef26c63fafe5bda65b47a6bd859ca66f92  rtl/m31/frp_m31_execution_core.sv
          ebad1f7ee952a577239445d33d99cae799afaaff5c181c7162514bbcea6eab90  rtl/m31/frp_m31_state_update.sv
          fc9de24b41736e5c5a9f9e464318c80adbfda9dc8cc4362c0c55bfed403bf97f  rtl/m31/frp_m31_scheduler.sv
          SHA
          sha256sum .github/workflows/frp-65-m31-pending-service-regression.yml \
            >> "$FRP65_EVIDENCE/sources.sha256"
          sha256sum --check "$FRP65_EVIDENCE/sources.sha256" \
            | tee "$FRP65_EVIDENCE/source-check.log"
          printf '%s\n' "$GITHUB_SHA" > "$FRP65_EVIDENCE/commit.txt"

      - name: Install and record toolchain
        run: |
          set -euo pipefail
          {
            python -m pip install --disable-pip-version-check \
              verilator==5.48.0 systemc==3.0.2.1
            python -m pip check
            verilator-cli --version
            g++ --version
            make --version
          } 2>&1 | tee "$FRP65_EVIDENCE/toolchain.log"
          python -m pip freeze > "$FRP65_EVIDENCE/packages.txt"

      - name: Build, replay and qualify pending route service
        run: |
          set -euo pipefail
          python - <<'PYTHON'
          import hashlib
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          n = int(os.environ['CELLS'])
          profiles = {
              8: (292193, 'b9e6b194bb2f7955', 768, 17536, 9472, 2880, 128, 96),
              16: (512577, 'c7b859403b09e875', 1536, 35072, 18944, 5632, 288, 288),
              32: (953345, '30b2d43b57833d55', 3072, 70144, 37888, 12352, 576, 672),
          }
          if n not in profiles:
              raise SystemExit('Unsupported cell count')
          checks, signature, routes, paused, blocked, busy, capacity, duplicates = profiles[n]
          evidence = Path(os.environ['FRP65_EVIDENCE']).resolve()
          build = Path(os.environ['RUNNER_TEMP']) / f'frp-65-build-{n}'
          top = 'frp_m31_pending_service_tb'
          commands = []

          def run(command, logfile, seconds):
              commands.append(command)
              (evidence / 'commands.json').write_text(json.dumps(commands, indent=2) + '\n')
              print('Running:', command, flush=True)
              path = evidence / logfile
              with path.open('w') as stream:
                  result = subprocess.run(
                      command, stdout=stream, stderr=subprocess.STDOUT,
                      timeout=seconds, check=False,
                  )
              if result.returncode:
                  print(path.read_text(errors='replace')[-16000:])
                  raise SystemExit(f'{logfile}: exit {result.returncode}')

          run([
              'verilator-cli', '--binary', '--output-groups', '0',
              '--timing', '--assert', '-Wno-fatal', '-j', '1',
              '-CFLAGS', '-std=c++20',
              '-MAKEFLAGS', 'OPT_FAST=-O0',
              '-MAKEFLAGS', 'VK_PCH_I_FAST=',
              '-MAKEFLAGS', 'VK_PCH_I_SLOW=',
              '--top-module', top, f'-GCELLS={n}', '--Mdir', str(build),
              '-Irtl/m31', f'rtl/m31/{top}.sv',
          ], 'compile.log', 1200)
          executable = build / f'V{top}'
          (evidence / 'executable.sha256').write_text(
              f'{hashlib.sha256(executable.read_bytes()).hexdigest()}  V{top}\n'
          )
          expected = {
              'PASS PENDING_SERVICE': {
                  'N': n, 'cases': 96, 'checks': checks,
                  'cycles': 5968, 'signature': signature,
              },
              'ROUTES': {
                  'N': n, 'created': routes, 'completed': routes,
                  'service_bound': 4, 'direct': 0,
              },
              'CONTENTION': {
                  'N': n, 'paused_routes': paused, 'blocked_routes': blocked,
                  'busy_requests': busy, 'capacity_rejects': capacity,
                  'duplicate_rejects': duplicates, 'clears_with_pending': 1168,
              },
          }

          def collect(path):
              lines = path.read_text().splitlines()
              records, selected = {}, []
              for label, fields in expected.items():
                  hits = [line for line in lines if line.startswith(label + ' ')]
                  if len(hits) != 1:
                      raise SystemExit(f'{path.name}: expected one {label} record')
                  line = hits[0]
                  values = {}
                  for token in line[len(label) + 1:].split():
                      match = re.fullmatch(r'([A-Za-z_][A-Za-z_0-9]*)=([0-9a-f]+)', token)
                      if not match or match[1] in values:
                          raise SystemExit(f'{path.name}: malformed or duplicate field: {token}')
                      key, value = match.groups()
                      values[key] = value if key == 'signature' else int(value)
                  if values != fields:
                      raise SystemExit(
                          f'{path.name}: {label} mismatch\n'
                          f'Expected: {fields}\nObserved: {values}'
                      )
                  records[label] = values
                  selected.append(line)
              return records, '\n'.join(selected) + '\n'

          results = []
          for replay in (1, 2):
              logfile = f'run-{replay}.log'
              run([str(executable)], logfile, 300)
              records, semantic = collect(evidence / logfile)
              (evidence / f'replay-{replay}.txt').write_text(semantic)
              results.append((records, semantic))
          if results[0][1] != results[1][1]:
              raise SystemExit('Deterministic replay mismatch')
          records, semantic = results[0]
          report = {
              'commit': os.environ['GITHUB_SHA'], 'cells': n,
              'replays': 2, 'replay_equal': True, 'records': records,
              'semantic_sha256': hashlib.sha256(semantic.encode()).hexdigest(),
              'contract': {
                  'core': 'M31 execution stage instantiated by M32',
                  'batch': 'CELLS accepted opposite-polarity routes',
                  'drain': 'no new opposite-polarity route admitted during drain',
                  'service': 'ascending cell priority; pending completion before new requests',
                  'bound': 'four activation opportunities; at most 32 enabled drain ticks',
                  'scheduler_modes': ['free', '7/1', '1/7'],
                  'pause': 'disabled clocks preserve state and saved destination',
                  'counter_clear': 'scheduler counters clear while retained routes persist',
                  'activity': 'logical ternary state transitions',
              },
          }
          (evidence / 'qualification.json').write_text(json.dumps(report, indent=2) + '\n')
          summary = (
              f'### FRP 65: {n} cells — PASS\n\n'
              f'96 cases; {checks:,} checks per replay; two identical replays.\n\n'
              f'All {routes} accepted routes completed; direct transitions: 0.\n\n'
              'Closed batch: four activation opportunities, at most 32 enabled drain ticks.\n\n'
              '```text\n' + semantic + '```\n'
          )
          (evidence / 'summary.md').write_text(summary)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write(summary)
          print(semantic, end='')
          print('PASS: bounded pending service, active-zero retention and deterministic replay')
          PYTHON
          sha256sum --check "$FRP65_EVIDENCE/sources.sha256" \
            > "$FRP65_EVIDENCE/source-recheck.log"

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: frp-65-pending-service-${{ matrix.cells }}-${{ github.sha }}
          path: ${{ runner.temp }}/frp-65-evidence/
          if-no-files-found: error
          retention-days: 30
