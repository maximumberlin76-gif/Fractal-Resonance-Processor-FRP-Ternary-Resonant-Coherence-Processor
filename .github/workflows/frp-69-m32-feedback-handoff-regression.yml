name: 69 - FRP M32 Feedback Handoff Regression
run-name: "69 - FRP Feedback Handoff | 8/16/32 cells and deterministic replay @ ${{ github.sha }}"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frp-69-feedback-handoff-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    name: M32 feedback handoff - ${{ matrix.cells }} cells
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        cells: [8, 16, 32]
    defaults:
      run:
        shell: bash
    env:
      CELLS: ${{ matrix.cells }}
      LC_ALL: C.UTF-8
      TZ: UTC
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Initialize evidence directory
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/frp-69-evidence"
          echo "FRP69_EVIDENCE=$RUNNER_TEMP/frp-69-evidence" >> "$GITHUB_ENV"

      - name: Check out dispatched commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify manual execution and qualified sources
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          cat > "$FRP69_EVIDENCE/sources.sha256" <<'SHA'
          765429b33df3f843626bdc411ad8371fd963738a58ab10201abef75dcdafcaf0  rtl/m31/frp_m31_active_neutral.sv
          d0587897f955ce49923aca807b5d3e0c637383c88e5d5e0dfa8405f47917c123  rtl/m31/frp_m31_capacity_guard.sv
          e516a5cd378bd2ddecdadc5abb13ddef26c63fafe5bda65b47a6bd859ca66f92  rtl/m31/frp_m31_execution_core.sv
          6b2afb8d1583c93d95d2386ba25dd1eaef6bb5bd9a4e1c9e9abff1dd004cbf24  rtl/m31/frp_m31_fixed_point_pkg.sv
          df058d4e3671ba1d7c9d0403a6bb1b8c9750a0a967905b5f91cca455c1dddb83  rtl/m31/frp_m31_global_stability.sv
          cbb5a531283164d1d54d59ec748b97bf84e172704854bf5eb7c6bda2c502f7c7  rtl/m31/frp_m31_isqrt_u64.sv
          478882d4f6a2986f5079c88b444c7b007d68145d61e5150209cb0637f35b2ec0  rtl/m31/frp_m31_local_gamma_drift.sv
          6e10f738f94c43ac9748ec7a033adde16243beea59e2f7f2973a3ab51c2e5e04  rtl/m31/frp_m31_local_thermal_attenuation.sv
          cb97c1bfeabbb2acaebf2f9644d484b2f7c5e995dbf1b70777f6bc2e7df9368e  rtl/m31/frp_m31_local_thermal_field.sv
          18889d85e78b23b844f1db4c46a35a6b7d01e609e3f1f0e6263a39a6c5729411  rtl/m31/frp_m31_pending_routes.sv
          7ac3572ef2bf9feef509e7dc43c662d92d23fa3eb0563efbfa8dba7c28157746  rtl/m31/frp_m31_phase_interference.sv
          fa78bcfe965270cc74855908aa392989d857575a2097a126539aabb1aab8990d  rtl/m31/frp_m31_phase_request_adapter.sv
          762302f1c7a7f7f40cb029f5ada6a111fc8c3e3f6be9920e9b2401b95e179c94  rtl/m31/frp_m31_pkg.sv
          32f75cc70df5dba3f4fbb511397be9a5921236c2afd16cfeb1350eca3f6e8109  rtl/m31/frp_m31_request_lanes.sv
          fc9de24b41736e5c5a9f9e464318c80adbfda9dc8cc4362c0c55bfed403bf97f  rtl/m31/frp_m31_scheduler.sv
          adbb4b94fcf8fa0bfc981d654679fd7518a5c4c9c97b611a35cd8accaf28233d  rtl/m31/frp_m31_sin_q30.mem
          69c06833e6dfbb28e25b74a5787dcd03756dddf0f66726de3ea47c1ad2931931  rtl/m31/frp_m31_stability.sv
          ebad1f7ee952a577239445d33d99cae799afaaff5c181c7162514bbcea6eab90  rtl/m31/frp_m31_state_update.sv
          34df4ebfc5dfad8e3e5e454e560404585de5c881e6f75abaae367d3bd9fb11bd  rtl/m31/frp_m31_thermal_proxy.sv
          0be6c5ee28ee4a23baf6110143eec309f387200c1c2c80e3016353d5d4107541  rtl/m32/frp_m32_core.sv
          54626d2d2e1ebe8430414d545242e6970d9bd1f7be424acc5e16b3385987fe07  rtl/m32/frp_m32_feedback_handoff_tb.sv
          9626474b49d32b411e107d7ccc8ee5aa7f42728e9a6f70d634d16d3f2a414c5e  rtl/m32/frp_m32_registered_target_boundary.sv
          02250069a68737f055a419cd67bf2d439b3f63b3f6a7a245f40e9bf29d1958eb  rtl/m32/frp_m32_registered_target_request_path.sv
          SHA
          sha256sum .github/workflows/frp-69-m32-feedback-handoff-regression.yml \
            >> "$FRP69_EVIDENCE/sources.sha256"
          sha256sum --check "$FRP69_EVIDENCE/sources.sha256" \
            | tee "$FRP69_EVIDENCE/source-check.log"
          printf '%s\n' "$GITHUB_SHA" > "$FRP69_EVIDENCE/commit.txt"

      - name: Install and record toolchain
        run: |
          set -euo pipefail
          {
            python -m pip install --disable-pip-version-check \
              verilator==5.48.0 systemc==3.0.2.1
            python -m pip check
            verilator-cli --version
            g++ --version
            make --version
          } 2>&1 | tee "$FRP69_EVIDENCE/toolchain.log"
          python -m pip freeze > "$FRP69_EVIDENCE/packages.txt"

      - name: Build and qualify two deterministic handoff replays
        run: |
          set -euo pipefail
          python - <<'PYTHON'
          import hashlib
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          n = int(os.environ['CELLS'])
          golden = {
              8: 'c487de7840da8b8fbbc6e66f9cc17cc789a418744542c70f1d0e36f219d79ff3',
              16: 'd4736c4a99d0e90235b244af41195b4d15fd126b5d19205d2cfea9341739010e',
              32: 'd82d53b2ac8eb400ec7ab6885ab00a3d6c1ab4762b933f18a2180e3fceb1dbdd',
          }
          if n not in golden:
              raise SystemExit('Unsupported cell count')
          evidence = Path(os.environ['FRP69_EVIDENCE']).resolve()
          build = Path(os.environ['RUNNER_TEMP']) / f'frp-69-build-{n}'
          top = 'frp_m32_feedback_handoff_tb'
          commands = []

          def run(command, logfile, seconds):
              commands.append(command)
              (evidence / 'commands.json').write_text(json.dumps(commands, indent=2) + '\n')
              print('Running:', command, flush=True)
              path = evidence / logfile
              try:
                  with path.open('w') as stream:
                      result = subprocess.run(
                          command, stdout=stream, stderr=subprocess.STDOUT,
                          timeout=seconds, check=False,
                      )
              except subprocess.TimeoutExpired:
                  print(path.read_text(errors='replace')[-16000:])
                  raise SystemExit(f'{logfile}: timeout after {seconds} seconds')
              if result.returncode:
                  print(path.read_text(errors='replace')[-16000:])
                  raise SystemExit(f'{logfile}: exit {result.returncode}')

          run([
              'verilator-cli', '--binary', '--output-groups', '0',
              '--timing', '--assert', '-Wno-fatal', '-j', '1',
              '-CFLAGS', '-std=c++20',
              '-MAKEFLAGS', 'OPT_FAST=-O0',
              '-MAKEFLAGS', 'VK_PCH_I_FAST=',
              '-MAKEFLAGS', 'VK_PCH_I_SLOW=',
              '--top-module', top, f'-GCELLS={n}', '--Mdir', str(build),
              '-Irtl/m31', '-Irtl/m32', f'rtl/m32/{top}.sv',
          ], 'compile.log', 1200)
          compile_log = (evidence / 'compile.log').read_text(errors='replace')
          if re.search(r'%Warning-(PINMISSING|IMPLICIT|MULTIDRIVEN)\b', compile_log):
              raise SystemExit('Unexpected port, implicit signal or multiple driver')
          executable = build / f'V{top}'
          (evidence / 'executable.sha256').write_text(
              f'{hashlib.sha256(executable.read_bytes()).hexdigest()}  V{top}\n'
          )

          def fields(line, prefix):
              result = {}
              for token in line[len(prefix):].split():
                  key, separator, value = token.partition('=')
                  if not separator or not re.fullmatch(r'[A-Za-z_][A-Za-z_0-9]*', key) or key in result:
                      raise SystemExit(f'Malformed or duplicate field: {token}')
                  if key == 'signature':
                      if not re.fullmatch(r'[0-9a-f]{16}', value):
                          raise SystemExit('Invalid signature')
                      result[key] = value
                  else:
                      if not re.fullmatch(r'-?[0-9]+', value):
                          raise SystemExit(f'Invalid integer: {token}')
                      result[key] = int(value)
              return result

          def collect(path):
              lines = path.read_text().splitlines()
              if any('%Error' in line or 'Assertion failed' in line or 'Aborting' in line for line in lines):
                  raise SystemExit(f'{path.name}: simulator failure')
              if not any('Verilog $finish' in line for line in lines):
                  raise SystemExit(f'{path.name}: missing normal simulator finish')
              selected = [line for line in lines if line.startswith(('HANDOFF ', 'STREAM ', 'PASS '))]
              expected = [
                  f'HANDOFF cells={n} from={a} to={b} cases=32'
                  for a in range(3) for b in range(3)
              ] + [
                  f'STREAM cells={n} profile={p} ticks=1024 snapshots=1024'
                  for p in range(2)
              ]
              if len(selected) != 12 or selected[:11] != expected:
                  raise SystemExit('Missing, duplicated or incorrect handoff/stream records')
              prefix = 'PASS FEEDBACK_HANDOFF '
              if not selected[-1].startswith(prefix):
                  raise SystemExit('Missing final feedback handoff PASS')
              total = fields(selected[-1], prefix)
              required = {
                  'cells', 'cases', 'cycles', 'checks', 'streams', 'modes', 'routes',
                  'completions', 'zero_memory', 'hot', 'gamma', 'attenuation',
                  'cooling', 'holds', 'delayed', 'signature',
              }
              if set(total) != required:
                  raise SystemExit('Unexpected PASS field set')
              exact = {
                  'cells': n, 'cases': 288, 'cycles': 24272, 'streams': 2048,
                  'modes': 1737, 'holds': 1200, 'delayed': 620,
              }
              for key, value in exact.items():
                  if total[key] != value:
                      raise SystemExit(f'Incorrect coverage {key}: {total[key]} != {value}')
              for key in ('checks', 'routes', 'completions', 'zero_memory', 'hot',
                          'gamma', 'attenuation', 'cooling'):
                  if total[key] <= 0:
                      raise SystemExit(f'Missing coverage: {key}')
              if total['routes'] != total['completions']:
                  raise SystemExit('Incomplete retained-route service')
              semantic = '\n'.join(selected) + '\n'
              digest = hashlib.sha256(semantic.encode()).hexdigest()
              if digest != golden[n]:
                  raise SystemExit(f'Qualified result mismatch: expected {golden[n]}, observed {digest}')
              return total, semantic

          results = []
          for replay in (1, 2):
              logfile = f'run-{replay}.log'
              run([str(executable)], logfile, 300)
              total, semantic = collect(evidence / logfile)
              (evidence / f'replay-{replay}.txt').write_text(semantic)
              results.append((total, semantic))
          if results[0] != results[1]:
              raise SystemExit('Deterministic replay mismatch')
          total, semantic = results[0]
          report = {
              'commit': os.environ['GITHUB_SHA'], 'cells': n,
              'replays': 2, 'replay_equal': True,
              'semantic_sha256': golden[n], 'total': total,
              'contract': {
                  'core': 'Full M32 with local thermal and gamma feedback enabled',
                  'modes': ['FREE', '7/1', '1/7'],
                  'matrix': '3 old modes x 3 new modes x 8 positions x 2 tick states x 2 clear states',
                  'handoff': 'Each matrix case starts with retained routes and local thermal overload',
                  'retention': 'Phase, frequency, thermal, gamma and pending-route history checked at every step',
                  'interference': 'Relative-phase coupling checked against an independent integer reference',
                  'active_zero': 'Saved destination has priority over conflicting new goals; every cell routes and completes',
                  'service': 'Every matrix case drains saved routes within 16 enabled ticks',
                  'stability': 'Delayed C-P snapshot, compression, effective coherence and valid/count timing checked',
                  'streams': 'Two phase-target streams of 1024 enabled ticks, with live mode changes and holds',
                  'replay': 'Nine handoff records, two stream records and the complete PASS record match',
                  'units': {'coherence': 'Q30', 'margin_and_heat': 'Q16'},
              },
          }
          (evidence / 'qualification.json').write_text(json.dumps(report, indent=2) + '\n')
          summary = (
              f'### FRP 69: {n} cells — PASS\n\n'
              f'288 handoff cases; {total["checks"]:,} checks per replay; two identical replays.\n\n'
              'All mode pairs and cadence positions checked with retained active-zero routes and local feedback.\n\n'
              'Two 1024-tick phase-target streams; delayed C-P snapshots and memory continuity checked.\n\n'
              '```text\n' + semantic + '```\n'
          )
          (evidence / 'summary.md').write_text(summary)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write(summary)
          print(semantic, end='')
          print('PASS: M32 feedback handoff, active-zero retention and deterministic replay')
          PYTHON
          sha256sum --check "$FRP69_EVIDENCE/sources.sha256" \
            > "$FRP69_EVIDENCE/source-recheck.log"

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: frp-69-feedback-handoff-${{ matrix.cells }}-${{ github.sha }}
          path: ${{ runner.temp }}/frp-69-evidence/
          if-no-files-found: error
          retention-days: 30
