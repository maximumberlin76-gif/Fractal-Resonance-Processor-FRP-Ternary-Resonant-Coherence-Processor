name: 68 - FRP M32 Phase Recovery Post-Synthesis
run-name: "68 - FRP Phase Recovery | 8/16/32 cells and RTL-netlist equivalence @ ${{ github.sha }}"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frp-68-phase-recovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    name: M32 phase recovery - ${{ matrix.cells }} cells
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        cells: [8, 16, 32]
    defaults:
      run:
        shell: bash
    env:
      CELLS: ${{ matrix.cells }}
      LC_ALL: C.UTF-8
      TZ: UTC
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Initialize evidence directory
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/frp-68-evidence"
          echo "FRP68_EVIDENCE=$RUNNER_TEMP/frp-68-evidence" >> "$GITHUB_ENV"

      - name: Check out dispatched commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify manual execution and qualified sources
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          cat > "$FRP68_EVIDENCE/sources.sha256" <<'SHA'
          765429b33df3f843626bdc411ad8371fd963738a58ab10201abef75dcdafcaf0  rtl/m31/frp_m31_active_neutral.sv
          d0587897f955ce49923aca807b5d3e0c637383c88e5d5e0dfa8405f47917c123  rtl/m31/frp_m31_capacity_guard.sv
          e516a5cd378bd2ddecdadc5abb13ddef26c63fafe5bda65b47a6bd859ca66f92  rtl/m31/frp_m31_execution_core.sv
          6b2afb8d1583c93d95d2386ba25dd1eaef6bb5bd9a4e1c9e9abff1dd004cbf24  rtl/m31/frp_m31_fixed_point_pkg.sv
          d1604e08fa6cf658f25b579fb76202e65fca1481167e6d8d6039a7034e354832  rtl/m31/frp_m31_global_stability.sv
          cbb5a531283164d1d54d59ec748b97bf84e172704854bf5eb7c6bda2c502f7c7  rtl/m31/frp_m31_isqrt_u64.sv
          478882d4f6a2986f5079c88b444c7b007d68145d61e5150209cb0637f35b2ec0  rtl/m31/frp_m31_local_gamma_drift.sv
          6e10f738f94c43ac9748ec7a033adde16243beea59e2f7f2973a3ab51c2e5e04  rtl/m31/frp_m31_local_thermal_attenuation.sv
          2973c4ce73c014cd2692e2fa34cbf1ef6daa88d8e4115a545d6e776acb75cff6  rtl/m31/frp_m31_local_thermal_field.sv
          18889d85e78b23b844f1db4c46a35a6b7d01e609e3f1f0e6263a39a6c5729411  rtl/m31/frp_m31_pending_routes.sv
          81cd497e3f3e04abc93a2052c23deb189b2c200b11cc249ec51dbd40588e9523  rtl/m31/frp_m31_phase_interference.sv
          fa78bcfe965270cc74855908aa392989d857575a2097a126539aabb1aab8990d  rtl/m31/frp_m31_phase_request_adapter.sv
          762302f1c7a7f7f40cb029f5ada6a111fc8c3e3f6be9920e9b2401b95e179c94  rtl/m31/frp_m31_pkg.sv
          32f75cc70df5dba3f4fbb511397be9a5921236c2afd16cfeb1350eca3f6e8109  rtl/m31/frp_m31_request_lanes.sv
          fc9de24b41736e5c5a9f9e464318c80adbfda9dc8cc4362c0c55bfed403bf97f  rtl/m31/frp_m31_scheduler.sv
          adbb4b94fcf8fa0bfc981d654679fd7518a5c4c9c97b611a35cd8accaf28233d  rtl/m31/frp_m31_sin_q30.mem
          69c06833e6dfbb28e25b74a5787dcd03756dddf0f66726de3ea47c1ad2931931  rtl/m31/frp_m31_stability.sv
          ebad1f7ee952a577239445d33d99cae799afaaff5c181c7162514bbcea6eab90  rtl/m31/frp_m31_state_update.sv
          34df4ebfc5dfad8e3e5e454e560404585de5c881e6f75abaae367d3bd9fb11bd  rtl/m31/frp_m31_thermal_proxy.sv
          df35b73ccb01f06908385656332942858a5f056e7b92556cc16658beb5732b98  rtl/m32/frp_m32_core.sv
          df95c6fa411e7877074c002a03b3f56797fdde8e2702b36306fe903539db39f3  rtl/m32/frp_m32_recovery_tb.sv
          9626474b49d32b411e107d7ccc8ee5aa7f42728e9a6f70d634d16d3f2a414c5e  rtl/m32/frp_m32_registered_target_boundary.sv
          02250069a68737f055a419cd67bf2d439b3f63b3f6a7a245f40e9bf29d1958eb  rtl/m32/frp_m32_registered_target_request_path.sv
          SHA
          sha256sum .github/workflows/frp-68-m32-phase-recovery-post-synthesis.yml \
            >> "$FRP68_EVIDENCE/sources.sha256"
          sha256sum --check "$FRP68_EVIDENCE/sources.sha256" \
            | tee "$FRP68_EVIDENCE/source-check.log"
          printf '%s\n' "$GITHUB_SHA" > "$FRP68_EVIDENCE/commit.txt"

      - name: Install and record toolchain
        run: |
          set -euo pipefail
          {
            python -m pip install --disable-pip-version-check \
              verilator==5.48.0 systemc==3.0.2.1 \
              yowasp-yosys==0.68.0.0.post1208 yowasp-runtime==1.96 \
              wasmtime==47.0.1 click==8.5.0 platformdirs==4.13.0
            python -m pip check
            verilator-cli --version
            yowasp-yosys -V
            g++ --version
            make --version
          } 2>&1 | tee "$FRP68_EVIDENCE/toolchain.log"
          python -m pip freeze > "$FRP68_EVIDENCE/packages.txt"

      - name: Synthesize and qualify recovery against RTL
        run: |
          set -euo pipefail
          python - <<'PYTHON'
          import hashlib
          import json
          import os
          import re
          import subprocess
          from pathlib import Path
          import yowasp_yosys

          n = int(os.environ['CELLS'])
          golden = {
              8: '671f260c68998da542e7b2b878f2aac0a87f9b57364442b3cd90e15e29fc6e4b',
              16: '85e896b30680629836ad868dcbb354ce83c54f15ad8fb7b5edd2d0b948a82e34',
              32: 'e8fd2b4b72683cd76d2cf8490a65d059c82d0b5c5a69996b5f97d22eb4a1c15a',
          }
          if n not in golden:
              raise SystemExit('Unsupported cell count')
          e = Path(os.environ['FRP68_EVIDENCE']).absolute()
          build = Path(os.environ['RUNNER_TEMP']) / f'frp-68-build-{n}'
          top = 'frp_m32_core'
          tb = 'frp_m32_recovery_tb'
          source = Path(f'rtl/m32/{top}.sv').read_text()
          start = source.index('module ' + top + ' #(')
          header = source[start:source.index('\n);', start) + 3]
          ports = []
          for direction, declaration in re.findall(
              r'\b(input|output)\s+(.+?)(?=,\s*(?:input|output)\b|\s*\);)', header, re.S
          ):
              match = re.fullmatch(r'(.+?)\s+(\w+)\s*', declaration.split('=', 1)[0].strip(), re.S)
              if not match:
                  raise SystemExit('Unsupported port declaration')
              ports.append((direction, *match.groups()))
          outputs = [p for p in ports if p[0] == 'output']
          if len(ports) != 122 or len(outputs) != 103 or len({p[2] for p in ports}) != 122:
              raise SystemExit('Public-port contract changed')
          parameters = re.findall(r'parameter (?:int|string) (\w+)\s*=', header)
          widths = {}
          constants = {'CELLS': n, 'REQUEST_LANES': n//4,
                       'CELL_INDEX_BITS': n.bit_length()-1, 'COUNTER_BITS': 32,
                       'frp_m31_pkg::FRP_M31_STATE_BITS': 2,
                       'frp_m31_pkg::FRP_M31_INVARIANT_FLAGS': 10}
          for _, typ, name in ports:
              span = re.search(r'\[(.+):0\s*\]', typ, re.S)
              if span:
                  expr = span[1].replace('$clog2(CELLS)', str(n.bit_length()-1))
                  for key in sorted(constants, key=len, reverse=True):
                      expr = re.sub(r'\b' + re.escape(key) + r'\b', str(constants[key]), expr)
                  expr = ''.join(expr.split())
                  if not re.fullmatch(r'[0-9+*()\-]+', expr):
                      raise SystemExit('Unsupported port width: ' + name)
                  widths[name] = eval(expr, {'__builtins__': {}}) + 1
              else:
                  widths[name] = 3 if 'scheduler_state_e' in typ else 2 if 'scheduler_mode_e' in typ else 1
          contract = {name: [direction, widths[name]] for direction, _, name in ports}
          (e / 'ports.json').write_text(json.dumps(contract, indent=2) + '\n')

          # Preserve canonical RTL; omit only ROM sanity assertions in the synthesis view.
          view = Path(os.environ['RUNNER_TEMP']) / f'frp-68-synthesis-{n}'
          for line in (e / 'sources.sha256').read_text().splitlines():
              digest, relative = line.split()
              data = Path(relative).read_bytes()
              if hashlib.sha256(data).hexdigest() != digest:
                  raise SystemExit('Source mismatch: ' + relative)
              if relative.startswith('rtl/'):
                  destination = view / relative
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(data)
          phase = view / 'rtl/m31/frp_m31_phase_interference.sv'
          original = phase.read_text()
          start = original.index('    if (sin_lut[0] !==')
          end = original.index('      $fatal(1, "FRP M31 sine LUT three-quarter-cycle mismatch");', start)
          end += len('      $fatal(1, "FRP M31 sine LUT three-quarter-cycle mismatch");\n')
          normalized = original[:start] + original[end:]
          if hashlib.sha256(normalized.encode()).hexdigest() != '0190a40ed577986017fb686639af791e417fe494352635d04f34a058b29a7106':
              raise SystemExit('Unexpected synthesis-view normalization')
          phase.write_text(normalized)
          import difflib
          (e / 'synthesis-view.patch').write_text(''.join(difflib.unified_diff(
              original.splitlines(True), normalized.splitlines(True),
              fromfile='canonical/phase_interference.sv', tofile='synthesis/phase_interference.sv')))

          # The original task checker consumes netlist outputs; RTL runs alongside it.
          wrapper = header.replace('module ' + top, 'module ' + top + '_checked', 1) + '\n'
          wrapper += 'longint unsigned comparisons=0, frames=0;\n'
          wrapper += f'initial if (CELLS!={n} || CELL_INDEX_BITS!={n.bit_length()-1} || REQUEST_LANES!={n//4} || COUNTER_BITS!=32) $fatal(1,"Netlist profile mismatch");\n'
          for _, typ, name in outputs:
              wrapper += f'{typ} gold_{name};\n'
          wrapper += top + ' #(' + ','.join(f'.{p}({p})' for p in parameters) + ') rtl (\n'
          wrapper += ',\n'.join(f'.{name}({"gold_" if d == "output" else ""}{name})'
                               for d, _, name in ports) + '\n);\n'
          wrapper += f'{top}_net netlist (.*);\n'
          wrapper += 'always @(posedge clk or negedge clk or negedge rst_n) begin\n#0.1; frames++;\n'
          for _, _, name in outputs:
              wrapper += f'comparisons++; if ({name} !== gold_{name}) $fatal(1,"RTL/netlist mismatch: {name}");\n'
          wrapper += 'end\nendmodule\n'
          bench = Path(f'rtl/m32/{tb}.sv').read_text()
          if bench.count(top + ' #(') != 1 or bench.count('$finish;') != 1:
              raise SystemExit('Unexpected testbench structure')
          bench = bench.replace(top + ' #(', top + '_checked #(', 1)
          bench = bench.replace('$finish;', '''
              if (dut.frames < 2*cycles || dut.comparisons != 103*dut.frames)
                $fatal(1,"Incomplete RTL/netlist observation coverage");
              $display("PASS NETLIST_EQUIVALENCE cells=%0d outputs=103 frames=%0d comparisons=%0d",
                CELLS,dut.frames,dut.comparisons);
              $finish;''', 1)
          (e / 'checked.sv').write_text(bench + '\n' + wrapper)
          simlib = Path(yowasp_yosys.__file__).resolve().parent / 'share' / 'simlib.v'
          (e / 'yosys-simlib.v').write_bytes(simlib.read_bytes())

          structures = []
          for replay in (1, 2):
              stem = f'net-{replay}'
              script = (
                  'read_slang -j 1 --std 1800-2017 --ignore-assertions '
                  f'-G CELLS={n} -G REQUEST_LANES={n//4} -G COUNTER_BITS=32 '
                  f'--top {top} -Irtl/m31 -Irtl/m32 rtl/m32/{top}.sv; '
                  f'synth -top {top} -noalumacc -noshare -run begin:fine; check -assert; '
                  f'write_json {json.dumps(str(e / (stem + "-raw.json")))}'
              )
              export = (
                  f'read_json {json.dumps(str(e / (stem + "-raw.json")))}; '
                  'techmap -map +/techmap.v t:$shiftx; opt_clean; check -assert; '
                  'select -assert-none t:$shiftx t:$connect; '
                  f'rename {top} {top}_net; '
                  f'write_json {json.dumps(str(e / (stem + ".json")))}; '
                  f'write_verilog -noattr {json.dumps(str(e / (stem + ".v")))}'
              )
              (e / (stem + '.ys')).write_text(script + '\n')
              print(f'Synthesis cells={n} replay={replay}', flush=True)
              subprocess.run(['yowasp-yosys', '-Q', '-T', '-q', '-l', str(e / (stem + '.log')),
                              '-s', str(e / (stem + '.ys'))], check=True, timeout=1800, cwd=view)
              raw = json.loads((e / (stem + '-raw.json')).read_text())
              (e / (stem + '-export.ys')).write_text(export + '\n')
              subprocess.run(['yowasp-yosys', '-Q', '-T', '-q', '-l', str(e / (stem + '-export.log')),
                              '-s', str(e / (stem + '-export.ys'))], check=True, timeout=600)
              mapped = json.loads((e / (stem + '.json')).read_text())
              if set(raw['modules']) != {top} or set(mapped['modules']) != {top + '_net'}:
                  raise SystemExit('Unexpected synthesized hierarchy')
              original, module = raw['modules'][top], mapped['modules'][top + '_net']
              def port_types(m):
                  return {k: (v['direction'], len(v['bits']), v.get('signed', 0))
                          for k, v in m['ports'].items()}
              if port_types(original) != port_types(module):
                  raise SystemExit('Export changed port types')
              if {k: [v['direction'], len(v['bits'])] for k, v in module['ports'].items()} != contract:
                  raise SystemExit('Netlist port contract mismatch')
              def memories(m):
                  return {k: c['parameters'] for k, c in m['cells'].items() if c['type'] == '$mem_v2'}
              if not memories(original) or memories(original) != memories(module):
                  raise SystemExit('ROM parameters or initialization changed')
              for m in (original, module):
                  if m.get('processes') or not m['cells']:
                      raise SystemExit('Incomplete synthesis')
                  if any(not c['type'].startswith('$') or 'latch' in c['type'].lower()
                         for c in m['cells'].values()):
                      raise SystemExit('Unresolved module or latch')
                  if not any('dff' in c['type'].lower() for c in m['cells'].values()):
                      raise SystemExit('Retained registers missing')
              log = (e / (stem + '.log')).read_text()
              if 'ERROR:' in log or 'Found and reported 0 problems.' not in log:
                  raise SystemExit('Synthesis structural check failed')
              structures.append(dict(replay=replay, cells=n, logic_cells=len(module['cells']),
                                     sha256=hashlib.sha256((e / (stem + '.v')).read_bytes()).hexdigest()))
          for suffix in ('-raw.json', '.json', '.v'):
              if (e / ('net-1' + suffix)).read_bytes() != (e / ('net-2' + suffix)).read_bytes():
                  raise SystemExit('Synthesis replay mismatch: ' + suffix)
          (e / 'structure.json').write_text(json.dumps(structures, indent=2) + '\n')

          command = [
              'verilator-cli', '-DSIMLIB_NOCONNECT', '--binary', '--timing', '--assert',
              '-Wall', '-Wno-fatal', '--output-groups', '0', '-MAKEFLAGS', 'OPT_FAST=-O0',
              '-MAKEFLAGS', 'VK_PCH_I_FAST=', '-MAKEFLAGS', 'VK_PCH_I_SLOW=', '-j', '1', '-CFLAGS', '-std=c++20',
              '--top-module', tb, f'-GCELLS={n}', '--Mdir', str(build), '-Irtl/m31', '-Irtl/m32',
              '-v', str(e / 'yosys-simlib.v'), str(e / 'checked.sv'), str(e / 'net-1.v'),
          ]
          (e / 'build-command.json').write_text(json.dumps(command, indent=2) + '\n')
          with (e / 'build.log').open('w') as log:
              built = subprocess.run(command, stdout=log, stderr=subprocess.STDOUT, timeout=1800)
          text = (e / 'build.log').read_text(errors='replace')
          if built.returncode or re.search(r'%Error|%Warning-(PINMISSING|IMPLICIT|MULTIDRIVEN)', text):
              print(text[-16000:])
              raise SystemExit('RTL/netlist build failed')
          print('PASS build', n, flush=True)
          def fields(line, prefix):
              result = {}
              for token in line[len(prefix):].split():
                  key, separator, value = token.partition('=')
                  if not separator or not re.fullmatch(r'[A-Za-z_][A-Za-z_0-9]*', key) or key in result:
                      raise SystemExit(f'Malformed or duplicate field: {token}')
                  if key == 'signature':
                      if not re.fullmatch(r'[0-9a-f]{16}', value):
                          raise SystemExit('Invalid signature')
                      result[key] = value
                  else:
                      if not re.fullmatch(r'-?[0-9]+', value):
                          raise SystemExit(f'Invalid integer: {token}')
                      result[key] = int(value)
              return result

          def collect(path):
              lines = path.read_text().splitlines()
              selected = [line for line in lines if line.startswith(('RECOVERY ', 'PASS RECOVERY '))]
              cases = [fields(line, 'RECOVERY ') for line in selected if line.startswith('RECOVERY ')]
              passes = [fields(line, 'PASS RECOVERY ') for line in selected if line.startswith('PASS RECOVERY ')]
              if len(cases) != 12 or len(passes) != 1:
                  raise SystemExit(f'{path.name}: expected twelve cases and one PASS record')
              expected_cases = {(mode, profile) for mode in range(3) for profile in range(4)}
              observed_cases = {(row['mode'], row['profile']) for row in cases}
              if observed_cases != expected_cases:
                  raise SystemExit('Missing or duplicated recovery profile')
              for row in cases:
                  if (row['cells'] != n or not 0 <= row['shock_R'] < 1073741824 // 4
                          or row['late_R'] < 1073741824 * 15 // 16
                          or row['late_R'] < row['shock_R'] + 1073741824 // 16
                          or row['min_margin'] <= 0
                          or row['routes'] <= 0 or row['completions'] <= 0):
                      raise SystemExit(f'Recovery acceptance failed: {row}')
              total = passes[0]
              if total['cells'] != n or total['cases'] != 12 or total['cycles'] != 17604:
                  raise SystemExit('Incomplete recovery run')
              for key in ('checks', 'routes', 'completions', 'zero_memory', 'hot',
                          'gamma', 'attenuation', 'cooling', 'holds', 'delayed'):
                  if total[key] <= 0:
                      raise SystemExit(f'Missing coverage: {key}')
              semantic = '\n'.join(selected) + '\n'
              digest = hashlib.sha256(semantic.encode()).hexdigest()
              if digest != golden[n]:
                  raise SystemExit(f'Qualified result mismatch: expected {golden[n]}, observed {digest}')
              return cases, total, semantic

          def collect_equivalence(path):
              lines = path.read_text().splitlines()
              hits = [line for line in lines if line.startswith('PASS NETLIST_EQUIVALENCE ')]
              if len(hits) != 1:
                  raise SystemExit('Missing or duplicate equivalence record')
              values = fields(hits[0], 'PASS NETLIST_EQUIVALENCE ')
              if set(values) != {'cells', 'outputs', 'frames', 'comparisons'}:
                  raise SystemExit('Invalid equivalence record')
              if values['cells'] != n or values['outputs'] != 103:
                  raise SystemExit('Equivalence profile mismatch')
              if values['frames'] < 2*17604 or values['comparisons'] != 103*values['frames']:
                  raise SystemExit('Incomplete output observation coverage')
              return values

          results = []
          for replay in (1, 2):
              path = e / f'run-{replay}.log'
              print(f'Simulating cells={n} replay={replay}', flush=True)
              with path.open('w') as stream:
                  ran = subprocess.run([str(build / ('V' + tb))], stdout=stream,
                                       stderr=subprocess.STDOUT, timeout=900)
              print(path.read_text(errors='replace'), flush=True)
              if ran.returncode:
                  raise SystemExit(f'Simulation failed: replay {replay}')
              cases, total, semantic = collect(path)
              equivalence = collect_equivalence(path)
              results.append((cases, total, semantic, equivalence))
              (e / f'replay-{replay}.txt').write_text(semantic + json.dumps(equivalence, sort_keys=True) + '\n')
          if results[0] != results[1]:
              raise SystemExit('Simulation replay mismatch')
          subprocess.run(['sha256sum', '--check', str(e / 'sources.sha256')], check=True)
          summary = (
              f'### FRP 68: M32 phase recovery post-synthesis — PASS ({n} cells)\n\n'
              '12 profiles; two identical synthesis replays and two simulation replays.\n\n'
              f'All 103 public outputs matched across {equivalence["frames"]} settled frames: '
              f'{equivalence["comparisons"]} comparisons per replay.\n\n'
              'The original recovery checker consumes synthesized-netlist outputs.\n\n'
              'Each profile: 1024 recovery snapshots with positive C-P; final mean R >= 15/16.\n\n'
              'Phase recovery, thermal/gamma feedback, active-zero routes and retention match FRP 67.\n\n'
              'Synthesis: Yosys begin:fine, with shiftx simulation mapping; ports and ROM preserved.\n\n'
              '```text\n' + semantic + '```\n'
          )
          (e / 'summary.md').write_text(summary)
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as stream:
              stream.write(summary)
          report = dict(status='PASS', commit=os.environ['GITHUB_SHA'], cells=n,
                        synthesis_replays=2, simulation_replays=2, cases=cases, total=total,
                        semantic_sha256=golden[n], equivalence=equivalence, synthesis=structures)
          (e / 'qualification.json').write_text(json.dumps(report, indent=2, sort_keys=True) + '\n')
          (e / 'artifacts.sha256').write_text(''.join(
              f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n'
              for p in sorted(e.iterdir()) if p.is_file() and p.name != 'artifacts.sha256'
          ))
          print(summary)
          PYTHON
          sha256sum --check "$FRP68_EVIDENCE/sources.sha256" \
            > "$FRP68_EVIDENCE/source-recheck.log"

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: frp-68-phase-recovery-${{ matrix.cells }}-${{ github.sha }}
          path: ${{ runner.temp }}/frp-68-evidence/
          if-no-files-found: error
          retention-days: 30
