name: 02 - FRP Update Qualification to 60 Runs

run-name: "02 - FRP Update Qualification to 60 Runs | main @ ${{ github.sha }}"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frp-01-m31-m32-rtl-netlist-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      LC_ALL: C.UTF-8
      TZ: UTC
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out the dispatched commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Prepare the exact validated 60-run workflow
        id: prepare
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          import difflib
          import hashlib
          import json
          import os
          import pprint
          import subprocess
          import textwrap
          from pathlib import Path

          root = Path.cwd().resolve()
          workflow = root / '.github/workflows/frp-01-m31-m32-rtl-netlist.yml'
          evidence = Path(os.environ['RUNNER_TEMP']) / 'frp-02-workflow-update'
          evidence.mkdir(parents=True, exist_ok=True)
          base_sha = '5aacdc7a645167c5028c3ee408966d5a76be43c74347adeaf4f773af59bf3459'
          target_sha = 'bbd072a5a716a22a40aaa223eddc83a5dd59a6a55f7ec7e9590ac0bf89504d16'

          def require(condition, message):
              if not condition:
                  raise RuntimeError(message)

          def sha(raw):
              return hashlib.sha256(raw).hexdigest()

          require(os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch', 'Manual dispatch required')
          require(os.environ['GITHUB_REF'] == 'refs/heads/main', 'Dispatch from main only')
          require(os.environ['GITHUB_REPOSITORY'] ==
                  'maximumberlin76-gif/Fractal-Resonance-Processor-FRP-Ternary-Resonant-Coherence-Processor',
                  'Unexpected repository')
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          require(head == os.environ['GITHUB_SHA'], 'Checkout differs from the dispatched commit')
          require(workflow.is_file() and not workflow.is_symlink(), 'Missing qualification workflow')
          raw = workflow.read_bytes()
          require(sha(raw) in (base_sha, target_sha), 'Workflow differs from both validated versions')

          rows = []
          for directory in ('rtl', 'fpga'):
              for path in sorted((root / directory).rglob('*')):
                  require(not path.is_symlink(), 'Source symlinks are not supported')
                  if path.is_file():
                      data = path.read_bytes()
                      rows.append(f'{path.relative_to(root).as_posix()}|{len(data)}|{sha(data)}')
          source_sha = sha(('\n'.join(sorted(rows)) + '\n').encode())
          require(len(rows) == 117 and source_sha ==
                  'c1d08262d816a72a56369a2bc142a673ea53a26c23fe6bb5d3047d10aebb4328',
                  'RTL or FPGA source tree differs from validated commit 842df4e')

          tb = root / 'rtl/m32/frp_m32_reserved_mode_recovery_tb.sv'
          require(len(tb.read_bytes()) == 38495 and sha(tb.read_bytes()) ==
                  '4ba80ae367407c4bda49ca69a90e703ba690c7a449263fcb894a1a1ce97a283b',
                  'Reserved-mode testbench differs from the validated source')
          if sha(raw) == target_sha:
              require(len(raw) == 187780 and len(raw.splitlines()) == 2966,
                      'Unexpected target workflow size')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
                  stream.write('changed=false\n')
              (evidence / 'result.json').write_text(json.dumps({
                  'status': 'ALREADY_UPDATED', 'commit': head, 'workflow_sha256': target_sha,
                  'qualification_executed': False, 'simulation_runs': 0,
              }, indent=2) + '\n')
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
                  stream.write('Workflow 01 already contains the exact validated 60-run configuration.\n'
                               'No repository change and no qualification run were performed.\n'
                               'Start a new manual workflow 01 run on main.\n')
              print('ALREADY_UPDATED: no commit required', flush=True)
              raise SystemExit(0)
          require(len(raw) == 178055 and len(raw.splitlines()) == 2790,
                  'Unexpected 58-run workflow size')
          text = raw.decode('utf-8')

          matrix = {'entry_cases': 384,
           'recovery_cases': 384,
           'recovery_retention_checks': 384,
           'drained_route_checks': 768}

          streams = [{'workload': 0,
            'recovery_mode': 0,
            'ticks': 256,
            'phase': '2531586bb7745f5870d7acd88f580fd62dcff43bfeebbd2897f364af912697ff',
            'frequency': '00010f5b00010f5d00010f5b00010f5b00010f5b00010f5d0000ffff00010000',
            'state': 'ddd0',
            'pending': '0007',
            'temperature': '00000000',
            'peak': '00000000'},
           {'workload': 0,
            'recovery_mode': 1,
            'ticks': 256,
            'phase': '2531586bb7745f5870d7acd88f580fd60897fc37d9b533d6bd2a3f82b65e15c9',
            'frequency': '00010f5b00010f5d00010f5b00010f5b0000ffff0001000100010f5b00010f5b',
            'state': 'dd0d',
            'pending': '0070',
            'temperature': '00000000',
            'peak': '00000000'},
           {'workload': 0,
            'recovery_mode': 2,
            'ticks': 256,
            'phase': '2531586bb7745f584ba02f106a2069502dcff43bfeebbd28bd2a3f82b65e15c9',
            'frequency': '00010f5b00010f5d0000ffff0000ffff00010f5b00010f5d00010f5b00010f5b',
            'state': 'd0dd',
            'pending': '0700',
            'temperature': '00000000',
            'peak': '00000000'},
           {'workload': 1,
            'recovery_mode': 0,
            'ticks': 256,
            'phase': '1c046107340c1cac18b914ee27c76c418cb8344c14c88e7b2b09ad041721bb21',
            'frequency': '00010f5b00010f5d00010f5b00010f5b0000ffff0001000100010f5b00010f5b',
            'state': 'dd0d',
            'pending': '0070',
            'temperature': '00000000',
            'peak': '00000000'},
           {'workload': 1,
            'recovery_mode': 1,
            'ticks': 256,
            'phase': '17477587333e53201b8a87fa52ac51852f16dc0ff6ba6578268bc80912e6d748',
            'frequency': '00010f5b00010f5d0000ffff0000ffff00010f5b00010f5d00010f5b00010f5b',
            'state': 'd0dd',
            'pending': '0700',
            'temperature': '00000000',
            'peak': '00000000'},
           {'workload': 1,
            'recovery_mode': 2,
            'ticks': 256,
            'phase': 'e1cfd0e50400efbd08ea687a7587fa0a41c40880d313a803f4c43ec3e01e1c2b',
            'frequency': '0000ffff0001000100010f5b00010f5b00010f5b00010f5d00010f5b00010f5b',
            'state': '0ddd',
            'pending': '7000',
            'temperature': '00000000',
            'peak': '00000000'}]

          final_metrics = {'profiles': 6,
           'steps': 26181,
           'checks': 86133,
           'output_bits': 2075,
           'entry_cases': 384,
           'recovery_cases': 384,
           'reset_cases': 48,
           'stream_ticks': 1536,
           'invalid_ticks': 2928,
           'invalid_holds': 630,
           'invalid_dynamic_ticks': 2832,
           'invalid_phase_updates': 2832,
           'invalid_frequency_updates': 1494,
           'invalid_capture_ticks': 2928,
           'invalid_auto_ticks': 1308,
           'invalid_external_ticks': 1620,
           'invalid_loads': 192,
           'invalid_retention_checks': 3558,
           'diagnostic_checks': 4380,
           'retained_diagnostic_checks': 3462,
           'restored_diagnostic_checks': 918,
           'recovery_retention_checks': 384,
           'drained_route_checks': 774,
           'dynamic_ticks': 22317,
           'held_edges': 3660,
           'loads': 1236,
           'resets': 870,
           'pending_resets': 48,
           'clear_ticks': 228,
           'clear_holds': 978,
           'target_lag_samples': 6310,
           'state_feedback_samples': 149768,
           'switch_feedback_samples': 9812,
           'heating_ticks': 4926,
           'cooling_ticks': 12659,
           'first_legs': 1700,
           'second_legs': 1604,
           'first_cells': 255,
           'second_cells': 255,
           'live_control_checks': 4110,
           'free_ticks': 11209,
           'balance_ticks': 3668,
           'commit_ticks': 524,
           'excite_ticks': 524,
           'neutralize_ticks': 3668}

          standalone = {'metrics': final_metrics}

          def replace(old, new):
              global text
              require(text.count(old) == 1, 'Missing or ambiguous update anchor: ' + old[:140])
              text = text.replace(old, new)

          def block(source, extra=0):
              return textwrap.indent(textwrap.dedent(source).strip('\n') + '\n', ' ' * (10 + extra))

          replace('| 58 runs @', '| 60 runs @')
          anchor = '          mode_handoff_post_tb = "rtl/m32/" + mode_handoff_post_bench + ".sv"\n'
          replace(anchor, anchor + block('''
          reserved_mode_bench = "frp_m32_reserved_mode_recovery_tb"
          reserved_mode_tb = "rtl/m32/" + reserved_mode_bench + ".sv"
          '''))
          anchor = '          report = {\n'
          values = ''.join(block(name + ' = ' + pprint.pformat(value, sort_dicts=False, width=96))
                           for name, value in [('reserved_mode_matrix_expected', matrix),
                                               ('reserved_mode_stream_expected', streams),
                                               ('reserved_mode_expected', standalone['metrics'])])
          replace(anchor, values + anchor)
          anchor = '              "mode_handoff_expected_metrics": mode_handoff_expected,\n'
          replace(anchor, anchor + block('"reserved_mode_expected_metrics": reserved_mode_expected,', 4))
          anchor = '          def mode_handoff_records(text):\n'
          replace(anchor, block(r'''
          def reserved_mode_records(text):
              records = [line for line in text.splitlines()
                         if line.startswith("FRP_M32_RESERVED_MODE_")]
              require(len(records) == len(reserved_mode_stream_expected) + 2,
                      "Incomplete or repeated reserved-mode recovery results")
              _, matrix_metrics = regression_record(records[0],
                  "FRP_M32_RESERVED_MODE_MATRIX:", reserved_mode_matrix_expected)
              fields = ("workload", "recovery_mode", "ticks", "phase", "frequency",
                        "state", "pending", "temperature", "peak")
              pattern = (r"FRP_M32_RESERVED_MODE_STREAM: PASS workload=(\d+) "
                         r"recovery_mode=(\d+) ticks=(\d+) phase=([0-9a-f]{64}) "
                         r"frequency=([0-9a-f]{64}) state=([0-9a-f]{4}) "
                         r"pending=([0-9a-f]{4}) temperature=([0-9a-f]{8}) peak=([0-9a-f]{8})")
              stream_metrics = []
              for record, wanted in zip(records[1:-1], reserved_mode_stream_expected):
                  match = re.fullmatch(pattern, record)
                  require(match is not None, "Malformed reserved-mode recovery stream")
                  observed = dict(zip(fields, match.groups()))
                  for name in ("workload", "recovery_mode", "ticks"):
                      observed[name] = int(observed[name])
                  require(observed == wanted,
                          "Reserved-mode stream order, dynamics or retained state differs")
                  stream_metrics.append(observed)
              _, metrics = regression_record(records[-1],
                  "FRP_M32_RESERVED_MODE_RECOVERY_TB:", reserved_mode_expected)
              return records, matrix_metrics, stream_metrics, metrics
          ''') + '\n' + anchor)
          anchor = '              report.update(base_source_set_sha256=digest,\n'
          replace(anchor, block('''
          visit(reserved_mode_tb)
          require(sources == set(identities) | {reserved_mode_tb},
                  "Unexpected reserved-mode recovery dependencies")
          reserved_mode_raw = (root / reserved_mode_tb).read_bytes()
          require(len(reserved_mode_raw) == 38495 and sha(reserved_mode_raw) ==
                  "4ba80ae367407c4bda49ca69a90e703ba690c7a449263fcb894a1a1ce97a283b",
                  "Reserved-mode regression differs from the validated testbench")
          identities[reserved_mode_tb] = {
              "bytes": len(reserved_mode_raw), "sha256": sha(reserved_mode_raw)}
          rows.append(f"{reserved_mode_tb}|{len(reserved_mode_raw)}|{sha(reserved_mode_raw)}")
          ''', 4) + anchor)
          anchor = '              mode_handoff_build = work / "mode-handoff-build"\n'
          replace(anchor, block(r'''
          reserved_mode_build = work / "reserved-mode-build"
          execute(compiler + ["--top-module", reserved_mode_bench,
              "--Mdir", str(reserved_mode_build), reserved_mode_tb],
              "reserved-mode-build", root, 600)
          reserved_mode_replays = []
          for attempt in (1, 2):
              log = execute([str(reserved_mode_build / ("V" + reserved_mode_bench))],
                            f"reserved-mode-run-{attempt}", root, 180)
              records, matrix_metrics, stream_metrics, metrics = reserved_mode_records(log.read_text())
              reserved_mode_replays.append(records)
          require(reserved_mode_replays[0] == reserved_mode_replays[1],
                  "Reserved-mode matrix, stream or summary replay records differ")
          report["reserved_mode_recovery"] = {
              "implementation": "RTL with independent fixed-point oracle", "replays": 2,
              "matrix": matrix_metrics, "streams": stream_metrics, "metrics": metrics,
              "records": reserved_mode_replays[0],
              "records_sha256": sha(("\n".join(reserved_mode_replays[0]) + "\n").encode())}
          print("\n".join(reserved_mode_replays[0]), flush=True)
          ''', 4) + '\n' + anchor)
          replace('              report.update(status="PASS", simulation_runs=58,\n',
                  '              report.update(status="PASS", simulation_runs=60,\n'
                  '                            reserved_mode_simulation_runs=2,\n')
          anchor = '                  "Simulation runs: 58.", "",\n'
          replace(anchor, '                  "Simulation runs: 60.", "",\n' + block('''
          "M32 reserved-mode recovery RTL regression: two identical eight-record replays; "
          "all 59 public outputs (2075 bits) match an independent oracle at 86133 checks per replay.",
          "384 entry cases and 384 recovery cases cover every working mode, cycle position and "
          "tick/clear/load/automatic-request combination; 48 reset cases preserve reset priority.",
          "Six uninterrupted 256-tick INVALID intervals retain active-zero routes while phase "
          "feedback and registered target capture continue. All six complete final states are checked exactly.",
          "2928 INVALID ticks, 3558 retention checks, 4380 diagnostic checks and 774 route drains "
          "are checked exactly; incoming mode cannot govern the handoff edge before registration.",
          "Returning to a valid mode preserves unmatched invalid-state ticks in the scheduler "
          "diagnostic; a held clear or reset removes that history. Clear plus an invalid tick "
          "records one unmatched tick. All 45 final metrics are checked exactly.",
          "This adds eight-cell RTL reserved-mode recovery coverage; post-synthesis reserved-mode "
          "recovery and model v0.9.3 workload equivalence remain separate qualifications.", "",
          ''', 8))

          updated = text.encode('utf-8')
          require(len(updated) == 187780 and len(text.splitlines()) == 2966,
                  'Unexpected updated workflow size')
          require(sha(updated) == target_sha, 'Updated workflow does not match the validated 60-run file')
          start_marker = "          python - <<'PY'\n"
          end_marker = '          PY\n'
          require(text.count(start_marker) == 1, 'Unexpected Python qualification block count')
          start = text.index(start_marker) + len(start_marker)
          end = text.index(end_marker, start)
          program = textwrap.dedent(text[start:end])
          ast.parse(program)
          compile(program, str(workflow), 'exec')
          patch = ''.join(difflib.unified_diff(raw.decode().splitlines(True), text.splitlines(True),
                          fromfile='workflow-58', tofile='workflow-60'))
          (evidence / 'workflow-update.diff').write_text(patch)
          (evidence / workflow.name).write_bytes(updated)
          (evidence / 'result.json').write_text(json.dumps({
              'status': 'PREPARED', 'dispatched_commit': head,
              'base_workflow_sha256': base_sha, 'workflow_sha256': target_sha,
              'source_tree_sha256': source_sha, 'workflow_bytes': len(updated),
              'workflow_lines': len(text.splitlines()), 'qualification_executed': False,
              'simulation_runs': 0, 'configured_simulation_runs': 60,
          }, indent=2) + '\n')
          workflow.write_bytes(updated)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('changed=true\n')
          print('PREPARED: exact validated 60-run workflow, SHA-256 ' + target_sha, flush=True)
          PY

      - name: Commit only the updated main qualification workflow
        if: steps.prepare.outputs.changed == 'true'
        env:
          FRP_WORKFLOW_UPDATE_TOKEN: ${{ secrets.FRP_WORKFLOW_UPDATE_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          import tempfile
          from pathlib import Path

          root = Path.cwd().resolve()
          path = '.github/workflows/frp-01-m31-m32-rtl-netlist.yml'
          evidence = Path(os.environ['RUNNER_TEMP']) / 'frp-02-workflow-update'
          expected = 'bbd072a5a716a22a40aaa223eddc83a5dd59a6a55f7ec7e9590ac0bf89504d16'
          repository = 'maximumberlin76-gif/Fractal-Resonance-Processor-FRP-Ternary-Resonant-Coherence-Processor'

          def require(condition, message):
              if not condition:
                  raise RuntimeError(message)

          def git(*args, env=None):
              return subprocess.check_output(['git', *args], cwd=root, env=env, text=True).strip()

          require(os.environ.get('FRP_WORKFLOW_UPDATE_TOKEN'),
                  'Add repository secret FRP_WORKFLOW_UPDATE_TOKEN with Contents and Workflows write permissions')
          require(os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch' and
                  os.environ['GITHUB_REF'] == 'refs/heads/main', 'Manual dispatch from main required')
          require(os.environ['GITHUB_REPOSITORY'] == repository, 'Unexpected repository')
          require(git('rev-parse', 'HEAD') == os.environ['GITHUB_SHA'], 'Unexpected local HEAD')
          require(hashlib.sha256((root / path).read_bytes()).hexdigest() == expected,
                  'Prepared workflow changed before publication')
          require(git('diff', '--name-only', '--').splitlines() == [path],
                  'Unexpected unstaged repository changes')
          require(not git('diff', '--cached', '--name-only', '--'), 'Unexpected staged changes')
          require(not git('ls-files', '--others', '--exclude-standard'), 'Unexpected untracked files')
          remote = 'https://github.com/' + repository + '.git'
          remote_head = git('ls-remote', '--exit-code', remote, 'refs/heads/main').split()[0]
          require(remote_head == os.environ['GITHUB_SHA'],
                  'main advanced after dispatch; start a new manual installer run')
          git('config', '--local', 'user.name', 'github-actions[bot]')
          git('config', '--local', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com')
          git('add', '--', path)
          require(git('diff', '--cached', '--name-only', '--').splitlines() == [path],
                  'The installer may commit only workflow 01')
          git('diff', '--cached', '--check')
          git('commit', '-m', 'Qualify M32 reserved-mode recovery in 60-run workflow',
              '-m', 'Add two deterministic reserved-mode recovery RTL replays with exact matrix, stream and coverage checks.')
          commit = git('rev-parse', 'HEAD')
          require(git('rev-parse', 'HEAD^') == os.environ['GITHUB_SHA'], 'Unexpected commit parent')
          with tempfile.TemporaryDirectory(prefix='frp-workflow-auth-', dir=os.environ['RUNNER_TEMP']) as tmp:
              askpass = Path(tmp) / 'askpass.sh'
              askpass.write_text('#!/bin/sh\ncase "$1" in\n'
                                 '  *Username*) printf "%s\\n" "x-access-token" ;;\n'
                                 '  *Password*) printf "%s\\n" "$FRP_WORKFLOW_UPDATE_TOKEN" ;;\n'
                                 '  *) exit 1 ;;\nesac\n')
              askpass.chmod(0o700)
              env = os.environ.copy()
              env.update(GIT_ASKPASS=str(askpass), GIT_TERMINAL_PROMPT='0')
              subprocess.run(['git', 'push', '--porcelain', remote, 'HEAD:refs/heads/main'],
                             cwd=root, env=env, check=True, timeout=120)
          result = json.loads((evidence / 'result.json').read_text())
          result.update(status='UPDATED', committed_sha=commit, changed_files=[path])
          (evidence / 'result.json').write_text(json.dumps(result, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write('Workflow 01 updated to the exact validated 60-run configuration.\n\n'
                           'Committed SHA: `' + commit + '`\n\n'
                           'Only `.github/workflows/frp-01-m31-m32-rtl-netlist.yml` was changed.\n\n'
                           'This installer performed zero simulation runs.\n\n'
                           'Next: Actions -> 01 - FRP M31-M32 RTL + Netlist -> Run workflow -> main.\n'
                           'Start a new run; re-running an older run retains its older commit.\n')
          print('UPDATED: ' + commit, flush=True)
          PY

      - name: Retain the prepared workflow and update evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frp-02-workflow-update-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/frp-02-workflow-update/
          if-no-files-found: warn
          retention-days: 90
