name: 74 - FRP M32 Route Under Load Regression
run-name: "74 - FRP Route Under Load | 8/16/32/64 cells and deterministic replay @ ${{ github.sha }}"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frp-74-route-under-load-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    name: M32 route-under-load - ${{ matrix.cells }} cells
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    strategy:
      fail-fast: false
      matrix:
        cells: [8, 16, 32, 64]
    defaults:
      run:
        shell: bash
    env:
      CELLS: ${{ matrix.cells }}
      LC_ALL: C.UTF-8
      TZ: UTC
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Initialize evidence directory
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/frp-74-evidence"
          printf 'commit=%s\ncells=%s\nrun=%s\nattempt=%s\n' \
            "$GITHUB_SHA" "$CELLS" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            > "$RUNNER_TEMP/frp-74-evidence/context.txt"
          echo "FRP74_EVIDENCE=$RUNNER_TEMP/frp-74-evidence" >> "$GITHUB_ENV"

      - name: Check out dispatched commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify manual execution and qualified sources
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          cat > "$FRP74_EVIDENCE/sources.sha256" <<'SHA'
          765429b33df3f843626bdc411ad8371fd963738a58ab10201abef75dcdafcaf0  rtl/m31/frp_m31_active_neutral.sv
          d0587897f955ce49923aca807b5d3e0c637383c88e5d5e0dfa8405f47917c123  rtl/m31/frp_m31_capacity_guard.sv
          e516a5cd378bd2ddecdadc5abb13ddef26c63fafe5bda65b47a6bd859ca66f92  rtl/m31/frp_m31_execution_core.sv
          6b2afb8d1583c93d95d2386ba25dd1eaef6bb5bd9a4e1c9e9abff1dd004cbf24  rtl/m31/frp_m31_fixed_point_pkg.sv
          df058d4e3671ba1d7c9d0403a6bb1b8c9750a0a967905b5f91cca455c1dddb83  rtl/m31/frp_m31_global_stability.sv
          cbb5a531283164d1d54d59ec748b97bf84e172704854bf5eb7c6bda2c502f7c7  rtl/m31/frp_m31_isqrt_u64.sv
          478882d4f6a2986f5079c88b444c7b007d68145d61e5150209cb0637f35b2ec0  rtl/m31/frp_m31_local_gamma_drift.sv
          6e10f738f94c43ac9748ec7a033adde16243beea59e2f7f2973a3ab51c2e5e04  rtl/m31/frp_m31_local_thermal_attenuation.sv
          cb97c1bfeabbb2acaebf2f9644d484b2f7c5e995dbf1b70777f6bc2e7df9368e  rtl/m31/frp_m31_local_thermal_field.sv
          18889d85e78b23b844f1db4c46a35a6b7d01e609e3f1f0e6263a39a6c5729411  rtl/m31/frp_m31_pending_routes.sv
          7ac3572ef2bf9feef509e7dc43c662d92d23fa3eb0563efbfa8dba7c28157746  rtl/m31/frp_m31_phase_interference.sv
          fa78bcfe965270cc74855908aa392989d857575a2097a126539aabb1aab8990d  rtl/m31/frp_m31_phase_request_adapter.sv
          762302f1c7a7f7f40cb029f5ada6a111fc8c3e3f6be9920e9b2401b95e179c94  rtl/m31/frp_m31_pkg.sv
          32f75cc70df5dba3f4fbb511397be9a5921236c2afd16cfeb1350eca3f6e8109  rtl/m31/frp_m31_request_lanes.sv
          fc9de24b41736e5c5a9f9e464318c80adbfda9dc8cc4362c0c55bfed403bf97f  rtl/m31/frp_m31_scheduler.sv
          adbb4b94fcf8fa0bfc981d654679fd7518a5c4c9c97b611a35cd8accaf28233d  rtl/m31/frp_m31_sin_q30.mem
          69c06833e6dfbb28e25b74a5787dcd03756dddf0f66726de3ea47c1ad2931931  rtl/m31/frp_m31_stability.sv
          ebad1f7ee952a577239445d33d99cae799afaaff5c181c7162514bbcea6eab90  rtl/m31/frp_m31_state_update.sv
          34df4ebfc5dfad8e3e5e454e560404585de5c881e6f75abaae367d3bd9fb11bd  rtl/m31/frp_m31_thermal_proxy.sv
          0be6c5ee28ee4a23baf6110143eec309f387200c1c2c80e3016353d5d4107541  rtl/m32/frp_m32_core.sv
          9626474b49d32b411e107d7ccc8ee5aa7f42728e9a6f70d634d16d3f2a414c5e  rtl/m32/frp_m32_registered_target_boundary.sv
          02250069a68737f055a419cd67bf2d439b3f63b3f6a7a245f40e9bf29d1958eb  rtl/m32/frp_m32_registered_target_request_path.sv
          60bf854a097785c76b9a557fdcb7779e066984481f158eb1a790e30c0ad69720  rtl/m32/frp_m32_route_under_load_tb.sv
          SHA
          sha256sum .github/workflows/frp-74-m32-route-under-load-regression.yml \
            >> "$FRP74_EVIDENCE/sources.sha256"
          sha256sum --check --strict "$FRP74_EVIDENCE/sources.sha256" \
            | tee "$FRP74_EVIDENCE/source-check.log"
          printf '%s\n' "$GITHUB_SHA" > "$FRP74_EVIDENCE/commit.txt"

      - name: Install and record toolchain
        run: |
          set -euo pipefail
          {
            python -m pip install --disable-pip-version-check \
              verilator==5.48.0 systemc==3.0.2.1
            python -m pip check
            verilator-cli --version
            g++ --version
            make --version
          } 2>&1 | tee "$FRP74_EVIDENCE/toolchain.log"
          python -m pip freeze > "$FRP74_EVIDENCE/packages.txt"

      - name: Build once and qualify two full replays
        run: |
          set -euo pipefail
          python - <<'PYTHON'
          import hashlib
          import json
          import os
          import re
          import signal
          import subprocess
          import time
          from pathlib import Path

          GOLDEN = {
              8: '08ebca04f32205e5cd63c43874b4003816b90dcdf7a566da29efb2f076137389',
              64: 'e50938e103670be49b808c98edb01802d256ac287e42a871dec74e1aad57a7bb',
          }

          def require(condition, message):
              if not condition:
                  raise SystemExit(message)

          def record(line, prefix, schema, n):
              require(line.startswith(prefix), f'Missing record: {prefix}')
              result = {}
              for token in line[len(prefix):].split():
                  key, separator, value = token.partition('=')
                  require(separator and key not in result, f'Malformed or duplicate field: {token}')
                  pattern = r'[0-9a-f]{16}' if key == 'signature' else r'[0-9]+'
                  require(re.fullmatch(pattern, value), f'Invalid field: {token}')
                  result[key] = value if key == 'signature' else int(value)
              require(set(result) == set(schema.split()), f'Incorrect field set: {prefix}')
              require(result['cells'] == n, f'Incorrect cell count: {prefix}')
              return result

          def collect(path, n):
              text = path.read_text(errors='strict')
              require(not re.search(r'%Error|%Fatal|Assertion failed|Aborting|^FAIL\b', text, re.M),
                      'Simulation failure marker')
              selected = [line.strip() for line in text.splitlines()
                          if line.strip().startswith(('BOUNDED_REFILL', 'FULL_REFILL', 'MIXED_STREAM', 'PASS'))]
              require(len(selected) == 10, f'Expected 10 semantic records, got {len(selected)}')
              bound = n - n//4 + 1
              profiles = []
              for mode in range(3):
                  bounded = record(selected[3*mode], 'BOUNDED_REFILL ',
                                   'cells mode opportunities bound enabled_ticks', n)
                  expected = dict(cells=n, mode=mode, bound=bound,
                                  opportunities=4 if mode == 0 else bound,
                                  enabled_ticks=4 if mode == 0 else 8*bound-5+mode)
                  require(bounded == expected, f'Incorrect bounded-refill profile: mode {mode}')
                  full = record(selected[3*mode+1], 'FULL_REFILL ',
                                'cells mode service_window retained release_services', n)
                  expected = dict(cells=n, mode=mode, service_window=12,
                                  retained=int(mode != 0), release_services=0 if mode == 0 else 3)
                  require(full == expected, f'Incorrect full-refill profile: mode {mode}')
                  mixed = record(selected[3*mode+2], 'MIXED_STREAM ',
                                 'cells mode enabled_ticks', n)
                  require(mixed == dict(cells=n, mode=mode, enabled_ticks=1024),
                          f'Incomplete mixed-stream profile: mode {mode}')
                  profiles.append(dict(bounded=bounded, full=full, mixed=mixed))
              total = record(selected[9], 'PASS ROUTE_UNDER_LOAD ',
                             'cells cycles checks created completed loaded_edges service_edges '
                             'conflicts duplicates capacity_waits paused_routes cadence_waits '
                             'lower_arrivals max_service_age max_wall_age signature', n)
              cycles = 4060 + sum(t + (t+10)//11 for t in (8*bound-4, 8*bound-3))
              require(total['cycles'] == cycles, 'Incomplete edge sequence')
              require(total['loaded_edges'] == cycles-432, 'Incorrect load edge count')
              require(total['created'] == total['completed'] > 0, 'Route conservation mismatch')
              require(total['checks'] >= 340758, 'Incomplete assertion count')
              for key in ('service_edges', 'conflicts', 'duplicates', 'capacity_waits',
                          'paused_routes', 'cadence_waits', 'lower_arrivals'):
                  require(total[key] > 0, f'Missing load interaction: {key}')
              require(total['service_edges'] <= total['loaded_edges'], 'Service edge count exceeds load')
              require(total['max_service_age'] >= bound, 'Bounded-refill service age not reached')
              require(total['max_service_age'] <= total['max_wall_age'] <= cycles,
                      'Inconsistent service and wall ages')
              semantic = '\n'.join(selected) + '\n'
              digest = hashlib.sha256(semantic.encode()).hexdigest()
              if n in GOLDEN:
                  require(digest == GOLDEN[n], f'{n}-cell baseline mismatch: {digest}')
              return {'profiles': profiles, 'total': total, 'semantic_sha256': digest}, semantic

          n = int(os.environ['CELLS'])
          require(n in (8, 16, 32, 64), 'Unsupported cell count')
          evidence = Path(os.environ['FRP74_EVIDENCE']).resolve()
          build = Path(os.environ['RUNNER_TEMP']) / f'frp-74-build-{n}'
          top = 'frp_m32_route_under_load_tb'
          commands = []

          def run(command, logfile, seconds):
              entry = {'argv': command, 'timeout_seconds': seconds, 'log': logfile, 'status': 'running'}
              commands.append(entry)
              def save():
                  (evidence / 'commands.json').write_text(json.dumps(commands, indent=2) + '\n')
              save()
              print('Running:', command, flush=True)
              path = evidence / logfile
              started = time.monotonic()
              process = None
              try:
                  with path.open('w') as stream:
                      process = subprocess.Popen(command, stdout=stream, stderr=subprocess.STDOUT,
                                                 start_new_session=True)
                      while True:
                          remaining = seconds - (time.monotonic() - started)
                          if remaining <= 0:
                              raise TimeoutError(f'{logfile}: timeout after {seconds} seconds')
                          try:
                              code = process.wait(timeout=min(30, remaining))
                              break
                          except subprocess.TimeoutExpired:
                              print(f'{logfile}: running, elapsed={time.monotonic()-started:.0f}s, '
                                    f'log_bytes={path.stat().st_size}', flush=True)
                  entry['returncode'] = code
                  require(code == 0, f'{logfile}: exit {code}')
                  entry['status'] = 'passed'
              except BaseException as error:
                  if process is not None and process.poll() is None:
                      os.killpg(process.pid, signal.SIGKILL)
                      process.wait()
                  entry['status'] = 'failed'
                  entry['error'] = str(error)
                  if path.exists():
                      print(path.read_text(errors='replace')[-16000:], flush=True)
                  raise
              finally:
                  entry['elapsed_seconds'] = round(time.monotonic() - started, 3)
                  save()
              print(f'{logfile}: passed in {entry["elapsed_seconds"]}s', flush=True)

          run([
              'verilator-cli', '--binary', '--output-groups', '0',
              '--timing', '--assert', '-Wno-fatal', '-j', '1',
              '-CFLAGS', '-std=c++20', '-MAKEFLAGS', 'OPT_FAST=-O0',
              '-MAKEFLAGS', 'VK_PCH_I_FAST=', '-MAKEFLAGS', 'VK_PCH_I_SLOW=',
              '--top-module', top, f'-GCELLS={n}', '--Mdir', str(build),
              '-Irtl/m31', '-Irtl/m32', f'rtl/m32/{top}.sv',
          ], 'compile.log', 3600)
          compile_log = (evidence / 'compile.log').read_text(errors='replace')
          require(not re.search(r'%Error|%Warning-(PINMISSING|IMPLICIT|MULTIDRIVEN)\b', compile_log),
                  'Compile error or unexpected port, implicit signal or multiple driver')
          executable = build / f'V{top}'
          (evidence / 'executable.sha256').write_text(
              f'{hashlib.sha256(executable.read_bytes()).hexdigest()}  V{top}\n')
          replays = []
          for replay in (1, 2):
              logfile = f'run-{replay}.log'
              run([str(executable)], logfile, 3600)
              result, semantic = collect(evidence / logfile, n)
              (evidence / f'run-{replay}.txt').write_text(semantic)
              replays.append((result, semantic))
              print(semantic, end='')
          require(replays[0] == replays[1], 'Deterministic replay mismatch')
          result, semantic = replays[0]
          report = {
              'commit': os.environ['GITHUB_SHA'], 'cells': n, 'builds': 1,
              'replays': 2, 'replay_equal': True, 'semantic_records': 10,
              'baseline_checked': n in GOLDEN, **result,
          }
          (evidence / 'qualification.json').write_text(json.dumps(report, indent=2) + '\n')
          summary = (f'### FRP 74: {n} cells - PASS\n\n'
                     'One build; two full replays; nine profiles and ten records per replay.\n\n'
                     'Each mode: bounded refill, full refill, and 1024-tick mixed stream.\n\n'
                     'Modes: 0 FREE, 1 7/1, 2 1/7.\n\n'
                     f'Semantic SHA-256: `{result["semantic_sha256"]}`\n\n'
                     '```text\n' + semantic.splitlines()[-1] + '\n```\n')
          (evidence / 'summary.md').write_text(summary)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write(summary)
          print('PASS: route under load and deterministic replay')
          PYTHON

      - name: Recheck qualified sources
        if: always()
        run: |
          set -euo pipefail
          sha256sum --check --strict "$FRP74_EVIDENCE/sources.sha256" \
            | tee "$FRP74_EVIDENCE/source-recheck.log"

      - name: Hash qualification evidence
        if: always()
        run: |
          set -euo pipefail
          python - <<'PYTHON'
          import hashlib
          import os
          from pathlib import Path
          root = Path(os.environ['FRP74_EVIDENCE'])
          files = sorted(p for p in root.rglob('*') if p.is_file() and p.name != 'evidence.sha256')
          manifest = ''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(root)}\n'
                             for p in files)
          (root / 'evidence.sha256').write_text(manifest)
          PYTHON

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          name: frp-74-route-under-load-${{ matrix.cells }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/frp-74-evidence/
          if-no-files-found: error
          retention-days: 30
