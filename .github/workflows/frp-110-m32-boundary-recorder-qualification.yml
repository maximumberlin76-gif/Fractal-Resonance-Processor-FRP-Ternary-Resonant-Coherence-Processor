name: 110 - FRP M32 Boundary Recorder Qualification
run-name: '110 - FRP Boundary Recorder | 18 configurations, 4 seeds, 4 mutations @ ${{ github.sha }}'

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install simulation tools
        run: |
          set -euo pipefail
          mkdir -p bundle
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential
          python -m pip install --disable-pip-version-check 'verilator==5.48.0'
          {
            python --version
            python -m pip show verilator
            verilator-cli --version
            g++ --version
            make --version
          } > bundle/toolchain.txt 2>&1

      - name: Qualify recorder and mutation detection
        run: |
          set -euo pipefail
          ulimit -c 0
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          import shlex
          import subprocess
          import tempfile
          from pathlib import Path

          root = Path('source').resolve()
          out = Path('bundle').resolve()
          out.mkdir(exist_ok=True)
          seeds = (0, 76, 2026, 4294967295)
          profiles = {(n, b) for n in (1, 8, 9, 16, 32, 64) for b in (1, 3, 64)}
          fixed = dict(checks=4721, accepted=3828, resets=23,
                       clears=144, holds=703, collisions=127)
          keys = set(fixed) | {'cells', 'count_bits', 'seed', 'crossings',
                              'min_ties', 'peak_ties', 'overflow_samples',
                              'post_overflow_crossings', 'signature'}
          report = {'schema': 'frp.m32.boundary_recorder.qualification.v1',
                    'status': 'RUNNING', 'seeds': list(seeds),
                    'configurations': 18, 'replays_per_seed': 2,
                    'runs': [], 'mutations': [], 'control': 'PENDING'}

          def require(ok, message):
              if not ok:
                  raise RuntimeError(message)

          def save():
              (out / 'results.json').write_text(json.dumps(report, indent=2) + '\n')

          def execute(command, log_name, seconds, cwd, expect_success=True):
              command = ['timeout', '--kill-after=15s', str(seconds) + 's'] + command
              path = out / log_name
              with path.open('w') as log:
                  log.write(shlex.join(command) + '\n')
                  log.flush()
                  result = subprocess.run(command, cwd=cwd, stdout=log,
                                          stderr=subprocess.STDOUT)
              text = path.read_text(errors='replace')
              if expect_success:
                  require(result.returncode == 0,
                          f'{log_name}: exit {result.returncode}')
              return result.returncode, text

          def parse(text, seed, wanted, matrix):
              records = {}
              for line in text.splitlines():
                  if not line.startswith('PASS BOUNDARY_RECORDER cells='):
                      continue
                  tokens = line.split()[2:]
                  fields = dict(token.split('=', 1) for token in tokens)
                  require(set(fields) == keys and len(tokens) == len(keys),
                          'PASS field set mismatch')
                  require(re.fullmatch(r'[0-9a-f]{16}', fields['signature']),
                          'Invalid trajectory signature')
                  record = {k: (v if k == 'signature' else int(v))
                            for k, v in fields.items()}
                  pair = (record['cells'], record['count_bits'])
                  require(pair in wanted and pair not in records,
                          'Unexpected or duplicate configuration')
                  require(record['seed'] == seed, 'Seed mismatch')
                  require(all(record[k] == v for k, v in fixed.items()),
                          'Scenario counts mismatch')
                  require(record['crossings'] >= 60 and record['min_ties'] > 0
                          and record['peak_ties'] > 0, 'Scenario coverage mismatch')
                  if pair[1] < 64:
                      require(record['overflow_samples'] > 0 and
                              record['post_overflow_crossings'] > 0,
                              'Missing saturation scenario')
                  else:
                      require(record['overflow_samples'] == 0 and
                              record['post_overflow_crossings'] == 0,
                              'Unexpected 64-bit overflow')
                  records[pair] = record
              require(set(records) == wanted, 'Incomplete configuration set')
              if matrix:
                  require(text.splitlines().count(
                      'PASS BOUNDARY_RECORDER_MATRIX configurations=18') == 1,
                      'Matrix completion record mismatch')
              return [records[p] for p in sorted(records)]

          def build(directory, top, tag, single=False):
              obj = directory / 'obj'
              command = [
                  'verilator-cli', '--binary', '--timing', '--assert',
                  '--top-module', top, '-j', '2', '--verilate-jobs', '1',
                  '-Wno-fatal', '-MAKEFLAGS', 'VK_PCH_I_FAST=',
                  '-MAKEFLAGS', 'VK_PCH_I_SLOW=', '-MAKEFLAGS', 'OPT_FAST=-O0',
                  '-I' + str(directory), '--Mdir', str(obj),
                  str(directory / 'frp_m32_boundary_recorder_tb.sv')
              ]
              if single:
                  command += ['-GCELLS=8', '-GCOUNT_BITS=3']
              execute(command, tag + '-build.log', 600, directory)
              return str(obj / ('V' + top))

          save()
          try:
              require(os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch',
                      'Manual execution required')
              sha = subprocess.check_output(
                  ['git', '-C', str(root), 'rev-parse', 'HEAD'], text=True).strip()
              require(sha == os.environ['GITHUB_SHA'], 'Checked-out commit mismatch')
              report['commit'] = sha
              paths = [root / 'rtl/m32' / name for name in (
                  'frp_m32_boundary_recorder.sv', 'frp_m32_boundary_recorder_tb.sv')]
              originals = {p.name: p.read_bytes() for p in paths}
              hashes = {str(p.relative_to(root)): hashlib.sha256(p.read_bytes()).hexdigest()
                        for p in paths}
              (out / 'source_sha256.json').write_text(json.dumps(hashes, indent=2) + '\n')

              with tempfile.TemporaryDirectory(prefix='frp110-',
                                               dir=os.environ['RUNNER_TEMP']) as temporary:
                  scratch = Path(temporary)

                  def stage(name, replacement=None):
                      directory = scratch / name
                      directory.mkdir()
                      for filename, contents in originals.items():
                          (directory / filename).write_bytes(contents)
                      if replacement is not None:
                          (directory / paths[0].name).write_text(replacement)
                      return directory

                  directory = stage('matrix')
                  binary = build(directory, 'frp_m32_boundary_recorder_tb', 'matrix')
                  for seed in seeds:
                      repeated = []
                      for replay in (1, 2):
                          _, text = execute([binary, f'+seed={seed}'],
                                            f'seed-{seed}-replay-{replay}.log', 180, directory)
                          records = parse(text, seed, profiles, True)
                          repeated.append(records)
                          report['runs'].append({'seed': seed, 'replay': replay,
                                                 'records': records})
                          save()
                      require(repeated[0] == repeated[1], f'Replay mismatch seed={seed}')
                      print(f'PASS seed={seed}: 18 configurations, identical replays', flush=True)

                  top = 'frp_m32_boundary_recorder_case'
                  directory = stage('control')
                  binary = build(directory, top, 'control', True)
                  _, text = execute([binary, '+seed=76'], 'control-run.log', 180, directory)
                  report['control_record'] = parse(text, 76, {(8, 3)}, False)[0]
                  baseline = next(r for run in report['runs'] if run['seed'] == 76
                                  for r in run['records'] if (r['cells'], r['count_bits']) == (8, 3))
                  require(report['control_record'] == baseline, 'Single-case control mismatch')
                  report['control'] = 'PASS'
                  save()

                  mutations = {
                      'minimum_tie': (
                          'stability_margin_q16 < minimum_margin_q16',
                          'stability_margin_q16 <= minimum_margin_q16'),
                      'boundary_overwrite': (
                          '!boundary_valid_q && previous_margin_q16 >',
                          'previous_margin_q16 >'),
                      'clear_priority': (
                          'end else if (clear_epoch) begin',
                          'end else if (clear_epoch && !sample_valid) begin'),
                      'overflow_flag': (
                          "if (sample_count_q == COUNT_MAX)\n          count_overflow_q <= 1'b1;",
                          "if (sample_count_q == COUNT_MAX)\n          count_overflow_q <= 1'b0;")
                  }
                  source = originals[paths[0].name].decode()
                  for name, (before, after) in mutations.items():
                      require(source.count(before) == 1, 'Mutation anchor mismatch: ' + name)
                      changed = source.replace(before, after)
                      directory = stage(name, changed)
                      binary = build(directory, top, name, True)
                      code, text = execute([binary, '+seed=76'], name + '-run.log',
                                           180, directory, expect_success=False)
                      diagnostic = re.search(
                          r'RECORDER cells=8 bits=3 check=\d+ history=\d+', text)
                      detected = (code in (1, 134, -6) and diagnostic is not None
                                  and 'actual=' in text
                                  and 'PASS BOUNDARY_RECORDER cells=' not in text)
                      report['mutations'].append({
                          'name': name, 'detected': detected, 'exit_code': code,
                          'diagnostic': diagnostic[0] if diagnostic else '',
                          'source_sha256': hashlib.sha256(changed.encode()).hexdigest()
                      })
                      save()
                      require(detected, 'Mutation detection failed: ' + name)
                      print('DETECTED ' + name, flush=True)

              require(all(p.read_bytes() == originals[p.name] for p in paths),
                      'Original source changed')
              report['configuration_executions'] = sum(len(run['records']) for run in report['runs'])
              report['output_comparisons'] = sum(r['checks'] for run in report['runs']
                                                 for r in run['records'])
              require(report['configuration_executions'] == 144 and
                      report['output_comparisons'] == 679824, 'Matrix totals mismatch')
              report['status'] = 'PASS'
          except Exception as error:
              report['status'] = 'FAIL'
              report['error'] = str(error)
              print('::error::Boundary recorder qualification failed; inspect bundle logs')
          finally:
              save()
              summary = [
                  '## FRP M32 Boundary Recorder Qualification', '',
                  f"Result: **{report['status']}**", '',
                  f"Commit: `{report.get('commit', 'unavailable')}`", '',
                  'Cells: 1, 8, 9, 16, 32, 64; counter widths: 1, 3, 64 bits.',
                  'Seeds: 0, 76, 2026, 4294967295; two replays per seed.', '',
                  f"Validated configuration executions: {sum(len(r['records']) for r in report['runs'])}/144.",
                  f"Single-case control: {report['control']}.", '',
                  '| Mutation | Detected by output comparison |',
                  '| --- | --- |'
              ]
              for item in report['mutations']:
                  summary.append(f"| {item['name']} | {item['detected']} |")
              if report['status'] == 'PASS':
                  summary += ['', 'All replay records match within each seed.',
                              'Matrix output comparisons: 679824; detected mutations: 4/4.']
              if 'error' in report:
                  summary += ['', 'Failure details: results.json and the named log in the artifact.']
              summary += ['', 'Artifact: build/run logs, toolchain, source hashes and JSON results.', '']
              (out / 'summary.md').write_text('\n'.join(summary))
          require(report['status'] == 'PASS', 'Boundary recorder qualification failed')
          PY

      - name: Publish Actions summary
        if: always()
        run: |
          mkdir -p bundle
          if [ ! -f bundle/summary.md ]; then
            printf '%s\n' 'Qualification stopped before the final report; inspect the step logs.' > bundle/summary.md
          fi
          cat bundle/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload one combined artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frp-110-boundary-recorder-${{ github.run_id }}-${{ github.run_attempt }}
          path: bundle/
          if-no-files-found: error
          retention-days: 14
