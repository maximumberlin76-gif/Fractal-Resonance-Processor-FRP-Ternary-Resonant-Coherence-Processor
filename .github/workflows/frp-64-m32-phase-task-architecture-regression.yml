name: 64 - FRP M32 Phase Task Architecture Regression
run-name: "64 - FRP Phase Task | 8/16/32 cells and deterministic replay @ ${{ github.sha }}"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frp-64-phase-task-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    name: Phase task - ${{ matrix.cells }} cells
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        cells: [8, 16, 32]
    defaults:
      run:
        shell: bash
    env:
      CELLS: ${{ matrix.cells }}
      LC_ALL: C.UTF-8
      TZ: UTC
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Initialize evidence directory
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/frp-64-evidence"
          echo "FRP64_EVIDENCE=$RUNNER_TEMP/frp-64-evidence" >> "$GITHUB_ENV"

      - name: Check out dispatched commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify testbench and record source snapshot
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          python - <<'PYTHON'
          import hashlib
          import os
          from pathlib import Path

          evidence = Path(os.environ['FRP64_EVIDENCE'])
          bench = Path('rtl/m32/frp_m32_phase_task_architecture_tb.sv')
          expected = '9600598a2e536a7769e355347e17d0f011ed74a38c90590cfe763f5e6b41dd71'
          actual = hashlib.sha256(bench.read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit(f'Testbench SHA256 mismatch: {actual}')
          sources = sorted(p for p in Path('rtl').rglob('*') if p.is_file())
          sources.append(Path('.github/workflows/frp-64-m32-phase-task-architecture-regression.yml'))
          manifest = ''.join(
              f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.as_posix()}\n'
              for p in sources
          )
          (evidence / 'sources.sha256').write_text(manifest)
          (evidence / 'commit.txt').write_text(os.environ['GITHUB_SHA'] + '\n')
          print(f'PASS testbench hash; recorded {len(sources)} source files')
          PYTHON
          sha256sum --check "$FRP64_EVIDENCE/sources.sha256" \
            > "$FRP64_EVIDENCE/source-check.log"

      - name: Install and record toolchain
        run: |
          set -euo pipefail
          {
            python -m pip install --disable-pip-version-check \
              verilator==5.48.0 systemc==3.0.2.1
            python -m pip check
            verilator-cli --version
            g++ --version
            make --version
          } 2>&1 | tee "$FRP64_EVIDENCE/toolchain.log"
          python -m pip freeze > "$FRP64_EVIDENCE/packages.txt"

      - name: Build, execute twice and qualify evidence
        run: |
          set -euo pipefail
          python - <<'PYTHON'
          import hashlib
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          n = int(os.environ['CELLS'])
          profiles = {
              8: (237775, 80, 515, '31bb18e37c4a4500'),
              16: (436368, 204, 1071, '3ce345133e8793b6'),
              32: (830160, 210, 2043, '548d1f306fe260bf'),
          }
          if n not in profiles:
              raise SystemExit('Unsupported cell count')
          evidence = Path(os.environ['FRP64_EVIDENCE']).resolve()
          build = Path(os.environ['RUNNER_TEMP']) / f'frp-64-build-{n}'
          top = 'frp_m32_phase_task_architecture_tb'
          commands = []

          def run(command, logfile, seconds):
              commands.append(command)
              (evidence / 'commands.json').write_text(json.dumps(commands, indent=2) + '\n')
              print('Running:', command, flush=True)
              path = evidence / logfile
              with path.open('w') as stream:
                  result = subprocess.run(
                      command, stdout=stream, stderr=subprocess.STDOUT,
                      timeout=seconds, check=False,
                  )
              if result.returncode:
                  print(path.read_text(errors='replace')[-16000:])
                  raise SystemExit(f'{logfile}: exit {result.returncode}')

          run([
              'verilator-cli', '--binary', '--output-groups', '0',
              '--timing', '--assert', '-Wno-fatal', '-j', '1',
              '-CFLAGS', '-std=c++20',
              '-MAKEFLAGS', 'OPT_FAST=-O0',
              '-MAKEFLAGS', 'VK_PCH_I_FAST=',
              '-MAKEFLAGS', 'VK_PCH_I_SLOW=',
              '--top-module', top, f'-GCELLS={n}', '--Mdir', str(build),
              '-Irtl/m31', '-Irtl/m32', f'rtl/m32/{top}.sv',
          ], 'compile.log', 1800)
          executable = build / f'V{top}'
          (evidence / 'executable.sha256').write_text(
              f'{hashlib.sha256(executable.read_bytes()).hexdigest()}  V{top}\n'
          )
          labels = ('PASS PHASE_TASK', 'ACTIVE_ZERO', 'BINARY_REFERENCE',
                    'M32_EXECUTION', 'M32_NATIVE')

          def require(condition, message):
              if not condition:
                  raise SystemExit(message)

          def collect(path):
              lines = path.read_text().splitlines()
              records, semantic = {}, []
              for label in labels:
                  hits = [line for line in lines if line.startswith(label + ' ')]
                  require(len(hits) == 1, f'{path.name}: expected one {label}')
                  line = hits[0]
                  tokens = line[len(label) + 1:].split()
                  require(all(re.fullmatch(r'[a-zA-Z_][a-zA-Z_0-9]*=[0-9a-f.\-]+', t)
                              for t in tokens), f'Malformed {label}')
                  pairs = [token.split('=', 1) for token in tokens]
                  values = dict(pairs)
                  require(len(values) == len(pairs), f'Duplicate fields in {label}')
                  require(int(values['N']) == n, f'Wrong cell count in {label}')
                  records[label] = values
                  semantic.append(line)
              return records, '\n'.join(semantic) + '\n'

          results = []
          for replay in (1, 2):
              logfile = f'run-{replay}.log'
              run([str(executable)], logfile, 600)
              records, semantic = collect(evidence / logfile)
              (evidence / f'replay-{replay}.txt').write_text(semantic)
              results.append((records, semantic))
          require(results[0][1] == results[1][1], 'Deterministic replay mismatch')
          records, semantic = results[0]
          task = records['PASS PHASE_TASK']
          zero = records['ACTIVE_ZERO']
          binary = records['BINARY_REFERENCE']
          frp = records['M32_EXECUTION']
          native = records['M32_NATIVE']
          checks, relative, routes, signature = profiles[n]
          require(int(task['cases']) == 144, 'Incomplete task matrix')
          require(int(task['checks']) == checks, 'Check count changed')
          require(int(task['phase_updates']) == 2376, 'Phase update count changed')
          require(int(task['relative_decisions']) == relative, 'Relative-phase coverage changed')
          require(task['signature'] == signature, 'Task signature changed')
          require(int(zero['routes']) == int(zero['completed']) == routes,
                  'Mediated routes did not all complete')
          for key in ('paused_retention', 'balance_retention', 'balance_entries',
                      'neutralize_entries', 'zero_goals', 'frequency_memory',
                      'phase_evolution', 'boundary_lag'):
              require(int(zero[key]) > 0, f'Missing active-zero function: {key}')
          require(binary['match'] == frp['match'] == '1', 'Common-task mismatch')
          require(int(binary['direct']) == routes, 'Binary opposite-polarity count changed')
          require(frp['direct'] == '0', 'Forbidden direct ternary transition')
          require(int(binary['rail_toggles']) > 0, 'Missing binary activity')
          require(int(frp['logical_changes']) > 0 and int(frp['ticks']) > 0,
                  'Missing M32 execution activity')
          for values in (binary, frp):
              require(float(values['execution_heat_peak']) >= 0, 'Invalid execution heat')
              require(0 <= float(values['switch_peak']) <= 1, 'Invalid switching ratio')
              float(values['margin_min'])
          for key in ('execution_window_mean_heat_peak_q16', 'margin_min_q16',
                      'local_margin_min_q16'):
              int(native[key])
          report = {
              'commit': os.environ['GITHUB_SHA'], 'cells': n,
              'replays': 2, 'replay_equal': True, 'records': records,
              'semantic_sha256': hashlib.sha256(semantic.encode()).hexdigest(),
              'scope': {
                  'task': 'sampled relative-phase selection with retained execution snapshot',
                  'binary': 'behavioral fixed-point oracle; direct two-rail execution',
                  'ternary': 'M32 phase engine, registered targets and active-zero routes',
                  'execution_heat': 'historical v0.9.3 execution-window scoring',
                  'native': 'separate M32 execution-window thermal/stability telemetry',
              },
          }
          (evidence / 'qualification.json').write_text(json.dumps(report, indent=2) + '\n')
          summary = (
              f'### FRP 64: {n} cells — PASS\n\n'
              f'144 cases; {checks:,} checks per replay; two identical replays.\n\n'
              '```text\n' + semantic + '```\n\n'
              'Execution heat scoring and native M32 telemetry are reported separately.\n'
          )
          (evidence / 'summary.md').write_text(summary)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write(summary)
          print(semantic, end='')
          print('PASS: phase task, active-zero coverage and deterministic replay')
          PYTHON
          sha256sum --check "$FRP64_EVIDENCE/sources.sha256" \
            > "$FRP64_EVIDENCE/source-recheck.log"

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: frp-64-phase-task-${{ matrix.cells }}-${{ github.sha }}
          path: ${{ runner.temp }}/frp-64-evidence/
          if-no-files-found: error
          retention-days: 30
