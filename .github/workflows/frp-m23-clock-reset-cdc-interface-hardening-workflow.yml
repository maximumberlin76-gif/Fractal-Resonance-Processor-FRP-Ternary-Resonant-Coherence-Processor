name: FRP M23 Clock Reset CDC Interface Hardening

run-name: FRP M23 Preserved Release Qualification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frp-m23-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  qualify-m23:
    name: Qualify preserved M23 and current bound inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      M23_RELEASE_COMMIT: 1dcc4e4d47135cdf1e38192cc96f0d928066b13e
      M22_SOURCE_COMMIT: 6bb07958710dc942c4deea1e7663ea97017fe3a8
      PYTHONHASHSEED: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
      LC_ALL: C.UTF-8
      TZ: UTC

    steps:
      - name: Check out the dispatched commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Require manual execution on main and prepare temporary paths
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          git merge-base --is-ancestor "$M23_RELEASE_COMMIT" "$GITHUB_SHA"
          git merge-base --is-ancestor "$M22_SOURCE_COMMIT" "$M23_RELEASE_COMMIT"
          python - <<'PY'
          import os
          import tempfile
          from pathlib import Path

          root = Path(tempfile.mkdtemp(prefix="frp-m23-", dir=os.environ["RUNNER_TEMP"]))
          evidence = root / "evidence"
          evidence.mkdir()
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as stream:
              stream.write(f"M23_RUN_ROOT={root}\n")
              stream.write(f"M23_REPLAY={root / 'release'}\n")
              stream.write(f"M23_EVIDENCE={evidence}\n")
          PY

      - name: Materialize the exact M23 release
        run: |
          set -euo pipefail
          git worktree add --detach "$M23_REPLAY" "$M23_RELEASE_COMMIT"
          test "$(git -C "$M23_REPLAY" rev-parse HEAD)" = "$M23_RELEASE_COMMIT"
          test "$(git -C "$M23_REPLAY" log -1 --format=%H -- artifacts/m22)" = "$M22_SOURCE_COMMIT"

      - name: Verify preserved sources and current bound input identities
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath

          current = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          release = Path(os.environ["M23_REPLAY"]).resolve()
          evidence = Path(os.environ["M23_EVIDENCE"])
          workflow = ".github/workflows/frp-m23-clock-reset-cdc-interface-hardening-workflow.yml"
          artifacts = (
              "artifacts/m23/contracts/m23-clock-reset-cdc-interface-contract.json",
              "artifacts/m23/records/m23-hardening-sequence-records.json",
              "artifacts/m23/reports/m23-interface-protocol-assertion-report.json",
              "artifacts/m23/manifests/m23-clock-reset-cdc-interface-hardening-manifest.json",
              "artifacts/m23/manifests/m23-clock-reset-cdc-interface-hardening-qualification.json",
          )

          def read(root, relative):
              parts = PurePosixPath(relative)
              if parts.is_absolute() or "\\" in relative or any(
                  part in {"", ".", ".."} for part in relative.split("/")
              ):
                  raise SystemExit(f"Unsafe source path: {relative}")
              target = root
              for part in parts.parts:
                  target = target / part
                  if target.is_symlink():
                      raise SystemExit(f"Symlink source rejected: {relative}")
              if not target.is_file():
                  raise SystemExit(f"Missing source: {relative}")
              return target.read_bytes()

          def identity(raw):
              return {"bytes": len(raw), "raw_sha256": hashlib.sha256(raw).hexdigest()}

          manifest = json.loads(read(release, artifacts[3]))
          if manifest["source_commit"] != os.environ["M22_SOURCE_COMMIT"]:
              raise SystemExit("M23 manifest upstream commit mismatch")
          sources = manifest["sources"]
          upstream = manifest["upstream_dependencies"]
          paths = [item["path"] for item in sources + upstream]
          if (
              manifest["source_count"] != 14 or len(sources) != 14
              or manifest["upstream_dependency_count"] != 6 or len(upstream) != 6
              or len(set(paths)) != 20
              or workflow not in {item["path"] for item in sources}
          ):
              raise SystemExit("M23 source inventory mismatch")
          records = []
          for item in sources + upstream:
              relative = item["path"]
              frozen = read(release, relative)
              expected = {key: item[key] for key in ("bytes", "raw_sha256")}
              if identity(frozen) != expected:
                  raise SystemExit(f"Preserved M23 source mismatch: {relative}")
              present = read(current, relative)
              if relative != workflow and present != frozen:
                  raise SystemExit(f"Current M23 bound input changed: {relative}")
              scope = "preserved creation workflow" if relative == workflow else "current bound input"
              records.append({"path": relative, "scope": scope, "preserved": expected, "current": identity(present)})
          for relative in artifacts:
              if read(current, relative) != read(release, relative):
                  raise SystemExit(f"Committed M23 artifact changed: {relative}")
          report = {
              "scope": "Preserved M23 release and current M23 source and upstream identities",
              "status": "PASS",
              "dispatched_commit": os.environ["GITHUB_SHA"],
              "m23_release_commit": os.environ["M23_RELEASE_COMMIT"],
              "m22_source_commit": os.environ["M22_SOURCE_COMMIT"],
              "preserved_source_count": 14,
              "preserved_upstream_count": 6,
              "current_bound_input_count": 19,
              "committed_artifact_count": len(artifacts),
              "sources": records,
              "current_workflow_sha256": identity(read(current, workflow))["raw_sha256"],
          }
          (evidence / "source-boundary.json").write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")
          print("M23_PRESERVED_SOURCES=14/14 PASS")
          print("M23_PRESERVED_UPSTREAM_INPUTS=6/6 PASS")
          print("M23_CURRENT_BOUND_INPUTS=19/19 PASS")
          print("M23_COMMITTED_ARTIFACT_IDENTITIES=5/5 PASS")
          PY

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install qualification dependencies and record toolchain
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r "$M23_REPLAY/requirements.txt"
          sudo apt-get update
          sudo apt-get install --yes verilator g++ make
          {
            python --version
            verilator --version
            g++ --version
            python -m pip freeze
          } > "$M23_EVIDENCE/toolchain.txt"
          cat "$M23_EVIDENCE/toolchain.txt"

      - name: Independently regenerate and qualify all five M23 artifacts
        run: |
          set -euo pipefail
          cd "$M23_REPLAY"
          for generation in a b; do
            python frp_m23_clock_reset_cdc_interface_hardening.py \
              --generate --repository-root . \
              --output-root "$M23_RUN_ROOT/generation-$generation" \
              --source-commit "$M22_SOURCE_COMMIT" \
              --output "$M23_EVIDENCE/generation-$generation.json"
          done
          python frp_m23_clock_reset_cdc_interface_hardening.py \
            --verify --repository-root . --source-commit "$M22_SOURCE_COMMIT" \
            --output "$M23_EVIDENCE/verify.json"
          python frp_m23_clock_reset_cdc_interface_hardening.py \
            --self-test --repository-root . --source-commit "$M22_SOURCE_COMMIT" \
            --output "$M23_EVIDENCE/self-test.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import frp_m23_clock_reset_cdc_interface_hardening as m23

          root = Path(os.environ["M23_RUN_ROOT"])
          evidence = Path(os.environ["M23_EVIDENCE"])
          current = Path(os.environ["GITHUB_WORKSPACE"])
          for relative in m23.ARTIFACT_PATHS:
              a = (root / "generation-a" / relative).read_bytes()
              b = (root / "generation-b" / relative).read_bytes()
              if a != b or a != Path(relative).read_bytes() or a != (current / relative).read_bytes():
                  raise SystemExit(f"M23 artifact reproduction mismatch: {relative}")
              target = evidence / relative
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(a)
          for label in ("generation-a", "generation-b", "verify", "self-test"):
              report = json.loads((evidence / f"{label}.json").read_text())
              if report["status"] != "PASS":
                  raise SystemExit(f"M23 {label} failed")
          contract = json.loads(Path(m23.CONTRACT_ARTIFACT).read_text())
          records = json.loads(Path(m23.RECORDS_ARTIFACT).read_text())
          assertions = json.loads(Path(m23.ASSERTION_ARTIFACT).read_text())
          qualification = json.loads(Path(m23.QUALIFICATION_ARTIFACT).read_text())
          if (
              qualification["overall_status"] != "PASS"
              or (qualification["check_count"], qualification["passed_count"], qualification["failed_count"]) != (72, 72, 0)
              or len(qualification["checks"]) != 72
              or len({check["check_id"] for check in qualification["checks"]}) != 72
              or any(check["status"] != "PASS" for check in qualification["checks"])
              or records["status"] != "PASS"
              or (records["record_count"], records["profile_count"]) != (45, 3)
              or (assertions["assertion_count"], assertions["passed_count"], assertions["failed_count"]) != (12, 12, 0)
              or contract["clock_domain_count"] != 2
              or contract["reset_contract"]["sequence_count"] != 5
              or contract["cdc_boundary_count"] != 5
              or contract["structural_cdc_check_count"] != 10
              or contract["invalid_sequence_count"] != 3
          ):
              raise SystemExit("M23 qualification totals mismatch")
          print("M23_INDEPENDENT_GENERATION=5/5 PASS")
          print("M23_COMMITTED_ARTIFACT_REPRODUCTION=5/5 PASS")
          print("M23_SEQUENCE_RECORDS=45/45 PASS")
          print("M23_STRUCTURAL_CDC_CHECKS=10/10 PASS")
          print("M23_INTERFACE_ASSERTIONS=12/12 PASS")
          print("M23_QUALIFICATION=72/72 PASS")
          print("M23_SELF_TEST=15/15 PASS")
          PY

      - name: Run all 238 tests from the preserved M23 release
        run: |
          set -euo pipefail
          cd "$M23_REPLAY"
          timeout 1200s python - <<'PY'
          import json
          import os
          import unittest
          from pathlib import Path

          for relative in (
              "frp_m23_clock_reset_cdc_interface_hardening.py",
              "tests/test_frp_m23_clock_reset_cdc_interface_hardening.py",
          ):
              compile(Path(relative).read_bytes(), relative, "exec")
          loader = unittest.TestLoader()
          focused = loader.discover("tests", pattern="test_frp_m23_clock_reset_cdc_interface_hardening.py")
          suite = loader.discover("tests", pattern="test*.py")
          if loader.errors or focused.countTestCases() != 36 or suite.countTestCases() != 238:
              raise SystemExit(f"Preserved M23 test inventory mismatch: {loader.errors}")
          evidence = Path(os.environ["M23_EVIDENCE"])
          log = evidence / "full-regression.log"
          with log.open("w", encoding="utf-8") as stream:
              result = unittest.TextTestRunner(stream=stream, verbosity=2).run(suite)
          print(log.read_text(), end="")
          passed = result.wasSuccessful() and result.testsRun == 238 and not result.skipped and not result.expectedFailures
          report = {
              "scope": "Complete unittest suite at the preserved M23 release commit",
              "tests_run": result.testsRun,
              "m23_tests_in_suite": focused.countTestCases(),
              "failures": len(result.failures),
              "errors": len(result.errors),
              "skipped": len(result.skipped),
              "expected_failures": len(result.expectedFailures),
              "status": "PASS" if passed else "FAIL",
          }
          (evidence / "unittest.json").write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")
          if not passed:
              raise SystemExit("Preserved M23 release regression failed")
          print("M23_UNIT_TESTS=36/36 PASS")
          print("M23_RELEASE_FULL_REGRESSION=238/238 PASS")
          PY

      - name: Lint and execute all three M23 RTL parameter profiles
        run: |
          set -euo pipefail
          cd "$M23_REPLAY"
          common=(
            --sv --timing --assert --Wno-fatal --Wno-TIMESCALEMOD
            --Wno-WIDTHEXPAND --Wno-WIDTHTRUNC
            --Wno-UNUSEDSIGNAL --Wno-UNUSEDPARAM
            --output-split 999999999
            --top-module frp_m23_hardened_integration_boundary_tb
            -Irtl/m16 -Irtl/m22 -Irtl/m23
            rtl/m23/frp_m23_hardened_integration_boundary_tb.sv
          )
          timeout 900s verilator --lint-only "${common[@]}" \
            2>&1 | tee "$M23_EVIDENCE/rtl-lint.log"
          for cells in 8 16 32; do
            lanes=$((cells / 4))
            timeout 600s verilator --binary "${common[@]}" \
              "-GCELLS=$cells" "-GREQUEST_LANES=$lanes" \
              --Mdir "$M23_RUN_ROOT/obj-$cells" \
              > "$M23_EVIDENCE/rtl-build-$cells.log" 2>&1 || {
                cat "$M23_EVIDENCE/rtl-build-$cells.log"
                exit 1
              }
            timeout 180s "$M23_RUN_ROOT/obj-$cells/Vfrp_m23_hardened_integration_boundary_tb" \
              2>&1 | tee "$M23_EVIDENCE/rtl-$cells-$lanes.log"
          done
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = Path(os.environ["M23_EVIDENCE"])
          profiles = []
          for cells, lanes, signature in ((8, 2, "00010119"), (16, 4, "00010101"), (32, 8, "00010131")):
              lines = (evidence / f"rtl-{cells}-{lanes}.log").read_text().splitlines()
              required = (
                  f"CELLS={cells} REQUEST_LANES={lanes}",
                  "M23_RESET_SEQUENCES=5/5 PASS",
                  "M23_CDC_BOUNDARIES=5/5 PASS",
                  "M23_INTERFACE_ASSERTIONS=12/12 PASS",
                  "M23_INVALID_SEQUENCE_CLASSES=3/3 DETECTED",
                  "M23_COMPLETED_TRANSACTIONS=24",
                  f"M23_RESTART_SIGNATURE={signature}",
                  "M23_RESTART_DETERMINISM=PASS",
                  "M23_HARDENING_TESTBENCH=PASS",
              )
              if any(lines.count(marker) != 1 for marker in required):
                  raise SystemExit(f"M23 RTL marker mismatch for {cells}/{lanes}")
              profiles.append({"cells": cells, "request_lanes": lanes, "completed_transactions": 24, "restart_signature": signature, "status": "PASS"})
              print(f"M23_RTL_PROFILE={cells}/{lanes} PASS")
          (evidence / "rtl-profiles.json").write_text(json.dumps({"status": "PASS", "profiles": profiles}, indent=2) + "\n", encoding="utf-8")
          print("M23_RTL_LINT=PASS")
          PY

      - name: Confirm clean repositories and publish qualification summary
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=all)"
          test -z "$(git -C "$M23_REPLAY" status --porcelain --untracked-files=all)"
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          evidence = Path(os.environ["M23_EVIDENCE"])
          checksums = []
          for path in sorted(evidence.rglob("*")):
              if path.is_file():
                  checksums.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.relative_to(evidence).as_posix()}")
          (evidence / "SHA256SUMS").write_text("\n".join(checksums) + "\n", encoding="utf-8")
          lines = [
              "## M23 preserved release qualification: PASS",
              "",
              f"Dispatched commit: {os.environ['GITHUB_SHA']}",
              f"Preserved M23 release: {os.environ['M23_RELEASE_COMMIT']}",
              f"M22 source commit: {os.environ['M22_SOURCE_COMMIT']}",
              "",
              "| Check | Result |",
              "|---|---|",
              "| Preserved source and upstream identities | 20/20 PASS |",
              "| Current bound input identities | 19/19 PASS |",
              "| Independently reproduced committed artifacts | 5/5 PASS |",
              "| Sequence records | 45/45 PASS |",
              "| Structural CDC checks | 10/10 PASS |",
              "| Protocol assertions | 12/12 PASS |",
              "| Qualification checks | 72/72 PASS |",
              "| Producer self-test | 15/15 PASS |",
              "| M23 tests within the complete release suite | 36/36 PASS |",
              "| Complete M23 release unittest suite | 238/238 PASS |",
              "| RTL lint and profiles 8/2, 16/4, 32/8 | PASS |",
              "| Reset sequences per RTL profile | 5/5 PASS |",
              "| CDC boundaries per RTL profile | 5/5 PASS |",
              "| Invalid sequence classes per RTL profile | 3/3 DETECTED |",
              "| Completed transactions per RTL profile | 24 |",
              "| Deterministic restart in every RTL profile | PASS |",
              "| Current and preserved worktrees | CLEAN |",
              "",
              "The complete regression and original creation workflow are read from the pinned M23 release.",
              "Current M23 technical sources, bound upstream inputs, and committed artifacts match that release byte for byte.",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as stream:
              stream.write("\n".join(lines) + "\n")
          PY

      - name: Retain M23 qualification logs and reports
        if: ${{ always() && env.M23_EVIDENCE != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: frp-m23-hardening-reports
          path: ${{ env.M23_EVIDENCE }}
          if-no-files-found: error
          retention-days: 90

      - name: Remove the temporary preserved worktree
        if: ${{ always() && env.M23_REPLAY != '' }}
        run: |
          set -euo pipefail
          if test -f "$M23_REPLAY/.git"; then
            git worktree remove "$M23_REPLAY"
          fi
