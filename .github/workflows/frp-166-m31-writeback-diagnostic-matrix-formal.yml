name: 166 - M31 writeback diagnostic matrix formal
on: workflow_dispatch
permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Record sources and install Yosys
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence work
          git rev-parse HEAD > evidence/commit.txt
          test "$(cat evidence/commit.txt)" = "$GITHUB_SHA"
          sha256sum formal/m31/frp_m31_writeback_diagnostic_matrix_formal.sv \
            rtl/m31/frp_m31_state_update.sv rtl/m31/frp_m31_pkg.sv \
            .github/workflows/frp-166-m31-writeback-diagnostic-matrix-formal.yml > evidence/sources.sha256
          python -m pip install --only-binary=:all: pyosys==0.68
          python -m pip show pyosys > evidence/tools.txt

      - name: Prove diagnostics, verify reset traces and run mutation controls
        shell: python
        run: |
          import json
          import os
          import subprocess
          import sys
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path

          top = "frp_m31_writeback_diagnostic_matrix_formal"
          harness = f"formal/m31/{top}.sv"
          dut = Path("rtl/m31/frp_m31_state_update.sv")
          evidence = Path("evidence")

          def yosys(script, log):
              driver = "import sys; from pyosys import libyosys as y; y.run_pass(sys.argv[1], y.Design())"
              with log.open("w") as stream:
                  result = subprocess.run([sys.executable, "-c", driver, script],
                                          stdout=stream, stderr=subprocess.STDOUT, timeout=600)
              if result.returncode:
                  raise RuntimeError(f"Yosys exit {result.returncode}; see {log}")
              return log.read_text()

          def frontend(cells, lanes, includes):
              return (f"read_slang --top {top} -G CELLS={cells} -G LANES={lanes} "
                      f"{includes} {harness}; prep -flatten -top {top}; async2sync; chformal -lower; ")

          def stimuli(n, lanes, bit):
              last, middle = 1 << (n - 1), 1 << (n // 2)
              pos_last, pos_middle = 1 << (2 * (n - 1)), 1 << (2 * (n // 2))
              def prefix_write(count):
                  mask = (1 << count) - 1
                  positive_words = ((1 << (2 * count)) - 1) // 3
                  return dict(candidate=positive_words, capacity=mask, accepted=mask)
              cases = [
                  prefix_write(lanes), prefix_write(lanes + 1),
                  dict(candidate=pos_last, accepted=last),
                  dict(tick_enable=0, candidate=pos_last),
                  dict(accepted=last),
                  dict(reserved_fault=last),
                  dict(candidate=pos_last, capacity=last, accepted=last, neutral_route=last),
                  dict(capacity=last, accepted=last, completion=last),
                  dict(neutral_route=last, completion=last),
                  dict(direct_fault=last),
                  dict(candidate=pos_last, capacity=last, accepted=last),
                  dict(scheduler_code=1, candidate=pos_last, capacity=last, accepted=last),
                  dict(rst_n=0, tick_enable=0, scheduler_code=7),
                  dict(candidate=2 | pos_middle | pos_last, capacity=1 | middle | last,
                       accepted=1 | middle | last, neutral_route=last),
              ]
              widths = dict(rst_n=1, tick_enable=1, scheduler_code=3, candidate=2*n,
                            capacity=n, accepted=n, neutral_route=n, completion=n,
                            reserved_fault=n, direct_fault=n)
              reset = dict.fromkeys(widths, 0)
              live = dict(reset, rst_n=1, tick_enable=1)
              seed = live.copy()
              if bit in (7, 10):
                  seed.update(candidate=pos_last * (1 if bit == 7 else 3), capacity=last, accepted=last)
              rows = (reset, seed, live | cases[bit])
              settings = " ".join(f"-set-at {t} {k} {widths[k]}'h{v:x}"
                                  for t, row in enumerate(rows, 1) for k, v in row.items())
              return rows, settings

          def samples(signal):
              data = iter(signal.get("data", []))
              values = []
              for code in signal["wave"]:
                  if code == ".":
                      value = values[-1]
                  elif code in "01":
                      value = int(code)
                  elif code in "=23456789":
                      word = next(data, "")
                      value = int(word, 2) if word else None
                  else:
                      value = None
                  values.append(value)
              return values[1:]

          def profile(n, lanes):
              label = f"n{n}-l{lanes}"
              out = evidence / label
              out.mkdir()
              model = Path("work") / f"{label}.il"
              yosys(frontend(n, lanes, "-I rtl/m31") +
                    "select -assert-count 0 t:$assume; select -assert-count 9 t:$assert; "
                    "select -assert-count 14 t:$cover; chformal -cover -remove; opt -full; "
                    f"check -assert; write_rtlil {model}", out / "prepare.log")
              proof = yosys(f"read_rtlil {model}; delete -output w:reach; opt_clean; "
                            "sat -seq 1 -prove-asserts -verify -timeout 120", out / "proof.log")
              if "SAT proof finished - no model found: SUCCESS!" not in proof:
                  raise ValueError("Missing diagnostic proof")
              cmds = [f"read_rtlil {model}; chformal -assert -remove; opt_clean"]
              scenarios = [stimuli(n, lanes, bit) for bit in range(14)]
              for bit, (_, settings) in enumerate(scenarios):
                  cmds.append(f"sat -seq 3 {settings} -set-at 3 reach[{bit}] 1 -show-ports "
                              f"-dump_json {out}/reach-{bit}.json -timeout 60")
              if yosys("; ".join(cmds), out / "witnesses.log").count("SAT solving finished - model found:") != 14:
                  raise ValueError("Missing SAT witnesses")
              for bit, (rows, _) in enumerate(scenarios):
                  trace = json.loads((out / f"reach-{bit}.json").read_text())["signal"]
                  ports = {s["name"]: s for s in trace}
                  for k in rows[0]:
                      if samples(ports[k]) != [row[k] for row in rows]:
                          raise ValueError(f"Incorrect {k} waveform in reach-{bit}")
                  reach = samples(ports["reach"])
                  if len(reach) != 3 or not (reach[-1] & (1 << bit)):
                      raise ValueError(f"Missing final reach[{bit}]")
              return {"assertions": 9, "assumptions": 0, "verified_traces": 14}

          mutations = {
              "strict_limit": ("<= REQUEST_LANE_LIMIT", "< REQUEST_LANE_LIMIT"),
              "stale_hold_on_pause": ("same_state_hold_valid = 1'b0;", "same_state_hold_valid = !tick_enable;"),
              "skip_scheduler_in_reset": (
                  "&& frp_scheduler_state_is_valid(\n        scheduler_state\n      )\n      && state_domain_valid",
                  "&& (!rst_n || scheduler_state <= 4)\n      && state_domain_valid"),
              "hide_reserved_on_pause": ("state_domain_valid = 1'b0;", "state_domain_valid = !tick_enable;"),
          }

          def control(name, old, new):
              out = evidence / name
              out.mkdir()
              source = dut.read_text()
              if source.count(old) != 1:
                  raise ValueError(f"Expected one mutation site for {name}")
              (out / dut.name).write_text(source.replace(old, new))
              trace = out / "counterexample.json"
              log = yosys(frontend(8, 2, f"-I {out} -I rtl/m31") +
                          "chformal -cover -remove; delete -output w:reach; opt_clean; "
                          "sat -seq 3 -set-at 1 rst_n 0 -prove-asserts -falsify -show-ports "
                          f"-dump_json {trace} -timeout 90", out / "control.log")
              if "SAT proof finished - model found: FAIL!" not in log or not json.loads(trace.read_text())["signal"]:
                  raise ValueError("Missing counterexample")
              return "DETECTED"

          matrix = [(n, lanes) for n in (8, 9, 16, 32, 64, 128) for lanes in (1, n-1)] + [(8, 2)]
          profiles, detected, errors = {}, {}, {}
          with ThreadPoolExecutor(max_workers=2) as pool:
              jobs = {pool.submit(profile, n, lanes): (profiles, f"n{n}-l{lanes}") for n, lanes in matrix}
              jobs.update({pool.submit(control, k, *v): (detected, k) for k, v in mutations.items()})
              for job in as_completed(jobs):
                  dest, key = jobs[job]
                  try:
                      dest[key] = job.result()
                  except Exception as exc:
                      errors[key] = str(exc)
                      print(f"::error::{key}: {exc}", flush=True)
          counts = len(profiles), sum(r["verified_traces"] for r in profiles.values()), len(detected)
          passed = counts == (13, 182, 4) and not errors
          report = dict(commit=os.environ["GITHUB_SHA"], passed=passed, profiles=profiles,
                        detected_controls=detected, errors=errors)
          (evidence / "results.json").write_text(json.dumps(report, sort_keys=True, indent=2) + "\n")
          summary = "M31 diagnostics: %d/13 complete profiles, %d/182 verified traces, %d/4 detected controls." % counts
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as stream:
              print(summary, file=stream)
          sys.exit(0 if passed else 1)

      - name: Record artifact checksums
        if: always()
        shell: bash
        working-directory: evidence
        run: find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frp-166-m31-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
