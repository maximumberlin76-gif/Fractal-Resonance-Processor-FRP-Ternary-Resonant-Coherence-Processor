name: 84 - FRP M32 Ingress Contract Regression
run-name: "84 - FRP Ingress Contract | 42 outputs, 8/16/32/64 cells and deterministic replay @ ${{ github.sha }}"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frp-84-ingress-contract-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    name: M32 ingress contract - ${{ matrix.cells }} cells
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        cells: [8, 16, 32, 64]
    defaults:
      run:
        shell: bash
    env:
      CELLS: ${{ matrix.cells }}
      LC_ALL: C.UTF-8
      TZ: UTC
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Initialize evidence directory
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/frp-84-evidence"
          printf 'commit=%s\ncells=%s\nrun=%s\nattempt=%s\n' \
            "$GITHUB_SHA" "$CELLS" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            > "$RUNNER_TEMP/frp-84-evidence/context.txt"
          printf '%s\n' '{"status":"NOT_COMPLETED"}' \
            > "$RUNNER_TEMP/frp-84-evidence/qualification.json"
          echo "FRP84_EVIDENCE=$RUNNER_TEMP/frp-84-evidence" >> "$GITHUB_ENV"

      - name: Check out dispatched commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify manual execution and qualified sources
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          cat > "$FRP84_EVIDENCE/sources.sha256" <<'SHA'
          fa78bcfe965270cc74855908aa392989d857575a2097a126539aabb1aab8990d  rtl/m31/frp_m31_phase_request_adapter.sv
          762302f1c7a7f7f40cb029f5ada6a111fc8c3e3f6be9920e9b2401b95e179c94  rtl/m31/frp_m31_pkg.sv
          32f75cc70df5dba3f4fbb511397be9a5921236c2afd16cfeb1350eca3f6e8109  rtl/m31/frp_m31_request_lanes.sv
          2eff054c7bde2b8b68161beac5f3f3a3111ca23864c1d3cfcd856e416cd102fa  rtl/m32/frp_m32_ingress_contract_tb.sv
          9626474b49d32b411e107d7ccc8ee5aa7f42728e9a6f70d634d16d3f2a414c5e  rtl/m32/frp_m32_registered_target_boundary.sv
          02250069a68737f055a419cd67bf2d439b3f63b3f6a7a245f40e9bf29d1958eb  rtl/m32/frp_m32_registered_target_request_path.sv
          SHA
          sha256sum .github/workflows/frp-84-m32-ingress-contract-regression.yml \
            >> "$FRP84_EVIDENCE/sources.sha256"
          sha256sum --check --strict "$FRP84_EVIDENCE/sources.sha256" \
            | tee "$FRP84_EVIDENCE/source-check.log"

      - name: Install and record toolchain
        run: |
          set -euo pipefail
          {
            python -m pip install --disable-pip-version-check \
              verilator==5.48.0 systemc==3.0.2.1
            python -m pip check
            verilator-cli --version
            g++ --version
            make --version
          } 2>&1 | tee "$FRP84_EVIDENCE/toolchain.log"
          python -m pip freeze > "$FRP84_EVIDENCE/packages.txt"

      - name: Build and qualify ingress replay with RTL coverage
        run: |
          set -euo pipefail
          python - <<'PYTHON'
          import hashlib
          import json
          import os
          import re
          import signal
          import subprocess
          import time
          from pathlib import Path

          evidence = Path(os.environ['FRP84_EVIDENCE']).resolve()
          n = int(os.environ['CELLS'])
          build = Path(os.environ['RUNNER_TEMP']) / f'frp-84-build-{n}'
          top = 'frp_m32_ingress_contract_tb'
          report = dict(status='RUNNING', commit=os.environ['GITHUB_SHA'], cells=n, commands=[])
          configs = ((1, 0), (4, 0), (32, 0), (4, 1))
          signatures = {
              8: ['3e5edc9d7e8af248', 'a33fb25b34f69522', 'cc1a4d1d5fc8a678', 'eb3ddee1d19de92d'],
              16: ['bee077a9af35f2a2', '42d0e84e420b36f2', '36fd4c5434b4928f', '7dbed36186825217'],
              32: ['72dbbf80adcb00c7', '192f1058fff48bae', '75f6769e800cbc23', 'b5c122c142db885b'],
              64: ['b62b9e638eec380e', '2833ec0e7f30e1e6', '231f8403284d18ae', '7cbde3a422066324'],
          }
          coverage_baseline = {
              'rtl/m31/frp_m31_phase_request_adapter.sv:line': [4, 4],
              'rtl/m31/frp_m31_phase_request_adapter.sv:branch': [8, 8],
              'rtl/m31/frp_m31_request_lanes.sv:line': [33, 34],
              'rtl/m31/frp_m31_request_lanes.sv:branch': [35, 36],
              'rtl/m32/frp_m32_registered_target_boundary.sv:line': [45, 45],
              'rtl/m32/frp_m32_registered_target_boundary.sv:branch': [32, 36],
              'rtl/m32/frp_m32_registered_target_request_path.sv:line': [4, 4],
          }
          rtl_files = {
              'rtl/m31/frp_m31_phase_request_adapter.sv',
              'rtl/m31/frp_m31_request_lanes.sv',
              'rtl/m32/frp_m32_registered_target_boundary.sv',
              'rtl/m32/frp_m32_registered_target_request_path.sv',
          }

          def require(ok, message):
              if not ok:
                  raise RuntimeError(message)

          def digest(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def save():
              (evidence / 'qualification.json').write_text(json.dumps(report, indent=2) + '\n')

          def collect(path):
              text = path.read_text()
              require(not re.search(r'%Error|%Fatal|Assertion failed|Aborting|^FAIL\b', text, re.M),
                      'Simulation failure marker')
              rows = [s.strip() for s in text.splitlines()
                      if s.strip().startswith(('INGRESS_', 'PASS'))]
              require(len(rows) == 9, f'Expected nine records, received {len(rows)}')
              final = f'PASS INGRESS_ALL cells={n} configurations=4'
              require(rows.count(final) == 1, 'Missing or duplicate final PASS')
              parsed = {}
              for row in rows:
                  if row == final:
                      continue
                  if row.startswith('PASS INGRESS '):
                      kind, tokens = 'pass', row.split()[2:]
                      keys = 'cells counter_bits extra_index ports cycles probes checks signature'.split()
                  elif row.startswith('INGRESS_EVENTS '):
                      kind, tokens = 'events', row.split()[1:]
                      keys = ('cells counter_bits extra_index captures faults clears resets '
                              'saturated_accept saturated_reject reasons').split()
                  else:
                      raise RuntimeError(f'Unexpected record: {row}')
                  pairs = [token.split('=', 1) for token in tokens]
                  require(all(len(pair) == 2 for pair in pairs), 'Malformed record')
                  require([pair[0] for pair in pairs] == keys, 'Missing, reordered or duplicate fields')
                  values = dict(pairs)
                  for key in keys:
                      if key not in ('signature', 'reasons'):
                          require(values[key].isdecimal(), f'Invalid unsigned field: {key}')
                          values[key] = int(values[key])
                  cfg = (values['counter_bits'], values['extra_index'])
                  require(values['cells'] == n and cfg in configs, 'Incorrect configuration')
                  require((kind, cfg) not in parsed, 'Duplicate configuration record')
                  if kind == 'pass':
                      c, extra = cfg
                      lanes, index = n // 4, n.bit_length() - 1 + extra
                      cycles = 4263 + 512 * n + 3 * n * n
                      probes = 3 * cycles + 70 + (n << extra) * 1024 + 512 * lanes * (lanes - 1) + n
                      words = (6 * n + 13 * lanes + lanes * index + 2 * c + 239 + 31) // 32
                      require((values['ports'], values['cycles'], values['probes'], values['checks']) ==
                              (42, cycles, probes, probes * words), 'Incomplete workload or output checks')
                      require(values['signature'] == signatures[n][configs.index(cfg)], 'Signature mismatch')
                  else:
                      reasons = values['reasons'].split(',')
                      require(len(reasons) == 7 and all(s.isdecimal() for s in reasons), 'Invalid reasons')
                      reasons = list(map(int, reasons))
                      require(all(reasons[k] > 0 for k in (0, 2, 3, 4, 5, 6)), 'Missing rejection class')
                      require((reasons[1] > 0) if cfg[1] else (reasons[1] == 0), 'Invalid address coverage')
                      require(all(values[k] > 0 for k in ('captures', 'faults', 'clears')), 'Missing history')
                      require(values['resets'] == 35, 'Incorrect asynchronous reset count')
                      saturation = [values['saturated_accept'], values['saturated_reject']]
                      require(all(x > 0 for x in saturation) if cfg[0] < 32 else saturation == [0, 0],
                              'Incorrect counter saturation coverage')
                  parsed[kind, cfg] = row
              require(len(parsed) == 8, 'Incomplete configuration matrix')
              normalized = [parsed[kind, cfg] for cfg in configs for kind in ('events', 'pass')]
              return '\n'.join(normalized + [final]) + '\n'

          def coverage(path):
              text = path.read_text()
              require(text.startswith('# SystemC::Coverage-3\n'), 'Invalid coverage header')
              bins, files = {}, set()
              for line in text.splitlines()[1:]:
                  if not line.startswith("C '"):
                      continue
                  data, hits = line[3:].rsplit("' ", 1)
                  fields = dict(x.split('\x02', 1) for x in data.split('\x01') if '\x02' in x)
                  source, instance = fields['f'], fields.get('h', '')
                  if source not in rtl_files:
                      continue
                  require(instance.startswith(top + '.'), 'Unexpected coverage hierarchy')
                  hits = int(hits)
                  require(hits >= 0, 'Negative coverage count')
                  kind = fields['t']
                  require(kind in ('line', 'branch'), f'Unexpected coverage kind: {kind}')
                  key = source + ':' + kind
                  counts = bins.setdefault(key, [0, 0])
                  counts[0] += int(hits > 0)
                  counts[1] += 1
                  files.add(source)
              require(files == rtl_files, 'Missing RTL coverage')
              require(bins == coverage_baseline, f'RTL coverage baseline mismatch: {bins}')
              return bins

          def run(argv, name, limit):
              path = evidence / name
              entry = dict(argv=argv, log=name, status='RUNNING')
              report['commands'].append(entry)
              started = time.monotonic()
              process = None
              save()
              try:
                  with path.open('w') as log:
                      process = subprocess.Popen(argv, stdout=log, stderr=subprocess.STDOUT,
                                                 start_new_session=True)
                      while True:
                          remaining = limit - (time.monotonic() - started)
                          require(remaining > 0, f'{name}: timeout')
                          try:
                              code = process.wait(timeout=min(30, remaining))
                              break
                          except subprocess.TimeoutExpired:
                              print(f'{name}: elapsed={time.monotonic()-started:.0f}s', flush=True)
                  entry['returncode'] = code
                  require(code == 0, f'{name}: exit {code}')
                  entry['status'] = 'PASS'
              except BaseException:
                  entry['status'] = 'FAIL'
                  if process is not None and process.poll() is None:
                      os.killpg(process.pid, signal.SIGKILL)
                      process.wait()
                  if path.exists():
                      print(path.read_text(errors='replace')[-12000:], flush=True)
                  raise
              finally:
                  entry['seconds'] = round(time.monotonic() - started, 3)
                  save()

          try:
              build.mkdir(parents=True, exist_ok=True)
              run([
                  'verilator-cli', '--binary', '--output-groups', '0', '--unroll-count', '1',
                  '--timing', '--assert', '--coverage-line', '-Wno-fatal', '-j', '2',
                  '-CFLAGS', '-std=c++20', '-MAKEFLAGS', 'OPT_FAST=-Os',
                  '-MAKEFLAGS', 'VK_PCH_I_FAST=', '-MAKEFLAGS', 'VK_PCH_I_SLOW=',
                  '--top-module', top, f'-GCELLS={n}', '--Mdir', str(build),
                  '-Irtl/m31', '-Irtl/m32', f'rtl/m32/{top}.sv',
              ], 'compile.log', 3600)
              compile_log = (evidence / 'compile.log').read_text(errors='replace')
              require(not re.search(r'%Error|%Warning-(PINMISSING|IMPLICIT|MULTIDRIVEN)\b', compile_log),
                      'Compile error or unexpected wiring warning')
              executable = build / f'V{top}'
              executable_hash = digest(executable)
              (evidence / 'executable.sha256').write_text(f'{executable_hash}  V{top}\n')
              replays, coverage_hashes = [], []
              for replay in (1, 2):
                  require(digest(executable) == executable_hash, 'Executable changed')
                  name = f'run-{replay}.log'
                  cov = evidence / f'run-{replay}.dat'
                  run([str(executable), '+verilator+coverage+file+' + str(cov)], name, 600)
                  semantic = collect(evidence / name)
                  (evidence / f'run-{replay}.txt').write_text(semantic)
                  replays.append(semantic)
                  bins = coverage(cov)
                  (evidence / f'coverage-{replay}.json').write_text(json.dumps(bins, indent=2) + '\n')
                  coverage_hashes.append(digest(cov))
                  print(semantic, end='')
              require(replays[0] == replays[1], 'Semantic replay mismatch')
              require(coverage_hashes[0] == coverage_hashes[1], 'Coverage replay mismatch')
              require(digest(executable) == executable_hash, 'Executable changed')
              run(['sha256sum', '--check', '--strict', str(evidence / 'sources.sha256')],
                  'source-final-check.log', 30)
              report.update(status='PASS', configurations=4, replays=2, replay_equal=True, ports=42,
                            executable_sha256=executable_hash, rtl_coverage=bins,
                            coverage_sha256=coverage_hashes[0],
                            semantic_sha256=hashlib.sha256(replays[0].encode()).hexdigest())
              summary = (f'### FRP 84: Ingress contract - {n} cells - PASS\n\n'
                         '42 outputs; four parameter configurations; two process replays.\n\n'
                         'Counter widths: 1, 4, 32 bits; extended index: separate 4-bit-counter configuration.\n\n'
                         'RTL instrumented points across parameter specializations; testbench excluded.\n\n'
                         '| RTL file / kind | Covered | Total | Percent |\n|---|---:|---:|---:|\n')
              for key, (covered, total) in sorted(bins.items()):
                  summary += f'| {key} | {covered} | {total} | {100 * covered / total:.2f}% |\n'
              summary += '\n```text\n' + replays[0] + '```\n'
              (evidence / 'summary.md').write_text(summary)
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
                  stream.write(summary)
          except BaseException as error:
              report.update(status='FAIL', error=str(error))
              raise
          finally:
              save()
          PYTHON

      - name: Hash qualification evidence
        if: always()
        run: |
          set -euo pipefail
          python - <<'PYTHON'
          import hashlib
          import os
          from pathlib import Path
          root = Path(os.environ['FRP84_EVIDENCE'])
          files = sorted(p for p in root.rglob('*') if p.is_file() and p.name != 'evidence.sha256')
          (root / 'evidence.sha256').write_text(''.join(
              f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(root)}\n'
              for p in files))
          PYTHON

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          name: frp-84-ingress-contract-${{ matrix.cells }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/frp-84-evidence/
          if-no-files-found: error
          retention-days: 14
