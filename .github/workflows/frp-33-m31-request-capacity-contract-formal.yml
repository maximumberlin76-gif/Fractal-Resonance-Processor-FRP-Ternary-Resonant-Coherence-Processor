              run(label + '-synthesis', f'read_slang -j 1 --std 1800-2017 --top {core} ' + '-G CELLS=8 -G STATE_BITS=2 -G REQUEST_LANES=2 -G CELL_INDEX_BITS=3 -G COUNTER_BITS=32 ' + f'-Irtl/m31 rtl/m31/{core}.sv; write_json {q(front)}; synth -top {core} -flatten -noshare -run begin:fine; check -assert; techmap -map +/techmap.v t:$shiftx; opt_clean; check -assert; select -assert-none t:$shiftx t:$connect; rename {core} {core}_netlist; write_verilog -noattr {q(net)}; write_json {q(meta)}', cwd=directory)
