          import hashlib, importlib.metadata, json, os, re, shutil, subprocess, sys, time
          import yowasp_yosys
          repo = Path.cwd().resolve()
          evidence = Path(os.environ['M31_REQUEST_CAPACITY_EVIDENCE']).resolve()
          evidence.mkdir(parents=True, exist_ok=True)
          view = evidence / 'inputs'
          workflow = '.github/workflows/frp-33-m31-request-capacity-contract-formal.yml'
          harness = 'formal/m31/frp_m31_request_capacity_contract_formal.sv'
          macro = 'FRP_M31_REQUEST_CAPACITY_CONTRACT_NETLIST'
          report = {'status': 'FAIL', 'repository': os.environ['GITHUB_REPOSITORY'], 'source_commit': os.environ['GITHUB_SHA'], 'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'scope': 'Independent request and capacity contracts; eight cells, two lanes, three-bit indices, 32-bit counters', 'public_outputs': 54, 'public_output_bits': 580, 'source_assertions': 54, 'assumptions': 0, 'input_domain': 'All input bit patterns, including reserved ternary/scheduler/transition codes; no out-of-range index in this profile', 'proof_method': 'Unrestricted combinational SAT on RTL and fresh netlists', 'contracts_proven': False, 'full_core_proof': False, 'global_coverage_closure': False, 'physical_timing': False, 'physical_temperature_model': False, 'python_model_equivalence': False, 'commands': [], 'proofs': [], 'witnesses': [], 'negatives': [], 'sources': {}, 'netlists': {}, 'models': {}}
          immutable = {}
          expected_sources = {'formal/m31/frp_m31_request_capacity_contract_formal.sv': {'bytes': 26665, 'sha256': '7c2de73f9c5cd35c65c381a83ca104d54f5365ab2bf63a63ec14c1a9f1ec67cd'}, 'rtl/m31/frp_m31_pkg.sv': {'bytes': 18531, 'sha256': '762302f1c7a7f7f40cb029f5ada6a111fc8c3e3f6be9920e9b2401b95e179c94'}, 'rtl/m31/frp_m31_request_lanes.sv': {'bytes': 18290, 'sha256': '32f75cc70df5dba3f4fbb511397be9a5921236c2afd16cfeb1350eca3f6e8109'}, 'rtl/m31/frp_m31_capacity_guard.sv': {'bytes': 20787, 'sha256': 'd0587897f955ce49923aca807b5d3e0c637383c88e5d5e0dfa8405f47917c123'}}
          expected_netlists = {'request': {'bytes': 34940, 'sha256': '56fd8e3e14d4f315fb6e2d223910a98457efed6173b6b5e22e20352116039040'}, 'capacity': {'bytes': 61351, 'sha256': '7561388755cfec42dcbc307d409edf4ae296ec617397dd9a0d728b740b89d00e'}}
