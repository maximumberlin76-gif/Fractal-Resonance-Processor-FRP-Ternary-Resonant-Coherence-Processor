name: 83 - FRP M32 Full-State Oracle Regression
run-name: "83 - FRP Full-State Oracle | 103 outputs, 8/16/32/64 cells and deterministic replay @ ${{ github.sha }}"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frp-83-full-state-oracle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    name: M32 full-state oracle - ${{ matrix.cells }} cells
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        cells: [8, 16, 32, 64]
    defaults:
      run:
        shell: bash
    env:
      CELLS: ${{ matrix.cells }}
      LC_ALL: C.UTF-8
      TZ: UTC
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Initialize evidence directory
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/frp-83-evidence"
          printf 'commit=%s\ncells=%s\nrun=%s\nattempt=%s\n' \
            "$GITHUB_SHA" "$CELLS" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            > "$RUNNER_TEMP/frp-83-evidence/context.txt"
          printf '%s\n' '{"status":"NOT_COMPLETED"}' \
            > "$RUNNER_TEMP/frp-83-evidence/qualification.json"
          echo "FRP83_EVIDENCE=$RUNNER_TEMP/frp-83-evidence" >> "$GITHUB_ENV"

      - name: Check out dispatched commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify manual execution and qualified sources
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          cat > "$FRP83_EVIDENCE/sources.sha256" <<'SHA'
          765429b33df3f843626bdc411ad8371fd963738a58ab10201abef75dcdafcaf0  rtl/m31/frp_m31_active_neutral.sv
          d0587897f955ce49923aca807b5d3e0c637383c88e5d5e0dfa8405f47917c123  rtl/m31/frp_m31_capacity_guard.sv
          e516a5cd378bd2ddecdadc5abb13ddef26c63fafe5bda65b47a6bd859ca66f92  rtl/m31/frp_m31_execution_core.sv
          6b2afb8d1583c93d95d2386ba25dd1eaef6bb5bd9a4e1c9e9abff1dd004cbf24  rtl/m31/frp_m31_fixed_point_pkg.sv
          df058d4e3671ba1d7c9d0403a6bb1b8c9750a0a967905b5f91cca455c1dddb83  rtl/m31/frp_m31_global_stability.sv
          cbb5a531283164d1d54d59ec748b97bf84e172704854bf5eb7c6bda2c502f7c7  rtl/m31/frp_m31_isqrt_u64.sv
          478882d4f6a2986f5079c88b444c7b007d68145d61e5150209cb0637f35b2ec0  rtl/m31/frp_m31_local_gamma_drift.sv
          6e10f738f94c43ac9748ec7a033adde16243beea59e2f7f2973a3ab51c2e5e04  rtl/m31/frp_m31_local_thermal_attenuation.sv
          cb97c1bfeabbb2acaebf2f9644d484b2f7c5e995dbf1b70777f6bc2e7df9368e  rtl/m31/frp_m31_local_thermal_field.sv
          18889d85e78b23b844f1db4c46a35a6b7d01e609e3f1f0e6263a39a6c5729411  rtl/m31/frp_m31_pending_routes.sv
          7ac3572ef2bf9feef509e7dc43c662d92d23fa3eb0563efbfa8dba7c28157746  rtl/m31/frp_m31_phase_interference.sv
          fa78bcfe965270cc74855908aa392989d857575a2097a126539aabb1aab8990d  rtl/m31/frp_m31_phase_request_adapter.sv
          762302f1c7a7f7f40cb029f5ada6a111fc8c3e3f6be9920e9b2401b95e179c94  rtl/m31/frp_m31_pkg.sv
          32f75cc70df5dba3f4fbb511397be9a5921236c2afd16cfeb1350eca3f6e8109  rtl/m31/frp_m31_request_lanes.sv
          fc9de24b41736e5c5a9f9e464318c80adbfda9dc8cc4362c0c55bfed403bf97f  rtl/m31/frp_m31_scheduler.sv
          adbb4b94fcf8fa0bfc981d654679fd7518a5c4c9c97b611a35cd8accaf28233d  rtl/m31/frp_m31_sin_q30.mem
          69c06833e6dfbb28e25b74a5787dcd03756dddf0f66726de3ea47c1ad2931931  rtl/m31/frp_m31_stability.sv
          ebad1f7ee952a577239445d33d99cae799afaaff5c181c7162514bbcea6eab90  rtl/m31/frp_m31_state_update.sv
          34df4ebfc5dfad8e3e5e454e560404585de5c881e6f75abaae367d3bd9fb11bd  rtl/m31/frp_m31_thermal_proxy.sv
          0be6c5ee28ee4a23baf6110143eec309f387200c1c2c80e3016353d5d4107541  rtl/m32/frp_m32_core.sv
          ae840b73a80778b350ff0eaa0578ec4dea9702fd495a13da0690218ea0784151  rtl/m32/frp_m32_full_state_oracle_tb.sv
          9626474b49d32b411e107d7ccc8ee5aa7f42728e9a6f70d634d16d3f2a414c5e  rtl/m32/frp_m32_registered_target_boundary.sv
          02250069a68737f055a419cd67bf2d439b3f63b3f6a7a245f40e9bf29d1958eb  rtl/m32/frp_m32_registered_target_request_path.sv
          SHA
          sha256sum .github/workflows/frp-83-m32-full-state-oracle-regression.yml \
            >> "$FRP83_EVIDENCE/sources.sha256"
          sha256sum --check --strict "$FRP83_EVIDENCE/sources.sha256" \
            | tee "$FRP83_EVIDENCE/source-check.log"

      - name: Install and record toolchain
        run: |
          set -euo pipefail
          {
            python -m pip install --disable-pip-version-check \
              verilator==5.48.0 systemc==3.0.2.1
            python -m pip check
            verilator-cli --version
            g++ --version
            make --version
          } 2>&1 | tee "$FRP83_EVIDENCE/toolchain.log"
          python -m pip freeze > "$FRP83_EVIDENCE/packages.txt"

      - name: Build and qualify full-state replay with RTL coverage
        run: |
          set -euo pipefail
          python - <<'PYTHON'
          import hashlib
          import json
          import os
          import re
          import signal
          import subprocess
          import time
          from pathlib import Path

          evidence = Path(os.environ['FRP83_EVIDENCE']).resolve()
          n = int(os.environ['CELLS'])
          build = Path(os.environ['RUNNER_TEMP']) / f'frp-83-build-{n}'
          top = 'frp_m32_full_state_oracle_tb'
          report = dict(status='RUNNING', commit=os.environ['GITHUB_SHA'], cells=n, commands=[])
          # Independent local qualification baselines for the pinned testbench.
          metrics = {
              8: (12849, 9891522, 45, 'f7180aecaea4d824'),
              16: (12929, 17886505, 77, '98a95843cbb75cb3'),
              32: (13089, 34120044, 141, '4c0d6ef64f6690ec'),
              64: (13409, 68174198, 269, '87cbe61b7b1ae78b'),
          }
          stability = {
              8: (12348, 448, 501, 11048, 1300, 1749, 424, 16),
              16: (12396, 464, 533, 11082, 1314, 1851, 440, 32),
              32: (12492, 496, 597, 11135, 1357, 1951, 472, 64),
              64: (12684, 560, 725, 11241, 1443, 2069, 536, 128),
          }
          events = {
              8: (745, 728, 16123, 16113, 16064, 85109, 216),
              16: (1499, 1465, 33749, 33730, 33604, 171927, 216),
              32: (2884, 2818, 70407, 70379, 70166, 346636, 216),
              64: (6007, 5871, 148361, 148294, 147822, 693072, 216),
          }
          steps, checks, resets, signature = metrics[n]
          total = dict(cells=n, profiles=12, steps=steps, checks=checks,
                       resets=resets, signature=signature)

          def record(prefix, values):
              return prefix + ' ' + ' '.join(f'{key}={value}' for key, value in values.items())

          expected = [
              record('FULL_STATE_STABILITY', dict(cells=n, ports=103, **dict(zip(
                  'commits drains holds stable unstable compressed clear_commits cancelled'.split(),
                  stability[n], strict=True)))),
              record('PASS FULL_STATE', total),
              record('FULL_STATE_EVENTS', dict(cells=n, **dict(zip(
                  'routes completions overload gamma attenuation cooling handovers'.split(),
                  events[n], strict=True)))),
              f'PASS FULL_STATE_ALL cells={n}',
          ]

          def require(ok, message):
              if not ok:
                  raise RuntimeError(message)

          def digest(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def save():
              (evidence / 'qualification.json').write_text(json.dumps(report, indent=2) + '\n')

          def collect(path):
              text = path.read_text()
              require(not re.search(r'%Error|%Fatal|Assertion failed|Aborting|^FAIL\b', text, re.M),
                      'Simulation failure marker')
              records = [line.strip() for line in text.splitlines()
                         if line.strip().startswith(('FULL_STATE_', 'PASS'))]
              require(records == expected, f'Incorrect semantic records: {records}')
              return '\n'.join(records) + '\n'

          def coverage(path):
              text = path.read_text()
              require(text.startswith('# SystemC::Coverage-3\n'), 'Invalid coverage header')
              bins = {}
              hierarchy = top + '.checker_instance.dut'
              for line in text.splitlines()[1:]:
                  if not line.startswith("C '"):
                      continue
                  data, hits = line[3:].rsplit("' ", 1)
                  fields = dict(x.split('\x02', 1) for x in data.split('\x01') if '\x02' in x)
                  hits = int(hits)
                  require(hits >= 0, 'Negative coverage count')
                  source, instance = fields['f'], fields.get('h', '')
                  if (not source.startswith(('rtl/m31/', 'rtl/m32/')) or '_tb.sv' in source
                          or not (instance == hierarchy or instance.startswith(hierarchy + '.'))):
                      continue
                  kind = fields['t']
                  require(kind in ('line', 'branch', 'toggle'), f'Unknown coverage type: {kind}')
                  counts = bins.setdefault(kind, [0, 0])
                  counts[0] += int(hits > 0)
                  counts[1] += 1
              baseline = {'line': [189 + 2 * (n.bit_length() - 4), 250], 'branch': [193, 252]}
              if n == 8:
                  baseline['toggle'] = [66988, 87020]
              require(bins == baseline, f'RTL coverage differs from qualified baseline: {bins}')
              return {kind: dict(covered=value[0], total=value[1],
                                 percent=round(100 * value[0] / value[1], 3))
                      for kind, value in sorted(bins.items())}

          def run(argv, name, limit):
              path = evidence / name
              entry = dict(argv=argv, log=name, status='RUNNING')
              report['commands'].append(entry)
              started = time.monotonic()
              process = None
              save()
              try:
                  with path.open('w') as log:
                      process = subprocess.Popen(argv, stdout=log, stderr=subprocess.STDOUT,
                                                 start_new_session=True)
                      while True:
                          remaining = limit - (time.monotonic() - started)
                          require(remaining > 0, f'{name}: timeout')
                          try:
                              code = process.wait(timeout=min(30, remaining))
                              break
                          except subprocess.TimeoutExpired:
                              print(f'{name}: elapsed={time.monotonic()-started:.0f}s', flush=True)
                  entry['returncode'] = code
                  require(code == 0, f'{name}: exit {code}')
                  entry['status'] = 'PASS'
              except BaseException:
                  entry['status'] = 'FAIL'
                  if process is not None and process.poll() is None:
                      os.killpg(process.pid, signal.SIGKILL)
                      process.wait()
                  if path.exists():
                      print(path.read_text(errors='replace')[-12000:], flush=True)
                  raise
              finally:
                  entry['seconds'] = round(time.monotonic() - started, 3)
                  save()

          try:
              build.mkdir(parents=True, exist_ok=True)
              flags = ['--coverage-line'] + (['--coverage-toggle'] if n == 8 else [])
              run([
                  'verilator-cli', '--binary', '--output-groups', '0', '--unroll-count', '1',
                  '--timing', '--assert', *flags, '-Wno-fatal', '-j', '2', '-CFLAGS', '-std=c++20',
                  '-MAKEFLAGS', 'OPT_FAST=-Os', '-MAKEFLAGS', 'VK_PCH_I_FAST=',
                  '-MAKEFLAGS', 'VK_PCH_I_SLOW=', '--top-module', top,
                  f'-GCELLS={n}', '--Mdir', str(build), '-Irtl/m31', '-Irtl/m32', f'rtl/m32/{top}.sv',
              ], 'compile.log', 3600)
              compile_log = (evidence / 'compile.log').read_text(errors='replace')
              require(not re.search(r'%Error|%Warning-(PINMISSING|IMPLICIT|MULTIDRIVEN)\b', compile_log),
                      'Compile error or unexpected wiring warning')
              executable = build / f'V{top}'
              executable_hash = digest(executable)
              (evidence / 'executable.sha256').write_text(f'{executable_hash}  V{top}\n')
              replays, coverage_hashes = [], []
              for replay in (1, 2):
                  require(digest(executable) == executable_hash, 'Executable changed')
                  name = f'run-{replay}.log'
                  cov = evidence / f'run-{replay}.dat'
                  run([str(executable), '+verilator+coverage+file+' + str(cov)], name, 600)
                  semantic = collect(evidence / name)
                  (evidence / f'run-{replay}.txt').write_text(semantic)
                  replays.append(semantic)
                  bins = coverage(cov)
                  (evidence / f'coverage-{replay}.json').write_text(json.dumps(bins, indent=2) + '\n')
                  coverage_hashes.append(digest(cov))
                  print(semantic, end='')
              require(replays[0] == replays[1], 'Semantic replay mismatch')
              require(coverage_hashes[0] == coverage_hashes[1], 'Coverage replay mismatch')
              require(digest(executable) == executable_hash, 'Executable changed')
              run(['sha256sum', '--check', '--strict', str(evidence / 'sources.sha256')],
                  'source-final-check.log', 30)
              report.update(status='PASS', replays=2, replay_equal=True, ports=103,
                            executable_sha256=executable_hash, rtl_coverage=bins,
                            coverage_sha256=coverage_hashes[0],
                            semantic_sha256=hashlib.sha256(replays[0].encode()).hexdigest(), **total)
              summary = (f'### FRP 83: Full-state oracle - {n} cells - PASS\n\n'
                         '103 public outputs; 12 profiles; two independent process replays.\n\n'
                         'RTL instrumented points, excluding testbench and reference model.\n'
                         'These percentages describe this test, not project completion.\n\n'
                         '| Type | Covered | Total | Percent |\n|---|---:|---:|---:|\n')
              for kind, value in bins.items():
                  summary += f"| {kind} | {value['covered']} | {value['total']} | {value['percent']}% |\n"
              if n != 8:
                  summary += '\nToggle coverage is collected in the 8-cell job only.\n'
              summary += '\n```text\n' + replays[0] + '```\n'
              (evidence / 'summary.md').write_text(summary)
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
                  stream.write(summary)
          except BaseException as error:
              report.update(status='FAIL', error=str(error))
              raise
          finally:
              save()
          PYTHON

      - name: Hash qualification evidence
        if: always()
        run: |
          set -euo pipefail
          python - <<'PYTHON'
          import hashlib
          import os
          from pathlib import Path
          root = Path(os.environ['FRP83_EVIDENCE'])
          files = sorted(p for p in root.rglob('*') if p.is_file() and p.name != 'evidence.sha256')
          (root / 'evidence.sha256').write_text(''.join(
              f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(root)}\n'
              for p in files))
          PYTHON

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          name: frp-83-full-state-oracle-${{ matrix.cells }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/frp-83-evidence/
          if-no-files-found: error
          retention-days: 14
