name: 101 - FRP M31 Frequency Memory Formal
run-name: "101 - FRP Frequency Memory | 120 cells, 1920 witnesses @ ${{ github.sha }}"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frp-101-frequency-memory-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prove:
    name: "Frequency memory - ${{ matrix.cells }} cells - shard ${{ matrix.shard }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        cells: [8, 16, 32, 64]
        shard: [0, 1, 2, 3]
    defaults:
      run:
        shell: bash
    env:
      CELLS: ${{ matrix.cells }}
      SHARD: ${{ matrix.shard }}
      LC_ALL: C.UTF-8
      TZ: UTC
      PYTHONHASHSEED: "0"
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pinned formal tool
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pyosys==0.68

      - name: Prove every assigned cell and collect reach witnesses
        run: |
          set -euo pipefail
          cat > .frp101-runner.py <<'PY'
          from pathlib import Path
          import hashlib
          import importlib.metadata
          import json
          import os
          import re
          import shutil
          import subprocess
          import sys
          import time

          TOP = 'frp_m31_frequency_memory_formal'
          HARNESS = 'formal/m31/' + TOP + '.sv'
          PHASE = 'rtl/m31/frp_m31_phase_interference.sv'
          PKG = 'rtl/m31/frp_m31_fixed_point_pkg.sv'
          EXPECTED = {
              HARNESS: 'ba472ab18745139ef74524c15841933ccb17f8dafe72689159f78df67d53a79a',
              PHASE: '7ac3572ef2bf9feef509e7dc43c662d92d23fa3eb0563efbfa8dba7c28157746',
              PKG: '6b2afb8d1583c93d95d2386ba25dd1eaef6bb5bd9a4e1c9e9abff1dd004cbf24',
              'rtl/m31/frp_m31_pkg.sv': '762302f1c7a7f7f40cb029f5ada6a111fc8c3e3f6be9920e9b2401b95e179c94',
              'rtl/m31/frp_m31_isqrt_u64.sv': 'cbb5a531283164d1d54d59ec748b97bf84e172704854bf5eb7c6bda2c502f7c7',
              'rtl/m31/frp_m31_sin_q30.mem': 'adbb4b94fcf8fa0bfc981d654679fd7518a5c4c9c97b611a35cd8accaf28233d',
          }
          ROOT = Path.cwd()
          N = int(os.environ['CELLS'])
          SHARD = int(os.environ['SHARD'])
          assert N in (8, 16, 32, 64) and SHARD in range(4)
          PROBES = list(range(SHARD, N, 4))
          E = ROOT / '.frp101-evidence' / f'n{N}-s{SHARD}'
          E.mkdir(parents=True, exist_ok=False)
          WORKER = 'from pyosys import libyosys as y; import sys; y.run_pass(sys.argv[1])'
          RESULT = {
              'schema': 'frp.m31.frequency_memory.formal.v1',
              'status': 'failed', 'commit': os.environ['GITHUB_SHA'],
              'cells': N, 'shard': SHARD, 'required_probes': PROBES,
              'proofs': [], 'witnesses': [], 'mutations': [],
          }


          def save(name, value):
              (E / name).write_text(json.dumps(value, indent=2) + '\n')


          def checkpoint():
              save('result.json', RESULT)


          def hashes(directory):
              return {p: hashlib.sha256((directory / p).read_bytes()).hexdigest() for p in EXPECTED}


          def run(label, commands, directory, timeout=600, required=True):
              (E / (label + '.ys')).write_text(commands + '\n')
              print('RUN', N, SHARD, label, flush=True)
              start = time.monotonic()
              with (E / (label + '.log')).open('w') as log:
                  try:
                      proc = subprocess.run(
                          [sys.executable, '-u', '-c', WORKER, commands], cwd=directory,
                          stdout=log, stderr=subprocess.STDOUT, timeout=timeout,
                      )
                  except subprocess.TimeoutExpired:
                      save(label + '-process.json', {'status': 'timeout', 'seconds': timeout})
                      raise
              log = (E / (label + '.log')).read_text()
              save(label + '-process.json', {
                  'returncode': proc.returncode,
                  'seconds': round(time.monotonic() - start, 3),
              })
              if required and proc.returncode:
                  print(log[-6000:], flush=True)
                  raise RuntimeError(label + ': see evidence log')
              return proc.returncode, log


          def private_copy(label, mutation=None):
              directory = E / label
              for name in EXPECTED:
                  target = directory / name
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(ROOT / name, target)
              path = directory / PHASE
              source, count = re.subn(
                  r'    if \(sin_lut\[[^\n]+\n      \$fatal\(1, "FRP M31 sine LUT [^\n]+\n',
                  '', path.read_text(),
              )
              assert count == 4, 'Unexpected sine-ROM simulation guard layout'
              path.write_text(source)
              if mutation:
                  name, old, new = mutation
                  path = directory / name
                  source = path.read_text()
                  assert source.count(old) == 1, 'Mutation target must be unique'
                  path.write_text(source.replace(old, new))
              source = (directory / HARNESS).read_text()
              old = 'frp_m31_phase_interference #(.CELLS(CELLS)) dut ('
              assert source.count(old) == 1
              (directory / 'checker.sv').write_text(source.replace(old, 'frp_m31_frequency_bank dut ('))
              save(label + '-sources.json', {
                  'files': hashes(directory),
                  'checker_sha256': hashlib.sha256((directory / 'checker.sv').read_bytes()).hexdigest(),
                  'removed_rom_simulation_guards': count,
              })
              return directory


          def prepare_bank(label, directory):
              model = E / (label + '-bank.il')
              outputs = (
                  'phase_word_q coupling_field_q16 phase_projection_q30 phase_target '
                  'pair_coherence_q30 cluster_coherence_q30 global_coherence_q30 '
                  'organization_dispersion_q30 group_coherence_q30 level_mean_coherence_q30 '
                  'level_min_coherence_q30 level_max_coherence_q30 level_dispersion_q30'
              )
              run(label + '-bank',
                  f'read_slang --std 1800-2017 --unroll-limit 20000 -I rtl/m31 '
                  f'-G CELLS={N} --top frp_m31_phase_interference {PHASE}; '
                  + 'delete -output ' + ' '.join('w:' + p for p in outputs.split()) + '; '
                  'opt_clean; prep -top frp_m31_phase_interference -flatten; '
                  'rename frp_m31_phase_interference frp_m31_frequency_bank; '
                  'select -assert-none a:blackbox t:$anyseq t:$anyconst t:$assume t:$assert; '
                  f'check -assert; write_rtlil {model}', directory)
              return model


          def prepare_probe(label, directory, bank, probe):
              model = E / (label + '.il')
              run(label + '-prepare',
                  f'read_rtlil {bank}; read_slang --std 1800-2017 '
                  '-D FRP_M31_PHASE_INTERFERENCE_SV -I rtl/m31 '
                  f'-G CELLS={N} -G PROBE_CELL={probe} --top {TOP} '
                  'rtl/m31/frp_m31_pkg.sv checker.sv; '
                  f'prep -top {TOP} -flatten; async2sync; opt -full; chformal -lower; '
                  'select -assert-none a:blackbox t:$anyseq t:$anyconst; '
                  'select -assert-count 1 t:$assume; select -assert-count 10 t:$assert; '
                  'wreduce; opt -full; techmap; opt -full; abc -g simple; opt_clean; '
                  f'check -assert; stat; write_rtlil {model}', directory)
              return model


          checkpoint()
          assert hashes(ROOT) == EXPECTED, 'Source hash mismatch: inspect changed files'
          assert importlib.metadata.version('pyosys') == '0.68'
          shutil.copyfile(__file__, E / 'runner.py')
          (E / 'packages.txt').write_text(subprocess.check_output(
              [sys.executable, '-m', 'pip', 'freeze'], text=True))
          save('sources.json', EXPECTED)
          save('scope.json', {
              'sizes': [8, 16, 32, 64], 'total_probes': 120, 'total_witnesses': 1920,
              'partition': 'Each cell is checked once: probe modulo 4 equals shard',
              'method': 'Reset base and temporal induction, sampled edges after async2sync',
              'inputs': 'One initial-reset assumption; all subsequent inputs unrestricted',
              'bank': 'Full native frequency bank retained; unused output cones removed by Yosys',
              'link': 'Original harness properties connected to the loaded frequency-bank RTLIL',
              'private_edits': 'Four ROM simulation guards removed; DUT instance type changed for linking',
              'witness_depth': 6, 'witness_constraints': 'Initial reset and final reach bit only',
              'progress': 'Relative to the target sampled at each update; one-LSB errors hold',
          })
          canonical = private_copy('canonical')
          bank = prepare_bank('canonical', canonical)
          for probe in PROBES:
              label = f'cell-{probe:02d}'
              model = prepare_probe(label, canonical, bank, probe)
              _, log = run(label + '-proof',
                  f'read_rtlil {model}; delete -output w:reach; opt_clean; '
                  'sat -seq 1 -tempinduct -initsteps 1 -maxsteps 4 -set-assumes '
                  '-prove-asserts -verify -timeout 120', canonical, timeout=900)
              assert 'Induction step proven: SUCCESS!' in log
              assert 'Base case for induction length' in log
              RESULT['proofs'].append(probe)
              checkpoint()
              commands = (
                  f'read_rtlil {model}; chformal -assert -remove; '
                  'delete -output w:frequency_now w:target_now w:expected_next; opt_clean; '
                  'select -assert-none t:$assert t:$anyseq t:$anyconst a:blackbox; '
                  'select -assert-count 1 t:$assume; '
              )
              for bit in range(16):
                  commands += (
                      f'sat -seq 6 -set-assumes -set-at 6 reach[{bit}] 1 -show-ports '
                      f'-dump_json {E}/{label}-reach-{bit:02d}.json -timeout 60; '
                  )
              _, log = run(label + '-reach', commands, canonical, timeout=1200)
              assert log.count('SAT solving finished - model found:') == 16
              for bit in range(16):
                  path = E / f'{label}-reach-{bit:02d}.json'
                  signals = {s['name']: s for s in json.loads(path.read_text())['signal']}
                  assert int(signals['reach']['data'][-1], 2) & (1 << bit)
                  RESULT['witnesses'].append({'probe': probe, 'bit': bit})
              checkpoint()

          if N == 8 and SHARD == 0:
              mutations = [
                  ('coefficient', PKG, "FRP_M31_DELAY_ALPHA_Q16 = 32'sd19661",
                   "FRP_M31_DELAY_ALPHA_Q16 = 32'sd19660"),
                  ('reset', PHASE, 'frequency_q[cell_index] <= FRP_M31_BASE_FREQUENCY_Q16;',
                   "frequency_q[cell_index] <= 32'sd0;"),
                  ('load-priority', PHASE, 'end else if (load_valid) begin',
                   'end else if (load_valid && tick_enable) begin'),
              ]
              for label, name, old, new in mutations:
                  label = 'mutant-' + label
                  directory = private_copy(label, (name, old, new))
                  mutant_bank = prepare_bank(label, directory)
                  model = prepare_probe(label, directory, mutant_bank, 0)
                  witness = E / (label + '-counterexample.json')
                  rc, log = run(label + '-check',
                      f'read_rtlil {model}; delete -output w:reach; opt_clean; '
                      'sat -seq 4 -set-assumes -prove-asserts -verify -show-ports '
                      f'-dump_json {witness} -timeout 120', directory, timeout=240, required=False)
                  assert rc != 0 and 'model found: FAIL!' in log and witness.is_file()
                  assert json.loads(witness.read_text())['signal']
                  RESULT['mutations'].append(label)
                  checkpoint()

          assert RESULT['proofs'] == PROBES
          assert len(RESULT['witnesses']) == 16 * len(PROBES)
          assert len(RESULT['mutations']) == (3 if N == 8 and SHARD == 0 else 0)
          assert hashes(ROOT) == EXPECTED, 'Repository sources changed during qualification'
          RESULT['status'] = 'passed'
          checkpoint()
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as summary:
              summary.write(
                  f'### FRP 101 — {N} cells, shard {SHARD}\n\n'
                  f'- Proven cell indices: {PROBES}\n'
                  f'- Reach witnesses: {len(RESULT["witnesses"])}\n'
                  f'- Detected mutations: {len(RESULT["mutations"])}\n'
                  '- Source fingerprints verified; original files unchanged.\n'
              )
          print('PASS', json.dumps(RESULT), flush=True)
          PY
          python .frp101-runner.py

      - name: Preserve formal evidence
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          name: frp-101-n${{ matrix.cells }}-s${{ matrix.shard }}-${{ github.sha }}-${{ github.run_attempt }}
          path: .frp101-evidence/n${{ matrix.cells }}-s${{ matrix.shard }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
