name: 86 - FRP M32 Downstream Contract Regression
run-name: "86 - FRP Downstream Contract | 79 outputs, three tests, 8/16/32/64 cells and deterministic replay @ ${{ github.sha }}"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frp-86-downstream-contract-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    name: M32 downstream contract - ${{ matrix.cells }} cells
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        cells: [8, 16, 32, 64]
    defaults:
      run:
        shell: bash
    env:
      CELLS: ${{ matrix.cells }}
      LC_ALL: C.UTF-8
      TZ: UTC
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Initialize evidence directory
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/frp-86-evidence"
          printf 'commit=%s\ncells=%s\nrun=%s\nattempt=%s\n' \
            "$GITHUB_SHA" "$CELLS" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            > "$RUNNER_TEMP/frp-86-evidence/context.txt"
          printf '%s\n' '{"status":"NOT_COMPLETED"}' \
            > "$RUNNER_TEMP/frp-86-evidence/qualification.json"
          echo "FRP86_EVIDENCE=$RUNNER_TEMP/frp-86-evidence" >> "$GITHUB_ENV"

      - name: Check out dispatched commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify manual execution and qualified sources
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          cat > "$FRP86_EVIDENCE/sources.sha256" <<'SHA'
          762302f1c7a7f7f40cb029f5ada6a111fc8c3e3f6be9920e9b2401b95e179c94  rtl/m31/frp_m31_pkg.sv
          765429b33df3f843626bdc411ad8371fd963738a58ab10201abef75dcdafcaf0  rtl/m31/frp_m31_active_neutral.sv
          d0587897f955ce49923aca807b5d3e0c637383c88e5d5e0dfa8405f47917c123  rtl/m31/frp_m31_capacity_guard.sv
          ebad1f7ee952a577239445d33d99cae799afaaff5c181c7162514bbcea6eab90  rtl/m31/frp_m31_state_update.sv
          951859d7343d739bdec9a1b2e2f1335143f757ba1a8b7506cb9284ec96b7acdc  rtl/m32/frp_m32_downstream_contract_tb.sv
          SHA
          sha256sum .github/workflows/frp-86-m32-downstream-contract-regression.yml \
            >> "$FRP86_EVIDENCE/sources.sha256"
          sha256sum --check --strict "$FRP86_EVIDENCE/sources.sha256" \
            | tee "$FRP86_EVIDENCE/source-check.log"

      - name: Install and record toolchain
        run: |
          set -euo pipefail
          {
            python -m pip install --disable-pip-version-check \
              verilator==5.48.0 systemc==3.0.2.1
            python -m pip check
            verilator-cli --version
            g++ --version
            make --version
          } 2>&1 | tee "$FRP86_EVIDENCE/toolchain.log"
          python -m pip freeze > "$FRP86_EVIDENCE/packages.txt"

      - name: Build and qualify downstream replay with RTL coverage
        run: |
          set -euo pipefail
          python - <<'PYTHON'
          import hashlib
          import json
          import os
          import re
          import signal
          import subprocess
          import time
          from pathlib import Path

          evidence = Path(os.environ['FRP86_EVIDENCE']).resolve()
          n = int(os.environ['CELLS'])
          build = Path(os.environ['RUNNER_TEMP']) / f'frp-86-build-{n}'
          top = 'frp_m32_downstream_contract_tb'
          report = dict(status='RUNNING', commit=os.environ['GITHUB_SHA'], cells=n, commands=[])
          configs = (0, 1)
          ports = (29, 24, 26)
          signatures = {
              8: [
                  '06839fc89b4b6905', '92023798e6645ffb', 'cd5685d30ed52cbd',
                  'd89ffebbda1f46e7', '6177e4e76a644391', 'cd5685d30ed52cbd',
              ],
              16: [
                  '5d0828a60434d19d', '554bcfeccbf724d8', '5b7cfb02afbd270d',
                  '662f8412151aac4f', '26c0eaf0ec18fab8', '5b7cfb02afbd270d',
              ],
              32: [
                  '1cfe22617e636f18', '3059d66f3494c6a9', '57257afb9518bb49',
                  'e16bb61d14994fb9', '4cde4b2e22d0d9ee', '57257afb9518bb49',
              ],
              64: [
                  'efb337795f95f245', '8a82d790529642b7', 'e3483ed88d7a8f15',
                  'dda983f9a0955f95', 'b235390eee9c19a8', 'e3483ed88d7a8f15',
              ],
          }
          coverage_baseline = {
              'rtl/m31/frp_m31_active_neutral.sv:line': [33, 38],
              'rtl/m31/frp_m31_active_neutral.sv:branch': [45, 48],
              'rtl/m31/frp_m31_capacity_guard.sv:line': [37, 40],
              'rtl/m31/frp_m31_capacity_guard.sv:branch': [45 if n == 8 else 43, 48],
              'rtl/m31/frp_m31_state_update.sv:line': [13, 13],
              'rtl/m31/frp_m31_state_update.sv:branch': [39, 44],
          }
          rtl_files = {key.split(':')[0] for key in coverage_baseline}

          def require(ok, message):
              if not ok:
                  raise RuntimeError(message)

          def digest(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def save():
              (evidence / 'qualification.json').write_text(json.dumps(report, indent=2) + '\n')

          def collect(path):
              text = path.read_text()
              require(not re.search(r'%Error|%Fatal|Assertion failed|Aborting|^FAIL\b', text, re.M),
                      'Simulation failure marker')
              rows = [s.strip() for s in text.splitlines()
                      if s.strip().startswith(('DOWNSTREAM_', 'PASS'))]
              require(len(rows) == 15, f'Expected fifteen records, received {len(rows)}')
              final = f'PASS DOWNSTREAM_ALL cells={n} tests=3 configurations=2'
              require(rows.count(final) == 1, 'Missing or duplicate final PASS')
              parsed = {}
              for row in rows:
                  if row == final:
                      continue
                  if row.startswith('PASS DOWNSTREAM '):
                      kind, tokens = 'pass', row.split()[2:]
                      keys = 'cells extra test ports probes checks signature'.split()
                  elif row.startswith('DOWNSTREAM_BINS '):
                      kind, tokens = 'bins', row.split()[1:]
                      keys = 'cells extra test hits'.split()
                  elif row.startswith('DOWNSTREAM_HISTORY '):
                      kind, tokens = 'history', row.split()[1:]
                      keys = 'cells extra cycles resets'.split()
                  else:
                      raise RuntimeError(f'Unexpected record: {row}')
                  pairs = [token.split('=', 1) for token in tokens]
                  require(all(len(pair) == 2 for pair in pairs), 'Malformed record')
                  require([pair[0] for pair in pairs] == keys, 'Missing, reordered or duplicate fields')
                  values = dict(pairs)
                  for key in keys:
                      if key not in ('signature', 'hits'):
                          require(values[key].isdecimal(), f'Invalid unsigned field: {key}')
                          values[key] = int(values[key])
                  cfg = values['extra']
                  test = values.get('test', -1)
                  require(values['cells'] == n and cfg in configs, 'Incorrect configuration')
                  require(kind == 'history' or test in (0, 1, 2), 'Unknown test')
                  record_key = (cfg, test, kind)
                  require(record_key not in parsed, 'Duplicate configuration record')
                  if kind == 'pass':
                      lanes = n // 4
                      expected_probes = (
                          8192*n + 2*n*lanes*(lanes-1) + 32*n*lanes*cfg + 4096,
                          4096*n + 32*n*lanes*cfg + 2*n*(n+1) + 4096,
                          12306*n + 9778,
                      )[test]
                      bits = (12*n + 328, 2*lanes + 3*n + 267, 10*n + 329)[test]
                      words = (bits + 31) // 32
                      require((values['ports'], values['probes'], values['checks']) ==
                              (ports[test], expected_probes, expected_probes * words),
                              'Incomplete workload or output checks')
                      require(values['signature'] == signatures[n][3*cfg + test], 'Signature mismatch')
                  elif kind == 'bins':
                      hits = values['hits'].split(',')
                      require(len(hits) == 8 and all(x.isdecimal() for x in hits), 'Invalid bin record')
                      require(all(int(x) > 0 for x in hits), 'Missing contract class')
                  else:
                      require((values['cycles'], values['resets']) == (4*n + 4866, 5*n + 23),
                              'Incomplete writeback history or reset sequence')
                  parsed[record_key] = row
              require(len(parsed) == 14, 'Incomplete three-test configuration matrix')
              normalized = []
              for cfg in configs:
                  for test in (0, 1, 2):
                      for kind in ('bins', 'pass'):
                          normalized.append(parsed[cfg, test, kind])
                  normalized.append(parsed[cfg, -1, 'history'])
              return '\n'.join(normalized + [final]) + '\n'

          def coverage(path):
              text = path.read_text()
              require(text.startswith('# SystemC::Coverage-3\n'), 'Invalid coverage header')
              bins, files = {}, set()
              for line in text.splitlines()[1:]:
                  if not line.startswith("C '"):
                      continue
                  data, hits = line[3:].rsplit("' ", 1)
                  fields = dict(x.split('\x02', 1) for x in data.split('\x01') if '\x02' in x)
                  source, instance = fields['f'], fields.get('h', '')
                  if source not in rtl_files:
                      continue
                  require(instance.startswith(top + '.'), 'Unexpected coverage hierarchy')
                  hits = int(hits)
                  require(hits >= 0, 'Negative coverage count')
                  kind = fields['t']
                  require(kind in ('line', 'branch'), f'Unexpected coverage kind: {kind}')
                  key = source + ':' + kind
                  counts = bins.setdefault(key, [0, 0])
                  counts[0] += int(hits > 0)
                  counts[1] += 1
                  files.add(source)
              require(files == rtl_files, 'Missing RTL coverage')
              require(bins == coverage_baseline, f'RTL coverage baseline mismatch: {bins}')
              return bins

          def run(argv, name, limit):
              path = evidence / name
              entry = dict(argv=argv, log=name, status='RUNNING')
              report['commands'].append(entry)
              started = time.monotonic()
              process = None
              save()
              try:
                  with path.open('w') as log:
                      process = subprocess.Popen(argv, stdout=log, stderr=subprocess.STDOUT,
                                                 start_new_session=True)
                      while True:
                          remaining = limit - (time.monotonic() - started)
                          require(remaining > 0, f'{name}: timeout')
                          try:
                              code = process.wait(timeout=min(30, remaining))
                              break
                          except subprocess.TimeoutExpired:
                              print(f'{name}: elapsed={time.monotonic()-started:.0f}s', flush=True)
                  entry['returncode'] = code
                  require(code == 0, f'{name}: exit {code}')
                  entry['status'] = 'PASS'
              except BaseException:
                  entry['status'] = 'FAIL'
                  if process is not None and process.poll() is None:
                      os.killpg(process.pid, signal.SIGKILL)
                      process.wait()
                  if path.exists():
                      print(path.read_text(errors='replace')[-12000:], flush=True)
                  raise
              finally:
                  entry['seconds'] = round(time.monotonic() - started, 3)
                  save()

          try:
              build.mkdir(parents=True, exist_ok=True)
              run([
                  'verilator-cli', '--binary', '--output-groups', '0', '--unroll-count', '1',
                  '--timing', '--assert', '--coverage-line', '-Wno-fatal', '-j', '2',
                  '-CFLAGS', '-std=c++20', '-MAKEFLAGS', 'OPT_FAST=-Os',
                  '-MAKEFLAGS', 'VK_PCH_I_FAST=', '-MAKEFLAGS', 'VK_PCH_I_SLOW=',
                  '--top-module', top, f'-GCELLS={n}', '--Mdir', str(build),
                  '-Irtl/m31', '-Irtl/m32', f'rtl/m32/{top}.sv',
              ], 'compile.log', 3600)
              compile_log = (evidence / 'compile.log').read_text(errors='replace')
              require(not re.search(r'%Error|%Warning-(PINMISSING|IMPLICIT|MULTIDRIVEN)\b', compile_log),
                      'Compile error or unexpected wiring warning')
              executable = build / f'V{top}'
              executable_hash = digest(executable)
              (evidence / 'executable.sha256').write_text(f'{executable_hash}  V{top}\n')
              replays, coverage_hashes = [], []
              for replay in (1, 2):
                  require(digest(executable) == executable_hash, 'Executable changed')
                  name = f'run-{replay}.log'
                  cov = evidence / f'run-{replay}.dat'
                  run([str(executable), '+verilator+coverage+file+' + str(cov)], name, 600)
                  semantic = collect(evidence / name)
                  (evidence / f'run-{replay}.txt').write_text(semantic)
                  replays.append(semantic)
                  bins = coverage(cov)
                  (evidence / f'coverage-{replay}.json').write_text(json.dumps(bins, indent=2) + '\n')
                  coverage_hashes.append(digest(cov))
                  print(semantic, end='')
              require(replays[0] == replays[1], 'Semantic replay mismatch')
              require(coverage_hashes[0] == coverage_hashes[1], 'Coverage replay mismatch')
              require(digest(executable) == executable_hash, 'Executable changed')
              run(['sha256sum', '--check', '--strict', str(evidence / 'sources.sha256')],
                  'source-final-check.log', 30)
              report.update(status='PASS', configurations=2, replays=2, replay_equal=True, tests=3, ports=79,
                            executable_sha256=executable_hash, rtl_coverage=bins,
                            coverage_sha256=coverage_hashes[0],
                            semantic_sha256=hashlib.sha256(replays[0].encode()).hexdigest())
              summary = (f'### FRP 86: Downstream contract - {n} cells - PASS\n\n'
                         'Three tests; 79 outputs; two address configurations; two process replays.\n\n'
                         'Test 0: active-neutral (29); test 1: capacity (24); test 2: writeback (26).\n\n'
                         'Canonical and extended address widths; 32-bit event counts.\n\n'
                         'Functional bins count sampled observations, including pre/post-edge writeback checks.\n\n'
                         'RTL instrumented points across parameter specializations; testbench excluded.\n\n'
                         '| RTL file / kind | Covered | Total | Percent |\n|---|---:|---:|---:|\n')
              for key, (covered, total) in sorted(bins.items()):
                  summary += f'| {key} | {covered} | {total} | {100 * covered / total:.2f}% |\n'
              summary += '\n```text\n' + replays[0] + '```\n'
              (evidence / 'summary.md').write_text(summary)
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
                  stream.write(summary)
          except BaseException as error:
              report.update(status='FAIL', error=str(error))
              raise
          finally:
              save()
          PYTHON

      - name: Hash qualification evidence
        if: always()
        run: |
          set -euo pipefail
          python - <<'PYTHON'
          import hashlib
          import os
          from pathlib import Path
          root = Path(os.environ['FRP86_EVIDENCE'])
          files = sorted(p for p in root.rglob('*') if p.is_file() and p.name != 'evidence.sha256')
          (root / 'evidence.sha256').write_text(''.join(
              f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(root)}\n'
              for p in files))
          PYTHON

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          name: frp-86-downstream-contract-${{ matrix.cells }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/frp-86-evidence/
          if-no-files-found: error
          retention-days: 14
