name: 15 - FRP M31 Phase Step Boundary RTL

run-name: "15 - FRP M31 Phase Step Boundary RTL | 2 runs @ ${{ github.sha }}"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frp-15-m31-phase-step-boundary-rtl-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify-phase-step:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      LC_ALL: C.UTF-8
      TZ: UTC
      PYTHONHASHSEED: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      CXXFLAGS: "--std=c++20 -DVL_TIME_CONTEXT"

    steps:
      - name: Initialize build and evidence paths
        run: |
          set -euo pipefail
          printf '%s\n' \
            "M31_PHASE_STEP_WORK=$RUNNER_TEMP/frp-m31-phase-step-boundary-work" \
            "M31_PHASE_STEP_EVIDENCE=$RUNNER_TEMP/frp-m31-phase-step-boundary-evidence" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/frp-m31-phase-step-boundary-evidence"

      - name: Check out the dispatched commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install the pinned RTL simulator
        timeout-minutes: 10
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          {
            command -v g++
            command -v make
            g++ --version
            make --version
            python -m pip install --disable-pip-version-check --only-binary=:all: \
              --timeout 30 --retries 3 \
              verilator==5.48.0
            frp_verilator_root="$(python -c 'import importlib.util; from pathlib import Path; print(Path(importlib.util.find_spec("verilator").origin).parent)')"
            test -x "$frp_verilator_root/bin/verilator_bin"
            printf '%s\n' "VERILATOR_ROOT=$frp_verilator_root" >> "$GITHUB_ENV"
            printf '%s\n' "$frp_verilator_root/bin" >> "$GITHUB_PATH"
            python --version
            VERILATOR_ROOT="$frp_verilator_root" "$frp_verilator_root/bin/verilator" --version
          } 2>&1 | tee "$M31_PHASE_STEP_EVIDENCE/toolchain.log"

      - name: Qualify two deterministic phase-step boundary RTL replays
        run: |
          set -euo pipefail
          ulimit -c 0
          python - <<'PY'
          import hashlib
          import importlib.metadata
          import json
          import os
          import re
          import shutil
          import subprocess
          from pathlib import Path

          root = Path.cwd().resolve()
          work = Path(os.environ['M31_PHASE_STEP_WORK'])
          evidence = Path(os.environ['M31_PHASE_STEP_EVIDENCE'])
          evidence.mkdir(parents=True, exist_ok=True)
          view = work / 'source'
          build = work / 'build'
          bench = 'frp_m31_phase_step_boundary_tb'
          tb = 'rtl/m31/' + bench + '.sv'
          workflow = '.github/workflows/frp-15-m31-phase-step-boundary-rtl.yml'
          include_dirs = ['rtl/m31']
          report = {
              'status': 'FAIL',
              'repository': os.environ['GITHUB_REPOSITORY'],
              'source_commit': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'scope': 'Eight-cell M31 clocked frequency and phase-step boundaries with reset/load/tick/hold priorities',
              'implementation': 'Unchanged RTL phase engine versus independent signed 128-bit recurrence arithmetic, analytic sine and binary-search integer roots',
              'configured_simulation_runs': 2,
              'simulation_attempts': 0,
              'simulation_runs': 0,
              'commands': [],
              'replays': [],
              'rtl_phase_step_qualified': False,
              'post_synthesis_qualified': False,
              'global_coverage_closure_qualified': False,
              'hardware_implementation_qualified': False,
              'model_v0_9_3_equivalence_qualified': False,
          }
          expected_sources = {
              'rtl/m31/frp_m31_phase_step_boundary_tb.sv': {
                  'bytes': 25224,
                  'sha256': '6d58636a1c8ac513d3d7dda000a27ac494c1d81269c22f8a80c7e5f7a6edd3e3',
              },
              'rtl/m31/frp_m31_phase_interference.sv': {
                  'bytes': 11627,
                  'sha256': 'd3ccabcd304c4ca66dcd31c75d233a16fe61c3181f797162e91674e1992d475d',
              },
              'rtl/m31/frp_m31_fixed_point_pkg.sv': {
                  'bytes': 7278,
                  'sha256': '6b2afb8d1583c93d95d2386ba25dd1eaef6bb5bd9a4e1c9e9abff1dd004cbf24',
              },
              'rtl/m31/frp_m31_pkg.sv': {
                  'bytes': 18531,
                  'sha256': '762302f1c7a7f7f40cb029f5ada6a111fc8c3e3f6be9920e9b2401b95e179c94',
              },
              'rtl/m31/frp_m31_sin_q30.mem': {
                  'bytes': 36864,
                  'sha256': 'adbb4b94fcf8fa0bfc981d654679fd7518a5c4c9c97b611a35cd8accaf28233d',
              },
          }
          expected_stages = [
              {'stage': 0, 'observations': 170, 'signature': 'c1c4ee441879b449'},
              {'stage': 1, 'observations': 1728, 'signature': '5a2098207a15f3d9'},
              {'stage': 2, 'observations': 98304, 'signature': 'b43edecaecd9441b'},
              {'stage': 3, 'observations': 7692, 'signature': 'a6efa8b02a901d66'},
              {'stage': 4, 'observations': 5184, 'signature': '10edd9da06ef2aad'},
          ]
          expected_rounding = [
              {'operation': 0, 'exact': 450, 'positive_below': 42162, 'positive_half': 385, 'positive_above': 38410, 'negative_below': 40065, 'negative_half': 257, 'negative_above': 36551},
              {'operation': 1, 'exact': 214, 'positive_below': 62994, 'positive_half': 102, 'positive_above': 65020, 'negative_below': 15046, 'negative_half': 1, 'negative_above': 14903},
              {'operation': 2, 'exact': 33, 'positive_below': 68301, 'positive_half': 0, 'positive_above': 67633, 'negative_below': 11155, 'negative_half': 0, 'negative_above': 11158},
          ]
          expected_metrics = {
              'stages': 5,
              'observations': 113078,
              'checks': 1017702,
              'loads': 17174,
              'ticks': 19785,
              'holds': 721,
              'reset_updates': 17,
              'load_over_tick': 73,
              'reset_low': 5,
              'reset_high': 4,
              'wide_deltas': 512,
              'multi_turn_steps': 2269,
              'positive_wraps': 3248,
              'negative_wraps': 1283,
              'coupled_cell_ticks': 17399,
              'rising_edges': 37688,
              'falling_edges': 37688,
              'asynchronous_resets': 9,
              'reset_releases': 9,
              'input_settles': 37684,
              'residue_bins': 131072,
              'output_bits': 1168,
              'output_exercised': 1159,
              'signature': '10edd9da06ef2aad',
          }
          expected_records = [
              'FRP_M31_PHASE_STEP_BOUNDARY_STAGE: PASS ' +
              ' '.join(f'{key}={value}' for key, value in stage.items())
              for stage in expected_stages
          ] + [
              'FRP_M31_PHASE_STEP_BOUNDARY_ROUND: PASS ' +
              ' '.join(f'{key}={value}' for key, value in row.items())
              for row in expected_rounding
          ] + [
              'FRP_M31_PHASE_STEP_BOUNDARY_TB: PASS ' +
              ' '.join(f'{key}={value}' for key, value in expected_metrics.items())
          ]


          def require(condition, message):
              if not condition:
                  raise RuntimeError(message)


          def sha(raw):
              return hashlib.sha256(raw).hexdigest()


          def execute(command, label, directory, limit):
              report['commands'].append({'label': label, 'argv': command})
              print(label, flush=True)
              log_path = evidence / (label + '.log')
              try:
                  with log_path.open('w') as log:
                      subprocess.run(command, cwd=directory, stdout=log,
                                     stderr=subprocess.STDOUT, timeout=limit, check=True)
              except (subprocess.CalledProcessError, subprocess.TimeoutExpired):
                  print('\n'.join(log_path.read_text(errors='replace').splitlines()[-40:]))
                  raise
              return log_path


          def phase_step_records(text):
              records = [line for line in text.splitlines()
                         if line.lstrip().startswith('FRP_')]
              require(len(records) == 9, 'Exactly nine phase-step result records are required')
              for index, (actual, expected) in enumerate(zip(records, expected_records)):
                  require(actual == expected,
                          f'Phase-step result {index} differs: {actual!r}; expected {expected!r}')
              return records


          try:
              require(os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch', 'Manual dispatch required')
              require(os.environ['GITHUB_REF'] == 'refs/heads/main', 'Dispatch from main only')
              require(os.environ['GITHUB_REPOSITORY'] ==
                      'maximumberlin76-gif/Fractal-Resonance-Processor-FRP-Ternary-Resonant-Coherence-Processor',
                      'Unexpected repository')
              require(importlib.metadata.version('verilator') == '5.48.0', 'Unexpected simulation package')
              simulator_root = Path(os.environ['VERILATOR_ROOT']).resolve()
              require(Path(shutil.which('verilator') or '').resolve() == simulator_root / 'bin' / 'verilator',
                      'Simulator path differs from the pinned package')
              simulator_sha = sha((simulator_root / 'bin' / 'verilator_bin').read_bytes())
              require(simulator_sha == '7a308fe7b00607f3140fe0599efc107a3f591e631a44a1c3614e00e6c90c0dcc',
                      'Simulator binary differs from the validated Linux x86-64 build')
              report.update(simulation_package='verilator==5.48.0', simulation_binary_sha256=simulator_sha)
              workflow_raw = (root / workflow).read_bytes()
              report['workflow_sha256'] = sha(workflow_raw)
              (evidence / Path(workflow).name).write_bytes(workflow_raw)
              sources = {}

              def visit(name):
                  if name in sources:
                      return
                  path = root / name
                  require(path.is_file() and not path.is_symlink(), 'Missing source: ' + name)
                  raw = path.read_bytes()
                  sources[name] = raw
                  for inc in re.findall(r'`include\s+"([^"]+)"', raw.decode()):
                      matches = {(directory / inc).resolve()
                                 for directory in [path.parent, *[root / d for d in include_dirs]]
                                 if (directory / inc).is_file()}
                      require(len(matches) == 1, 'Missing or ambiguous include: ' + inc)
                      resolved = matches.pop()
                      require(resolved.is_relative_to(root), 'Include leaves the repository')
                      visit(resolved.relative_to(root).as_posix())

              visit(tb)
              visit('rtl/m31/frp_m31_sin_q30.mem')
              identities = {name: {'bytes': len(raw), 'sha256': sha(raw)}
                            for name, raw in sorted(sources.items())}
              report['sources'] = identities
              require(identities == expected_sources, 'Phase-step sources differ from the validated inputs')
              for name, raw in sources.items():
                  for destination in (view / name, evidence / 'inputs' / name):
                      destination.parent.mkdir(parents=True, exist_ok=True)
                      destination.write_bytes(raw)
              version_log = execute(['verilator', '--version'], 'simulator-version', view, 30)
              report['simulation_version'] = version_log.read_text().strip()
              compiler = ['verilator', '--binary', '--sv', '--timing', '--assert',
                          '-Wall', '-Wno-fatal', '-CFLAGS', '-std=c++20 -O0',
                          '--output-split', '20000', '-MAKEFLAGS', 'VK_PCH_I_FAST=',
                          '-MAKEFLAGS', 'VK_PCH_I_SLOW=', '-j', '2']
              compiler += ['-I' + directory for directory in include_dirs]
              execute(compiler + ['--top-module', bench, '--Mdir', str(build), tb],
                      'phase-step-build', view, 600)
              executable = build / ('V' + bench)
              executable_sha = sha(executable.read_bytes())
              report['executable_sha256'] = executable_sha
              for attempt in (1, 2):
                  report['simulation_attempts'] += 1
                  log = execute([str(executable)], f'phase-step-run-{attempt}', view, 180)
                  report['simulation_runs'] += 1
                  records = phase_step_records(log.read_text())
                  record_bytes = ('\n'.join(records) + '\n').encode()
                  (evidence / f'phase-step-records-{attempt}.txt').write_bytes(record_bytes)
                  report['replays'].append({
                      'attempt': attempt, 'stages': expected_stages,
                      'rounding': expected_rounding, 'metrics': expected_metrics,
                      'records': records, 'records_sha256': sha(record_bytes),
                  })
                  print('\n'.join(records), flush=True)
              require(report['simulation_runs'] == 2 and len(report['replays']) == 2,
                      'Both phase-step replays are required')
              require(report['replays'][0]['records'] == report['replays'][1]['records'],
                      'Phase-step replay records differ')
              for name, raw in sources.items():
                  require((root / name).read_bytes() == raw and (view / name).read_bytes() == raw and
                          (evidence / 'inputs' / name).read_bytes() == raw,
                          'Source changed during qualification: ' + name)
              require(sha(executable.read_bytes()) == executable_sha, 'Executable changed during qualification')
              require((root / workflow).read_bytes() == workflow_raw, 'Workflow changed during qualification')
              summary = [
                  '# FRP M31 phase-step boundary RTL: PASS',
                  '',
                  'Source commit: `' + report['source_commit'] + '`',
                  '',
                  'Simulation runs: 2. All nine result records match exactly in both replays.',
                  '',
                  '| Metric | Per replay |',
                  '| --- | ---: |',
                  '| Stages | 5 |',
                  '| Output observations | 113078 |',
                  '| Oracle field comparisons | 1017702 |',
                  '| Public outputs / compared bits | 9 / 1168 |',
                  '| Loads / enabled ticks / held rising edges | 17174 / 19785 / 721 |',
                  '| Load-over-tick priority checks | 73 |',
                  '| Asynchronous resets at low / high clock | 5 / 4 |',
                  '| Total reset updates, including clocked reset edges | 17 |',
                  '| Rising / falling edges | 37688 / 37688 |',
                  '| Reset releases / input-settle observations | 9 / 37684 |',
                  '| Frequency deltas requiring more than 32 signed bits | 512 |',
                  '| Steps of at least one full phase turn | 2269 |',
                  '| Positive / negative phase-wrap events | 3248 / 1283 |',
                  '| Cell ticks with nonzero old-bank coupling | 17399 |',
                  '| Filter-product residue bins, both signs | 131072 |',
                  '| Continuous trajectories / ticks per trajectory | 4 / 512 |',
                  '| Output bits observed at both values | 1159 / 1168 |',
                  '',
                  'All nine public fields are checked before, after and between clock edges.',
                  'The independent oracle uses signed 128-bit arithmetic, analytic sine and binary-search integer roots.',
                  'Five cumulative signatures, three rounding rows and all totals match fixed expectations.',
                  'Rounding rows 0-2 cover the frequency filter, frequency-to-velocity gain and phase-step conversion.',
                  'Every 16-bit filter-product residue is exercised separately for positive and negative deltas.',
                  'This does not exhaust the frequency domain or all rounding cases of phase-step conversion.',
                  'Thermal factors stay in [0, Q30 one]; stages 1 and 4 include reserved input codes as port diagnostics.',
                  'Each tick uses the old phase bank for coupling and the newly filtered frequency for velocity.',
                  'Phase targets are observations, not executed ternary state transitions.',
                  '',
                  'This result covers the declared standalone phase-engine RTL workload.',
                  'Scheduler cadence, full-core reachability, post-synthesis equality, exhaustive input/state coverage,',
                  'physical timing, hardware readiness and model v0.9.3 equivalence are outside this result.',
              ]
              (evidence / 'summary.md').write_text('\n'.join(summary) + '\n')
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
                  stream.write('\n'.join(summary) + '\n')
              report.update(status='PASS', deterministic=True, sources_unchanged=True,
                            rtl_phase_step_qualified=True)
              print('FRP M31 phase-step boundary RTL qualification: PASS (2 runs)', flush=True)
          except Exception as error:
              report['status'] = 'FAIL'
              report['error'] = str(error)
              raise
          finally:
              (evidence / 'result.json').write_text(json.dumps(report, indent=2, sort_keys=True) + '\n')
          PY

      - name: Retain source identities, input snapshots, logs, and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frp-15-m31-phase-step-boundary-rtl-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.M31_PHASE_STEP_EVIDENCE }}/
          if-no-files-found: error
          retention-days: 90
