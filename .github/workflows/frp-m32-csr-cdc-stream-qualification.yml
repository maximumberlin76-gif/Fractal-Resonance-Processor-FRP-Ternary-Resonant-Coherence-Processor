name: FRP M32 CSR CDC Stream Qualification

run-name: "FRP M32 CSR CDC Stream Qualification @ ${{ github.sha }}"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frp-m32-csr-cdc-stream-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify-csr-cdc-stream:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      LC_ALL: C.UTF-8
      TZ: UTC
      PYTHONHASHSEED: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Initialize build and evidence paths
        run: |
          set -euo pipefail
          printf '%s\n' \
            "M32_CDC_STREAM_WORK=$RUNNER_TEMP/frp-m32-csr-cdc-stream-work" \
            "M32_CDC_STREAM_EVIDENCE=$RUNNER_TEMP/frp-m32-csr-cdc-stream-evidence" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/frp-m32-csr-cdc-stream-evidence"

      - name: Check out the dispatched commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install simulation and synthesis tools
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          {
            sudo apt-get update
            sudo apt-get install --yes verilator g++ make
            python -m pip install --disable-pip-version-check \
              yowasp-yosys==0.68.0.0.post1208
            python --version
            verilator --version
            g++ --version
          } 2>&1 | tee "$M32_CDC_STREAM_EVIDENCE/toolchain.log"

      - name: Qualify ready-valid CDC traffic, reset recovery, and synthesis
        run: |
          set -euo pipefail
          ulimit -c 0
          python - <<'PY'
          import hashlib
          import importlib.metadata
          import json
          import os
          import re
          import shutil
          import subprocess
          from pathlib import Path

          root = Path.cwd().resolve()
          work = Path(os.environ["M32_CDC_STREAM_WORK"])
          evidence = Path(os.environ["M32_CDC_STREAM_EVIDENCE"])
          evidence.mkdir(parents=True, exist_ok=True)
          view, build = work / "source", work / "build"
          top = "frp_m32_csr_cdc_stream_top"
          bench = "frp_m32_csr_cdc_stream_tb"
          tb = "fpga/m32_csr/" + bench + ".sv"
          workflow = ".github/workflows/frp-m32-csr-cdc-stream-qualification.yml"
          include_dirs = ["rtl/m22", "rtl/m23", "rtl/m31", "rtl/m32",
                          "fpga/m32", "fpga/m32_csr"]
          profiles = [(5, 7, 1), (3, 11, 4), (13, 2, 3)]
          expected = {
              "accepted": 427, "completed": 423, "core_completed": 425,
              "aborted": 4, "aborted_after_core": 2, "simultaneous": 127,
              "pulses": 426, "rejected": 41, "routes": 8, "resets": 10,
          }
          report = {
              "status": "FAIL", "source_commit": os.environ["GITHUB_SHA"],
              "repository": os.environ["GITHUB_REPOSITORY"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "expected_metrics": expected, "commands": [], "profiles": [],
          }

          def require(condition, message):
              if not condition:
                  raise RuntimeError(message)

          def sha(raw):
              return hashlib.sha256(raw).hexdigest()

          def execute(command, label, directory, limit):
              report["commands"].append({"label": label, "argv": command})
              print(label, flush=True)
              log_path = evidence / (label + ".log")
              try:
                  with log_path.open("w") as log:
                      subprocess.run(command, cwd=directory, stdout=log,
                          stderr=subprocess.STDOUT, timeout=limit, check=True)
              except (subprocess.CalledProcessError, subprocess.TimeoutExpired):
                  print("\n".join(log_path.read_text(errors="replace").splitlines()[-40:]))
                  raise
              return log_path

          def result_records(text, profile):
              prefix = "FRP_M32_CSR_CDC_STREAM_TB:"
              records = [line for line in text.splitlines() if line.startswith(prefix)]
              require(len(records) == 1, "Missing or repeated CDC stream result")
              fields = ["host_half", "core_half", "phase", "checks", "accepted",
                        "completed", "core_completed", "aborted", "aborted_after_core",
                        "simultaneous", "stalled_responses", "stalled_requests",
                        "pulses", "rejected", "routes", "resets"]
              match = re.fullmatch(prefix + " PASS " +
                  " ".join(name + r"=(\d+)" for name in fields), records[0])
              require(match is not None, "Malformed CDC stream terminal result")
              metrics = dict(zip(fields, map(int, match.groups())))
              wanted = dict(zip(("host_half", "core_half", "phase"), profile)) | expected
              require(all(metrics[name] == value for name, value in wanted.items()),
                      "Unexpected CDC stream metrics or clock profile")
              require(metrics["checks"] >= expected["completed"]
                      and metrics["stalled_responses"] >= 100
                      and metrics["stalled_requests"] >= 100,
                      "Missing stalled request or response coverage")
              return records, metrics
          try:
              require(importlib.metadata.version("yowasp-yosys") == "0.68.0.0.post1208",
                      "Unexpected synthesis package")
              sources = set()

              def visit(name):
                  if name in sources:
                      return
                  path = root / name
                  require(path.is_file() and not path.is_symlink(), "Missing source: " + name)
                  sources.add(name)
                  for inc in re.findall(r'`include\s+"([^"]+)"', path.read_text()):
                      matches = {(directory / inc).resolve()
                                 for directory in [path.parent, *[root / d for d in include_dirs]]
                                 if (directory / inc).is_file()}
                      require(len(matches) == 1, "Missing or ambiguous include: " + inc)
                      resolved = matches.pop()
                      require(resolved.is_relative_to(root), "Include leaves the repository")
                      visit(resolved.relative_to(root).as_posix())

              visit(tb)
              sources.add("rtl/m31/frp_m31_sin_q30.mem")
              rows, identities = [], {}
              for name in sorted(sources):
                  raw = (root / name).read_bytes()
                  identities[name] = {"bytes": len(raw), "sha256": sha(raw)}
                  rows.append(f"{name}|{len(raw)}|{sha(raw)}")
              digest = sha(("\n".join(rows) + "\n").encode())
              report.update(sources=identities, source_set_sha256=digest,
                            workflow_sha256=sha((root / workflow).read_bytes()))
              require(len(sources) == 26 and digest ==
                      "2045980c1774b7fded00fd84b8fa8bb3a33876268966b69a0463b45a357de474",
                      "Source set differs from the validated CDC stream inputs")
              for name in sources:
                  target = view / name
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(root / name, target)

              command = ["verilator", "--binary", "--sv", "--timing", "--assert",
                         "-Wall", "-Wno-fatal", "-CFLAGS", "-std=c++20 -O0",
                         "--output-split", "20000", "-MAKEFLAGS", "VK_PCH_I_FAST=",
                         "-MAKEFLAGS", "VK_PCH_I_SLOW=", "-j", "2",
                         "--top-module", bench, "--Mdir", str(build)]
              command += ["-I" + d for d in include_dirs] + [tb]
              execute(command, "build", root, 600)
              for profile in profiles:
                  h, c, p = profile
                  replays = []
                  for attempt in (1, 2):
                      log = execute([str(build / ("V" + bench)), f"+HOST_HALF={h}",
                                     f"+CORE_HALF={c}", f"+PHASE={p}"],
                                    f"run-{h}-{c}-{p}-{attempt}", root, 180)
                      records, metrics = result_records(log.read_text(), profile)
                      replays.append(records)
                  require(replays[0] == replays[1], "CDC stream replay records differ")
                  report["profiles"].append({"host_half_ns": h, "core_half_ns": c,
                      "phase_ns": p, "replays": 2, "metrics": metrics, "records": replays[0]})
                  print("\n".join(replays[0]), flush=True)

              phase = view / "rtl/m31/frp_m31_phase_interference.sv"
              text = phase.read_text()
              first = text.index("    if (sin_lut[0] !== 32'sd0)")
              last = text.index('      $fatal(1, "FRP M31 sine LUT three-quarter-cycle mismatch");', first)
              normalized = text[:first] + text[text.index("\n", last) + 1:]
              require(sha(normalized.encode()) ==
                      "571a1df102318fc5b62d2b0977aa57625e7abd999db3487e62fe2d270f190bb8",
                      "Unexpected synthesis source normalization")
              phase.write_text(normalized)
              netlist = evidence / "frp_m32_csr_cdc_stream_netlist.json"
              script = (
                  "read_slang -j 1 --std 1800-2017 --ignore-assertions --top " + top
                  + " " + " ".join("-I" + d for d in include_dirs)
                  + " fpga/m32_csr/" + top + ".sv; "
                  + "synth -top " + top + " -noshare -run begin:fine; "
                  + "check -assert; write_json " + json.dumps(str(netlist)) + "; stat"
              )
              script_path = evidence / "synthesis.ys"
              script_path.write_text(script + "\n")
              execute(["yowasp-yosys", "-Q", "-T", "-s", str(script_path)],
                      "synthesis", view, 600)
              modules = json.loads(netlist.read_text())["modules"]
              require(set(modules) == {top}, "Unexpected synthesized hierarchy")
              module = modules[top]
              cells, nets = module["cells"], module["netnames"]
              ports = {name: (item["direction"], len(item["bits"]))
                       for name, item in module["ports"].items()}
              wanted_ports = {name: ("input", 1) for name in
                  ("host_clk", "core_clk", "rst_n_async", "req_valid", "req_write", "rsp_ready")}
              wanted_ports.update(req_addr=("input", 8), req_wdata=("input", 32),
                                  rsp_rdata=("output", 32))
              wanted_ports.update({name: ("output", 1) for name in (
                  "req_ready", "rsp_valid", "rsp_error", "host_reset_released", "core_reset_released",
                  "interface_ready", "interface_busy", "protocol_error",
                  "invalid_before_ready", "invalid_while_busy", "invalid_valid_held")})
              require(ports == wanted_ports, "CDC stream port contract changed")
              require(not module.get("processes") and not any(
                  "latch" in cell["type"].lower() for cell in cells.values()),
                  "Remaining processes or latch cells")
              memories = [cell["parameters"] for cell in cells.values()
                          if cell["type"] == "$mem_v2"]
              require(len(memories) == 2 and all(int(m["WR_PORTS"], 2) == 0
                      for m in memories), "Read-only memory contract changed")
              roms = [m for m in memories if int(m["SIZE"], 2) == 4096
                      and int(m["WIDTH"], 2) == 32]
              require(len(roms) == 1, "Missing canonical sine ROM")
              words = [int(word, 16) for word in
                       (root / "rtl/m31/frp_m31_sin_q30.mem").read_text().split()]
              require(len(words) == 4096 and roms[0]["INIT"] ==
                      "".join(f"{word:032b}" for word in reversed(words)),
                      "Synthesized sine ROM contents changed")

              def bit(name):
                  bits = nets[name]["bits"]
                  require(len(bits) == 1, "Expected one-bit net: " + name)
                  return bits[0]

              syncs = [
                  ("u_cdc.host_reset_sync.release_q", "host_clk", "rst_n_async", "1"),
                  ("u_cdc.core_reset_sync.release_q", "core_clk", "rst_n_async", "1"),
                  ("u_cdc.core_release_host_sync_q", "host_clk", "host_reset_released",
                   bit("core_reset_released")),
                  ("u_cdc.cdc_bridge.request_toggle_core_sync_q", "core_clk",
                   "core_reset_released", bit("u_cdc.cdc_bridge.request_toggle_host_q")),
                  ("u_cdc.cdc_bridge.response_toggle_host_sync_q", "host_clk",
                   "host_reset_released", bit("u_cdc.cdc_bridge.response_toggle_core_q")),
              ]
              for name, clock, reset, source in syncs:
                  net = nets[name]
                  require(net.get("attributes", {}).get("ASYNC_REG") == "TRUE"
                          and len(net["bits"]) == 2, "Lost synchronizer: " + name)
                  for index, q in enumerate(net["bits"]):
                      drivers = [cell for cell in cells.values()
                                 if q in cell.get("connections", {}).get("Q", [])]
                      require(len(drivers) == 1, "Ambiguous synchronizer driver")
                      cell = drivers[0]
                      conn, params = cell["connections"], cell["parameters"]
                      require(cell["type"] == "$adff" and conn["CLK"] == [bit(clock)]
                              and conn["ARST"] == [bit(reset)]
                              and int(params["CLK_POLARITY"], 2) == 1
                              and int(params["ARST_POLARITY"], 2) == 0
                              and int(params["ARST_VALUE"], 2) == 0,
                              "Synchronizer clock/reset mismatch: " + name)
                      require(conn["D"][conn["Q"].index(q)] ==
                              (source if index == 0 else net["bits"][0]),
                              "Synchronizer stage wiring mismatch: " + name)
              report["synthesis"] = {"cells": len(cells), "ports": ports,
                  "processes": 0, "latches": 0, "read_only_memories": 2,
                  "sine_rom_exact": True, "two_stage_synchronizers": len(syncs),
                  "netlist_sha256": sha(netlist.read_bytes())}
              for name, identity in identities.items():
                  require(sha((root / name).read_bytes()) == identity["sha256"],
                          "Source changed during qualification: " + name)
              require(sha((root / workflow).read_bytes()) == report["workflow_sha256"],
                      "Workflow changed during qualification")
              subprocess.run(["git", "diff", "--exit-code", "--"], cwd=root, check=True)
              report.update(status="PASS", simulation_runs=6,
                            result_records_identical=True, sources_unchanged=True)
              summary = ["# FRP M32 CSR CDC Stream Qualification: PASS", "",
                  "Source commit: " + os.environ["GITHUB_SHA"], "",
                  "Three clock profiles; two matching replays per profile.", "",
                  "Held requests, response backpressure, clock stops, and four reset abort stages.", "",
                  "Both lanes and active-zero routes under schedules 7/1 and 1/7.", "",
                  "| Measurement per replay | Result |", "| --- | ---: |"]
              summary += [f"| {name} | {value} |" for name, value in expected.items()]
              summary += ["", "rejected counts intentional CSR errors; aborted counts reset cancellations.", "",
                  "Synthesis: zero latches/processes, exact sine ROM,",
                  "and five verified two-stage synchronizers."]
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as stream:
                  stream.write("\n".join(summary) + "\n")
              print("FRP M32 CSR CDC Stream qualification: PASS", flush=True)
          except Exception as error:
              report["status"] = "FAIL"
              report["error"] = str(error)
              raise
          finally:
              (evidence / "result.json").write_text(
                  json.dumps(report, indent=2, sort_keys=True) + "\n")
          PY

      - name: Retain CDC stream logs, synthesized netlist, and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frp-m32-csr-cdc-stream-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.M32_CDC_STREAM_EVIDENCE }}/
          if-no-files-found: error
          retention-days: 90
