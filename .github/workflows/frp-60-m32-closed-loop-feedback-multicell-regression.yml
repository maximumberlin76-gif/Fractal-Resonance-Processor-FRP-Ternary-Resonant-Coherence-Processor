name: 60 - FRP M32 Closed-Loop Feedback Multicell Regression
run-name: "60 - FRP Closed-Loop Feedback | 8/16/32 cells and deterministic replay @ ${{ github.sha }}"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frp-60-closed-loop-feedback-multicell-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    name: Feedback - ${{ matrix.cells }} cells
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        cells: [8, 16, 32]
    defaults:
      run:
        shell: bash
    env:
      CELLS: ${{ matrix.cells }}
      LC_ALL: C.UTF-8
      TZ: UTC
      PYTHONHASHSEED: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Initialize runner paths
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/frp-60-evidence" "$RUNNER_TEMP/frp-60-build"
          printf '%s\n' \
            "FRP60_EVIDENCE=$RUNNER_TEMP/frp-60-evidence" \
            "FRP60_BUILD=$RUNNER_TEMP/frp-60-build" >> "$GITHUB_ENV"

      - name: Check out dispatched commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify manual execution and exact sources
        run: |
          set -euo pipefail
          mkdir -p "$FRP60_EVIDENCE" "$FRP60_BUILD"
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          cat > "$FRP60_EVIDENCE/sources.sha256" <<'SHA'
          765429b33df3f843626bdc411ad8371fd963738a58ab10201abef75dcdafcaf0  rtl/m31/frp_m31_active_neutral.sv
          d0587897f955ce49923aca807b5d3e0c637383c88e5d5e0dfa8405f47917c123  rtl/m31/frp_m31_capacity_guard.sv
          e516a5cd378bd2ddecdadc5abb13ddef26c63fafe5bda65b47a6bd859ca66f92  rtl/m31/frp_m31_execution_core.sv
          6b2afb8d1583c93d95d2386ba25dd1eaef6bb5bd9a4e1c9e9abff1dd004cbf24  rtl/m31/frp_m31_fixed_point_pkg.sv
          d1604e08fa6cf658f25b579fb76202e65fca1481167e6d8d6039a7034e354832  rtl/m31/frp_m31_global_stability.sv
          cbb5a531283164d1d54d59ec748b97bf84e172704854bf5eb7c6bda2c502f7c7  rtl/m31/frp_m31_isqrt_u64.sv
          478882d4f6a2986f5079c88b444c7b007d68145d61e5150209cb0637f35b2ec0  rtl/m31/frp_m31_local_gamma_drift.sv
          6e10f738f94c43ac9748ec7a033adde16243beea59e2f7f2973a3ab51c2e5e04  rtl/m31/frp_m31_local_thermal_attenuation.sv
          2973c4ce73c014cd2692e2fa34cbf1ef6daa88d8e4115a545d6e776acb75cff6  rtl/m31/frp_m31_local_thermal_field.sv
          18889d85e78b23b844f1db4c46a35a6b7d01e609e3f1f0e6263a39a6c5729411  rtl/m31/frp_m31_pending_routes.sv
          81cd497e3f3e04abc93a2052c23deb189b2c200b11cc249ec51dbd40588e9523  rtl/m31/frp_m31_phase_interference.sv
          fa78bcfe965270cc74855908aa392989d857575a2097a126539aabb1aab8990d  rtl/m31/frp_m31_phase_request_adapter.sv
          762302f1c7a7f7f40cb029f5ada6a111fc8c3e3f6be9920e9b2401b95e179c94  rtl/m31/frp_m31_pkg.sv
          32f75cc70df5dba3f4fbb511397be9a5921236c2afd16cfeb1350eca3f6e8109  rtl/m31/frp_m31_request_lanes.sv
          fc9de24b41736e5c5a9f9e464318c80adbfda9dc8cc4362c0c55bfed403bf97f  rtl/m31/frp_m31_scheduler.sv
          adbb4b94fcf8fa0bfc981d654679fd7518a5c4c9c97b611a35cd8accaf28233d  rtl/m31/frp_m31_sin_q30.mem
          69c06833e6dfbb28e25b74a5787dcd03756dddf0f66726de3ea47c1ad2931931  rtl/m31/frp_m31_stability.sv
          ebad1f7ee952a577239445d33d99cae799afaaff5c181c7162514bbcea6eab90  rtl/m31/frp_m31_state_update.sv
          34df4ebfc5dfad8e3e5e454e560404585de5c881e6f75abaae367d3bd9fb11bd  rtl/m31/frp_m31_thermal_proxy.sv
          df35b73ccb01f06908385656332942858a5f056e7b92556cc16658beb5732b98  rtl/m32/frp_m32_core.sv
          9626474b49d32b411e107d7ccc8ee5aa7f42728e9a6f70d634d16d3f2a414c5e  rtl/m32/frp_m32_registered_target_boundary.sv
          02250069a68737f055a419cd67bf2d439b3f63b3f6a7a245f40e9bf29d1958eb  rtl/m32/frp_m32_registered_target_request_path.sv
          fcdc97231048a2dc18c76c69f035e4980dfc4003baf3b2dbaaa2a6195de83897  rtl/m32/frp_m32_feedback_multicell_tb.sv
          SHA
          sha256sum .github/workflows/frp-60-m32-closed-loop-feedback-multicell-regression.yml \
            >> "$FRP60_EVIDENCE/sources.sha256"
          sha256sum --check "$FRP60_EVIDENCE/sources.sha256" \
            | tee "$FRP60_EVIDENCE/source-check.log"
          printf '%s\n' "$GITHUB_SHA" > "$FRP60_EVIDENCE/commit.txt"

      - name: Install and record pinned simulator
        run: |
          set -euo pipefail
          {
            python -m pip install --disable-pip-version-check \
              verilator==5.48.0 systemc==3.0.2.1 click==8.5.0 platformdirs==4.13.0
            python -m pip check
            verilator-cli --version
            c++ --version
            make --version
          } 2>&1 | tee "$FRP60_EVIDENCE/toolchain.log"
          python -m pip freeze > "$FRP60_EVIDENCE/packages.txt"

      - name: Build selected feedback configuration
        run: |
          set -euo pipefail
          case "$CELLS" in 8|16|32) ;; *) exit 1 ;; esac
          timeout 1800s verilator-cli --binary --timing --assert -Wall -Wno-fatal \
            --output-groups 0 -MAKEFLAGS OPT_FAST=-O0 \
            -MAKEFLAGS VK_PCH_I_FAST= -MAKEFLAGS VK_PCH_I_SLOW= \
            -j 2 --top-module frp_m32_feedback_multicell_tb \
            "-GCELLS=$CELLS" --Mdir "$FRP60_BUILD" -Irtl/m31 -Irtl/m32 \
            rtl/m32/frp_m32_feedback_multicell_tb.sv \
            2>&1 | tee "$FRP60_EVIDENCE/build.log"
          test -x "$FRP60_BUILD/Vfrp_m32_feedback_multicell_tb"
          if grep -Eq '%Warning-(PINMISSING|IMPLICIT|MULTIDRIVEN):' "$FRP60_EVIDENCE/build.log"; then
            echo "Invalid connection or multiple driver"
            exit 1
          fi
          sha256sum "$FRP60_BUILD/Vfrp_m32_feedback_multicell_tb" \
            > "$FRP60_EVIDENCE/executable.sha256"

      - name: Run two complete feedback regressions
        run: |
          set -euo pipefail
          for replay in 1 2; do
            timeout 600s "$FRP60_BUILD/Vfrp_m32_feedback_multicell_tb" \
              2>&1 | tee "$FRP60_EVIDENCE/run-$replay.log"
          done

      - name: Verify counts, signatures and replay
        run: |
          set -euo pipefail
          sha256sum --check "$FRP60_EVIDENCE/sources.sha256"
          sha256sum --check "$FRP60_EVIDENCE/executable.sha256"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          evidence = Path(os.environ["FRP60_EVIDENCE"])
          cells = int(os.environ["CELLS"])
          expected = {
              8: [
                  'PASS FEEDBACK cells=8 profiles=12 steps=12812 checks=9279892 resets=44 signature=6542b27764812551',
                  'FEEDBACK_EVENTS cells=8 routes=745 completions=728 overload=16123 gamma=16113 attenuation=16064 cooling=85109 handovers=216',
                  'PASS FEEDBACK_ALL cells=8',
              ],
              16: [
                  'PASS FEEDBACK cells=16 profiles=12 steps=12892 checks=17246240 resets=76 signature=5c3379ef6088e99d',
                  'FEEDBACK_EVENTS cells=16 routes=1499 completions=1465 overload=33749 gamma=33730 attenuation=33604 cooling=171927 handovers=216',
                  'PASS FEEDBACK_ALL cells=16',
              ],
              32: [
                  'PASS FEEDBACK cells=32 profiles=12 steps=13052 checks=33423084 resets=140 signature=fb6856e931c20b47',
                  'FEEDBACK_EVENTS cells=32 routes=2884 completions=2818 overload=70407 gamma=70379 attenuation=70166 cooling=346636 handovers=216',
                  'PASS FEEDBACK_ALL cells=32',
              ],
          }
          if cells not in expected:
              raise SystemExit("Unsupported cell count")
          transcripts = []
          for replay in (1, 2):
              text = (evidence / f"run-{replay}.log").read_text(encoding="utf-8")
              if re.search(r"%Error|%Fatal|Assertion failed|Aborting", text):
                  raise SystemExit(f"Simulator failure: replay {replay}")
              lines = [line for line in text.splitlines()
                       if line.startswith(("PASS FEEDBACK", "FEEDBACK_EVENTS"))]
              if lines != expected[cells]:
                  raise SystemExit(f"Counts, events or signature differ: replay {replay}")
              transcript = "\n".join(lines) + "\n"
              transcripts.append(transcript)
              (evidence / f"replay-{replay}.txt").write_text(transcript, encoding="utf-8")
          if transcripts[0] != transcripts[1]:
              raise SystemExit("Semantic replay mismatch")
          fields = dict(item.split("=", 1) for item in expected[cells][0].split()[2:])
          events = dict(item.split("=", 1) for item in expected[cells][1].split()[1:])
          comparisons = int(fields["checks"])
          result = {
              "schema": "frp.m32.closed-loop-feedback-multicell-regression.v1",
              "result": "PASS", "commit": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "cells": cells, "replays": 2, "identical_transcripts": True,
              "profiles_per_replay": int(fields["profiles"]),
              "dynamic_ticks_per_profile": 1024,
              "steps_per_replay": int(fields["steps"]),
              "resets_per_replay": int(fields["resets"]),
              "observation_word_comparisons_per_replay": comparisons,
              "observation_word_comparisons_total": 2 * comparisons,
              "signature": fields["signature"],
              "events_per_replay": {k: int(v) for k, v in events.items() if k != "cells"},
              "transcript_sha256": hashlib.sha256(transcripts[0].encode()).hexdigest(),
          }
          (evidence / "result.json").write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          summary = "\n".join([
              f"## FRP M32 closed-loop feedback: PASS ({cells} cells)", "",
              f'Commit: `{os.environ["GITHUB_SHA"]}`', "",
              "| Profiles per replay | Steps per replay | Resets per replay | Signature |",
              "|---:|---:|---:|---|",
              f"| {fields['profiles']} | {fields['steps']} | {fields['resets']} | `{fields['signature']}` |",
              "", f"Two matching replays: {2 * comparisons} 32-bit observation-word comparisons.",
              "Each replay: four thermal/gamma source selections x three scheduler modes.",
              "Each profile: 1024 dynamic ticks, plus loads, holds and control checks.",
              "Relative-phase interference -> registered ternary target -> active-zero execution -> thermal/gamma feedback.",
              "Independent integer oracle, analytic sine/exp tables and multiscale coherence.",
              "Every cell: both polarity bridges through zero, retained completion and reset with pending work.",
              "Candidate thermal/gamma selection, frequency memory, pauses, clears and source handovers checked.",
              "", "```text", *expected[cells], "```", "",
          ])
          (evidence / "summary.md").write_text(summary, encoding="utf-8")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as stream:
              stream.write(summary)
          (evidence / "artifacts.sha256").write_text("".join(
              f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n"
              for p in sorted(evidence.iterdir())
              if p.is_file() and p.name != "artifacts.sha256"
          ), encoding="ascii")
          print(summary)
          PY

      - name: Upload results and diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: frp-60-feedback-${{ matrix.cells }}-cells-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/frp-60-evidence/
          if-no-files-found: error
          retention-days: 30
