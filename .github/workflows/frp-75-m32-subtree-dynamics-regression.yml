name: 75 - FRP M32 Subtree Dynamics Regression
run-name: "75 - FRP Subtree Dynamics | 8/16/32/64 cells and deterministic replay @ ${{ github.sha }}"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frp-75-subtree-dynamics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    name: M32 subtree-dynamics - ${{ matrix.cells }} cells
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        cells: [8, 16, 32, 64]
    defaults:
      run:
        shell: bash
    env:
      CELLS: ${{ matrix.cells }}
      LC_ALL: C.UTF-8
      TZ: UTC
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Initialize evidence directory
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/frp-75-evidence"
          printf 'commit=%s\ncells=%s\nrun=%s\nattempt=%s\n' \
            "$GITHUB_SHA" "$CELLS" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            > "$RUNNER_TEMP/frp-75-evidence/context.txt"
          echo "FRP75_EVIDENCE=$RUNNER_TEMP/frp-75-evidence" >> "$GITHUB_ENV"

      - name: Check out dispatched commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify manual execution and qualified sources
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          cat > "$FRP75_EVIDENCE/sources.sha256" <<'SHA'
          6b2afb8d1583c93d95d2386ba25dd1eaef6bb5bd9a4e1c9e9abff1dd004cbf24  rtl/m31/frp_m31_fixed_point_pkg.sv
          cbb5a531283164d1d54d59ec748b97bf84e172704854bf5eb7c6bda2c502f7c7  rtl/m31/frp_m31_isqrt_u64.sv
          478882d4f6a2986f5079c88b444c7b007d68145d61e5150209cb0637f35b2ec0  rtl/m31/frp_m31_local_gamma_drift.sv
          6e10f738f94c43ac9748ec7a033adde16243beea59e2f7f2973a3ab51c2e5e04  rtl/m31/frp_m31_local_thermal_attenuation.sv
          cb97c1bfeabbb2acaebf2f9644d484b2f7c5e995dbf1b70777f6bc2e7df9368e  rtl/m31/frp_m31_local_thermal_field.sv
          7ac3572ef2bf9feef509e7dc43c662d92d23fa3eb0563efbfa8dba7c28157746  rtl/m31/frp_m31_phase_interference.sv
          762302f1c7a7f7f40cb029f5ada6a111fc8c3e3f6be9920e9b2401b95e179c94  rtl/m31/frp_m31_pkg.sv
          adbb4b94fcf8fa0bfc981d654679fd7518a5c4c9c97b611a35cd8accaf28233d  rtl/m31/frp_m31_sin_q30.mem
          24cdb694103923bc882ac7e6fdafaef6635bed12cadd67841ffa295905f740e0  rtl/m32/frp_m32_subtree_dynamics_tb.sv
          SHA
          sha256sum .github/workflows/frp-75-m32-subtree-dynamics-regression.yml \
            >> "$FRP75_EVIDENCE/sources.sha256"
          sha256sum --check --strict "$FRP75_EVIDENCE/sources.sha256" \
            | tee "$FRP75_EVIDENCE/source-check.log"
          printf '%s\n' "$GITHUB_SHA" > "$FRP75_EVIDENCE/commit.txt"

      - name: Install and record toolchain
        run: |
          set -euo pipefail
          {
            python -m pip install --disable-pip-version-check \
              verilator==5.48.0 systemc==3.0.2.1
            python -m pip check
            verilator-cli --version
            g++ --version
            make --version
          } 2>&1 | tee "$FRP75_EVIDENCE/toolchain.log"
          python -m pip freeze > "$FRP75_EVIDENCE/packages.txt"

      - name: Build once and qualify two full replays
        run: |
          set -euo pipefail
          python - <<'PYTHON'
          import hashlib
          import json
          import os
          import re
          import signal
          import subprocess
          import time
          from pathlib import Path

          GOLDEN = {8: '964dd25e03d282ae73de6e2a98e2416fed161a2fc3718d5eea3a759e69ae89f3'}

          def require(condition, message):
              if not condition:
                  raise SystemExit(message)

          def record(line, prefix, schema, n):
              require(line.startswith(prefix), f'Missing record: {prefix}')
              result = {}
              for token in line[len(prefix):].split():
                  key, separator, value = token.partition('=')
                  require(separator and key not in result, f'Malformed or duplicate field: {token}')
                  pattern = r'[0-9a-f]{16}' if key == 'signature' else r'[0-9]+'
                  require(re.fullmatch(pattern, value), f'Invalid field: {token}')
                  result[key] = value if key == 'signature' else int(value)
              require(set(result) == set(schema.split()), f'Incorrect field set: {prefix}')
              require(result['cells'] == n, f'Incorrect cell count: {prefix}')
              return result

          def collect(path, n):
              require(n in (8, 16, 32, 64), 'Unsupported cell count')
              text = path.read_text(errors='strict')
              require(not re.search(r'%Error|%Fatal|Assertion failed|Aborting|^\s*FAIL\b', text, re.M),
                      'Simulation failure marker')
              selected = [line.strip() for line in text.splitlines()
                          if line.strip().startswith(('SUBTREE_', 'PASS'))]
              depth = n.bit_length() - 1
              require(len(selected) == 3*(depth+1)+1, 'Incomplete or additional semantic records')
              profiles = []
              for mode in range(3):
                  levels = []
                  for level in range(1, depth+1):
                      item = record(selected[mode*(depth+1)+level-1], 'SUBTREE_LEVEL ',
                                    'cells mode level cases', n)
                      require(item == dict(cells=n, mode=mode, level=level, cases=n >> level),
                              f'Incorrect subtree level: mode {mode}, level {level}')
                      levels.append(item)
                  composed = record(selected[mode*(depth+1)+depth], 'SUBTREE_COMPOSED ',
                                    'cells mode cases', n)
                  require(composed == dict(cells=n, mode=mode, cases=8),
                          f'Incorrect composed mappings: mode {mode}')
                  profiles.append(dict(levels=levels, composed=composed))
              total = record(selected[-1], 'PASS SUBTREE_DYNAMICS ',
                             'cells cases local_cases composed_cases edges updates holds loads checks '
                             'non_xor non_involutive renamed moving warm drifting attenuated '
                             'diffusion_positive diffusion_negative signature', n)
              cases = 3*(n+7)
              checks = cases*(213*(26*n+4*depth+6)+n*n+n*depth+113*n+75)+25
              expected = dict(cases=cases, local_cases=3*(n-1), composed_cases=24,
                              edges=107*cases, updates=95*cases, holds=9*cases, loads=3*cases,
                              checks=checks)
              for key, value in expected.items():
                  require(total[key] == value, f'Incorrect {key}: {total[key]} != {value}')
              require(sum(x['cases'] for p in profiles for x in p['levels']) == total['local_cases'],
                      'Local case accounting mismatch')
              require(sum(p['composed']['cases'] for p in profiles) == total['composed_cases'],
                      'Composed case accounting mismatch')
              require(total['local_cases'] + total['composed_cases'] == total['cases'],
                      'Total case accounting mismatch')
              require(0 < total['non_xor'] <= cases, 'Missing or invalid non-XOR mappings')
              require(0 < total['non_involutive'] <= total['composed_cases'],
                      'Missing or invalid non-involutive mappings')
              for key in ('renamed', 'moving', 'warm', 'drifting', 'attenuated',
                          'diffusion_positive', 'diffusion_negative'):
                  require(total[key] > 0, f'Missing trajectory witness: {key}')
              semantic = '\n'.join(selected) + '\n'
              digest = hashlib.sha256(semantic.encode()).hexdigest()
              if n in GOLDEN:
                  require(digest == GOLDEN[n], f'{n}-cell baseline mismatch: {digest}')
              return {'profiles': profiles, 'total': total, 'semantic_sha256': digest}, semantic

          n = int(os.environ['CELLS'])
          require(n in (8, 16, 32, 64), 'Unsupported cell count')
          evidence = Path(os.environ['FRP75_EVIDENCE']).resolve()
          build = Path(os.environ['RUNNER_TEMP']) / f'frp-75-build-{n}'
          top = 'frp_m32_subtree_dynamics_tb'
          commands = []

          def run(command, logfile, seconds):
              entry = {'argv': command, 'timeout_seconds': seconds, 'log': logfile, 'status': 'running'}
              commands.append(entry)
              def save():
                  (evidence / 'commands.json').write_text(json.dumps(commands, indent=2) + '\n')
              save()
              print('Running:', command, flush=True)
              path = evidence / logfile
              started = time.monotonic()
              process = None
              try:
                  with path.open('w') as stream:
                      process = subprocess.Popen(command, stdout=stream, stderr=subprocess.STDOUT,
                                                 start_new_session=True)
                      while True:
                          remaining = seconds - (time.monotonic() - started)
                          if remaining <= 0:
                              raise TimeoutError(f'{logfile}: timeout after {seconds} seconds')
                          try:
                              code = process.wait(timeout=min(30, remaining))
                              break
                          except subprocess.TimeoutExpired:
                              print(f'{logfile}: running, elapsed={time.monotonic()-started:.0f}s, '
                                    f'log_bytes={path.stat().st_size}', flush=True)
                  entry['returncode'] = code
                  require(code == 0, f'{logfile}: exit {code}')
                  entry['status'] = 'passed'
              except BaseException as error:
                  if process is not None and process.poll() is None:
                      os.killpg(process.pid, signal.SIGKILL)
                      process.wait()
                  entry['status'] = 'failed'
                  entry['error'] = str(error)
                  if path.exists():
                      print(path.read_text(errors='replace')[-16000:], flush=True)
                  raise
              finally:
                  entry['elapsed_seconds'] = round(time.monotonic() - started, 3)
                  save()
              print(f'{logfile}: passed in {entry["elapsed_seconds"]}s', flush=True)

          run([
              'verilator-cli', '--binary', '--output-groups', '0',
              '--timing', '--assert', '-Wno-fatal', '-j', '1',
              '-CFLAGS', '-std=c++20', '-MAKEFLAGS', 'OPT_FAST=-O0',
              '-MAKEFLAGS', 'VK_PCH_I_FAST=', '-MAKEFLAGS', 'VK_PCH_I_SLOW=',
              '--top-module', top, f'-GCELLS={n}', '--Mdir', str(build),
              '-Irtl/m31', '-Irtl/m32', f'rtl/m32/{top}.sv',
          ], 'compile.log', 3600)
          compile_log = (evidence / 'compile.log').read_text(errors='replace')
          require(not re.search(r'%Error|%Warning-(PINMISSING|IMPLICIT|MULTIDRIVEN)\b', compile_log),
                  'Compile error or unexpected port, implicit signal or multiple driver')
          executable = build / f'V{top}'
          (evidence / 'executable.sha256').write_text(
              f'{hashlib.sha256(executable.read_bytes()).hexdigest()}  V{top}\n')
          replays = []
          for replay in (1, 2):
              logfile = f'run-{replay}.log'
              run(['stdbuf', '-oL', '-eL', str(executable)], logfile, 7200)
              result, semantic = collect(evidence / logfile, n)
              (evidence / f'run-{replay}.txt').write_text(semantic)
              replays.append((result, semantic))
              print(semantic, end='')
          require(replays[0] == replays[1], 'Deterministic replay mismatch')
          result, semantic = replays[0]
          report = {
              'commit': os.environ['GITHUB_SHA'], 'cells': n, 'builds': 1,
              'replays': 2, 'replay_equal': True, 'semantic_records': 3*n.bit_length()+1,
              'baseline_checked': n in GOLDEN, **result,
          }
          (evidence / 'qualification.json').write_text(json.dumps(report, indent=2) + '\n')
          summary = (f'### FRP 75: {n} cells - PASS\n\n'
                     'One build; two full replays; every subtree level in three modes.\n\n'
                     'Each mode: all sibling-subtree exchanges and eight composed mappings.\n\n'
                     'Paired upstream phase, thermal, gamma and attenuation trajectories.\n\n'
                     'Modes: 0 FREE, 1 7/1, 2 1/7.\n\n'
                     f'Semantic SHA-256: `{result["semantic_sha256"]}`\n\n'
                     '```text\n' + semantic.splitlines()[-1] + '\n```\n')
          (evidence / 'summary.md').write_text(summary)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write(summary)
          print('PASS: subtree dynamics and deterministic replay')
          PYTHON

      - name: Recheck qualified sources
        if: always()
        run: |
          set -euo pipefail
          sha256sum --check --strict "$FRP75_EVIDENCE/sources.sha256" \
            | tee "$FRP75_EVIDENCE/source-recheck.log"

      - name: Hash qualification evidence
        if: always()
        run: |
          set -euo pipefail
          python - <<'PYTHON'
          import hashlib
          import os
          from pathlib import Path
          root = Path(os.environ['FRP75_EVIDENCE'])
          files = sorted(p for p in root.rglob('*') if p.is_file() and p.name != 'evidence.sha256')
          manifest = ''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(root)}\n'
                             for p in files)
          (root / 'evidence.sha256').write_text(manifest)
          PYTHON

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          name: frp-75-subtree-dynamics-${{ matrix.cells }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/frp-75-evidence/
          if-no-files-found: error
          retention-days: 30
