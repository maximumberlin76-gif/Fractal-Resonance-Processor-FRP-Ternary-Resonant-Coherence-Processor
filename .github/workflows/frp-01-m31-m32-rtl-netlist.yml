name: 01 - FRP M31-M32 RTL + Netlist

run-name: "01 - FRP M31-M32 RTL + Netlist @ ${{ github.sha }}"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frp-01-m31-m32-rtl-netlist-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify-01:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    env:
      LC_ALL: C.UTF-8
      TZ: UTC
      PYTHONHASHSEED: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      CXXFLAGS: "--std=c++20 -DVL_TIME_CONTEXT"

    steps:
      - name: Initialize build and evidence paths
        run: |
          set -euo pipefail
          printf '%s\n' \
            "M32_CDC_STREAM_POST_WORK=$RUNNER_TEMP/frp-m32-csr-cdc-stream-post-work" \
            "M32_CDC_STREAM_POST_EVIDENCE=$RUNNER_TEMP/frp-m32-csr-cdc-stream-post-evidence" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/frp-m32-csr-cdc-stream-post-evidence"

      - name: Check out the dispatched commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install simulation and synthesis tools
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          {
            sudo apt-get update
            sudo apt-get install --yes g++ make
            python -m pip install --disable-pip-version-check --only-binary=:all: \
              verilator==5.48.0
            python -m pip install --disable-pip-version-check \
              yowasp-yosys==0.68.0.0.post1208
            frp_verilator_root="$(python -c 'import importlib.util; from pathlib import Path; print(Path(importlib.util.find_spec("verilator").origin).parent)')"
            test -x "$frp_verilator_root/bin/verilator_bin"
            printf '%s\n' "VERILATOR_ROOT=$frp_verilator_root" >> "$GITHUB_ENV"
            printf '%s\n' "$frp_verilator_root/bin" >> "$GITHUB_PATH"
            python --version
            VERILATOR_ROOT="$frp_verilator_root" "$frp_verilator_root/bin/verilator" --version
            g++ --version
          } 2>&1 | tee "$M32_CDC_STREAM_POST_EVIDENCE/toolchain.log"

      - name: Qualify execution routing, phase, frequency, thermal stability, and netlists
        run: |
          set -euo pipefail
          ulimit -c 0
          python - <<'PY'
          import hashlib
          import importlib.metadata
          import json
          import os
          import re
          import shutil
          import subprocess
          from pathlib import Path
          import yowasp_yosys

          root = Path.cwd().resolve()
          work = Path(os.environ["M32_CDC_STREAM_POST_WORK"])
          evidence = Path(os.environ["M32_CDC_STREAM_POST_EVIDENCE"])
          evidence.mkdir(parents=True, exist_ok=True)
          view, build = work / "source", work / "build"
          top = "frp_m32_csr_cdc_stream_top"
          bench = "frp_m32_csr_cdc_stream_post_synthesis_tb"
          tb = "fpga/m32_csr/" + bench + ".sv"
          routing_bench = "frp_m31_execution_routing_tb"
          routing_tb = "rtl/m31/" + routing_bench + ".sv"
          routing_post_bench = "frp_m31_execution_routing_post_synthesis_tb"
          routing_post_tb = "rtl/m31/" + routing_post_bench + ".sv"
          frequency_bench = "frp_m31_frequency_range_tb"
          frequency_tb = "rtl/m31/" + frequency_bench + ".sv"
          frequency_post_bench = "frp_m31_frequency_range_post_synthesis_tb"
          frequency_post_tb = "rtl/m31/" + frequency_post_bench + ".sv"
          geometry_bench = "frp_m31_phase_geometry_tb"
          geometry_tb = "rtl/m31/" + geometry_bench + ".sv"
          geometry_post_bench = "frp_m31_phase_geometry_post_synthesis_tb"
          geometry_post_tb = "rtl/m31/" + geometry_post_bench + ".sv"
          dynamics_bench = "frp_m31_phase_dynamics_tb"
          dynamics_tb = "rtl/m31/" + dynamics_bench + ".sv"
          dynamics_post_bench = "frp_m31_phase_dynamics_post_synthesis_tb"
          dynamics_post_tb = "rtl/m31/" + dynamics_post_bench + ".sv"
          thermal_bench = "frp_m31_thermal_dynamics_tb"
          thermal_tb = "rtl/m31/" + thermal_bench + ".sv"
          thermal_post_bench = "frp_m31_thermal_dynamics_post_synthesis_tb"
          thermal_post_tb = "rtl/m31/" + thermal_post_bench + ".sv"
          workflow = ".github/workflows/frp-01-m31-m32-rtl-netlist.yml"
          include_dirs = ["rtl/m22", "rtl/m23", "rtl/m31", "rtl/m32",
                          "fpga/m32", "fpga/m32_csr"]
          profiles = [(5, 7, 1), (3, 11, 4), (13, 2, 3)]
          expected = {
              "accepted": 427, "completed": 423, "core_completed": 425,
              "aborted": 4, "aborted_after_core": 2, "simultaneous": 127,
              "pulses": 426, "rejected": 41, "routes": 8, "resets": 10,
          }
          routing_expected = {
              "matrix_cases": 720, "duplicate_cases": 216, "pending_cases": 32,
              "capacity_cases": 128, "backlog_cases": 32, "reserved_cases": 16,
              "counter_clears": 64, "resets": 1144, "enabled_ticks": 5664,
              "hold_edges": 1984, "first_legs": 496, "second_legs": 352,
          }
          routing_post_expected = {
              "comparisons": 34199, "output_bits": 556, "enabled_ticks": 5664,
              "hold_edges": 1984, "reset_assertions": 1144, "reset_clock_edges": 1144,
              "clear_tick_edges": 32, "clear_hold_edges": 32,
              "matrix_cases": 720, "duplicate_cases": 216, "pending_cases": 32,
              "capacity_cases": 128, "backlog_cases": 32, "reserved_cases": 16,
              "first_legs": 496, "second_legs": 352,
          }
          frequency_expected = {
              "vectors": 144, "scheduler_states": 5, "updates": 720,
              "loads": 90, "hold_edges": 360, "reset_checks": 3,
          }
          frequency_post_expected = {
              "output_bits": 1168, "vectors": 144, "scheduler_states": 5,
              "updates": 720, "ticks": 90, "loads": 90,
              "reset_assertions": 2, "reset_clock_edges": 2,
              "free_ticks": 18, "balance_ticks": 18, "commit_ticks": 18,
              "excite_ticks": 18, "neutralize_ticks": 18,
          }
          geometry_expected = {
              "loads": 634, "lut_samples": 4096, "target_samples": 4096,
              "geometry_cases": 5, "gamma_cases": 8, "topology_cases": 16,
              "thermal_cases": 13, "rotation_cases": 60, "coupling_checks": 296,
          }
          geometry_post_expected = geometry_expected | {
              "output_bits": 1168, "reset_assertions": 1, "reset_clock_edges": 1,
          }
          dynamics_expected = {
              "profiles": 6, "ticks": 48, "phase_words": 384, "frequency_words": 384,
              "hold_edges": 96, "loads": 6, "resets": 6, "free_ticks": 16,
              "balance_ticks": 14, "commit_ticks": 2, "excite_ticks": 2,
              "neutralize_ticks": 14,
          }
          dynamics_post_expected = {
              "output_bits": 1168, "ticks": 48, "loads": 6, "resets": 6,
              "free_ticks": 16, "balance_ticks": 14, "commit_ticks": 2,
              "excite_ticks": 2, "neutralize_ticks": 14,
          }
          thermal_expected = {
              "profiles": 2, "vectors": 64, "cooling_ticks": 256, "warmup_ticks": 4,
              "updates": 324, "hold_edges": 128, "clears": 4, "resets": 3,
              "capacity_cases": 36, "boundary_cases": 108, "saturation_cases": 22,
          }
          thermal_post_expected = {
              "output_bits": 193, "updates": 324, "clears": 4,
              "resets": 3, "boundary_cases": 108,
          }
          report = {
              "status": "FAIL", "source_commit": os.environ["GITHUB_SHA"],
              "repository": os.environ["GITHUB_REPOSITORY"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "expected_metrics": expected, "commands": [], "profiles": [],
              "execution_routing_expected_metrics": routing_expected,
              "execution_routing_post_expected_metrics": routing_post_expected,
              "frequency_expected_metrics": frequency_expected,
              "frequency_post_expected_metrics": frequency_post_expected,
              "geometry_expected_metrics": geometry_expected,
              "geometry_post_expected_metrics": geometry_post_expected,
              "dynamics_expected_metrics": dynamics_expected,
              "dynamics_post_expected_metrics": dynamics_post_expected,
              "thermal_expected_metrics": thermal_expected,
              "thermal_post_expected_metrics": thermal_post_expected,
          }

          def require(condition, message):
              if not condition:
                  raise RuntimeError(message)

          def sha(raw):
              return hashlib.sha256(raw).hexdigest()

          def execute(command, label, directory, limit):
              report["commands"].append({"label": label, "argv": command})
              print(label, flush=True)
              log_path = evidence / (label + ".log")
              try:
                  with log_path.open("w") as log:
                      subprocess.run(command, cwd=directory, stdout=log,
                          stderr=subprocess.STDOUT, timeout=limit, check=True)
              except (subprocess.CalledProcessError, subprocess.TimeoutExpired):
                  print("\n".join(log_path.read_text(errors="replace").splitlines()[-40:]))
                  raise
              return log_path

          def result_records(text, profile):
              rtl_prefix = "FRP_M32_CSR_CDC_STREAM_TB:"
              post_prefix = "FRP_M32_CSR_CDC_STREAM_POST_SYNTHESIS_TB:"
              records = [line for line in text.splitlines()
                         if line.startswith((rtl_prefix, post_prefix))]
              require(len(records) == 2,
                      "Incomplete or repeated CDC stream post-synthesis results")
              clocks = dict(zip(("host_half", "core_half", "phase"), profile))
              fields = [*clocks, "checks", "accepted", "completed", "core_completed",
                        "aborted", "aborted_after_core", "simultaneous",
                        "stalled_responses", "stalled_requests", "pulses",
                        "rejected", "routes", "resets"]
              match = re.fullmatch(rtl_prefix + " PASS " +
                  " ".join(k + r"=(\d+)" for k in fields), records[0])
              require(match is not None, "Malformed reference RTL result")
              rtl_metrics = dict(zip(fields, map(int, match.groups())))
              wanted = clocks | expected
              require(all(rtl_metrics[k] == v for k, v in wanted.items()),
                      "Unexpected reference metrics or clock profile")
              require(rtl_metrics["checks"] >= expected["completed"]
                      and rtl_metrics["stalled_responses"] >= 100
                      and rtl_metrics["stalled_requests"] >= 100,
                      "Missing stalled request or response coverage")
              fields = [*clocks, "comparisons", "output_bits", "accepted",
                        "completed", "simultaneous"]
              match = re.fullmatch(post_prefix + " PASS " +
                  " ".join(k + r"=(\d+)" for k in fields), records[1])
              require(match is not None, "Malformed post-synthesis result")
              metrics = dict(zip(fields, map(int, match.groups())))
              wanted = clocks | {k: expected[k]
                                 for k in ("accepted", "completed", "simultaneous")}
              require(all(metrics[k] == v for k, v in wanted.items())
                      and metrics["output_bits"] == 43
                      and metrics["comparisons"] >= 2 * expected["accepted"],
                      "Unexpected post-synthesis metrics or clock profile")
              return records, rtl_metrics, metrics

          def regression_record(text, prefix, expected_metrics):
              records = [line for line in text.splitlines() if line.startswith(prefix)]
              require(len(records) == 1, prefix + " incomplete or repeated result")
              match = re.fullmatch(prefix + " PASS " +
                  " ".join(k + r"=(\d+)" for k in expected_metrics), records[0])
              require(match is not None, prefix + " malformed result")
              metrics = dict(zip(expected_metrics, map(int, match.groups())))
              require(metrics == expected_metrics, prefix + " incomplete coverage")
              return records[0], metrics

          def routing_post_records(text):
              prefix = "FRP_M31_EXECUTION_ROUTING_POST_SYNTHESIS_TB:"
              records = [line for line in text.splitlines()
                         if line.startswith("FRP_M31_EXECUTION_ROUTING_")]
              require(len(records) == 2 and records[-1].startswith(prefix),
                      "Incomplete, repeated or out-of-order execution post-synthesis results")
              _, rtl_metrics = regression_record(records[0],
                  "FRP_M31_EXECUTION_ROUTING_TB:", routing_expected)
              _, metrics = regression_record(records[1], prefix, routing_post_expected)
              return records, rtl_metrics, metrics

          def frequency_post_records(text):
              prefix = "FRP_M31_FREQUENCY_RANGE_POST_SYNTHESIS_TB:"
              records = [line for line in text.splitlines()
                         if line.startswith("FRP_M31_FREQUENCY_RANGE_")]
              require(len(records) == 2 and records[-1].startswith(prefix),
                      "Incomplete, repeated or out-of-order frequency post-synthesis results")
              _, rtl_metrics = regression_record(records[0],
                  "FRP_M31_FREQUENCY_RANGE_TB:", frequency_expected)
              fields = ["comparisons", "output_bits", "vectors", "scheduler_states",
                        "updates", "ticks", "loads", "hold_edges", "reset_assertions",
                        "reset_clock_edges", "free_ticks", "balance_ticks", "commit_ticks",
                        "excite_ticks", "neutralize_ticks"]
              match = re.fullmatch(prefix + " PASS " +
                  " ".join(k + r"=(\d+)" for k in fields), records[-1])
              require(match is not None, "Malformed frequency post-synthesis result")
              metrics = dict(zip(fields, map(int, match.groups())))
              require(all(metrics[k] == v for k, v in frequency_post_expected.items())
                      and metrics["hold_edges"] >= frequency_expected["hold_edges"]
                      and metrics["comparisons"] >= 544,
                      "Incomplete frequency post-synthesis coverage")
              return records, rtl_metrics, metrics

          def geometry_post_records(text):
              prefix = "FRP_M31_PHASE_GEOMETRY_POST_SYNTHESIS_TB:"
              records = [line for line in text.splitlines()
                         if line.startswith("FRP_M31_PHASE_GEOMETRY_")]
              require(len(records) == 2 and records[-1].startswith(prefix),
                      "Incomplete, repeated or out-of-order geometry post-synthesis results")
              _, rtl_metrics = regression_record(records[0],
                  "FRP_M31_PHASE_GEOMETRY_TB:", geometry_expected)
              fields = ["comparisons", "output_bits", "loads", "hold_edges",
                        "reset_assertions", "reset_clock_edges", "lut_samples",
                        "target_samples", "geometry_cases", "gamma_cases", "topology_cases",
                        "thermal_cases", "rotation_cases", "coupling_checks"]
              match = re.fullmatch(prefix + " PASS " +
                  " ".join(k + r"=(\d+)" for k in fields), records[-1])
              require(match is not None, "Malformed geometry post-synthesis result")
              metrics = dict(zip(fields, map(int, match.groups())))
              require(all(metrics[k] == v for k, v in geometry_post_expected.items())
                      and metrics["hold_edges"] >= 634 and metrics["comparisons"] >= 1270,
                      "Incomplete geometry post-synthesis coverage")
              return records, rtl_metrics, metrics

          def dynamics_records(text):
              terminal, metrics = regression_record(text,
                  "FRP_M31_PHASE_DYNAMICS_TB:", dynamics_expected)
              records = [line for line in text.splitlines()
                         if line.startswith("FRP_M31_PHASE_DYNAMICS_")]
              require(len(records) == 55 and records[-1] == terminal,
                      "Incomplete, repeated or out-of-order phase dynamics results")
              index = 0
              for workload in (0, 1):
                  for mode in ("free", "7/1", "1/7"):
                      for tick in range(1, 9):
                          state = (0 if mode == "free" else
                                   (2 if tick == 8 else 1) if mode == "7/1" else
                                   (3 if tick == 1 else 4))
                          pattern = (f"FRP_M31_PHASE_DYNAMICS_TICK: workload={workload} "
                              f"mode={mode} tick={tick} scheduler={state}"
                              + r" phase=[0-9a-f]{64} frequency=[0-9a-f]{64}")
                          require(re.fullmatch(pattern, records[index]) is not None,
                                  "Malformed or out-of-order phase dynamics tick")
                          index += 1
                      require(records[index] ==
                          f"FRP_M31_PHASE_DYNAMICS_PROFILE: PASS workload={workload} "
                          f"mode={mode} ticks=8", "Missing phase dynamics profile")
                      index += 1
              return records, metrics

          def dynamics_post_records(text):
              prefix = "FRP_M31_PHASE_DYNAMICS_POST_SYNTHESIS_TB:"
              records = [line for line in text.splitlines()
                         if line.startswith("FRP_M31_PHASE_DYNAMICS_")]
              require(len(records) == 56 and records[-1].startswith(prefix),
                      "Incomplete, repeated or out-of-order phase post-synthesis results")
              _, rtl_metrics = dynamics_records("\n".join(records[:-1]))
              fields = ["comparisons", "output_bits", "ticks", "hold_edges", "loads",
                        "resets", "free_ticks", "balance_ticks", "commit_ticks",
                        "excite_ticks", "neutralize_ticks"]
              match = re.fullmatch(prefix + " PASS " +
                  " ".join(k + r"=(\d+)" for k in fields), records[-1])
              require(match is not None, "Malformed phase post-synthesis result")
              metrics = dict(zip(fields, map(int, match.groups())))
              require(all(metrics[k] == v for k, v in dynamics_post_expected.items())
                      and metrics["hold_edges"] >= dynamics_expected["hold_edges"]
                      and metrics["comparisons"] >= 156,
                      "Incomplete phase post-synthesis coverage")
              return records, rtl_metrics, metrics

          def thermal_records(text):
              terminal, metrics = regression_record(text,
                  "FRP_M31_THERMAL_DYNAMICS_TB:", thermal_expected)
              records = [line for line in text.splitlines()
                         if line.startswith("FRP_M31_THERMAL_DYNAMICS_")]
              expected_profiles = [
                  "FRP_M31_THERMAL_DYNAMICS_PROFILE: PASS workload=0 samples=160 "
                  "temperature=0000000a peak=00000f4c",
                  "FRP_M31_THERMAL_DYNAMICS_PROFILE: PASS workload=1 samples=160 "
                  "temperature=0004b190 peak=1066b54c",
              ]
              require(records == expected_profiles + [terminal],
                      "Incomplete, repeated, out-of-order or incorrect thermal results")
              return records, metrics

          def thermal_post_records(text):
              prefix = "FRP_M31_THERMAL_DYNAMICS_POST_SYNTHESIS_TB:"
              records = [line for line in text.splitlines()
                         if line.startswith("FRP_M31_THERMAL_DYNAMICS_")]
              require(len(records) == 4 and records[-1].startswith(prefix),
                      "Incomplete, repeated or out-of-order thermal post-synthesis results")
              _, rtl_metrics = thermal_records("\n".join(records[:-1]))
              fields = ["comparisons", "output_bits", "updates", "hold_edges",
                        "clears", "resets", "boundary_cases"]
              match = re.fullmatch(prefix + " PASS " +
                  " ".join(k + r"=(\d+)" for k in fields), records[-1])
              require(match is not None, "Malformed thermal post-synthesis result")
              metrics = dict(zip(fields, map(int, match.groups())))
              require(all(metrics[k] == v for k, v in thermal_post_expected.items())
                      and metrics["hold_edges"] >= thermal_expected["hold_edges"]
                      and metrics["comparisons"] >= 567,
                      "Incomplete thermal post-synthesis coverage")
              return records, rtl_metrics, metrics

          try:
              require(importlib.metadata.version("yowasp-yosys") == "0.68.0.0.post1208",
                      "Unexpected synthesis package")
              require(importlib.metadata.version("verilator") == "5.48.0",
                      "Unexpected simulation package")
              simulator_root = Path(os.environ["VERILATOR_ROOT"]).resolve()
              require(Path(shutil.which("verilator") or "").resolve() ==
                      simulator_root / "bin" / "verilator",
                      "Simulator path differs from the pinned package")
              simulator_sha = sha((simulator_root / "bin" / "verilator_bin").read_bytes())
              require(simulator_sha ==
                      "7a308fe7b00607f3140fe0599efc107a3f591e631a44a1c3614e00e6c90c0dcc",
                      "Simulator binary differs from the validated Linux x86-64 build")
              report.update(simulation_package="verilator==5.48.0",
                            simulation_binary_sha256=simulator_sha)
              sources = set()

              def visit(name):
                  if name in sources:
                      return
                  path = root / name
                  require(path.is_file() and not path.is_symlink(), "Missing source: " + name)
                  sources.add(name)
                  for inc in re.findall(r'`include\s+"([^"]+)"', path.read_text()):
                      matches = {(directory / inc).resolve()
                                 for directory in [path.parent, *[root / d for d in include_dirs]]
                                 if (directory / inc).is_file()}
                      require(len(matches) == 1, "Missing or ambiguous include: " + inc)
                      resolved = matches.pop()
                      require(resolved.is_relative_to(root), "Include leaves the repository")
                      visit(resolved.relative_to(root).as_posix())

              visit(tb)
              visit(frequency_tb)
              visit(geometry_tb)
              visit(dynamics_tb)
              sources.add("rtl/m31/frp_m31_sin_q30.mem")
              rows, identities = [], {}
              for name in sorted(sources):
                  raw = (root / name).read_bytes()
                  identities[name] = {"bytes": len(raw), "sha256": sha(raw)}
                  rows.append(f"{name}|{len(raw)}|{sha(raw)}")
              digest = sha(("\n".join(rows) + "\n").encode())
              report.update(sources=identities, source_set_sha256=digest,
                            workflow_sha256=sha((root / workflow).read_bytes()))
              require(len(sources) == 30 and digest ==
                      "f43a8d74d8d1489cea29caf05a9cdd289cf15c89d26ac75f332c79af3d0eeba4",
                      "Source set differs from the validated post-synthesis inputs")

              visit(thermal_tb)
              require(sources == set(identities) | {thermal_tb},
                      "Unexpected thermal regression dependencies")
              thermal_raw = (root / thermal_tb).read_bytes()
              require(len(thermal_raw) == 14757 and sha(thermal_raw) ==
                      "cd76bf09bf1ec362faa94f6a5aff6e52c4a51fb17be22eb6f5bd950c1d766467",
                      "Thermal regression differs from the validated testbench")
              identities[thermal_tb] = {
                  "bytes": len(thermal_raw), "sha256": sha(thermal_raw)}
              rows.append(f"{thermal_tb}|{len(thermal_raw)}|{sha(thermal_raw)}")
              visit(thermal_post_tb)
              require(sources == set(identities) | {thermal_post_tb},
                      "Unexpected thermal post-synthesis dependencies")
              thermal_post_raw = (root / thermal_post_tb).read_bytes()
              require(len(thermal_post_raw) == 5858 and sha(thermal_post_raw) ==
                      "2fb91ba029019ecc536f9ef1c5061ffa1eb362fa89367bd2c826c564c18029a4",
                      "Thermal post-synthesis test differs from the validated testbench")
              identities[thermal_post_tb] = {
                  "bytes": len(thermal_post_raw), "sha256": sha(thermal_post_raw)}
              rows.append(f"{thermal_post_tb}|{len(thermal_post_raw)}|{sha(thermal_post_raw)}")
              visit(dynamics_post_tb)
              require(sources == set(identities) | {dynamics_post_tb},
                      "Unexpected phase post-synthesis dependencies")
              dynamics_post_raw = (root / dynamics_post_tb).read_bytes()
              require(len(dynamics_post_raw) == 6778 and sha(dynamics_post_raw) ==
                      "ab43633b76ae500e5e747bb8f7d626bfa523f0e0922d73980a9d7a32c61d1d55",
                      "Phase post-synthesis test differs from the validated testbench")
              identities[dynamics_post_tb] = {
                  "bytes": len(dynamics_post_raw), "sha256": sha(dynamics_post_raw)}
              rows.append(f"{dynamics_post_tb}|{len(dynamics_post_raw)}|{sha(dynamics_post_raw)}")
              visit(frequency_post_tb)
              require(sources == set(identities) | {frequency_post_tb},
                      "Unexpected frequency post-synthesis dependencies")
              frequency_post_raw = (root / frequency_post_tb).read_bytes()
              require(len(frequency_post_raw) == 6928 and sha(frequency_post_raw) ==
                      "782109dd3d081f896b44a764bd5e3173a0499dd96b237a47e6fe469668941486",
                      "Frequency post-synthesis test differs from the validated testbench")
              identities[frequency_post_tb] = {
                  "bytes": len(frequency_post_raw), "sha256": sha(frequency_post_raw)}
