name: 53 - FRP M31 Local Thermal Field Regression
run-name: "53 - FRP Local Thermal Field | 8/16/32 cells @ ${{ github.sha }}"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: frp-53-local-thermal-field-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      LC_ALL: C.UTF-8
      TZ: UTC
      PYTHONHASHSEED: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Prepare evidence and pinned simulator
        run: |
          set -euo pipefail
          export FRP53_EVIDENCE="$RUNNER_TEMP/frp-53-evidence"
          mkdir -p "$FRP53_EVIDENCE"
          printf '%s\n' "FRP53_EVIDENCE=$FRP53_EVIDENCE" >> "$GITHUB_ENV"
          python -m pip install --disable-pip-version-check \
            verilator==5.48.0 systemc==3.0.2.1 click==8.5.0 platformdirs==4.13.0 \
            2>&1 | tee "$FRP53_EVIDENCE/install.log"
          python -m pip freeze > "$FRP53_EVIDENCE/packages.txt"
      - name: Run local thermal field regression and verify results
        run: |
          set -euo pipefail
          cat > "$FRP53_EVIDENCE/verify.py" <<'FRP53_EOF'
          from pathlib import Path
          import hashlib, importlib.metadata, json, os, re, shutil, subprocess
          R=Path.cwd()
          B=Path(os.environ['FRP53_EVIDENCE'])
          def save(name,value):
              (B/name).write_text(json.dumps(value,indent=2)+'\n')
          def run(args,name,timeout=900):
              save(name+'-command.json',args)
              path=B/(name+'.log')
              print('RUN',name,flush=True)
              with path.open('w') as log:
                  try:
                      result=subprocess.run(args,cwd=R,stdout=log,
                          stderr=subprocess.STDOUT,text=True,timeout=timeout)
                  except subprocess.TimeoutExpired:
                      log.write('\nTIMEOUT\n')
                      raise
              text=path.read_text()
              if result.returncode:
                  print(text[-12000:],flush=True)
                  raise RuntimeError((name,result.returncode))
              print(text[-2000:],flush=True)
              return text
          files=[
              'rtl/m31/frp_m31_fixed_point_pkg.sv',
              'rtl/m31/frp_m31_local_thermal_field.sv',
              'rtl/m31/frp_m31_local_thermal_field_tb.sv',
              'frp_prototype_v1_7_0.py',
              '.github/workflows/frp-53-m31-local-thermal-field-regression.yml',
          ]
          hashes={p:hashlib.sha256((R/p).read_bytes()).hexdigest() for p in files}
          save('sources.json',{'commit':os.environ['GITHUB_SHA'],'files':hashes})
          save('versions.json',{p:importlib.metadata.version(p)
              for p in ['verilator','systemc']})
          run(['verilator-cli','--version'],'verilator-version')
          run(['c++','--version'],'compiler-version')
          top='frp_m31_local_thermal_field_tb'
          source=R/'rtl/m31'/f'{top}.sv'
          shutil.copy2(source,B/source.name)
          obj=B/'obj'
          run(['verilator-cli','--binary','--timing','--assert','-Wno-fatal',
               '-j','2','-MAKEFLAGS','VK_PCH_I_FAST=',
               '-MAKEFLAGS','VK_PCH_I_SLOW=','-MAKEFLAGS','OPT_FAST=-O1',
               '--top-module',top,'--Mdir',str(obj),'-Irtl/m31',str(source)],
              'local-thermal-field-build')
          text=run([str(obj/('V'+top))],'local-thermal-field-run',120)
          keys=['cells','steps','checks','commits','holds','resets','diffusion_pairs',
                'lag_cases','random','thresholds','mean_ties','dissipation_ties']
          pattern=r'^PASS LOCAL_THERMAL '+r' '.join(k+r'=(\d+)' for k in keys)+r'$'
          matches=re.findall(pattern,text,re.MULTILINE)
          assert len(matches)==3,('Expected three checker records',text)
          results={}
          expected_checks={8:732829,16:1564885,32:3615301}
          for match in matches:
              v=dict(zip(keys,map(int,match)))
              n=v['cells']
              assert n in (8,16,32) and str(n) not in results,v
              assert v['steps']==4890+62*n and v['checks']==expected_checks[n],v
              assert v['commits']==4303+48*n and v['holds']==587+14*n,v
              assert v['commits']+v['holds']==v['steps'],v
              assert v['resets']==n+33,v
              assert v['diffusion_pairs']==n*(n-1) and v['lag_cases']==14*n,v
              assert v['random']==4096 and v['thresholds']==3,v
              assert v['mean_ties']==3 and v['dissipation_ties']==9,v
              results[str(n)]=v
          assert set(results)=={'8','16','32'}
          marker='PASS LOCAL_THERMAL_ALL cells=8,16,32'
          assert text.splitlines().count(marker)==1,text
          for p,h in hashes.items():
              assert hashlib.sha256((R/p).read_bytes()).hexdigest()==h,p
          totals={k:sum(v[k] for v in results.values()) for k in keys if k!='cells'}
          assert totals['steps']==18142 and totals['checks']==5913015,totals
          assert totals['diffusion_pairs']==1288 and totals['random']==12288,totals
          save('result.json',{'result':'PASS','commit':os.environ['GITHUB_SHA'],
                             'cells':results,'totals':totals})
          lines=['## FRP M31 local thermal field regression: PASS','',
                 'Commit: `'+os.environ['GITHUB_SHA']+'`','',
                 '| Cells | Steps | Comparisons | Commits | Holds | Resets | Diffusion pairs |',
                 '|---|---|---|---|---|---|---|']
          for n in ('8','16','32'):
              v=results[n]
              lines.append(f"| {n} | {v['steps']} | {v['checks']} | {v['commits']} | {v['holds']} | {v['resets']} | {v['diffusion_pairs']} |")
          lines += ['',
              'All directed source/destination diffusion pairs are exercised for each cell count.',
              'Per configuration: 4096 deterministic random samples, three overload thresholds,',
              'three mean-rounding boundaries and nine dissipation-rounding boundaries.',
              'Checks include uniform heating/cooling, isolated hot cells, unsigned lag boundaries,',
              'held inputs, asynchronous reset, local peaks and aggregate heat history.',
              'The reference generates dyadic weights at exponent 1.20 with exact row closure',
              'and rounds each neighbor contribution before accumulation.',
              'RTL simulation; source hashes, commands, tool versions and logs are attached.','']
          summary='\n'.join(lines)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write(summary)
          print(summary)
          FRP53_EOF
          python "$FRP53_EVIDENCE/verify.py" 2>&1 | tee "$FRP53_EVIDENCE/verify.log"
      - name: Upload logs and reproducibility records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frp-53-local-thermal-field-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/frp-53-evidence/*.log
            ${{ runner.temp }}/frp-53-evidence/*.json
            ${{ runner.temp }}/frp-53-evidence/*.txt
            ${{ runner.temp }}/frp-53-evidence/*.py
            ${{ runner.temp }}/frp-53-evidence/*.sv
          if-no-files-found: error
          retention-days: 30
