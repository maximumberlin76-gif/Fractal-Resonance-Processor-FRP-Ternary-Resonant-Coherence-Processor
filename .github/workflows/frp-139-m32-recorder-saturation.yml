name: 139 - FRP M32 Recorder Saturation
run-name: "139 - M32 recorder | up to 64 cells | ${{ github.sha }}"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Record sources and install Yosys
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/commit.txt
          sha256sum formal/m32/frp_m32_recorder_saturation_formal.sv \
            rtl/m32/frp_m32_boundary_recorder.sv > evidence/sources.sha256
          python -m pip install yowasp-yosys==0.68.0.0.post1208 yowasp-runtime==1.96 wasmtime==47.0.1
          yowasp-yosys -V > evidence/tool-version.txt
          python -m pip freeze > evidence/packages.txt

      - name: Prove recorder properties and replay fault controls
        run: |
          cat > evidence/verify.py <<'PY'
          from concurrent.futures import ThreadPoolExecutor
          import json
          from pathlib import Path
          import shutil
          import subprocess

          top = "frp_m32_recorder_saturation_formal"
          rtl = Path("rtl/m32/frp_m32_boundary_recorder.sv")
          bench = Path("formal/m32") / (top + ".sv")
          out = Path("evidence")
          sizes = (8, 9, 16, 32, 64)

          def prepare(folder):
              folder.mkdir(parents=True)
              for src in (bench, rtl):
                  shutil.copy2(src, folder / src.name)

          def run(folder, label, script):
              marker = label + ".ok"
              script += f"; tee -o {marker} log FRP139_COMPLETE"
              with (folder / (label + ".stderr")).open("w") as err:
                  proc = subprocess.run(["yowasp-yosys", "-Q", "-p", script], cwd=folder,
                                        stdout=subprocess.PIPE, stderr=err, timeout=360)
              (folder / (label + ".log")).write_bytes(proc.stdout)
              proc.check_returncode()
              if "FRP139_COMPLETE" not in (folder / marker).read_text():
                  raise RuntimeError(f"{folder}: incomplete {label}")

          def build(n, w):
              return (f"read_slang -j 1 --top {top} -I. -G CELLS={n} -G COUNT_BITS={w} {top}.sv; "
                      f"prep -top {top} -flatten; async2sync; opt -full; chformal -lower; "
                      "check -assert; select -assert-count 9 t:$assert; "
                      "select -assert-count 1 t:$assume; write_rtlil model.il")

          def samples(path, name, depth):
              signals = json.loads(path.read_text())["signal"]
              s = next(x for x in signals if x["name"] == name)
              data = iter(s.get("data", [])[1:])
              values = []
              for ch in s["wave"][1:]:
                  if ch == "=":
                      values.append(int(next(data), 2))
                  elif ch in ("0", "1"):
                      values.append(int(ch))
                  elif ch == "." and values:
                      values.append(values[-1])
                  else:
                      raise ValueError(f"{path}: unexpected {name} encoding {ch}")
              if len(values) != depth:
                  raise ValueError(f"{path}: incomplete {name}")
              return values

          reset = "-set-assumes -set rst_n 1 -set-at 1 rst_n 0"
          show = "-show-inputs -show reach -show count_q -show overflow_q -show valid_q -show pulse_q"

          def qualify(case):
              n, w = case
              folder = out / f"cells-{n}-width-{w}"
              prepare(folder)
              run(folder, "proof", build(n, w) +
                  "; sat -set-assumes -tempinduct -seq 1 -maxsteps 5 -prove-asserts -verify")
              if w == 3:
                  queries = [f"sat -seq 12 {reset} -set-at 12 reach[{b}] 1 {show} "
                             f"-dump_json w{b}.json" for b in range(8)]
                  run(folder, "witness", "read_rtlil model.il; " + "; ".join(queries))
                  for b in range(8):
                      path = folder / f"w{b}.json"
                      if samples(path, "rst_n", 12) != [0] + [1]*11 or not (samples(path, "reach", 12)[-1] & (1 << b)):
                          raise RuntimeError(f"{path}: reset or event mismatch")
              print(f"PASS cells={n} width={w}", flush=True)
              return {"cells": n, "counter_bits": w, "witnesses": 8 if w == 3 else 0}

          cases = [(n, w) for n in sizes for w in (64, 3)]
          with ThreadPoolExecutor(max_workers=2) as pool:
              rows = list(pool.map(qualify, cases))
          if len(rows) != 10 or sum(r["witnesses"] for r in rows) != 40:
              raise RuntimeError("Incomplete recorder matrix")
          (out / "profiles.json").write_text(json.dumps(rows, indent=2))

          # At sample 9 the counter is full. The next edge accepts margin zero.
          last_positive = 1 << 126
          pins = (f"sat -seq 10 {reset} -set clear_epoch 0 -set sample_valid 1 "
                  "-set stability_margin_q16 1 -set-at 9 stability_margin_q16 0 "
                  "-set source_tick 37 -set scheduler_mode 1 -set scheduler_state 2 "
                  "-set coherence_capacity_q16 3 -set pressure_q16 4 -set mean_heat_q16 5 "
                  f"-set switch_load_q16 6 -set retained_state 128'b{last_positive:b} -set pending_route 3")
          reference = out / "cells-64-width-3"
          run(reference, "control", f"read_rtlil model.il; {pins} {show} -show frame_q -dump_json control.json")
          path = reference / "control.json"
          for name, pair in {"count_q": [7,7], "overflow_q": [0,1],
                             "valid_q": [0,1], "pulse_q": [0,1]}.items():
              if samples(path, name, 10)[8:] != pair:
                  raise RuntimeError(f"Control waveform mismatch: {name}")

          expected_frame = 0
          for width, value in [(64,37), (2,1), (3,2), (32,1), (32,0), (32,3),
                               (32,4), (32,5), (32,6), (128,last_positive), (128,3)]:
              expected_frame = (expected_frame << width) | value
          if samples(path, "frame_q", 10)[8:] != [0, expected_frame]:
              raise RuntimeError("Control snapshot payload mismatch")

          faults = [
              ("early-overflow", "if (sample_count_q == COUNT_MAX)",
               "if (sample_count_q == COUNT_MAX - 1'b1)", "overflow_q", 9, 1),
              ("lost-crossing", "if (!boundary_valid_q && previous_margin_q16",
               "if (sample_count_q != COUNT_MAX && !boundary_valid_q && previous_margin_q16",
               "valid_q", 10, 0),
          ]
          for label, old, new, signal, step, value in faults:
              folder = out / label
              prepare(folder)
              src = folder / rtl.name
              body = src.read_text()
              if body.count(old) != 1:
                  raise RuntimeError(f"{label}: mutation anchor changed")
              src.write_text(body.replace(old, new))
              run(folder, "fault", build(64, 3) + f"; {pins} -prove-asserts -falsify "
                  f"{show} -dump_json counterexample.json")
              if samples(folder / "counterexample.json", signal, 10)[step-1] != value:
                  raise RuntimeError(f"{label}: unexpected counterexample")
              print("PASS detected", label, flush=True)
          (out / "mutations.json").write_text(json.dumps([f[0] for f in faults]))
          PY
          python -u evidence/verify.py

      - name: Summarize qualification
        if: always()
        env:
          PRIOR_STATUS: ${{ job.status }}
        run: |
          {
            echo "### M32 boundary recorder"
            echo "Verification status: $PRIOR_STATUS"
            if [[ -f evidence/profiles.json ]]; then
              jq -r '"Induction profiles: \(length), reset witnesses: \(map(.witnesses)|add)"' evidence/profiles.json
            fi
            if [[ -f evidence/mutations.json ]]; then
              jq -r '"Detected mutations: " + join(", ")' evidence/mutations.json
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload combined evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frp-139-recorder-saturation-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30
