name: 67 - FRP M32 Phase Recovery Regression
run-name: "67 - FRP Phase Recovery | 8/16/32 cells and deterministic replay @ ${{ github.sha }}"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frp-67-phase-recovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    name: M32 phase recovery - ${{ matrix.cells }} cells
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        cells: [8, 16, 32]
    defaults:
      run:
        shell: bash
    env:
      CELLS: ${{ matrix.cells }}
      LC_ALL: C.UTF-8
      TZ: UTC
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Initialize evidence directory
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/frp-67-evidence"
          echo "FRP67_EVIDENCE=$RUNNER_TEMP/frp-67-evidence" >> "$GITHUB_ENV"

      - name: Check out dispatched commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify manual execution and qualified sources
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          cat > "$FRP67_EVIDENCE/sources.sha256" <<'SHA'
          765429b33df3f843626bdc411ad8371fd963738a58ab10201abef75dcdafcaf0  rtl/m31/frp_m31_active_neutral.sv
          d0587897f955ce49923aca807b5d3e0c637383c88e5d5e0dfa8405f47917c123  rtl/m31/frp_m31_capacity_guard.sv
          e516a5cd378bd2ddecdadc5abb13ddef26c63fafe5bda65b47a6bd859ca66f92  rtl/m31/frp_m31_execution_core.sv
          6b2afb8d1583c93d95d2386ba25dd1eaef6bb5bd9a4e1c9e9abff1dd004cbf24  rtl/m31/frp_m31_fixed_point_pkg.sv
          d1604e08fa6cf658f25b579fb76202e65fca1481167e6d8d6039a7034e354832  rtl/m31/frp_m31_global_stability.sv
          cbb5a531283164d1d54d59ec748b97bf84e172704854bf5eb7c6bda2c502f7c7  rtl/m31/frp_m31_isqrt_u64.sv
          478882d4f6a2986f5079c88b444c7b007d68145d61e5150209cb0637f35b2ec0  rtl/m31/frp_m31_local_gamma_drift.sv
          6e10f738f94c43ac9748ec7a033adde16243beea59e2f7f2973a3ab51c2e5e04  rtl/m31/frp_m31_local_thermal_attenuation.sv
          2973c4ce73c014cd2692e2fa34cbf1ef6daa88d8e4115a545d6e776acb75cff6  rtl/m31/frp_m31_local_thermal_field.sv
          18889d85e78b23b844f1db4c46a35a6b7d01e609e3f1f0e6263a39a6c5729411  rtl/m31/frp_m31_pending_routes.sv
          81cd497e3f3e04abc93a2052c23deb189b2c200b11cc249ec51dbd40588e9523  rtl/m31/frp_m31_phase_interference.sv
          fa78bcfe965270cc74855908aa392989d857575a2097a126539aabb1aab8990d  rtl/m31/frp_m31_phase_request_adapter.sv
          762302f1c7a7f7f40cb029f5ada6a111fc8c3e3f6be9920e9b2401b95e179c94  rtl/m31/frp_m31_pkg.sv
          32f75cc70df5dba3f4fbb511397be9a5921236c2afd16cfeb1350eca3f6e8109  rtl/m31/frp_m31_request_lanes.sv
          fc9de24b41736e5c5a9f9e464318c80adbfda9dc8cc4362c0c55bfed403bf97f  rtl/m31/frp_m31_scheduler.sv
          adbb4b94fcf8fa0bfc981d654679fd7518a5c4c9c97b611a35cd8accaf28233d  rtl/m31/frp_m31_sin_q30.mem
          69c06833e6dfbb28e25b74a5787dcd03756dddf0f66726de3ea47c1ad2931931  rtl/m31/frp_m31_stability.sv
          ebad1f7ee952a577239445d33d99cae799afaaff5c181c7162514bbcea6eab90  rtl/m31/frp_m31_state_update.sv
          34df4ebfc5dfad8e3e5e454e560404585de5c881e6f75abaae367d3bd9fb11bd  rtl/m31/frp_m31_thermal_proxy.sv
          df35b73ccb01f06908385656332942858a5f056e7b92556cc16658beb5732b98  rtl/m32/frp_m32_core.sv
          df95c6fa411e7877074c002a03b3f56797fdde8e2702b36306fe903539db39f3  rtl/m32/frp_m32_recovery_tb.sv
          9626474b49d32b411e107d7ccc8ee5aa7f42728e9a6f70d634d16d3f2a414c5e  rtl/m32/frp_m32_registered_target_boundary.sv
          02250069a68737f055a419cd67bf2d439b3f63b3f6a7a245f40e9bf29d1958eb  rtl/m32/frp_m32_registered_target_request_path.sv
          SHA
          sha256sum .github/workflows/frp-67-m32-phase-recovery-regression.yml \
            >> "$FRP67_EVIDENCE/sources.sha256"
          sha256sum --check "$FRP67_EVIDENCE/sources.sha256" \
            | tee "$FRP67_EVIDENCE/source-check.log"
          printf '%s\n' "$GITHUB_SHA" > "$FRP67_EVIDENCE/commit.txt"

      - name: Install and record toolchain
        run: |
          set -euo pipefail
          {
            python -m pip install --disable-pip-version-check \
              verilator==5.48.0 systemc==3.0.2.1
            python -m pip check
            verilator-cli --version
            g++ --version
            make --version
          } 2>&1 | tee "$FRP67_EVIDENCE/toolchain.log"
          python -m pip freeze > "$FRP67_EVIDENCE/packages.txt"

      - name: Build and qualify two deterministic recovery replays
        run: |
          set -euo pipefail
          python - <<'PYTHON'
          import hashlib
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          n = int(os.environ['CELLS'])
          golden = {
              8: '671f260c68998da542e7b2b878f2aac0a87f9b57364442b3cd90e15e29fc6e4b',
              16: '85e896b30680629836ad868dcbb354ce83c54f15ad8fb7b5edd2d0b948a82e34',
              32: 'e8fd2b4b72683cd76d2cf8490a65d059c82d0b5c5a69996b5f97d22eb4a1c15a',
          }
          if n not in golden:
              raise SystemExit('Unsupported cell count')
          evidence = Path(os.environ['FRP67_EVIDENCE']).resolve()
          build = Path(os.environ['RUNNER_TEMP']) / f'frp-67-build-{n}'
          top = 'frp_m32_recovery_tb'
          commands = []

          def run(command, logfile, seconds):
              commands.append(command)
              (evidence / 'commands.json').write_text(json.dumps(commands, indent=2) + '\n')
              print('Running:', command, flush=True)
              path = evidence / logfile
              try:
                  with path.open('w') as stream:
                      result = subprocess.run(
                          command, stdout=stream, stderr=subprocess.STDOUT,
                          timeout=seconds, check=False,
                      )
              except subprocess.TimeoutExpired:
                  print(path.read_text(errors='replace')[-16000:])
                  raise SystemExit(f'{logfile}: timeout after {seconds} seconds')
              if result.returncode:
                  print(path.read_text(errors='replace')[-16000:])
                  raise SystemExit(f'{logfile}: exit {result.returncode}')

          run([
              'verilator-cli', '--binary', '--output-groups', '0',
              '--timing', '--assert', '-Wno-fatal', '-j', '1',
              '-CFLAGS', '-std=c++20',
              '-MAKEFLAGS', 'OPT_FAST=-O0',
              '-MAKEFLAGS', 'VK_PCH_I_FAST=',
              '-MAKEFLAGS', 'VK_PCH_I_SLOW=',
              '--top-module', top, f'-GCELLS={n}', '--Mdir', str(build),
              '-Irtl/m31', '-Irtl/m32', f'rtl/m32/{top}.sv',
          ], 'compile.log', 1200)
          compile_log = (evidence / 'compile.log').read_text(errors='replace')
          if re.search(r'%Warning-(PINMISSING|IMPLICIT|MULTIDRIVEN)\b', compile_log):
              raise SystemExit('Unexpected port, implicit signal or multiple driver')
          executable = build / f'V{top}'
          (evidence / 'executable.sha256').write_text(
              f'{hashlib.sha256(executable.read_bytes()).hexdigest()}  V{top}\n'
          )

          def fields(line, prefix):
              result = {}
              for token in line[len(prefix):].split():
                  key, separator, value = token.partition('=')
                  if not separator or not re.fullmatch(r'[A-Za-z_][A-Za-z_0-9]*', key) or key in result:
                      raise SystemExit(f'Malformed or duplicate field: {token}')
                  if key == 'signature':
                      if not re.fullmatch(r'[0-9a-f]{16}', value):
                          raise SystemExit('Invalid signature')
                      result[key] = value
                  else:
                      if not re.fullmatch(r'-?[0-9]+', value):
                          raise SystemExit(f'Invalid integer: {token}')
                      result[key] = int(value)
              return result

          def collect(path):
              lines = path.read_text().splitlines()
              selected = [line for line in lines if line.startswith(('RECOVERY ', 'PASS RECOVERY '))]
              cases = [fields(line, 'RECOVERY ') for line in selected if line.startswith('RECOVERY ')]
              passes = [fields(line, 'PASS RECOVERY ') for line in selected if line.startswith('PASS RECOVERY ')]
              if len(cases) != 12 or len(passes) != 1:
                  raise SystemExit(f'{path.name}: expected twelve cases and one PASS record')
              expected_cases = {(mode, profile) for mode in range(3) for profile in range(4)}
              observed_cases = {(row['mode'], row['profile']) for row in cases}
              if observed_cases != expected_cases:
                  raise SystemExit('Missing or duplicated recovery profile')
              for row in cases:
                  if (row['cells'] != n or not 0 <= row['shock_R'] < 1073741824 // 4
                          or row['late_R'] < 1073741824 * 15 // 16
                          or row['late_R'] < row['shock_R'] + 1073741824 // 16
                          or row['min_margin'] <= 0
                          or row['routes'] <= 0 or row['completions'] <= 0):
                      raise SystemExit(f'Recovery acceptance failed: {row}')
              total = passes[0]
              if total['cells'] != n or total['cases'] != 12 or total['cycles'] != 17604:
                  raise SystemExit('Incomplete recovery run')
              for key in ('checks', 'routes', 'completions', 'zero_memory', 'hot',
                          'gamma', 'attenuation', 'cooling', 'holds', 'delayed'):
                  if total[key] <= 0:
                      raise SystemExit(f'Missing coverage: {key}')
              semantic = '\n'.join(selected) + '\n'
              digest = hashlib.sha256(semantic.encode()).hexdigest()
              if digest != golden[n]:
                  raise SystemExit(f'Qualified result mismatch: expected {golden[n]}, observed {digest}')
              return cases, total, semantic

          results = []
          for replay in (1, 2):
              logfile = f'run-{replay}.log'
              run([str(executable)], logfile, 300)
              records = collect(evidence / logfile)
              (evidence / f'replay-{replay}.txt').write_text(records[2])
              results.append(records)
          if results[0][2] != results[1][2]:
              raise SystemExit('Deterministic replay mismatch')
          cases, total, semantic = results[0]
          report = {
              'commit': os.environ['GITHUB_SHA'], 'cells': n,
              'replays': 2, 'replay_equal': True,
              'semantic_sha256': golden[n], 'cases': cases, 'total': total,
              'contract': {
                  'core': 'Full M32 with local thermal and gamma feedback enabled',
                  'modes': ['FREE', '7/1', '1/7'],
                  'profiles': 'Two spatial phase patterns crossed with two gamma targets',
                  'disturbance': 'Sixteen relative impulses and one defined phase split',
                  'retention': 'Every phase impulse preserves retained frequency',
                  'recovery': '1024 enabled ticks and exactly 1024 completed stability snapshots',
                  'controls': 'Counter clears and disabled-clock holds during recovery',
                  'acceptance': 'Positive C-P at every recovery snapshot; final mean R >= 15/16',
                  'active_zero': 'Route entry, retained destination, completion and frequency memory',
                  'replay': 'All twelve case records and the complete PASS record match',
                  'units': {'coherence': 'Q30', 'margin_and_heat': 'Q16'},
              },
          }
          (evidence / 'qualification.json').write_text(json.dumps(report, indent=2) + '\n')
          summary = (
              f'### FRP 67: {n} cells — PASS\n\n'
              f'12 profiles; {total["checks"]:,} checks per replay; two identical replays.\n\n'
              'Each profile: 1024 completed recovery snapshots with positive C-P.\n\n'
              'Final 64-snapshot mean R >= 15/16; active-zero routes and memory checked.\n\n'
              '```text\n' + semantic + '```\n'
          )
          (evidence / 'summary.md').write_text(summary)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write(summary)
          print(semantic, end='')
          print('PASS: M32 phase recovery, thermal feedback, active zero and deterministic replay')
          PYTHON
          sha256sum --check "$FRP67_EVIDENCE/sources.sha256" \
            > "$FRP67_EVIDENCE/source-recheck.log"

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: frp-67-phase-recovery-${{ matrix.cells }}-${{ github.sha }}
          path: ${{ runner.temp }}/frp-67-evidence/
          if-no-files-found: error
          retention-days: 30
