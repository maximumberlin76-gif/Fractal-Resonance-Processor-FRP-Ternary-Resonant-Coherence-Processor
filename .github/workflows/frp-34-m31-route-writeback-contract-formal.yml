name: 34 - FRP M31 Route Writeback Contract RTL + Netlist Formal

run-name: "34 - FRP M31 Route Writeback Contract | 12 proofs @ ${{ github.sha }}"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frp-34-m31-route-writeback-contract-formal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify-route-writeback-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      LC_ALL: C.UTF-8
      TZ: UTC
      PYTHONHASHSEED: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Initialize evidence paths
        run: |
          set -euo pipefail
          printf '%s\n' "M31_ROUTE_WRITEBACK_EVIDENCE=$RUNNER_TEMP/frp-m31-route-writeback-contract-evidence" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/frp-m31-route-writeback-contract-evidence"

      - name: Check out the dispatched commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install the pinned formal tool
        timeout-minutes: 10
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          {
            python --version
            python -m pip install --disable-pip-version-check --only-binary=:all: \
              --timeout 30 --retries 3 yowasp-yosys==0.68.0.0.post1208
            python -m pip freeze
          } 2>&1 | tee "$M31_ROUTE_WRITEBACK_EVIDENCE/toolchain.log"

      - name: Prove three contracts and check witnesses and negative controls
