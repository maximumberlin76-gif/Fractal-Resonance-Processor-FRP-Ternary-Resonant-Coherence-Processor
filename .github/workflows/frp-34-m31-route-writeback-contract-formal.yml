                  name = s['name']
                  if name not in widths:
                      require(seq and (name in ('history_valid', 'reference_q') or re.fullmatch('\\$auto\\$async2sync.cc:[0-9]+:execute\\$[0-9]+', name)) and (s['wave'][1:] == '444444'), 'Unexpected auxiliary ' + name)
