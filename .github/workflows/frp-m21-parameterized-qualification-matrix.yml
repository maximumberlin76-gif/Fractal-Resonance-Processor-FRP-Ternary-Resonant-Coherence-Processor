name: FRP M21 Parameterized Qualification Matrix

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frp-m21-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify-m21:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONHASHSEED: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
      LC_ALL: C.UTF-8
      TZ: UTC

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install exact Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Verify current M21 code and published artifacts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          import unittest
          from pathlib import Path

          root = Path.cwd()
          output = root / "m21-qualification-evidence"
          output.mkdir(exist_ok=True)
          sha = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip()
          if sha != os.environ["GITHUB_SHA"]:
              raise SystemExit("Checkout SHA does not match the requested candidate")
          loader = unittest.TestLoader()
          suite = loader.discover(
              "tests", pattern="test_frp_m21_parameterized_qualification_matrix.py"
          )
          discovered = suite.countTestCases()
          with (output / "unittest.log").open("w", encoding="utf-8") as log:
              result = unittest.TextTestRunner(stream=log, verbosity=2).run(suite)
          print((output / "unittest.log").read_text(encoding="utf-8"))
          import test_frp_m21_parameterized_qualification_matrix as tests
          import frp_m21_parameterized_qualification_matrix as producer

          archive_inputs = []
          for path in tests.PUBLISHED_INPUT_PATHS:
              raw = subprocess.check_output([
                  "git", "show", f"{tests.PUBLISHED_M21_COMMIT}:{path}"
              ])
              archive_inputs.append({
                  "path": path,
                  "sha256": hashlib.sha256(raw).hexdigest(),
              })
          current_paths = sorted(set(producer.TECHNICAL_SOURCE_PATHS)
                                 | set(producer.UPSTREAM_SOURCE_PATHS))
          passed = (
              not loader.errors
              and discovered == 31
              and result.testsRun == discovered
              and result.wasSuccessful()
              and not result.skipped
              and not result.expectedFailures
              and not result.unexpectedSuccesses
          )
          report = {
              "status": "PASS" if passed else "FAIL",
              "candidate_commit": sha,
              "discovered": discovered,
              "executed": result.testsRun,
              "failure_count": len(result.failures),
              "error_count": len(result.errors),
              "skipped_count": len(result.skipped),
              "expected_failure_count": len(result.expectedFailures),
              "unexpected_success_count": len(result.unexpectedSuccesses),
              "loader_errors": loader.errors,
              "publication_commit": tests.PUBLISHED_M21_COMMIT,
              "publication_inputs": archive_inputs,
              "current_inputs": [
                  {"path": path, "sha256": hashlib.sha256(
                      producer.read_bytes(root, path)
                  ).hexdigest()}
                  for path in current_paths
              ],
          }
          (output / "qualification.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          raise SystemExit(0 if passed else 1)
          PY

      - name: Run current M21 self-test
        shell: bash
        run: |
          set -euo pipefail
          python frp_m21_parameterized_qualification_matrix.py \
            --self-test \
            --repository-root . \
            --source-commit be91e69d5d2e51a2bbc9a3ffb8f6d60c88d8bef4 \
            --output m21-qualification-evidence/self-test.json

      - name: Confirm tracked source integrity
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code HEAD -- .

      - name: Upload M21 qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frp-m21-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: m21-qualification-evidence/
          if-no-files-found: error
          retention-days: 30
