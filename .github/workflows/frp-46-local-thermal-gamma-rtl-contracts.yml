name: 46 - FRP Local Thermal Gamma RTL Contracts
run-name: "46 - FRP Thermal Gamma | RTL and 226 obligations @ ${{ github.sha }}"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: frp-46-local-thermal-gamma-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      LC_ALL: C.UTF-8
      TZ: UTC
      PYTHONHASHSEED: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Prepare evidence and pinned tools
        run: |
          set -euo pipefail
          export FRP46_EVIDENCE="$RUNNER_TEMP/frp-46-evidence"
          mkdir -p "$FRP46_EVIDENCE"
          printf '%s\n' "FRP46_EVIDENCE=$FRP46_EVIDENCE" >> "$GITHUB_ENV"
          python -m pip install --disable-pip-version-check \
            verilator==5.48.0 yowasp-yosys==0.68.0.0.post1208 \
            yowasp-runtime==1.96 wasmtime==47.0.1 z3-solver==4.15.4.0 \
            2>&1 | tee "$FRP46_EVIDENCE/install.log"
          python -m pip freeze > "$FRP46_EVIDENCE/packages.txt"
      - name: Record checked sources
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os,hashlib,json,subprocess
          R=Path.cwd();E=Path(os.environ['FRP46_EVIDENCE'])
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          ref=R/'frp_prototype_v1_7_0.py'
          assert sha(ref)=='9de085915aa0fb8a73705c0927cc875b106480ef8a75a76f599be04440c0f099','Reference source changed'
          files=[ref]+sorted((R/'rtl/m31').glob('*.sv'))+sorted((R/'rtl/m32').glob('*.sv'))
          files += [R/'artifacts/m18/m15_vectors/frp_m15_trig_lut_q30.vec']
          manifest={'commit':os.environ.get('GITHUB_SHA','local'),'files':{str(p.relative_to(R)):sha(p) for p in files}}
          (E/'sources.json').write_text(json.dumps(manifest,indent=2))
          for tool in ['verilator-cli','yowasp-yosys']:
           p=subprocess.run([tool,'--version'],capture_output=True,text=True,check=True)
           (E/(tool+'-version.txt')).write_text(p.stdout+p.stderr)
          PY
      - name: Replay M32 thermal gamma and phase updates
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          import subprocess,json,importlib.util,copy,hashlib
          E=Path(os.environ['FRP46_EVIDENCE'])/'core';E.mkdir(parents=True,exist_ok=True);R=Path.cwd()
          pre=['phase_word_q','frequency_current_q16','phase_load','frequency_load_q16','gamma_targets_q16','gamma_effective_word','thermal_node_factor_q30','local_frequency_lag_q16','local_next_overload_q16','local_next_gamma_effective_word','phase_gamma_effective_word','coupling_field_q16']
          thermal=['local_heat_q16','local_heat_peak_q16','local_generated_power_q16','local_thermal_dissipation_q16','local_thermal_diffusion_q16','local_thermal_overload_q16'];gamma=['local_gamma_noise_target_q16','local_gamma_noise_state_q16','local_gamma_drift_word','local_gamma_effective_word'];post=['frequency_current_q16','phase_word_q']+thermal+gamma
          cpp='''#include "Vfrp_m32_core.h"
          #include "verilated.h"
          #include <fstream>
          #include <cstdint>
          int main(int argc,char**argv){
           Verilated::commandArgs(argc,argv);Vfrp_m32_core d;std::ofstream out(argv[1]);
           uint32_t rng=50;auto rnd=[&](){rng^=rng<<13;rng^=rng>>17;rng^=rng<<5;return rng;};
           d.clk=0;d.rst_n=1;d.eval();
           for(unsigned c=0;c<12000;c++){
            d.clk=0;d.rst_n=!(c==0||c==4001||c==8103||c==9999);
            d.tick_enable=(c%13<10);d.phase_load_valid=(c%37==0||c<8);
            d.clear_counters=(c%71==0);d.scheduler_mode=(c/1000)%3;
            d.auto_target_enable=(c/500)%2;d.external_request_valid=rnd()&3;
            d.external_request_cell_index=rnd()&63;d.external_request_target=rnd()&15;
            d.external_target_bank=rnd()&65535;d.local_gamma_enable=((c/200)%3!=0);
            d.gamma_update_valid=(c<6000)?(c%8==0):(rnd()&1);
            for(int i=0;i<8;i++){
             d.phase_load[i]=rnd();d.frequency_load_q16[i]=rnd();
             if(c<8)d.frequency_load_q16[i]=(c&1)?0x80000000u:0x7fffffffu;
             d.gamma_targets_q16[i]=(c<6000)?uint32_t(int(rnd()%131073)-65536):rnd();
             d.gamma_effective_word[i]=rnd();d.thermal_node_factor_q30[i]=(c%3)?1073741824u:(rnd()&0x3fffffffu);
            }
            d.eval();out<<std::hex<<c<<" "<<unsigned(d.rst_n)<<" "<<unsigned(d.tick_enable)<<" "<<unsigned(d.phase_load_valid)<<" "<<unsigned(d.clear_counters)<<" "<<unsigned(d.scheduler_mode)<<" "<<unsigned(d.scheduler_state_q)<<" "<<d.state_out<<" "<<unsigned(d.accepted_change_mask)<<" "<<unsigned(d.local_gamma_enable)<<" "<<unsigned(d.gamma_update_valid);
          '''
          for f in pre:cpp+=f'  for(int i=0;i<8;i++)out<<" "<<d.{f}[i];\n'
          cpp+='d.clk=1;d.eval();\n'
          for f in post:cpp+=f'  for(int i=0;i<8;i++)out<<" "<<d.{f}[i];\n'
          cpp+=''' out<<" "<<d.local_mean_heat_q16<<" "<<d.local_mean_heat_peak_q16<<" "<<d.local_maximum_heat_peak_q16<<"\\n";
           }
          }
          ''';(E/'sim.cpp').write_text(cpp)
          args=['verilator-cli','--cc','--exe','--build','-Wno-fatal','-j','2','-MAKEFLAGS','VK_PCH_I_FAST=','-MAKEFLAGS','VK_PCH_I_SLOW=','--top-module','frp_m32_core','--Mdir',str(E/'obj'),'-Irtl/m31','-Irtl/m32','rtl/m32/frp_m32_core.sv',str(E/'sim.cpp')]
          p=subprocess.run(args,cwd=R,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=1200);(E/'build.log').write_text(p.stdout);assert p.returncode==0,p.stdout[-4000:];print('build complete',flush=True)
          p=subprocess.run([str(E/'obj/Vfrp_m32_core'),str(E/'trace.txt')],cwd=R,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=90);(E/'run.log').write_text(p.stdout);assert p.returncode==0,p.stdout
          spec=importlib.util.spec_from_file_location('frp',R/'frp_prototype_v1_7_0.py');ref=importlib.util.module_from_spec(spec);spec.loader.exec_module(ref)
          p=ref.QuantizedReferenceShadowProcessor(cells=8);tn=[n.removeprefix('local_') if n!='local_heat_peak_q16' else n for n in thermal];gn=[n.removeprefix('local_') for n in gamma];names=tn+gn;peak=3277;checks=0;cov=dict(resets=0,holds=0,local_ticks=0,external_ticks=0,mode_changes=0,target_updates=0,overload=0,gamma_changed=0,phase_effect=0,loads_with_tick=0)
          s32=lambda x:(x&0xffffffff) if (x&0xffffffff)<0x80000000 else (x&0xffffffff)-0x100000000
          mask=lambda x:x&0xffffffff
          weights={1:516461574,2:158959695,3:59840215};previous_mode=0

          def check(label,actual,expected):
           global checks
           expected=[mask(x) for x in expected]
           assert actual==expected,(c,label,[(i,x,y) for i,(x,y) in enumerate(zip(actual,expected)) if x!=y]);checks+=len(expected)
          def coupling(phases,gammas,factors):
           result=[]
           for i in range(8):
            total=0
            for j in range(8):
             if i==j:continue
             pair=ref.mul_q30(factors[i],factors[j]);weighted=ref.mul_q30(weights[(i^j).bit_length()],pair)
             total+=ref.mul_q30(weighted,ref.sin_phase_q30(phases[j]-phases[i]-gammas[i]))
            result.append(ref.mul_q16(18350,ref.q30_to_q16(ref.sat_s32(total))))
           return result
          rows=(E/'trace.txt').read_text().splitlines();assert len(rows)==12000
          for line in rows:
           a=[int(x,16) for x in line.split()];c,rst,tick,load,clear,mode,sched,state,sw,local,valid=a[:11];pos=11;before={};after={}
           for n in pre:before[n]=a[pos:pos+8];pos+=8
           for n in post:after[n]=a[pos:pos+8];pos+=8
           actual_aggregate=a[pos:];assert len(actual_aggregate)==3
           if not rst:
            for n in names:setattr(p,n,[3277 if n in tn[:2] else 644245094 if n=='gamma_effective_word' else 0]*8)
            peak=3277;cov['resets']+=1
           p.states=[-1 if ((state>>(2*i))&3)==3 else 1 if ((state>>(2*i))&3)==1 else 0 for i in range(8)];p.cell_switch_activity=[(sw>>i)&1 for i in range(8)];p.frequency_current_q16=list(map(s32,before['frequency_current_q16']));p.update_delay_dynamics();selected=list(map(s32,before['frequency_load_q16'])) if load else p.frequency_current_q16
           p.frequency_lag_q16=[abs(t-f) for t,f in zip(p.frequency_target_q16,selected)];check('lag',before['local_frequency_lag_q16'],p.frequency_lag_q16)
           nxt=copy.copy(p)
           for n in names:setattr(nxt,n,getattr(p,n).copy())
           nxt.update_local_thermal_field();nxt.update_local_gamma_drift(valid,list(map(s32,before['gamma_targets_q16'])))
           check('next overload',before['local_next_overload_q16'],nxt.thermal_overload_q16);check('next gamma',before['local_next_gamma_effective_word'],nxt.gamma_effective_word)
           chosen=nxt.gamma_effective_word if local else list(map(s32,before['gamma_effective_word']));check('gamma selection',before['phase_gamma_effective_word'],chosen)
           phases=before['phase_word_q'];factors=list(map(s32,before['thermal_node_factor_q30']));field=coupling(phases,chosen,factors);check('coupling',before['coupling_field_q16'],field)
           push={0:197,1:197,2:655,3:393,4:197}.get(sched,197)
           computed=[mask(phases[i]+ref.round_shift_away_from_zero(s32(ref.mul_q16(3932,p.frequency_current_q16[i])+push+field[i])*ref.PHASE_PER_RAD_Q16,32)) for i in range(8)]
           expected_freq=[65536]*8 if not rst else selected if (load or tick) else list(map(s32,before['frequency_current_q16']))
           expected_phase=[i*0x20000000 for i in range(8)] if not rst else before['phase_load'] if load else computed if tick else phases
           check('frequency commit',after['frequency_current_q16'],expected_freq);check('phase commit',after['phase_word_q'],expected_phase)
           if rst and tick:
            p=nxt;peak=max(peak,ref.round_div_away_from_zero(sum(p.heat_q16),8));cov['local_ticks' if local else 'external_ticks']+=1;cov['target_updates']+=valid
           elif rst:cov['holds']+=1
           for port,n in zip(thermal+gamma,names):check(port,after[port],getattr(p,n))
           check('aggregates',actual_aggregate,[ref.round_div_away_from_zero(sum(p.heat_q16),8),peak,max(p.local_heat_peak_q16)])
           cov['mode_changes']+=local!=previous_mode;previous_mode=local;cov['overload']+=sum(x>0 for x in p.thermal_overload_q16);cov['gamma_changed']+=sum(x!=644245094 for x in nxt.gamma_effective_word);cov['loads_with_tick']+=bool(rst and load and tick)
           if local and rst and tick and not load:
            other_field=coupling(phases,list(map(s32,before['gamma_effective_word'])),factors);cov['phase_effect']+=sum(x!=y for x,y in zip(field,other_field))
          assert all(cov[n]>0 for n in cov),cov
          print('PASS',checks,cov,flush=True);(E/'validation.json').write_text(json.dumps({'cycles':12000,'checks':checks,'coverage':cov,'core_sha256':hashlib.sha256((R/'rtl/m32/frp_m32_core.sv').read_bytes()).hexdigest()},indent=2))
          assert checks==1668000
          PY
      - name: Replay attenuation including every ROM address
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          import importlib.util,random,subprocess,json,hashlib
          E=Path(os.environ['FRP46_EVIDENCE'])/'attenuation';E.mkdir(parents=True,exist_ok=True);R=Path.cwd();T='frp_m31_local_thermal_attenuation'
          spec=importlib.util.spec_from_file_location('ref',R/'frp_prototype_v1_7_0.py');ref=importlib.util.module_from_spec(spec);spec.loader.exec_module(ref)
          p=ref.QuantizedReferenceShadowProcessor(cells=8);assert p.thermal_coupling_gain_q16==163840
          rng=random.Random(51);q=[1<<30]*8;seen=set();cov={'resets':0,'holds':0,'negative':0,'saturation':0};cycles=64430
          with (E/'vectors.txt').open('w') as f:
           for c in range(cycles):
            if c<52430:xs=list(range(c*8,c*8+8))
            else:xs=[rng.randrange(-2147483648,2147483648) for _ in range(8)]
            if c==52430:xs=[-2147483648,-1,0,1,419429,419430,419431,2147483647]
            reset=c in (0,52431,59999);tick=(c%13<10);p.thermal_overload_q16=xs;p.update_thermal_node_factors();nxt=p.thermal_node_factor_q30.copy()
            for x in xs:
             arg=ref.mul_q16(81920,x);clipped=max(0,min(524288,arg));seen.add(ref.round_div_away_from_zero(clipped*4095,524288));cov['negative']+=arg<0;cov['saturation']+=arg>524288
            if reset:q=[1<<30]*8;cov['resets']+=1
            elif tick:q=nxt.copy()
            else:cov['holds']+=1
            f.write(' '.join(f'{x&0xffffffff:x}' for x in [not reset,tick]+xs+q+nxt)+'\n')
          assert len(seen)==4096
          cpp='''#include "Vfrp_m31_local_thermal_attenuation.h"
          #include "verilated.h"
          #include <fstream>
          #include <iostream>
          #include <cstdint>
          int main(int argc,char**argv){
           Verilated::commandArgs(argc,argv);Vfrp_m31_local_thermal_attenuation d;
           std::ifstream f(argv[1]);uint32_t rst,tick,x;unsigned cycles=0,checks=0;
           d.clk=0;d.rst_n=1;d.eval();
           while(f>>std::hex>>rst>>tick){
            d.clk=0;d.rst_n=rst;d.tick_enable=tick;
            for(int i=0;i<8;i++){if(!(f>>std::hex>>x))return 3;d.thermal_overload_q16[i]=x;}
            d.eval();d.clk=1;d.eval();
          '''
          for port in ['thermal_node_factor_q30','next_thermal_node_factor_q30']:
           cpp+=f'  for(int i=0;i<8;i++){{if(!(f>>std::hex>>x))return 3;if(d.{port}[i]!=x){{std::cerr<<"FAIL cycle="<<cycles<<" {port}["<<i<<"] actual="<<std::hex<<d.{port}[i]<<" expected="<<x<<"\\n";return 1;}}checks++;}}\n'
          cpp+=''' cycles++;
           }
           if(!f.eof()||cycles!=64430)return 4;
           std::cout<<"PASS cycles="<<cycles<<" checks="<<checks<<"\\n";
          }
          ''';(E/'sim.cpp').write_text(cpp)
          args=['verilator-cli','--cc','--exe','--build','-j','2','-MAKEFLAGS','VK_PCH_I_FAST=','-MAKEFLAGS','VK_PCH_I_SLOW=','--top-module',T,'--Mdir',str(E/'obj'),'-Irtl/m31',f'rtl/m31/{T}.sv',str(E/'sim.cpp')]
          for label,cmd in [('compile',args),('simulation',[str(E/'obj'/('V'+T)),str(E/'vectors.txt')])]:
           r=subprocess.run(cmd,cwd=R,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=600);(E/(label+'.log')).write_text(r.stdout);assert r.returncode==0,r.stdout[-4000:];print(label,r.stdout[-500:],flush=True)
          (E/'validation.json').write_text(json.dumps({'cycles':cycles,'checks':cycles*16,'rom_addresses':len(seen),'coverage':cov,'source_sha256':hashlib.sha256((R/f'rtl/m31/{T}.sv').read_bytes()).hexdigest(),'reference_sha256':hashlib.sha256((R/'frp_prototype_v1_7_0.py').read_bytes()).hexdigest()},indent=2));print(cov,flush=True)
          PY
      - name: Regress active zero and all scheduler profiles
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          import subprocess,re,json
          E=Path(os.environ['FRP46_EVIDENCE'])/'regression';E.mkdir(parents=True,exist_ok=True);R=Path.cwd();top='frp_m32_closed_loop_tb'
          a=['verilator-cli','--binary','--timing','--assert','-Wno-fatal','-j','2','-MAKEFLAGS','VK_PCH_I_FAST=','-MAKEFLAGS','VK_PCH_I_SLOW=','--top-module',top,'--Mdir',str(E/'regression'),'-Irtl/m31','-Irtl/m32','rtl/m32/'+top+'.sv']
          p=subprocess.run(a,cwd=R,capture_output=True,text=True,timeout=1200);(E/'regression-build.log').write_text(p.stdout+p.stderr);assert p.returncode==0,p.stderr[-2000:]
          p=subprocess.run([str(E/'regression'/('V'+top))],cwd=R,capture_output=True,text=True,timeout=120);(E/'regression-run.log').write_text(p.stdout+p.stderr);assert p.returncode==0,p.stdout+p.stderr;print(p.stdout,flush=True)
          profiles=set(re.findall(r'PROFILE: PASS workload=(\d) mode=(free|7/1|1/7)',p.stdout))
          assert profiles=={(str(w),m) for w in range(2) for m in ['free','7/1','1/7']}
          assert 'FRP_M32_CLOSED_LOOP_TB: PASS profiles=6 steps=3262 checks=10030' in p.stdout
          (E/'validation.json').write_text(json.dumps({'profiles':6,'steps':3262,'checks':10030},indent=2))
          PY
      - name: Prove thermal bounds reset hold and commit
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          import subprocess,json,collections
          E=Path(os.environ['FRP46_EVIDENCE'])/'thermal';E.mkdir(parents=True,exist_ok=True);R=Path.cwd()
          s=f'read_slang -j 1 --std 1800-2017 --top frp_m31_local_thermal_field -Irtl/m31 rtl/m31/frp_m31_local_thermal_field.sv; proc; flatten; opt -full; wreduce; opt_clean; async2sync; dffunmap; check -assert; write_json {E}/rtl.json; write_smt2 -wires {E}/rtl.smt2;'
          (E/'rtl.ys').write_text(s);p=subprocess.run(['yowasp-yosys','-Q','-T','-s',str(E/'rtl.ys')],cwd=R,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=120);(E/'rtl.log').write_text(p.stdout);assert p.returncode==0,p.stdout[-2000:]
          m=json.loads((E/'rtl.json').read_text())['modules']['frp_m31_local_thermal_field'];print(dict(collections.Counter(c['type'] for c in m['cells'].values())))
          import z3,time
          T='frp_m31_local_thermal_field'
          variables={};bindings=[]
          def sig(name,width,state=0,bool_=False):
           key=f'v{state}_{name}';v=z3.Bool(key) if bool_ else z3.BitVec(key,width);variables[key]=v;bindings.append(f'(assert (= (|{T}_n {name}| s{state}) {key}))');return v
          ports=['heat_q16','local_heat_peak_q16','generated_power_q16','thermal_dissipation_q16','thermal_diffusion_q16','thermal_overload_q16','next_heat_q16','next_overload_q16']
          a={n:sig(n,256) for n in ports};b={n:sig(n,256,1) for n in ports[:6]};lag=sig('frequency_lag_q16',256);sw=sig('switch_activity',8);rst=sig('rst_n',1,bool_=True);rst1=sig('rst_n',1,1,True);tick=sig('tick_enable',1,bool_=True)
          d={n:sig(n,256) for n in ['power_d','dissipation_d','diffusion_d']};mean=sig('mean_heat_q16',32);mean_d=sig('mean_heat_d',32);meanpeak=sig('mean_heat_peak_q16',32);meanpeak1=sig('mean_heat_peak_q16',32,1);maxpeak=sig('maximum_local_heat_q16',32)
          text=(E/'rtl.smt2').read_text()+f'\n(declare-fun s0 () |{T}_s|)\n(declare-fun s1 () |{T}_s|)\n'+'\n'.join(bindings)
          base=z3.parse_smt2_string(text,decls=variables)
          transition=z3.parse_smt2_string(text+f'\n(assert (|{T}_t| s0 s1))',decls=variables)
          results={}
          def prove(name,pre,goal,seq=False):
           replacements=[(v.arg(1),v.arg(0)) for v in base]
           goal=z3.substitute(goal,*replacements); pre=[z3.substitute(v,*replacements) for v in pre]
           if seq:
            equations=transition[-1].children()
            require_pairs=[(eq.arg(1),eq.arg(0)) for eq in equations]
            assert all(str(right.arg(0))=='s1' for right,left in require_pairs)
            goal=z3.substitute(goal,*require_pairs)
            pre=[z3.substitute(v,*require_pairs) for v in pre]
           s=z3.Solver();s.set(timeout=20000);s.add(*pre,z3.Not(goal));start=time.monotonic();r=s.check();duration=time.monotonic()-start;print(name,r,round(duration,3),flush=True)
           (E/(name+'.smt2')).write_text(s.to_smt2());(E/(name+'.log')).write_text(str(r)+'\n'+(str(s.model()) if r==z3.sat else s.reason_unknown() if r==z3.unknown else ''));assert r==z3.unsat,(name,r)
           results[name]=dict(result=str(r),seconds=duration);(E/'formal-results.json').write_text(json.dumps(results,indent=2))
          def lane(bank,i):return z3.Extract(32*i+31,32*i,bank)
          def ext(x):return z3.SignExt(32,x)
          def sat(x):return z3.Extract(31,0,z3.If(x>2147483647,z3.BitVecVal(2147483647,64),z3.If(x< -2147483648,z3.BitVecVal(-2147483648,64),x)))
          def rnd(x,n):return z3.If(x<0,-((-x+(1<<(n-1)))>>n),(x+(1<<(n-1)))>>n)
          h=[lane(a['heat_q16'],i) for i in range(8)];valid=[rst]+[x>=3277 for x in h]
          for i in range(8):
           prove(f'bounds-{i}',valid,z3.And(lane(a['next_heat_q16'],i)>=3277,lane(a['next_overload_q16'],i)>=0))
           reset=[];advance=[];hold=[]
           for name in ports[:6]:
            reset.append(lane(a[name],i)==(3277 if name in ports[:2] else 0))
            hold.append(lane(b[name],i)==lane(a[name],i))
