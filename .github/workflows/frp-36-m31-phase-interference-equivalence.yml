name: 36 - FRP M31 Phase Interference RTL + Netlist Equivalence
run-name: "36 - FRP M31 Phase Interference | 44 proofs @ ${{ github.sha }}"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: frp-36-m31-phase-interference-equivalence-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualify-phase-interference:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      LC_ALL: C.UTF-8
      TZ: UTC
      PYTHONHASHSEED: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Initialize evidence paths
        run: |
          set -euo pipefail
          printf '%s\n' "M31_PHASE_EQ_EVIDENCE=$RUNNER_TEMP/frp-m31-phase-equivalence-evidence" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/frp-m31-phase-equivalence-evidence"
      - name: Check out the dispatched commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install the pinned verification tools
        timeout-minutes: 10
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          {
            python --version
            python -m pip install --disable-pip-version-check --only-binary=:all: \
              --timeout 30 --retries 3 yowasp-yosys==0.68.0.0.post1208 \
              z3-solver==5.1.0.0 verilator==5.48.0
            python -m pip freeze
            g++ --version
            make --version
          } 2>&1 | tee "$M31_PHASE_EQ_EVIDENCE/toolchain.log"
      - name: Prove the complete phase engine and validate independent replay
        run: |
          set -euo pipefail
          ulimit -c 0
          python - <<'PY'
          from pathlib import Path
          import hashlib, importlib.metadata, importlib.util, json, math, os, random, re, shutil, subprocess, sys, time
          import yowasp_yosys
          REPO = Path.cwd().resolve()
          E = Path(os.environ['M31_PHASE_EQ_EVIDENCE']).resolve()
          E.mkdir(parents=True, exist_ok=True)
          VIEW, SIM, BUILD = E/'formal-inputs', E/'simulation-inputs', E.parent/(E.name+'-build')
          WORKFLOW = '.github/workflows/frp-36-m31-phase-interference-equivalence.yml'
          C = 'frp_m31_phase_interference'
          N, TOP = C+'_netlist', C+'_equivalence_formal'
          HARNESS = 'formal/m31/'+TOP+'.sv'
          CORE = 'rtl/m31/'+C+'.sv'
          FIELDS = [['phase_word_q', 256], ['frequency_current_q16', 256], ['coupling_field_q16', 256], ['phase_projection_q30', 256], ['phase_target', 16], ['pair_coherence_q30', 32], ['cluster_coherence_q30', 32], ['global_coherence_q30', 32], ['organization_dispersion_q30', 32]]
          INPUT_PORTS = [['clk', 1], ['rst_n', 1], ['tick_enable', 1], ['load_valid', 1], ['phase_load', 256], ['frequency_load_q16', 256], ['gamma_effective_word', 256], ['thermal_node_factor_q30', 256], ['retained_state', 16], ['switch_activity', 8], ['scheduler_state', 3]]
          INPUTS = INPUT_PORTS[1:]
          EXPECTED_SOURCES = {'formal/m31/frp_m31_phase_interference_equivalence_formal.sv': {'bytes': 9882, 'sha256': '239fd641a2b7a496a5e1d648d9a5a17485a40a6509c1d894f08c81e950b3144b'}, 'rtl/m31/frp_m31_phase_interference.sv': {'bytes': 11627, 'sha256': 'd3ccabcd304c4ca66dcd31c75d233a16fe61c3181f797162e91674e1992d475d'}, 'rtl/m31/frp_m31_fixed_point_pkg.sv': {'bytes': 7278, 'sha256': '6b2afb8d1583c93d95d2386ba25dd1eaef6bb5bd9a4e1c9e9abff1dd004cbf24'}, 'rtl/m31/frp_m31_pkg.sv': {'bytes': 18531, 'sha256': '762302f1c7a7f7f40cb029f5ada6a111fc8c3e3f6be9920e9b2401b95e179c94'}, 'rtl/m31/frp_m31_sin_q30.mem': {'bytes': 36864, 'sha256': 'adbb4b94fcf8fa0bfc981d654679fd7518a5c4c9c97b611a35cd8accaf28233d'}}
          EXPECTED_NETLIST = {'bytes': 699993, 'sha256': 'ef0bada6b971b3a7ac938603bb844f9a021e32a85d3a2ff7cc8b3fff0ca98f1a'}
          report = dict(status='FAIL', source_commit=os.environ['GITHUB_SHA'], run_id=os.environ['GITHUB_RUN_ID'], run_attempt=os.environ['GITHUB_RUN_ATTEMPT'], equivalence_proven=False, global_coverage_closure=False, full_m32_proof=False, physical_timing=False, python_reference_model_equivalence=False, commands=[], proofs={}, negatives=[])
          immutable = {}
          def ident(p):
              b=p.read_bytes(); return dict(bytes=len(b), sha256=hashlib.sha256(b).hexdigest())
          def save(name,value):
              (E/name).write_text(json.dumps(value,indent=2,sort_keys=True)+'\n')
          def freeze(p):
              h=ident(p); assert p not in immutable or immutable[p]==h, str(p); immutable[p]=h

          def command(label,args,cwd=VIEW,timeout=600,negative=False):
              log=E/(label+'.log'); assert not log.exists(), label
              print('START '+label,flush=True); started=time.monotonic()
              entry=dict(label=label, argv=[str(a) for a in args]); report['commands'].append(entry)
              with log.open('wb') as stream:
                  try:
                      process=subprocess.run(args,cwd=cwd,stdout=stream,stderr=subprocess.STDOUT,timeout=timeout)
                  except subprocess.TimeoutExpired:
                      entry.update(status='TIMEOUT',seconds=round(time.monotonic()-started,3)); freeze(log); raise
              entry.update(returncode=process.returncode,seconds=round(time.monotonic()-started,3)); freeze(log)
              assert negative or process.returncode==0, label+' failed: '+log.read_text()[-1500:]
              return process.returncode,log

          def yosys(label,script):
              p=E/(label+'.ys'); p.write_text(script+'\n'); freeze(p)
              return command(label,['yowasp-yosys','-Q','-T','-s',str(p)])

          try:
              assert sys.flags.optimize==0, 'Python assertions must remain enabled'
              assert os.environ['GITHUB_EVENT_NAME']=='workflow_dispatch', 'Manual dispatch only'
              assert os.environ['GITHUB_REF']=='refs/heads/main', 'Run on main only'
              assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==report['source_commit'], 'Dispatched commit mismatch'
              assert not subprocess.check_output(['git','status','--porcelain'],text=True), 'Checkout is dirty'
              for relative,wanted in EXPECTED_SOURCES.items():
                  assert ident(REPO/relative)==wanted, 'Validated source mismatch: '+relative
                  for root in (VIEW,SIM):
                      p=root/relative; p.parent.mkdir(parents=True,exist_ok=True); shutil.copyfile(REPO/relative,p)
                  freeze(SIM/relative)
              shutil.copyfile(REPO/WORKFLOW,E/Path(WORKFLOW).name); workflow_identity=ident(REPO/WORKFLOW); freeze(E/Path(WORKFLOW).name)
              words=[int(s,16) for s in (VIEW/'rtl/m31/frp_m31_sin_q30.mem').read_text().split()]
              assert len(words)==4096 and all(0<=w<2**32 for w in words)
              expected_sine=[int(math.copysign(math.floor(abs(math.sin(2*math.pi*i/4096))*2**30+0.5),math.sin(2*math.pi*i/4096))) for i in range(4096)]
              assert words==[v&0xffffffff for v in expected_sine], 'Independent ROM validation failed'
              source=(VIEW/CORE).read_text()
              pattern=r'    if \(sin_lut[^\n]+\)\n      \$fatal\([^;\n]+\);\n'
              removed=re.findall(pattern,source); assert len(removed)==4, 'ROM guard normalization mismatch'
              normalized=re.sub(pattern,'',source)
              assert hashlib.sha256(normalized.encode()).hexdigest()=='09302236b4a7734be9ac0890df4a7a577541a73c441ae7db3e70da8465f1c3ef'
              (VIEW/CORE).write_text(normalized); (E/'removed-simulation-guards.txt').write_text(''.join(removed)); freeze(E/'removed-simulation-guards.txt')
              for relative in EXPECTED_SOURCES: freeze(VIEW/relative)
              wasm=Path(yowasp_yosys.__file__).parent/'yosys.wasm'
              assert ident(wasm)['sha256']=='e37a7e65e3fa4efbbd64a9c1b0e906be16cdc6c4d5273109d17537f78449f38c'
              assert importlib.metadata.version('yowasp-yosys')=='0.68.0.0.post1208'
              assert importlib.metadata.version('z3-solver')=='5.1.0.0'
              assert importlib.metadata.version('verilator')=='5.48.0'
              Z3=shutil.which('z3'); assert Z3 and ident(Path(Z3))['sha256']=='54bae839dd54e262edac6f755fc99659ce2a121301faff20a3e3b94478dcead0'
              vroot=Path(next(iter(importlib.util.find_spec('verilator').submodule_search_locations)))
              os.environ['VERILATOR_ROOT']=str(vroot); os.environ['PATH']=str(vroot/'bin')+os.pathsep+os.environ['PATH']
              save('sources.json',EXPECTED_SOURCES)
              save('tools.json',dict(yosys=importlib.metadata.version('yowasp-yosys'),wasm=ident(wasm),z3=ident(Path(Z3)),verilator=importlib.metadata.version('verilator')))
              q=lambda p:json.dumps(str(p))
              net=E/'word-netlist.v'
              yosys('synthesis',f'read_slang -j 1 --std 1800-2017 --top {C} -Irtl/m31 {CORE}; synth -top {C} -flatten -noshare -noalumacc -run begin:fine; check -assert; techmap -map +/techmap.v t:$shiftx; opt_clean; check -assert; select -assert-none t:$shiftx t:$connect; rename {C} {N}; write_verilog -noattr {q(net)}; write_json {q(E/"netlist.json")}')
              assert ident(net)==EXPECTED_NETLIST, 'Fresh netlist differs from validated synthesis'
              freeze(net); freeze(E/'netlist.json')
              yosys('formal-front',f'read_verilog -icells {q(net)}; read_slang -j 1 --std 1800-2017 --top {TOP} -Irtl/m31 {HARNESS}; proc; opt_clean; write_json {q(E/"formal-front.json")}')
              front=json.loads((E/'formal-front.json').read_text())['modules'][TOP]
              checks={n:c['parameters']['FLAVOR'] for n,c in front['cells'].items() if c['type']=='$check'}
              assert {n for n,v in checks.items() if v=='assert'}=={'a_'+n for n,w in FIELDS}
              assert list(checks.values()).count('assume')==1 and len(checks)==10
              freeze(E/'formal-front.json')
              yosys('cores',f'read_slang -j 1 --std 1800-2017 --top {C} -Irtl/m31 {CORE}; read_verilog -icells {q(net)}; setattr -mod -unset top; proc; memory_collect; async2sync; opt -full; wreduce; opt_clean; write_rtlil {q(E/"cores.il")}; write_json {q(E/"word-cores.json")}; dffunmap; check -assert; write_smt2 -wires {q(E/"word-cores.smt2")}')
              for name in ('cores.il','word-cores.json','word-cores.smt2'):freeze(E/name)
              # Read complete SMT declarations; no identifier matching for proof cut points.
              s=(E/'word-cores.smt2').read_text();defs={};order=[];acc=[];depth=0
              for line in s.splitlines():
               if line.startswith(('(declare-','(define-')):
                assert not acc;acc=[line]
               elif acc:acc.append(line)
               else:continue
               code=re.sub(r'\|[^|]*\|','symbol',line.split(';')[0]);depth+=code.count('(')-code.count(')')
               if not depth:
                text='\n'.join(acc);name=re.match(r'\((?:declare|define)-\S+ \|([^|]+)\|',text)[1];defs[name]=text;order.append(name);acc=[]
              assert not acc
              models=json.loads((E/'word-cores.json').read_text())['modules'];inputs=INPUT_PORTS;fields=FIELDS
              assert set(models)=={C,N}
              expected_ports={**{n:('input',w) for n,w in INPUT_PORTS},**{n:('output',w) for n,w in FIELDS}}
              for model in models.values():
               assert {n:(v['direction'],len(v['bits'])) for n,v in model['ports'].items()}==expected_ports
               assert not model.get('processes')
               sequential=[c for c in model['cells'].values() if 'ff' in c['type'].lower() or 'latch' in c['type'].lower()]
               assert len(sequential)==16 and all(c['type']=='$sdff' for c in sequential)
               qb=[b for c in sequential for b in c['connections']['Q']];assert len(qb)==len(set(qb))==512
               assert not any(c['type'] in ('$assume','$anyseq','$anyconst') for c in model['cells'].values())
              replace={};const={};state={};nextd={};maps={};register_ids={}
              def alias(name):
               text=defs[name];a=re.findall(r'\|([^|]+)\|',text);args=[x for x in a if x not in (name,name.split('_n ')[0]+'_s')];assert len(args)==1,(name,args);return args[0]
              def bind(m,name,label):
               raw=alias(m+'_n '+name);d=defs[raw];pat=r'\(declare-fun \|[^|]+\| \(\|[^|]+\|\) (.+)\)';match=re.match(pat,d.split(';')[0].strip());assert match,d
               typ=match[1];key='shared_'+label
               if key in const:assert const[key]==typ
               const[key]=typ;replace[raw]=f'(define-fun |{raw}| ((state |{m}_s|)) {typ} |{key}|)';return raw
              def sexpr(text):
               tokens=iter(re.findall(r'\|[^|]*\||[()]|[^()\s]+',text.split(';')[0]))
               def one(t):
                if t!='(':return t
                out=[]
                for t in tokens:
                 if t==')':return out
                 out.append(one(t))
                raise RuntimeError('Unclosed SMT expression')
               result=one(next(tokens));assert next(tokens,None) is None;return result

              def bitmap(x):
               if isinstance(x,str):raise RuntimeError('Non-symbolic input bit '+x)
               if x[0]=='concat':return bitmap(x[2])+bitmap(x[1])
               if isinstance(x[0],list):
                tag,op,hi,lo=x[0];assert (tag,op)==('_','extract');return bitmap(x[1])[int(lo):int(hi)+1]
               if x[0]=='=':
                assert x[2]=='#b1';bits=bitmap(x[1]);assert len(bits)==1;return bits
               raw=x[0].strip('|');assert x[1]=='state';node=sexpr(defs[raw]);assert node[0] in ('declare-fun','define-fun');typ=node[3]
               width=1 if typ=='Bool' else int(typ[2]);return [(raw,i) for i in range(width)]

              def input_bind(m,name,width):
               tree=sexpr(defs[m+'_n '+name]);bits=bitmap(tree[4]);assert len(bits)==len(set(bits))==width
               grouped={}
               for i,(raw,j) in enumerate(bits):grouped.setdefault(raw,{})[j]=i
               key='shared_input_'+name;const[key]=f'(_ BitVec {width})'
               for raw,remap in grouped.items():
                typ=sexpr(defs[raw])[3];n=1 if typ=='Bool' else int(typ[2]);assert set(remap)==set(range(n))
                parts=[];a=0
                while a<n:
                 b=a
                 while b+1<n and remap[b+1]==remap[b]+1:b+=1
                 parts.append(f'((_ extract {remap[b]} {remap[a]}) |{key}|)');a=b+1
                expr=parts[0]
                for part in parts[1:]:expr=f'(concat {part} {expr})'
                typestr='Bool' if typ=='Bool' else f'(_ BitVec {n})'
                if typ=='Bool':expr=f'(= {expr} #b1)'
                replace[raw]=f'(define-fun |{raw}| ((state |{m}_s|)) {typestr} {expr})'

              for m,v in models.items():
               maps[m]={};state[m]={};register_ids[m]={}
               for name,w in inputs:input_bind(m,name,w)
               ff={tuple(c['connections']['Q']):(name,c) for name,c in v['cells'].items() if c['type']=='$sdff'};assert len(ff)==16
               for field in ('phase_word_q','frequency_current_q16'):
                bits=v['ports'][field]['bits']
                for i in range(8):
                 part=bits[32*i:32*(i+1)];found=[c for c in v['cells'].values() if c['type']=='$mux' and c['connections']['Y']==part];assert len(found)==1
                 mux=found[0]['connections'];assert mux['S']==v['ports']['rst_n']['bits'];q=tuple(mux['B']);fname,f=ff[q]
                 assert f['connections']['SRST']==v['ports']['rst_n']['bits'];assert f['connections']['CLK']==v['ports']['clk']['bits'];assert int(f['parameters']['SRST_POLARITY'],2)==0;assert int(f['parameters']['CLK_POLARITY'],2)==1
                 value=(i<<29) if field=='phase_word_q' else 65536;assert f['parameters']['SRST_VALUE']==f'{value:032b}';assert mux['A']==list(f'{value:032b}'[::-1])
                 aliases=[n for n,w in v['netnames'].items() if w['bits']==list(q)];assert len(aliases)==1
                 label=f'{field}_{i}';raw=bind(m,aliases[0],'state_'+label);maps[m][label]={'ff':fname,'reset':value,'raw':raw};register_ids[m][raw]=label;state[m][label]=raw
               assert len({maps[m][x]['ff'] for x in maps[m]})==16
               mem=[c for c in v['cells'].values() if c['type']=='$mem_v2'];assert len(mem)==1;mem=mem[0]['parameters'];assert int(mem['WR_PORTS'],2)==0;assert int(mem['SIZE'],2)==4096;assert int(mem['WIDTH'],2)==32
               assert int(mem['RD_PORTS'],2)==72 and int(mem['RD_CLK_ENABLE'],2)==0
               assert len(mem['INIT'])==131072 and set(mem['INIT'])<={'0','1'}
               assert [int(mem['INIT'][-32*(i+1):131072-32*i],2) for i in range(4096)]==words
               if m==C:memory_init=mem['INIT']
               else:assert memory_init==mem['INIT']
               raw=next(x for x,d in defs.items() if x.startswith(m+'#') and d.startswith('(declare-fun') and '(Array' in d);const['shared_ROM']='(Array (_ BitVec 12) (_ BitVec 32))';replace[raw]=f'(define-fun |{raw}| ((state |{m}_s|)) (Array (_ BitVec 12) (_ BitVec 32)) |shared_ROM|)'
               # Each next-state expression comes from the exported complete transition.
               trans=defs[m+'_t'];pairs=re.findall(r'\(= \(\|([^|]+)\| state\) \(\|([^|]+)\| next_state\)\)',trans);assert len(pairs)==17
               nextd[m]={register_ids[m][b]:a for a,b in pairs if b in register_ids[m]};assert len(nextd[m])==16
              save('state-correspondence.json',maps);freeze(E/'state-correspondence.json')

              results={}
              def check(name,expression):
               need=set();todo=re.findall(r'\|([^|]+)\|',expression)
               while todo:
                x=todo.pop()
                if x in need:continue
                assert x in defs,x;need.add(x)
                if x not in replace:todo.extend(set(re.findall(r'\|([^|]+)\|',defs[x]))-need)
               decls=[x for x in need if defs[x].startswith('(declare-fun')];assert all(x in replace for x in decls),(name,[x for x in decls if x not in replace])
               text='(set-option :timeout 120000)\n'+'\n'.join(f'(declare-fun |{n}| () {typ})' for n,typ in const.items())+'\n'+'\n'.join(replace.get(x,defs[x]) for x in order if x in need)+'\n'+f'(declare-fun r () |{C}_s|)\n(declare-fun n () |{N}_s|)\n(assert {expression})\n(check-sat)\n'
               p=E/(name+'.smt2');p.write_text(text);freeze(p)
               code,log=command('prove-'+name,[Z3,str(p)],timeout=150)
               out=log.read_text().strip();results[name]=dict(result=out,query=ident(p),log=ident(log));report['proofs']=results;save('proofs.json',results)
               return out=='unsat' and code==0

              addresses='(or '+' '.join(f'(not (= (|{C}_m:R{i}A sin_lut| r) (|{N}_m:R{i}A sin_lut| n)))' for i in range(72))+')'
              assert check('all-72-ROM-addresses',addresses)
              for i in range(72):
               key=f'ROM_read_{i}';const[key]='(_ BitVec 32)'
               for m in (C,N):
                name=m+f'_m:R{i}D sin_lut';tree=sexpr(defs[name]);assert len(tree[4])==2 and tree[4][1]=='state';raw=tree[4][0].strip('|');assert '(select ' in defs[raw];assert raw not in replace
                replace[raw]=f'(define-fun |{raw}| ((state |{m}_s|)) (_ BitVec 32) |{key}|)'
              for name,_ in fields:
               assert check(name,f'(not (= (|{C}_n {name}| r) (|{N}_n {name}| n)))'), name
               if name=='coupling_field_q16':
                for m in (C,N):input_bind(m,name,256)
              name='frequency_d'
              assert check(name,f'(not (= (|{C}_n {name}| r) (|{N}_n {name}| n)))')
              for m in (C,N):input_bind(m,name,256)
              scale={m:{} for m in (C,N)}
              for m in (C,N):
               for raw,d in defs.items():
                if raw.startswith(m+'#') and '(bvmul ' in d and any(int(v,2)==44798133900177 for v in re.findall(r'#b([01]+)',d)):
                 tree=sexpr(d);assert tree[3]==['_','BitVec','79']
                 refs=set(re.findall(r'\|([^|]+)\|',d))-{raw,m+'_s'};assert len(refs)==1
                 vel=refs.pop();assert sexpr(defs[vel])[3]==['_','BitVec','32'];scale[m][raw]=vel
               assert len(scale[m])==8
              def abstract_pair(a,b,width,label):
               const[label]=f'(_ BitVec {width})'
               for m,raw in ((C,a),(N,b)):
                assert raw not in replace and sexpr(defs[raw])[3]==['_','BitVec',str(width)]
                replace[raw]=f'(define-fun |{raw}| ((state |{m}_s|)) (_ BitVec {width}) |{label}|)'
              consumed={C:set(),N:set()}
              for i in range(8):
               match={}
               for m in (C,N):
                roots={raw for raw,bit in bitmap(sexpr(defs[m+'_n phase_d'])[4])[i*32:(i+1)*32]};seen=set();todo=list(roots);hit=set()
                while todo:
                 x=todo.pop()
                 if x in seen:continue
                 seen.add(x)
                 if x in scale[m]:hit.add(x);continue
                 if x not in replace:todo.extend(set(re.findall(r'\|([^|]+)\|',defs[x]))-seen)
                assert len(hit)==1;match[m]=hit.pop();consumed[m].add(match[m])
               a,b=scale[C][match[C]],scale[N][match[N]]
               assert check(f'velocity_{i}',f'(not (= (|{a}| r) (|{b}| n)))')
               abstract_pair(a,b,32,f'common_velocity_{i}')
               a,b=match[C],match[N]
               assert check(f'phase_product_{i}',f'(not (= (|{a}| r) (|{b}| n)))')
               abstract_pair(a,b,79,f'common_phase_product_{i}')
              assert all(len(v)==8 for v in consumed.values())
              name='phase_d'
              assert check(name,f'(not (= (|{C}_n {name}| r) (|{N}_n {name}| n)))')
              for m in (C,N):input_bind(m,name,256)
              for label in nextd[C]:
               assert check('next_'+label,f'(not (= (|{nextd[C][label]}| r) (|{nextd[N][label]}| n)))'),label
              assert len(results)==44 and all(r['result']=='unsat' for r in results.values())
