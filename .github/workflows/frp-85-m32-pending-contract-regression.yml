name: 85 - FRP M32 Pending Contract Regression
run-name: "85 - FRP Pending Contract | 29 outputs, 8/16/32/64 cells and deterministic replay @ ${{ github.sha }}"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frp-85-pending-contract-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    name: M32 pending contract - ${{ matrix.cells }} cells
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        cells: [8, 16, 32, 64]
    defaults:
      run:
        shell: bash
    env:
      CELLS: ${{ matrix.cells }}
      LC_ALL: C.UTF-8
      TZ: UTC
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Initialize evidence directory
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/frp-85-evidence"
          printf 'commit=%s\ncells=%s\nrun=%s\nattempt=%s\n' \
            "$GITHUB_SHA" "$CELLS" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            > "$RUNNER_TEMP/frp-85-evidence/context.txt"
          printf '%s\n' '{"status":"NOT_COMPLETED"}' \
            > "$RUNNER_TEMP/frp-85-evidence/qualification.json"
          echo "FRP85_EVIDENCE=$RUNNER_TEMP/frp-85-evidence" >> "$GITHUB_ENV"

      - name: Check out dispatched commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify manual execution and qualified sources
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          cat > "$FRP85_EVIDENCE/sources.sha256" <<'SHA'
          762302f1c7a7f7f40cb029f5ada6a111fc8c3e3f6be9920e9b2401b95e179c94  rtl/m31/frp_m31_pkg.sv
          18889d85e78b23b844f1db4c46a35a6b7d01e609e3f1f0e6263a39a6c5729411  rtl/m31/frp_m31_pending_routes.sv
          18741e33accc7b772987c510724c9c570c55b91c5bcaab51ccf1d65cf7e7f39f  rtl/m32/frp_m32_pending_contract_tb.sv
          SHA
          sha256sum .github/workflows/frp-85-m32-pending-contract-regression.yml \
            >> "$FRP85_EVIDENCE/sources.sha256"
          sha256sum --check --strict "$FRP85_EVIDENCE/sources.sha256" \
            | tee "$FRP85_EVIDENCE/source-check.log"

      - name: Install and record toolchain
        run: |
          set -euo pipefail
          {
            python -m pip install --disable-pip-version-check \
              verilator==5.48.0 systemc==3.0.2.1
            python -m pip check
            verilator-cli --version
            g++ --version
            make --version
          } 2>&1 | tee "$FRP85_EVIDENCE/toolchain.log"
          python -m pip freeze > "$FRP85_EVIDENCE/packages.txt"

      - name: Build and qualify pending replay with RTL coverage
        run: |
          set -euo pipefail
          python - <<'PYTHON'
          import hashlib
          import json
          import os
          import re
          import signal
          import subprocess
          import time
          from pathlib import Path

          evidence = Path(os.environ['FRP85_EVIDENCE']).resolve()
          n = int(os.environ['CELLS'])
          build = Path(os.environ['RUNNER_TEMP']) / f'frp-85-build-{n}'
          top = 'frp_m32_pending_contract_tb'
          report = dict(status='RUNNING', commit=os.environ['GITHUB_SHA'], cells=n, commands=[])
          configs = (0, 1)
          signatures = {
              8: ['255bfd3a462027c2', '2ec818176ed75848'],
              16: ['148aa2f678cbdee7', 'd6d82090874540dd'],
              32: ['22fc914b2aa95a2b', '89f5464b209e47e6'],
              64: ['e6c109abd4b731bd', '9f94acde3a3ffe00'],
          }
          coverage_baseline = {
              'rtl/m31/frp_m31_pending_routes.sv:line': [33, 36],
              'rtl/m31/frp_m31_pending_routes.sv:branch': [35, 44],
          }
          rtl_files = {'rtl/m31/frp_m31_pending_routes.sv'}

          def require(ok, message):
              if not ok:
                  raise RuntimeError(message)

          def digest(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def save():
              (evidence / 'qualification.json').write_text(json.dumps(report, indent=2) + '\n')

          def collect(path):
              text = path.read_text()
              require(not re.search(r'%Error|%Fatal|Assertion failed|Aborting|^FAIL\b', text, re.M),
                      'Simulation failure marker')
              rows = [s.strip() for s in text.splitlines()
                      if s.strip().startswith(('PENDING_', 'PASS'))]
              require(len(rows) == 5, f'Expected five records, received {len(rows)}')
              final = f'PASS PENDING_ALL cells={n} configurations=2'
              require(rows.count(final) == 1, 'Missing or duplicate final PASS')
              parsed = {}
              for row in rows:
                  if row == final:
                      continue
                  if row.startswith('PASS PENDING '):
                      kind, tokens = 'pass', row.split()[2:]
                      keys = 'cells extra ports cycles probes resets checks signature'.split()
                  elif row.startswith('PENDING_EVENTS '):
                      kind, tokens = 'events', row.split()[1:]
                      keys = ('cells extra create complete paused bad_address bad_polarity '
                              'occupied duplicate illegal_complete excess empty_complete').split()
                  else:
                      raise RuntimeError(f'Unexpected record: {row}')
                  pairs = [token.split('=', 1) for token in tokens]
                  require(all(len(pair) == 2 for pair in pairs), 'Malformed record')
                  require([pair[0] for pair in pairs] == keys, 'Missing, reordered or duplicate fields')
                  values = dict(pairs)
                  for key in keys:
                      if key != 'signature':
                          require(values[key].isdecimal(), f'Invalid unsigned field: {key}')
                          values[key] = int(values[key])
                  cfg = values['extra']
                  require(values['cells'] == n and cfg in configs, 'Incorrect configuration')
                  require((kind, cfg) not in parsed, 'Duplicate configuration record')
                  if kind == 'pass':
                      lanes = n // 4
                      pairs = 4 * n * lanes * (lanes - 1)
                      cycles = 8241 + 9 * n + 2 * pairs
                      resets = 37 + 4 * n + pairs
                      probes = 2 * cycles + 2 * resets + (768 + 32 * cfg) * n * lanes
                      words = (12 * n + 329 + 31) // 32
                      require((values['ports'], values['cycles'], values['probes'],
                               values['resets'], values['checks']) ==
                              (29, cycles, probes, resets, probes * words),
                              'Incomplete workload, reset sequence or output checks')
                      require(values['signature'] == signatures[n][cfg], 'Signature mismatch')
                  else:
                      required = ('create complete paused bad_polarity occupied duplicate '
                                  'illegal_complete excess empty_complete').split()
                      require(all(values[k] > 0 for k in required), 'Missing pending contract class')
                      require((values['bad_address'] > 0) if cfg else (values['bad_address'] == 0),
                              'Incorrect address-domain coverage')
                  parsed[kind, cfg] = row
              require(len(parsed) == 4, 'Incomplete configuration matrix')
              normalized = [parsed[kind, cfg] for cfg in configs for kind in ('events', 'pass')]
              return '\n'.join(normalized + [final]) + '\n'

          def coverage(path):
              text = path.read_text()
              require(text.startswith('# SystemC::Coverage-3\n'), 'Invalid coverage header')
              bins, files = {}, set()
              for line in text.splitlines()[1:]:
                  if not line.startswith("C '"):
                      continue
                  data, hits = line[3:].rsplit("' ", 1)
                  fields = dict(x.split('\x02', 1) for x in data.split('\x01') if '\x02' in x)
                  source, instance = fields['f'], fields.get('h', '')
                  if source not in rtl_files:
                      continue
                  require(instance.startswith(top + '.'), 'Unexpected coverage hierarchy')
                  hits = int(hits)
                  require(hits >= 0, 'Negative coverage count')
                  kind = fields['t']
                  require(kind in ('line', 'branch'), f'Unexpected coverage kind: {kind}')
                  key = source + ':' + kind
                  counts = bins.setdefault(key, [0, 0])
                  counts[0] += int(hits > 0)
                  counts[1] += 1
                  files.add(source)
              require(files == rtl_files, 'Missing RTL coverage')
              require(bins == coverage_baseline, f'RTL coverage baseline mismatch: {bins}')
              return bins

          def run(argv, name, limit):
              path = evidence / name
              entry = dict(argv=argv, log=name, status='RUNNING')
              report['commands'].append(entry)
              started = time.monotonic()
              process = None
              save()
              try:
                  with path.open('w') as log:
                      process = subprocess.Popen(argv, stdout=log, stderr=subprocess.STDOUT,
                                                 start_new_session=True)
                      while True:
                          remaining = limit - (time.monotonic() - started)
                          require(remaining > 0, f'{name}: timeout')
                          try:
                              code = process.wait(timeout=min(30, remaining))
                              break
                          except subprocess.TimeoutExpired:
                              print(f'{name}: elapsed={time.monotonic()-started:.0f}s', flush=True)
                  entry['returncode'] = code
                  require(code == 0, f'{name}: exit {code}')
                  entry['status'] = 'PASS'
              except BaseException:
                  entry['status'] = 'FAIL'
                  if process is not None and process.poll() is None:
                      os.killpg(process.pid, signal.SIGKILL)
                      process.wait()
                  if path.exists():
                      print(path.read_text(errors='replace')[-12000:], flush=True)
                  raise
              finally:
                  entry['seconds'] = round(time.monotonic() - started, 3)
                  save()

          try:
              build.mkdir(parents=True, exist_ok=True)
              run([
                  'verilator-cli', '--binary', '--output-groups', '0', '--unroll-count', '1',
                  '--timing', '--assert', '--coverage-line', '-Wno-fatal', '-j', '2',
                  '-CFLAGS', '-std=c++20', '-MAKEFLAGS', 'OPT_FAST=-Os',
                  '-MAKEFLAGS', 'VK_PCH_I_FAST=', '-MAKEFLAGS', 'VK_PCH_I_SLOW=',
                  '--top-module', top, f'-GCELLS={n}', '--Mdir', str(build),
                  '-Irtl/m31', '-Irtl/m32', f'rtl/m32/{top}.sv',
              ], 'compile.log', 3600)
              compile_log = (evidence / 'compile.log').read_text(errors='replace')
              require(not re.search(r'%Error|%Warning-(PINMISSING|IMPLICIT|MULTIDRIVEN)\b', compile_log),
                      'Compile error or unexpected wiring warning')
              executable = build / f'V{top}'
              executable_hash = digest(executable)
              (evidence / 'executable.sha256').write_text(f'{executable_hash}  V{top}\n')
              replays, coverage_hashes = [], []
              for replay in (1, 2):
                  require(digest(executable) == executable_hash, 'Executable changed')
                  name = f'run-{replay}.log'
                  cov = evidence / f'run-{replay}.dat'
                  run([str(executable), '+verilator+coverage+file+' + str(cov)], name, 600)
                  semantic = collect(evidence / name)
                  (evidence / f'run-{replay}.txt').write_text(semantic)
                  replays.append(semantic)
                  bins = coverage(cov)
                  (evidence / f'coverage-{replay}.json').write_text(json.dumps(bins, indent=2) + '\n')
                  coverage_hashes.append(digest(cov))
                  print(semantic, end='')
              require(replays[0] == replays[1], 'Semantic replay mismatch')
              require(coverage_hashes[0] == coverage_hashes[1], 'Coverage replay mismatch')
              require(digest(executable) == executable_hash, 'Executable changed')
              run(['sha256sum', '--check', '--strict', str(evidence / 'sources.sha256')],
                  'source-final-check.log', 30)
              report.update(status='PASS', configurations=2, replays=2, replay_equal=True, ports=29,
                            executable_sha256=executable_hash, rtl_coverage=bins,
                            coverage_sha256=coverage_hashes[0],
                            semantic_sha256=hashlib.sha256(replays[0].encode()).hexdigest())
              summary = (f'### FRP 85: Pending contract - {n} cells - PASS\n\n'
                         '29 outputs; two address configurations; two process replays.\n\n'
                         'Canonical and extended address widths; 32-bit event counts.\n\n'
                         'Event bins count observations before and after clock edges.\n\n'
                         'RTL instrumented points across parameter specializations; testbench excluded.\n\n'
                         '| RTL file / kind | Covered | Total | Percent |\n|---|---:|---:|---:|\n')
              for key, (covered, total) in sorted(bins.items()):
                  summary += f'| {key} | {covered} | {total} | {100 * covered / total:.2f}% |\n'
              summary += '\n```text\n' + replays[0] + '```\n'
              (evidence / 'summary.md').write_text(summary)
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
                  stream.write(summary)
          except BaseException as error:
              report.update(status='FAIL', error=str(error))
              raise
          finally:
              save()
          PYTHON

      - name: Hash qualification evidence
        if: always()
        run: |
          set -euo pipefail
          python - <<'PYTHON'
          import hashlib
          import os
          from pathlib import Path
          root = Path(os.environ['FRP85_EVIDENCE'])
          files = sorted(p for p in root.rglob('*') if p.is_file() and p.name != 'evidence.sha256')
          (root / 'evidence.sha256').write_text(''.join(
              f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(root)}\n'
              for p in files))
          PYTHON

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          name: frp-85-pending-contract-${{ matrix.cells }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/frp-85-evidence/
          if-no-files-found: error
          retention-days: 14
