name: 120 - FRP M31 Thermal Dynamics Qualification
run-name: '120 - FRP Thermal Dynamics | 2 suites, 32 executions, 6 mutations @ ${{ github.sha }}'

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install simulation tools
        run: |
          set -euo pipefail
          mkdir -p bundle
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential
          python -m pip install --disable-pip-version-check 'verilator==5.48.0'
          {
            python --version
            python -m pip show verilator
            verilator-cli --version
            g++ --version
            make --version
          } > bundle/toolchain.txt 2>&1

      - name: Qualify thermal topology and equilibrium
        run: |
          set -euo pipefail
          ulimit -c 0
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          import shlex
          import shutil
          import subprocess
          import tempfile
          import zipfile
          from pathlib import Path

          root = Path('source').resolve()
          out = Path('bundle').resolve()
          out.mkdir(exist_ok=True)
          profiles, seeds = (8, 16, 32, 64), (0, 76)
          tops = {'topology': 'frp_m31_thermal_topology_replay_tb',
                  'equilibrium': 'frp_m31_thermal_equilibrium_tb'}
          prefixes = {'topology': 'PASS THERMAL_TOPOLOGY ', 'equilibrium': 'PASS THERMAL_EQUILIBRIUM '}
          fields = {
              'topology': set('cells seed maps steps commits holds resets replays checks positive_flux negative_flux cooling peak_history unsigned_lags changed_candidates rounding_residuals signature'.split()),
              'equilibrium': set('cells seed checks updates holds resets uniform_cases relaxations replays low_endpoints high_endpoints steady_updates maximum_settle nonuniform_histories retained_peaks candidate_changes signature'.split())
          }
          # Recorded from the qualified source versions, ordered by cells and then seed.
          signatures = {
              'topology': ('6e31cfb2ede95485', '756dc49b845a197d', '41ff9707f4ee3c05', '3841a481fd126015',
                           '97c49faa3771c5e5', '6b7b9a496941bf25', '1cc956c0864b9155', '1cf805352b3271d5'),
              'equilibrium': ('d09bd187b1dc3e61', '1fcf875b7443461d', 'c343b40b4bebd8bd', '49b2b51af4255999',
                              '4124458f588695f9', '61e2c99ec070e98d', '124d8b7fbf32a299', 'c85f40f40cd61299')
          }
          expected_hashes = {
              'frp_m31_thermal_topology_replay_tb.sv': '198c6ab08a75ea0cd87d8d04743d4bc398066972784988dc1c6b6cccb51bf21f',
              'frp_m31_thermal_equilibrium_tb.sv': 'd5c574bf676aa37ecc1f7488a19c328aa53805e168bf7d0ccd23b271ba7cfce5',
              'frp_m31_local_thermal_field.sv': 'cb97c1bfeabbb2acaebf2f9644d484b2f7c5e995dbf1b70777f6bc2e7df9368e',
              'frp_m31_fixed_point_pkg.sv': '6b2afb8d1583c93d95d2386ba25dd1eaef6bb5bd9a4e1c9e9abff1dd004cbf24'
          }
          workflow = '.github/workflows/frp-120-m31-thermal-dynamics-qualification.yml'
          report = {'schema': 'frp.m31.thermal_dynamics.qualification.v1', 'status': 'RUNNING',
                    'profiles': profiles, 'seeds': seeds, 'runs': [], 'replay_pairs': 0, 'mutations': []}


          def require(ok, message):
              if not ok:
                  raise RuntimeError(message)


          def save():
              (out / 'results.json').write_text(json.dumps(report, indent=2) + '\n')


          def execute(command, name, seconds, success=True):
              command = ['timeout', '--kill-after=15s', f'{seconds}s'] + command
              with (out / name).open('w') as log:
                  log.write(shlex.join(command) + '\n')
                  log.flush()
                  result = subprocess.run(command, cwd=root, stdout=log, stderr=subprocess.STDOUT)
              text = (out / name).read_text(errors='replace')
              if success:
                  require(result.returncode == 0, f'{name}: exit {result.returncode}')
              return result.returncode, text


          def parse(text, suite, cells, seed):
              lines = [line for line in text.splitlines() if line.startswith('PASS ')]
              prefix = prefixes[suite]
              require(len(lines) == 1 and lines[0].startswith(prefix), 'Missing or duplicate PASS record')
              record = {}
              for token in lines[0][len(prefix):].split():
                  require(token.count('=') == 1, 'Malformed field')
                  key, value = token.split('=')
                  require(key in fields[suite] and key not in record, 'Unexpected or duplicate field')
                  pattern = r'[0-9a-f]{16}' if key == 'signature' else r'0|[1-9][0-9]*'
                  require(re.fullmatch(pattern, value), 'Invalid field: ' + key)
                  record[key] = value if key == 'signature' else int(value)
              require(set(record) == fields[suite], 'Missing field')
              expected = {'cells': cells, 'seed': seed}
              if suite == 'topology':
                  maps = 2*cells-2
                  holds = sum((step+repeat)%3 + 1+(step+mapping+repeat)%3
                              for mapping in range(maps) for repeat in range(2) for step in range(64))
                  expected.update(maps=maps, steps=64, commits=maps*256, holds=holds,
                                  resets=maps*2, replays=(maps*2-1)*64, changed_candidates=holds)
                  positive = ('positive_flux', 'negative_flux', 'cooling', 'peak_history',
                              'unsigned_lags', 'rounding_residuals')
              else:
                  expected.update(resets=34, uniform_cases=18, relaxations=16, replays=8,
                                  low_endpoints=9, high_endpoints=9, steady_updates=1088,
                                  nonuniform_histories=16)
                  require(0 < record['maximum_settle'] <= 512, 'Convergence budget exceeded')
                  require(record['candidate_changes'] == record['holds'], 'Missing live candidate changes')
                  positive = ('updates', 'retained_peaks')
              for key, value in expected.items():
                  require(record[key] == value, f'{suite}: {key} expected {value}, got {record[key]}')
              for key in ('checks', 'holds') + positive:
                  require(record[key] > 0, 'Missing activity: ' + key)
              index = profiles.index(cells)*len(seeds) + seeds.index(seed)
              require(record['signature'] == signatures[suite][index], 'Qualified signature mismatch')
              return record


          def source_hashes():
              paths = [workflow] + ['rtl/m31/' + name for name in expected_hashes]
              return {path: hashlib.sha256((root / path).read_bytes()).hexdigest() for path in paths}


          def build(scratch, suite, cells, tag, mutation=None):
              directory = scratch / tag
              directory.mkdir()
              top = tops[suite]
              for name in expected_hashes:
                  shutil.copyfile(root / 'rtl/m31' / name, directory / name)
              if mutation is not None:
                  (directory / 'frp_m31_local_thermal_field.sv').write_text(mutation)
              obj = directory / 'obj'
              command = ['verilator-cli', '--cc', '--main', '--exe', '--timing', '--assert',
                         '--unroll-count', '1', '-Wno-fatal', '--top-module', top,
                         '-I' + str(directory), '--Mdir', str(obj), f'-GCELLS={cells}',
                         str(directory / (top + '.sv'))]
              execute(command, tag + '-generate.log', 600)
              execute(['make', '-C', str(obj), '-f', 'V' + top + '.mk', '-j', '2',
                       'VK_PCH_I_FAST=', 'VK_PCH_I_SLOW=', 'CXXFLAGS=--std=c++20 -DVL_TIME_CONTEXT',
                       'OPT_FAST=-O1'], tag + '-build.log', 900)
              binary = obj / ('V' + top)
              binary.chmod(binary.stat().st_mode | 0o111)
              return directory, str(binary)


          def mutation_diagnostic(code, text, marker):
              diagnostic = next((line for line in text.splitlines()
                                 if re.search(r'%(?:Fatal|Error):', line) and marker in line), None)
              require(code in (1, 134, -6) and diagnostic is not None and
                      not any(line.startswith('PASS ') for line in text.splitlines()) and
                      not re.search(r'watchdog|budget exceeded', text, re.I), 'Expected runtime diagnostic absent')
              return diagnostic


          def main():
              require(os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch', 'Manual execution required')
              sha = subprocess.check_output(['git', '-C', str(root), 'rev-parse', 'HEAD'], text=True).strip()
              require(sha == os.environ['GITHUB_SHA'], 'Checked-out commit mismatch')
              report['commit'] = sha
              hashes = source_hashes()
              for name, digest in expected_hashes.items():
                  require(hashes['rtl/m31/' + name] == digest, 'Qualified source mismatch: ' + name)
              (out / 'source_sha256.json').write_text(json.dumps(hashes, indent=2) + '\n')
              with zipfile.ZipFile(out / 'tested_sources.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
                  for path in hashes:
                      archive.write(root / path, path)
              with tempfile.TemporaryDirectory(prefix='frp120-', dir=os.environ['RUNNER_TEMP']) as temporary:
                  scratch = Path(temporary)
                  for suite in tops:
                      for cells in profiles:
                          tag = f'{suite}-cells-{cells}'
                          directory, binary = build(scratch, suite, cells, tag)
                          for seed in seeds:
                              records = []
                              for replay in (1, 2):
                                  label = f'{tag}-seed-{seed}-replay-{replay}'
                                  _, text = execute([binary, f'+SEED={seed}'], label + '.log', 600)
                                  record = parse(text, suite, cells, seed)
                                  records.append(record)
                                  report['runs'].append({'suite': suite, 'replay': replay,
                                                         'log': label + '.log', 'record': record})
                                  save()
                              require(records[0] == records[1], 'Replay mismatch: ' + label)
                              report['replay_pairs'] += 1
                              save()
                              print('PASS ' + label + ': identical replays', flush=True)
                          shutil.rmtree(directory)

                  mutations = (
                      ('hold_bypass', 'topology', 'end else if (tick_enable) begin',
                       "end else if (1'b1) begin", 'THERMAL_TOPOLOGY disabled peer changed'),
                      ('asymmetric_gain', 'topology', 'DIFFUSION_GAIN_Q16, frp_m31_sat_s32(weighted_sum)',
                       "(cell_index==0 ? 32'sd2295 : DIFFUSION_GAIN_Q16), frp_m31_sat_s32(weighted_sum)",
                       'THERMAL_TOPOLOGY diffusion residual='),
                      ('stale_peak', 'topology', 'peak_q[cell_index] <= AMBIENT_Q16;',
                       'peak_q[cell_index] <= (peak_q[cell_index]>AMBIENT_Q16) ? peak_q[cell_index] : AMBIENT_Q16;',
                       'THERMAL_TOPOLOGY async_reset'),
                      ('dissipation_tie', 'equilibrium', "(excess_heat + 64'sd7) / 64'sd14",
                       "(excess_heat + 64'sd6) / 64'sd14", 'THERMAL_EQUILIBRIUM uniform_candidate_after'),
                      ('signed_lag', 'equilibrium', "$signed({32'd0, frequency_lag_q16[cell_index*32 +: 32]})",
                       '$signed(frequency_lag_q16[cell_index*32 +: 32])', 'THERMAL_EQUILIBRIUM uniform_candidate_before'),
                      ('lost_peak', 'equilibrium', 'if (heat_d[cell_index] > peak_q[cell_index])',
                       "if (1'b1)", 'THERMAL_EQUILIBRIUM peak_history')
                  )
                  original = (root / 'rtl/m31/frp_m31_local_thermal_field.sv').read_text()
                  for name, suite, before, after, marker in mutations:
                      require(original.count(before) == 1, 'Mutation anchor mismatch: ' + name)
                      changed = original.replace(before, after)
                      (out / (name + '.sv')).write_text(changed)
                      directory, binary = build(scratch, suite, 8, name, changed)
                      code, text = execute([binary, '+SEED=76'], name + '-run.log', 600, False)
                      item = {'name': name, 'suite': suite, 'detected': False, 'exit_code': code,
                              'source_sha256': hashlib.sha256(changed.encode()).hexdigest()}
                      report['mutations'].append(item)
                      save()
                      item.update(diagnostic=mutation_diagnostic(code, text, marker), detected=True)
                      save()
                      print('DETECTED ' + name, flush=True)
                      shutil.rmtree(directory)
              require(source_hashes() == hashes, 'Original sources changed')
              require(len(report['runs']) == 32 and report['replay_pairs'] == 16 and
                      all(sum(x['suite'] == suite for x in report['runs']) == 16 for suite in tops) and
                      len(report['mutations']) == 6 and all(x['detected'] for x in report['mutations']),
                      'Qualification matrix incomplete')
              report.update(comparisons=sum(x['record']['checks'] for x in report['runs']),
                            topology_commits=sum(x['record']['commits'] for x in report['runs'] if x['suite'] == 'topology'),
                            equilibrium_updates=sum(x['record']['updates'] for x in report['runs'] if x['suite'] == 'equilibrium'),
                            maximum_spatial_settle=max(x['record']['maximum_settle'] for x in report['runs'] if x['suite'] == 'equilibrium'))
              report['status'] = 'PASS'


          save()
          try:
              main()
          except BaseException as error:
              report['status'] = 'FAIL'
              report['error'] = f'{type(error).__name__}: {error}'
              raise
          finally:
              save()
              summary = ['## FRP M31 Thermal Dynamics Qualification', '',
                         f"Result: **{report['status']}**", '', f"Commit: `{report.get('commit', 'unavailable')}`", '',
                         'Cells: 8, 16, 32, 64. Seeds: 0 and 76. Two exact replays per suite/profile/seed.',
                         'Topology: dyadic permutations, staggered commits, noisy pauses, reset history and thermal balance.',
                         'Equilibrium: 18 uniform endpoint cases and 16 spatial relaxations per execution;',
                         '512-update spatial convergence limit and 32-update steady-state retention.', '',
                         f"Executions: {len(report['runs'])}/32. Matching replay pairs: {report['replay_pairs']}/16.", '',
                         '| Mutation | Runtime failure detected |', '| --- | --- |']
              for item in report['mutations']:
                  summary.append(f"| {item['name']} | {item['detected']} |")
              if report['status'] == 'PASS':
                  summary += ['', f"Comparisons: {report['comparisons']}.",
                              f"Topology commits across both instances: {report['topology_commits']}.",
                              f"Equilibrium updates: {report['equilibrium_updates']}.",
                              f"Maximum spatial settling time: {report['maximum_spatial_settle']} updates."]
              if 'error' in report:
                  summary += ['', 'Failure details: results.json and the named artifact log.']
              summary += ['', 'One artifact contains logs, toolchain, source hashes, tested sources,',
                          'mutation copies, JSON results and this summary.', '']
              (out / 'summary.md').write_text('\n'.join(summary))
          PY

      - name: Publish Actions summary
        if: always()
        run: |
          mkdir -p bundle
          if [ ! -f bundle/summary.md ]; then
            printf '%s\n' 'Qualification stopped before the final report; inspect the step logs.' > bundle/summary.md
          fi
          cat bundle/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload one combined artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frp-120-thermal-dynamics-${{ github.run_id }}-${{ github.run_attempt }}
          path: bundle/
          if-no-files-found: error
          retention-days: 14
