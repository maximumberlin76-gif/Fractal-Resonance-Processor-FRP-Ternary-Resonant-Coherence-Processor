name: 52 - FRP M31 Global Stability Regression
run-name: "52 - FRP Global Stability | 8/16/32 cells @ ${{ github.sha }}"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: frp-52-global-stability-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      LC_ALL: C.UTF-8
      TZ: UTC
      PYTHONHASHSEED: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Prepare evidence and pinned simulator
        run: |
          set -euo pipefail
          export FRP52_EVIDENCE="$RUNNER_TEMP/frp-52-evidence"
          mkdir -p "$FRP52_EVIDENCE"
          printf '%s\n' "FRP52_EVIDENCE=$FRP52_EVIDENCE" >> "$GITHUB_ENV"
          python -m pip install --disable-pip-version-check \
            verilator==5.48.0 systemc==3.0.2.1 click==8.5.0 platformdirs==4.13.0 \
            2>&1 | tee "$FRP52_EVIDENCE/install.log"
          python -m pip freeze > "$FRP52_EVIDENCE/packages.txt"
      - name: Run global stability regression and verify results
        run: |
          set -euo pipefail
          cat > "$FRP52_EVIDENCE/verify.py" <<'FRP52_EOF'
          from pathlib import Path
          import hashlib, importlib.metadata, json, os, re, shutil, subprocess
          R=Path.cwd()
          B=Path(os.environ['FRP52_EVIDENCE'])
          def save(name,value):
              (B/name).write_text(json.dumps(value,indent=2)+'\n')
          def run(args,name,timeout=900):
              save(name+'-command.json',args)
              path=B/(name+'.log')
              print('RUN',name,flush=True)
              with path.open('w') as log:
                  try:
                      result=subprocess.run(args,cwd=R,stdout=log,
                          stderr=subprocess.STDOUT,text=True,timeout=timeout)
                  except subprocess.TimeoutExpired:
                      log.write('\nTIMEOUT\n')
                      raise
              text=path.read_text()
              if result.returncode:
                  print(text[-12000:],flush=True)
                  raise RuntimeError((name,result.returncode))
              print(text[-2000:],flush=True)
              return text
          files=[
              'rtl/m31/frp_m31_fixed_point_pkg.sv',
              'rtl/m31/frp_m31_global_stability.sv',
              'rtl/m31/frp_m31_global_stability_tb.sv',
              'frp_prototype_v1_7_0.py',
              '.github/workflows/frp-52-m31-global-stability-regression.yml',
          ]
          hashes={p:hashlib.sha256((R/p).read_bytes()).hexdigest() for p in files}
          save('sources.json',{'commit':os.environ['GITHUB_SHA'],'files':hashes})
          save('versions.json',{p:importlib.metadata.version(p)
              for p in ['verilator','systemc']})
          run(['verilator-cli','--version'],'verilator-version')
          run(['c++','--version'],'compiler-version')
          top='frp_m31_global_stability_tb'
          source=R/'rtl/m31'/f'{top}.sv'
          shutil.copy2(source,B/source.name)
          obj=B/'obj'
          run(['verilator-cli','--binary','--timing','--assert','-Wno-fatal',
               '-j','2','-MAKEFLAGS','VK_PCH_I_FAST=',
               '-MAKEFLAGS','VK_PCH_I_SLOW=','-MAKEFLAGS','OPT_FAST=-O1',
               '--top-module',top,'--Mdir',str(obj),'-Irtl/m31',str(source)],
              'global-stability-build')
          text=run([str(obj/('V'+top))],'global-stability-run',120)
          keys=['cells','steps','checks','commits','holds','resets','rom_words',
                'rom_addresses','sweep','random','half_cases','neutral_cases','thresholds']
          pattern=r'^PASS GLOBAL_STABILITY '+r' '.join(k+r'=(\d+)' for k in keys)+r'$'
          matches=re.findall(pattern,text,re.MULTILINE)
          assert len(matches)==3,('Expected three checker records',text)
          results={}
          expected_checks={8:3434902,16:3435134,32:3435598}
          for match in matches:
              v=dict(zip(keys,map(int,match)))
              n=v['cells']
              assert n in (8,16,32) and str(n) not in results,v
              assert v['steps']==118260+n and v['checks']==expected_checks[n],v
              assert v['commits']==7504+n and v['holds']==110756,v
              assert v['commits']+v['holds']==v['steps'],v
              assert v['resets']==41,v
              assert v['rom_words']==v['rom_addresses']==4096,v
              assert v['sweep']==110001 and v['random']==8192,v
              assert v['half_cases']==48 and v['neutral_cases']==n+1,v
              assert v['thresholds']==6,v
              results[str(n)]=v
          assert set(results)=={'8','16','32'}
          marker='PASS GLOBAL_STABILITY_ALL cells=8,16,32'
          assert text.splitlines().count(marker)==1,text
          for p,h in hashes.items():
              assert hashlib.sha256((R/p).read_bytes()).hexdigest()==h,p
          totals={k:sum(v[k] for v in results.values()) for k in keys if k!='cells'}
          assert totals['steps']==354836 and totals['checks']==10305634,totals
          save('result.json',{'result':'PASS','commit':os.environ['GITHUB_SHA'],
                             'cells':results,'totals':totals})
          lines=['## FRP M31 global stability regression: PASS','',
                 'Commit: `'+os.environ['GITHUB_SHA']+'`','',
                 '| Cells | Steps | Comparisons | Commits | Holds | Resets | ROM addresses |',
                 '|---|---|---|---|---|---|---|']
          for n in ('8','16','32'):
              v=results[n]
              lines.append(f"| {n} | {v['steps']} | {v['checks']} | {v['commits']} | {v['holds']} | {v['resets']} | {v['rom_addresses']} |")
          lines += ['',
              'Per configuration: 4096 ROM words, 110001 thermal sweep samples,',
              '8192 deterministic random samples and 48 signed mean-rounding cases.',
              'Checks include every active-zero population, C-minus-P history thresholds,',
              'signed saturation, combinational outputs, committed outputs and asynchronous reset.',
              'The testbench computes expected values using its own integer arithmetic',
              'and an exponential table generated from exp(-8 * index / 4095).',
              'RTL simulation; source hashes, commands, tool versions and logs are attached.','']
          summary='\n'.join(lines)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write(summary)
          print(summary)
          FRP52_EOF
          python "$FRP52_EVIDENCE/verify.py" 2>&1 | tee "$FRP52_EVIDENCE/verify.log"
      - name: Upload logs and reproducibility records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frp-52-global-stability-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/frp-52-evidence/*.log
            ${{ runner.temp }}/frp-52-evidence/*.json
            ${{ runner.temp }}/frp-52-evidence/*.txt
            ${{ runner.temp }}/frp-52-evidence/*.py
            ${{ runner.temp }}/frp-52-evidence/*.sv
          if-no-files-found: error
          retention-days: 30
