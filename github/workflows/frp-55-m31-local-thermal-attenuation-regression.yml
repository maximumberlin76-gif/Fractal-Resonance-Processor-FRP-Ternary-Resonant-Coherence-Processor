name: 55 - FRP M31 Local Thermal Attenuation Regression
run-name: "55 - FRP Local Thermal Attenuation | 8/16/32 cells @ ${{ github.sha }}"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: frp-55-local-thermal-attenuation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      LC_ALL: C.UTF-8
      TZ: UTC
      PYTHONHASHSEED: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Prepare evidence and pinned simulator
        run: |
          set -euo pipefail
          export FRP55_EVIDENCE="$RUNNER_TEMP/frp-55-evidence"
          mkdir -p "$FRP55_EVIDENCE"
          printf '%s\n' "FRP55_EVIDENCE=$FRP55_EVIDENCE" >> "$GITHUB_ENV"
          python -m pip install --disable-pip-version-check \
            verilator==5.48.0 systemc==3.0.2.1 click==8.5.0 platformdirs==4.13.0 \
            2>&1 | tee "$FRP55_EVIDENCE/install.log"
          python -m pip freeze > "$FRP55_EVIDENCE/packages.txt"
      - name: Run local thermal attenuation regression and verify results
        run: |
          set -euo pipefail
          cat > "$FRP55_EVIDENCE/verify.py" <<'FRP55_EOF'
          from pathlib import Path
          import hashlib, importlib.metadata, json, os, re, shutil, subprocess
          R=Path.cwd()
          B=Path(os.environ['FRP55_EVIDENCE'])
          def save(name,value):
              (B/name).write_text(json.dumps(value,indent=2)+'\n')
          def run(args,name,timeout=900):
              save(name+'-command.json',args)
              path=B/(name+'.log')
              print('RUN',name,flush=True)
              with path.open('w') as log:
                  try:
                      result=subprocess.run(args,cwd=R,stdout=log,
                          stderr=subprocess.STDOUT,text=True,timeout=timeout)
                  except subprocess.TimeoutExpired:
                      log.write('\nTIMEOUT\n')
                      raise
              text=path.read_text()
              if result.returncode:
                  print(text[-12000:],flush=True)
                  raise RuntimeError((name,result.returncode))
              print(text[-2000:],flush=True)
              return text
          files=[
              'rtl/m31/frp_m31_fixed_point_pkg.sv',
              'rtl/m31/frp_m31_local_thermal_attenuation.sv',
              'rtl/m31/frp_m31_local_thermal_attenuation_tb.sv',
              'frp_prototype_v1_7_0.py',
              '.github/workflows/frp-55-m31-local-thermal-attenuation-regression.yml',
          ]
          hashes={p:hashlib.sha256((R/p).read_bytes()).hexdigest() for p in files}
          save('sources.json',{'commit':os.environ['GITHUB_SHA'],'files':hashes})
          save('versions.json',{p:importlib.metadata.version(p)
              for p in ['verilator','systemc']})
          run(['verilator-cli','--version'],'verilator-version')
          run(['c++','--version'],'compiler-version')
          top='frp_m31_local_thermal_attenuation_tb'
          source=R/'rtl/m31'/f'{top}.sv'
          shutil.copy2(source,B/source.name)
          obj=B/'obj'
          run(['verilator-cli','--binary','--timing','--assert','-Wno-fatal',
               '-j','2','-MAKEFLAGS','VK_PCH_I_FAST=',
               '-MAKEFLAGS','VK_PCH_I_SLOW=','-MAKEFLAGS','OPT_FAST=-O1',
               '--top-module',top,'--Mdir',str(obj),'-Irtl/m31',str(source)],
              'local-thermal-attenuation-build')
          text=run([str(obj/('V'+top))],'local-thermal-attenuation-run',120)
          keys=['cells','steps','checks','commits','holds','resets',
                'rom_cell_pairs','boundaries','dense_words','random','isolated']
          pattern=r'^PASS LOCAL_ATTENUATION '+r' '.join(k+r'=(\d+)' for k in keys)+r'$'
          matches=re.findall(pattern,text,re.MULTILINE)
          assert len(matches)==3,('Expected three checker records',text)
          expected={
              8: (94243,3215520,88183,6060,65),
              16:(65668,4603136,61983,3685,73),
              32:(51416,7385600,48907,2509,89),
          }
          results={}
          for match in matches:
              v=dict(zip(keys,map(int,match)))
              n=v['cells']
              assert n in expected and str(n) not in results,v
              assert tuple(v[k] for k in ('steps','checks','commits','holds','resets'))==expected[n],v
              assert v['commits']+v['holds']==v['steps'],v
              assert v['rom_cell_pairs']==4096*n and v['boundaries']==24570,v
              assert v['dense_words']==419456 and v['resets']==n+57,v
              assert v['random']==8192 and v['isolated']==n,v
              results[str(n)]=v
          assert set(results)=={'8','16','32'}
          event_keys=['cells','negative','clipped','sat_pos','sat_neg','half_pos',
                      'half_neg','rising','falling','changed_hold','reset_tick']
          pattern=r'^ATTENUATION_EVENTS '+r' '.join(k+r'=(\d+)' for k in event_keys)+r'$'
          matches=re.findall(pattern,text,re.MULTILINE)
          assert len(matches)==3,('Expected three event records',text)
          events={}
          for match in matches:
              v=dict(zip(event_keys,map(int,match)))
              n=str(v['cells'])
              assert n in results and n not in events,v
              assert all(v[k]>0 for k in event_keys if k!='cells'),v
              events[n]=v
          assert set(events)==set(results)
          marker='PASS LOCAL_ATTENUATION_ALL cells=8,16,32'
          assert text.splitlines().count(marker)==1,text
          for p,h in hashes.items():
              assert hashlib.sha256((R/p).read_bytes()).hexdigest()==h,p
          totals={k:sum(v[k] for v in results.values()) for k in keys if k!='cells'}
          assert totals['steps']==211327 and totals['checks']==15204256,totals
          assert totals['rom_cell_pairs']==229376 and totals['boundaries']==73710,totals
          assert totals['dense_words']==1258368,totals
          assert totals['random']==24576 and totals['isolated']==56,totals
          save('result.json',{'result':'PASS','commit':os.environ['GITHUB_SHA'],
                             'cells':results,'events':events,'totals':totals})
          lines=['## FRP M31 local thermal attenuation regression: PASS','',
                 'Commit: `'+os.environ['GITHUB_SHA']+'`','',
                 '| Cells | Steps | Comparisons | Commits | Holds | Resets |',
                 '|---|---|---|---|---|---|']
          for n in ('8','16','32'):
              v=results[n]
              lines.append(f"| {n} | {v['steps']} | {v['checks']} | {v['commits']} | {v['holds']} | {v['resets']} |")
          lines += ['',
              'All 4096 ROM addresses are checked through both public factor ports in every cell.',
              'Per configuration: all 4095 lookup transitions in both directions,',
              'with three input values around each transition (24570 boundary samples).',
              'The dense sweep covers 419456 nonnegative overload words across the cells.',
              'Each configuration also runs 8192 fixed-seed samples and isolated-cell checks.',
              'The reference independently generates the exponential table and computes',
              'half-away scaling, clipping and address selection with integer division.',
              'Checks include candidate changes while held, clocked commits, asynchronous reset,',
              'signed interface extremes, saturation-boundary inputs and rounding ties.',
              'RTL simulation; source hashes, commands, tool versions and logs are attached.','']
          summary='\n'.join(lines)
          (B/'summary.md').write_text(summary)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write(summary)
          print(summary)
          FRP55_EOF
          python "$FRP55_EVIDENCE/verify.py" 2>&1 | tee "$FRP55_EVIDENCE/verify.log"
      - name: Upload logs and reproducibility records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frp-55-local-thermal-attenuation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/frp-55-evidence/*.log
            ${{ runner.temp }}/frp-55-evidence/*.json
            ${{ runner.temp }}/frp-55-evidence/*.txt
            ${{ runner.temp }}/frp-55-evidence/*.py
            ${{ runner.temp }}/frp-55-evidence/*.sv
            ${{ runner.temp }}/frp-55-evidence/*.md
          if-no-files-found: error
          retention-days: 30
